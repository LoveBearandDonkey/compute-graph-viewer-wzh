/* ===== ../../vendor/pto-design-system/tokens/components.css ===== */
/*
 * Design Principle — Color Usage
 * Avoid large-area transparent color fills (e.g. rgba(blue, 0.12) card backgrounds).
 * Prefer: neutral surface (--surface-1/2) for card bg + small high-saturation tag/badge for type signal.
 * Transparent color fills are only acceptable for tight accent regions (tag, badge, icon bg)
 * or when explicitly requested by the designer.
 */

:root {
  /* Toolbar */
  --comp-toolbar-height: 44px;
  --comp-toolbar-bg: color-mix(in srgb, var(--background) 92%, black);
  --comp-toolbar-border: var(--border-subtle);

  /* Button */
  --button-height-sm: 30px;
  --button-height-md: 36px;
  --button-height-lg: 42px;
  --button-radius: var(--radius-lg);
  --button-padding-x-sm: var(--space-2);
  --button-padding-x-md: var(--space-3);
  --button-padding-x-lg: var(--space-4);
  --button-gap: 6px;
  --button-font: 500 var(--font-size-body-sm) / 1 var(--font-sans);
  --button-solid-bg:       var(--foreground);
  --button-solid-bg-hover: color-mix(in srgb, var(--foreground) 88%, transparent);
  --button-solid-bg-press: color-mix(in srgb, var(--foreground) 80%, transparent);
  --button-solid-fg:       var(--background);
  --button-solid-shadow:   none;
  --button-secondary-bg: color-mix(in srgb, var(--surface-2) 92%, white 3%);
  --button-secondary-bg-hover: var(--surface-3);
  --button-secondary-bg-press: color-mix(in srgb, var(--surface-3) 84%, black);
  --button-secondary-border: var(--border-subtle);
  --button-secondary-fg: var(--foreground);
  --button-secondary-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03), 0 2px 8px rgba(0, 0, 0, 0.16);
  --button-ghost-bg-hover: var(--state-hover);
  --button-ghost-bg-press: var(--state-press);
  --button-ghost-fg: var(--foreground-secondary);
  --button-ghost-fg-hover: var(--foreground);
  --button-focus-ring: var(--focus-ring);
  --button-disabled-opacity: 0.42;

  /* Input */
  --input-height-md: 34px;
  --input-radius: var(--radius-md);
  --input-border: var(--border-default);
  --input-bg: var(--surface-1);

  /* Panel */
  --panel-radius: var(--radius-lg);
  --panel-padding: var(--space-4);
  --panel-padding-lg: var(--space-5);
  --panel-bg: var(--surface-2);
  --panel-border: var(--border-subtle);

  /* Card */
  --card-radius: var(--radius-lg);
  --card-padding: var(--space-4);
  --card-bg: var(--surface-1);
  --card-border: var(--border-default);
  --card-shadow: none;
  --card-hover-border: var(--border-strong);
  --card-hover-bg: var(--state-hover);          /* overlay on --card-bg, ArkUI-style */
  --card-selected-border: var(--primary);
  --card-selected-bg: var(--state-selected);    /* overlay on --card-bg */

  /* Table */
  --table-row-height: 36px;
  --table-header-height: 36px;
  --table-border: var(--border-subtle);

  /* Typography Composites — role-based readable defaults */
  --type-display:  var(--font-weight-bold) var(--font-size-display-lg) / var(--line-height-display) var(--font-sans);
  --type-title-1:  var(--font-weight-semibold) var(--font-size-title-md) / var(--line-height-title) var(--font-sans);
  --type-title-2:  var(--font-weight-semibold) var(--font-size-title-sm) / var(--line-height-title) var(--font-sans);
  --type-title-3:  var(--font-weight-semibold) var(--font-size-body-md) / var(--line-height-title) var(--font-sans);
  --type-body:     400 var(--font-size-body-md) / var(--line-height-body) var(--font-sans);
  --type-body-sm:  400 var(--font-size-body-sm) / var(--line-height-body) var(--font-sans);
  --type-label:    var(--font-weight-medium) var(--font-size-label-sm) / var(--line-height-label) var(--font-sans);
  --type-micro:    var(--font-weight-medium) var(--font-size-label-xs) / var(--line-height-label) var(--font-sans);
  --type-mono:     var(--font-weight-medium) var(--font-size-body-sm) / var(--line-height-mono) var(--font-mono);

  /* Deprecated typography aliases. Keep for downstream compatibility. */
  --text-display: var(--type-display);
  --text-title-1: var(--type-title-1);
  --text-title-2: var(--type-title-2);
  --text-title-3: var(--type-title-3);
  --text-body: var(--type-body);
  --text-body-sm: var(--type-body-sm);
  --text-label: var(--type-label);
  --text-mono: var(--type-mono);

  /* Badge / Tag */
  --tag-radius: var(--radius-pill);

  --zoom-control-gap: 8px;

  /* Compact Button */
  --button-height-compact: 34px;

  /* Segmented Control */
  --segmented-control-gap: 3px;
  --segmented-control-padding: 3px;

  --floating-playback-separator: var(--border-default);
  --floating-playback-scrubber-track: var(--border-strong);
  --floating-playback-scrubber-thumb-border: color-mix(in srgb, var(--primary) 80%, transparent);
  --floating-playback-scrubber-thumb-shadow: 0 0 8px color-mix(in srgb, var(--primary) 55%, transparent);
  --floating-playback-hover-bg: color-mix(in srgb, var(--background-elevated) 96%, black);
  --floating-playback-hover-border: var(--border-default);
  --floating-playback-button-height: 32px;
  --floating-playback-button-radius: var(--radius-md);
  --floating-playback-button-bg: var(--surface-disabled);
  --floating-playback-button-border: var(--border-subtle);
  --floating-playback-button-hover-bg: var(--state-hover);
  --floating-playback-button-hover-border: var(--border-default);
  --floating-playback-primary-bg: var(--primary);
  --floating-playback-primary-bg-hover: var(--primary-hover);
  --floating-playback-primary-border: var(--primary);
  --floating-playback-primary-fg: var(--primary-foreground);

  /* Inspector Rail */
  --inspector-rail-padding-x: var(--space-3);
  --inspector-rail-padding-bottom: var(--space-3);
  --inspector-section-padding-y: var(--space-4);
  --inspector-section-gap: var(--space-3);
  --inspector-section-divider: var(--border-subtle);
  --inspector-soft-card-bg: color-mix(in srgb, var(--surface-2) 80%, transparent);
  --inspector-soft-card-bg-hover: color-mix(in srgb, var(--surface-3) 62%, transparent);
  --inspector-soft-card-radius: var(--radius-md);
  --inspector-soft-card-padding: var(--space-3);
  --inspector-soft-card-gap: var(--space-2);
}

:root[data-theme='light'] {
  --button-secondary-bg: color-mix(in srgb, var(--surface-1) 92%, var(--surface-2));
  --button-secondary-bg-hover: color-mix(in srgb, var(--surface-1) 28%, var(--surface-2));
  --button-secondary-bg-press: color-mix(in srgb, var(--surface-2) 84%, var(--surface-3));
  --button-secondary-border: var(--border-default);
  --button-secondary-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.78), 0 1px 2px rgba(0, 0, 0, 0.06);
  --ide-frame-page-bg: var(--background-elevated);
  --ide-frame-bg: var(--background);
  --ide-frame-pane-bg: var(--surface-2);
  --floating-playback-bg: color-mix(in srgb, var(--background-elevated) 92%, white);
  --floating-playback-shadow: 0 16px 42px rgba(0, 0, 0, 0.16), 0 4px 14px rgba(0, 0, 0, 0.08);
  --floating-playback-inner-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.86), inset 0 -1px 0 rgba(0, 0, 0, 0.04);
  --floating-playback-collapsed-shadow: 0 10px 22px rgba(0, 0, 0, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.30);
  --floating-playback-hover-bg: var(--background-elevated);
}

:root[data-theme='glass'] {
  --comp-toolbar-bg: var(--glass-surface-bg-strong);
  --comp-toolbar-border: var(--glass-surface-border);

  --button-solid-bg: rgba(255, 255, 255, 0.88);
  --button-solid-bg-hover: rgba(255, 255, 255, 0.96);
  --button-solid-bg-press: rgba(255, 255, 255, 0.78);
  --button-solid-fg: #08111f;
  --button-solid-shadow: var(--glass-surface-highlight), 0 8px 20px rgba(0, 0, 0, 0.18);
  --button-secondary-bg: rgba(255, 255, 255, 0.105);
  --button-secondary-bg-hover: rgba(255, 255, 255, 0.16);
  --button-secondary-bg-press: rgba(255, 255, 255, 0.08);
  --button-secondary-border: rgba(255, 255, 255, 0.12);
  --button-secondary-shadow: var(--glass-surface-highlight), 0 8px 24px rgba(0, 0, 0, 0.14);
  --button-ghost-bg-hover: rgba(255, 255, 255, 0.10);
  --button-ghost-bg-press: rgba(255, 255, 255, 0.15);

  --input-bg: rgba(255, 255, 255, 0.08);
  --input-border: rgba(255, 255, 255, 0.12);

  --panel-bg: color-mix(in srgb, var(--background-elevated) 88%, black 12%);
  --panel-border: var(--border-subtle);
  --card-bg: color-mix(in srgb, var(--background-elevated) 84%, black 16%);
  --card-border: var(--border-subtle);
  --card-shadow: none;
  --card-hover-border: var(--border-strong);
  --card-hover-bg: rgba(255, 255, 255, 0.08);
  --card-selected-bg: rgba(111, 161, 255, 0.18);

  --comp-tag-bg: rgba(255, 255, 255, 0.075);
  --comp-tag-border: rgba(255, 255, 255, 0.16);
  --comp-tag-fg: var(--foreground-secondary);

  --stat-chip-bg: rgba(255, 255, 255, 0.09);
  --stat-chip-border: rgba(255, 255, 255, 0.14);
  --segmented-control-bg: rgba(255, 255, 255, 0.065);
  --segmented-control-border: rgba(255, 255, 255, 0.14);

  --panel-shell-bg: var(--glass-surface-bg);
  --panel-shell-border: var(--glass-surface-border);
  --panel-shell-shadow: var(--glass-surface-highlight), var(--glass-surface-shadow);
  --panel-shell-backdrop-filter: var(--surface-backdrop-filter);
  --panel-shell-quiet-bg: var(--glass-surface-bg-soft);
  --panel-shell-quiet-border: rgba(255, 255, 255, 0.12);
  --panel-shell-quiet-shadow: var(--glass-surface-highlight);

  --workbench-frame-bg: color-mix(in srgb, var(--background-elevated) 88%, black 12%);
  --workbench-pane-bg: color-mix(in srgb, var(--background) 92%, var(--surface-2));
  --workbench-pane-border: rgba(255, 255, 255, 0.09);
  --workbench-pane-body-bg: rgba(8, 10, 15, 0.78);

  --ide-frame-page-bg: var(--app-background);
  --ide-frame-bg: #0b1018;
  --ide-frame-chrome-bg: transparent;
  --ide-frame-pane-bg: #080c12;
  --ide-frame-pane-border: rgba(255, 255, 255, 0.08);
  --ide-frame-control-bg: var(--glass-surface-bg-soft);
  --ide-frame-control-border: rgba(255, 255, 255, 0.12);
  --ide-frame-control-shadow: var(--glass-surface-highlight);
  --ide-frame-selected-bg: var(--glass-surface-bg);
  --ide-frame-selected-border: rgba(255, 255, 255, 0.16);
  --ide-frame-selected-shadow: var(--glass-surface-highlight), 0 8px 24px rgba(0, 0, 0, 0.14);

  --floating-playback-bg: var(--glass-surface-bg-strong);
  --floating-playback-border: var(--glass-surface-border);
  --floating-playback-shadow: var(--glass-surface-shadow);
  --floating-playback-inner-highlight: var(--glass-surface-highlight);
  --floating-playback-collapsed-shadow: 0 12px 30px rgba(0, 0, 0, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.24);
  --floating-playback-hover-bg: var(--glass-surface-bg);
  --floating-playback-hover-border: rgba(255, 255, 255, 0.16);
  --floating-playback-button-bg: rgba(255, 255, 255, 0.09);
  --floating-playback-button-border: rgba(255, 255, 255, 0.12);
  --floating-playback-button-hover-bg: rgba(255, 255, 255, 0.14);
  --floating-playback-button-hover-border: rgba(255, 255, 255, 0.16);

  --inspector-soft-card-bg: rgba(255, 255, 255, 0.075);
  --inspector-soft-card-bg-hover: rgba(255, 255, 255, 0.115);
}

/* ===== report.css ===== */
/* ============================================================
   报告形态版面 —— A4 竖版 / 弱交互 / 打印即 PDF
   ------------------------------------------------------------
   与 index_v3.html（工具形态）共用数据，不共用样式：工具形态是视口自适应的
   IDE 三栏，报告形态是固定 210×297mm 的文档流，两套版面没有可复用的部分。
   本文件只依赖设计系统 tokens，不引 styles.css，避免工具态规则串味。

   报告固定浅色：它的最终形态是打印/PDF/转发截图，暗色底既吃墨也不利于转发。
   ============================================================ */

:root {
  --rp-page-w: 210mm;
  --rp-page-h: 297mm;
  --rp-pad-x: 15mm;
  --rp-pad-t: 14mm;
  --rp-pad-b: 12mm;

  /* 判定色：与工具形态指标卡的 ok/warn/bad 同义 */
  --rp-ok: var(--success, #1a8f52);
  --rp-warn: var(--warning, #b8860b);
  --rp-bad: var(--danger, #d23b3b);

  /* 时间构成色板：与 Timeline 页签泳道图例同源（计算绿 / 通信橙 / 空泡品红 / 空闲灰） */
  --rp-compute: #1a8f52;
  --rp-comm: #c15a1c;
  --rp-bubble: #cf4d86;
  --rp-host: #5d6b99;
  --rp-idle: #8b93a1;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: var(--font-sans, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif);
  font-size: 12.5px;
  line-height: 1.62;
  color: var(--foreground, #1c1f26);
  background: #eceef1;
  -webkit-font-smoothing: antialiased;
}

/* ── 屏幕态外壳：顶栏 + 目录侧栏，打印时整体消失 ───────────────── */

.rp-toolbar {
  position: fixed; inset: 0 0 auto 0; z-index: 50;
  display: flex; align-items: center; gap: var(--space-3, 12px);
  height: 46px; padding: 0 16px;
  background: var(--surface-1, #fff);
  border-bottom: 1px solid var(--border-default, #d8dce3);
  box-shadow: 0 1px 3px rgba(16, 20, 28, .06);
}
.rp-toolbar__brand { font-weight: var(--font-weight-semibold, 600); letter-spacing: .01em; }
.rp-toolbar__brand small { font-weight: 400; color: var(--foreground-muted, #6b7280); margin-left: 8px; }
.rp-toolbar__spacer { flex: 1; }
.rp-toolbar select,
.rp-toolbar button {
  font: inherit; font-size: 12px;
  height: 28px; padding: 0 10px;
  border: 1px solid var(--border-default, #d8dce3);
  border-radius: var(--radius-sm, 4px);
  background: var(--surface-1, #fff);
  color: inherit; cursor: pointer;
}
.rp-toolbar select { max-width: 380px; }
.rp-toolbar button:hover { background: var(--state-hover, #f1f3f6); }
.rp-toolbar .rp-btn-primary {
  background: var(--primary, #2f6fce); border-color: transparent;
  color: var(--primary-foreground, #fff); font-weight: 500;
}

.rp-toc {
  position: fixed; top: 46px; bottom: 0; left: 0; width: 226px; z-index: 40;
  overflow-y: auto; padding: 16px 12px 32px;
  background: var(--surface-2, #f6f7f9);
  border-right: 1px solid var(--border-subtle, #e4e7ec);
  font-size: 12px;
}
.rp-toc h4 {
  margin: 0 0 10px; font-size: var(--font-size-label-xs, 11px);
  letter-spacing: .08em; text-transform: uppercase;
  color: var(--foreground-muted, #6b7280); font-weight: 600;
}
.rp-toc a {
  display: flex; justify-content: space-between; gap: 8px;
  padding: 5px 8px; border-radius: var(--radius-sm, 4px);
  color: var(--foreground-secondary, #4a5160); text-decoration: none;
}
.rp-toc a:hover { background: var(--state-hover, #e9ecf1); color: var(--foreground, #1c1f26); }
.rp-toc a .n { color: var(--foreground-muted, #9aa1ad); font-variant-numeric: tabular-nums; }
.rp-toc a.is-sub { padding-left: 20px; font-size: 11.5px; }

.rp-doc { padding: 70px 0 60px 226px; display: flex; flex-direction: column; align-items: center; gap: 22px; }

/* ── A4 页 ─────────────────────────────────────────────────── */

.rp-page {
  position: relative;
  width: var(--rp-page-w);
  min-height: var(--rp-page-h);
  padding: var(--rp-pad-t) var(--rp-pad-x) var(--rp-pad-b);
  background: var(--surface-1, #fff);
  box-shadow: 0 2px 14px rgba(16, 20, 28, .12);
  display: flex; flex-direction: column;
}
.rp-page__head {
  display: flex; align-items: baseline; justify-content: space-between;
  padding-bottom: 5px; margin-bottom: 12px;
  border-bottom: 1px solid var(--border-subtle, #e4e7ec);
  font-size: 10px; color: var(--foreground-muted, #8b93a1); letter-spacing: .02em;
}
.rp-page__body { flex: 1; }
.rp-page__foot {
  display: flex; align-items: baseline; justify-content: space-between;
  margin-top: 12px; padding-top: 5px;
  border-top: 1px solid var(--border-subtle, #e4e7ec);
  font-size: 9.5px; color: var(--foreground-muted, #9aa1ad);
}
.rp-page__foot .pno { font-variant-numeric: tabular-nums; }

/* 章节标题 = 结论句（action title），不是名词 */
.rp-h2 {
  margin: 0 0 3px; font-size: 17px; line-height: 1.34;
  font-weight: var(--font-weight-semibold, 600); letter-spacing: -.01em;
}
.rp-h2 .rp-h2-num {
  display: inline-block; min-width: 22px;
  color: var(--primary, #2f6fce); font-variant-numeric: tabular-nums;
}
.rp-kicker {
  margin: 0 0 14px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
  color: var(--foreground-muted, #9aa1ad); font-weight: 600;
}
.rp-lead { margin: 0 0 14px; font-size: 12.5px; color: var(--foreground-secondary, #4a5160); }
.rp-h3 {
  margin: 16px 0 8px; font-size: 12.5px; font-weight: 600;
  color: var(--foreground, #1c1f26);
}
.rp-note { font-size: 10px; color: var(--foreground-muted, #8b93a1); line-height: 1.5; }
.rp-figcap {
  margin-top: 5px; font-size: 9.5px; line-height: 1.5;
  color: var(--foreground-muted, #8b93a1);
}
.rp-block { break-inside: avoid; page-break-inside: avoid; }

/* ── 封面 ─────────────────────────────────────────────────── */

.rp-cover { justify-content: space-between; }
.rp-cover__top { display: flex; align-items: center; gap: 10px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--foreground-muted, #9aa1ad); }
.rp-cover__rule { flex: 1; height: 1px; background: var(--border-default, #d8dce3); }
.rp-cover__mid { padding: 4mm 0; }
.rp-cover__type {
  display: inline-block; margin-bottom: 10px; padding: 3px 10px;
  border-radius: var(--radius-pill, 999px);
  background: var(--tone-info-bg, #eaf1fb); color: var(--primary, #2f6fce);
  font-size: 11px; font-weight: 600;
}
.rp-cover__title { margin: 0 0 8px; font-size: 30px; line-height: 1.24; font-weight: 700; letter-spacing: -.02em; }
.rp-cover__sub { margin: 0 0 22px; font-size: 14px; color: var(--foreground-secondary, #4a5160); }
.rp-cover__score { display: flex; align-items: center; gap: 22px; padding: 14px 0; border-top: 1px solid var(--border-subtle, #e4e7ec); border-bottom: 1px solid var(--border-subtle, #e4e7ec); }
.rp-cover__scorenum { font-size: 58px; font-weight: 700; line-height: 1; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.rp-cover__scoremeta { font-size: 11.5px; color: var(--foreground-secondary, #4a5160); }
.rp-cover__scoremeta b { font-size: 15px; }
.rp-cover__facts { display: grid; grid-template-columns: 1fr 1fr; gap: 3mm 8mm; margin-top: 8mm; }
.rp-cover__fact { border-top: 1px solid var(--border-subtle, #e4e7ec); padding-top: 6px; }
.rp-cover__fact dt { font-size: 10px; letter-spacing: .05em; color: var(--foreground-muted, #9aa1ad); text-transform: uppercase; }
.rp-cover__fact dd { margin: 2px 0 0; font-size: 11.5px; line-height: 1.5; word-break: break-word; }
.rp-cover__bot { font-size: 10px; color: var(--foreground-muted, #9aa1ad); border-top: 1px solid var(--border-default, #d8dce3); padding-top: 8px; }

/* ── 结论卡（执行摘要三句话）────────────────────────────────── */

.rp-verdicts { display: grid; gap: 8px; }
.rp-verdict {
  padding: 9px 12px; border-radius: var(--radius-md, 6px);
  background: var(--surface-2, #f6f7f9);
  border-left: 3px solid var(--border-strong, #b9c0cc);
}
.rp-verdict--top { border-left-color: var(--rp-bad); }
.rp-verdict--gain { border-left-color: var(--rp-ok); }
.rp-verdict dt { font-size: 10px; font-weight: 600; letter-spacing: .06em; color: var(--foreground-muted, #8b93a1); text-transform: uppercase; }
.rp-verdict dd { margin: 3px 0 0; font-size: 11.5px; line-height: 1.55; }

/* 头号杠杆一句话强调（借白皮书 callout 的做法：只放一件事，不写说明文）。
   与下方 rp-verdicts 分工——这里给"该记住哪一件事"，verdicts 给"为什么、还有什么"。 */
.rp-callout {
  margin: 0 0 6mm;
  padding: 9px 13px;
  border-radius: var(--radius-md, 6px);
  background: var(--tone-info-bg, #eaf1fb);
  border-left: 3px solid var(--primary, #2f6fce);
  font-size: 12px;
  line-height: 1.6;
  color: var(--foreground, #1c1f26);
}
.rp-callout b { color: var(--primary, #2f6fce); }

/* ── 通用小组件 ─────────────────────────────────────────────── */

.rp-badge {
  display: inline-block; padding: 1px 7px; border-radius: var(--radius-pill, 999px);
  font-size: 10px; font-weight: 700; letter-spacing: .03em; white-space: nowrap;
}
.rp-badge--p0 { background: #fbe9e9; color: #b02525; }
.rp-badge--p1 { background: #fdf1e0; color: #96601a; }
.rp-badge--p2 { background: #eef0f4; color: #5b6473; }
.rp-badge--ok { background: #e6f4ec; color: #14713f; }

.rp-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6mm; }
.rp-grid-72 { display: grid; grid-template-columns: 1.9fr 1fr; gap: 6mm; }

.rp-card {
  border: 1px solid var(--border-subtle, #e4e7ec);
  border-radius: var(--radius-md, 6px);
  padding: 10px 12px;
}
.rp-card__t { font-size: 10px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--foreground-muted, #8b93a1); margin-bottom: 6px; }

/* 结果层数字卡 */
.rp-kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4mm; }
.rp-kpi { border-top: 2px solid var(--foreground, #1c1f26); padding-top: 6px; }
.rp-kpi__k { font-size: 10px; color: var(--foreground-muted, #8b93a1); }
.rp-kpi__v { font-size: 19px; font-weight: 650; line-height: 1.2; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.rp-kpi__n { font-size: 9.5px; color: var(--foreground-muted, #9aa1ad); line-height: 1.45; }

/* 指标体检行（bullet chart）：本次值 + 参考区间 —— 报告态的核心表达，
   工具态藏在 tooltip 里的 data-warn 阈值在这里必须印出来。 */
.rp-bullets { display: grid; gap: 7px; }
.rp-bullet { display: grid; grid-template-columns: 118px 1fr 74px; align-items: center; gap: 10px; }
.rp-bullet__name { font-size: 11px; line-height: 1.3; }
.rp-bullet__track {
  position: relative; height: 15px; border-radius: 3px;
  background: var(--surface-3, #eceef1); overflow: visible;
}
.rp-bullet__fill { position: absolute; inset: 0 auto 0 0; border-radius: 3px; background: var(--foreground-muted, #9aa1ad); }
.rp-bullet__fill.is-ok { background: var(--rp-ok); }
.rp-bullet__fill.is-warn { background: var(--rp-warn); }
.rp-bullet__fill.is-bad { background: var(--rp-bad); }
.rp-bullet__thr { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--foreground, #1c1f26); }
.rp-bullet__thr::after {
  content: attr(data-l); position: absolute; left: 4px; top: -1px;
  font-size: 8.5px; color: var(--foreground-secondary, #4a5160); white-space: nowrap;
}
.rp-bullet__val { font-size: 12px; font-weight: 650; text-align: right; font-variant-numeric: tabular-nums; }
.rp-bullet__val small { font-size: 9px; font-weight: 400; color: var(--foreground-muted, #9aa1ad); }
.rp-bullet__note { grid-column: 2 / -1; margin-top: -3px; font-size: 9.5px; color: var(--foreground-muted, #8b93a1); }

/* ── 健康度仪表 ───────────────────────────────────────────────
   图形本身由工具形态 app.js 的 renderPhsGauge() 生成，见 report-render.js 的
   mountGauges()。那个函数写死了 styles.css 里的 .phs-gauge-* 类名与 --fg 系列变量，
   而报告不引 styles.css（IDE 三栏版面与 A4 文档流没有可复用的部分），所以在此补一组
   同名规则：选择器结构与 styles.css 保持一致，只改两处——
   ① 高度换成 aspect-ratio 3/2，与 renderPhsGauge 的 viewBox(300×200) 严丝合缝，
      SVG 不会在栏宽里留出上下留白、中心分数因此不会偏离环心；
   ② --fg 系列就地映射到设计系统 tokens。 */
.rp-gauge {
  --fg: var(--foreground, #1c1f26);
  --fg-secondary: var(--foreground-secondary, #4a5160);
  --fg-muted: var(--foreground-muted, #6b7280);
}
.phs-gauge-box { position: relative; width: 100%; aspect-ratio: 3 / 2; }
.phs-gauge-box > svg { width: 100%; height: 100%; display: block; }
.phs-gauge-center {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  transform: translateY(9%);
  pointer-events: none; text-align: center;
}
.phs-gauge-grade {
  font-size: 12px; font-weight: 700; line-height: 1;
  padding: 2px 10px; border-radius: 999px; margin-bottom: 3px;
}
.phs-gauge-score {
  font-size: 36px; font-weight: 700; line-height: 1.04;
  letter-spacing: -1px;
}
.phs-gauge-sub {
  font-size: 11px; color: var(--fg-muted); margin-top: 3px;
  display: flex; align-items: center; gap: 5px;
}
.phs-gauge-sub b { color: var(--fg-secondary); font-weight: 600; }
.phs-gauge-estbadge {
  font-size: 10px; font-weight: 700; line-height: 1.4;
  padding: 1px 7px; border-radius: 999px;
}

/* 时间构成堆叠条 */
.rp-stack { display: flex; height: 30px; border-radius: 4px; overflow: hidden; }
.rp-stack__seg { display: flex; align-items: center; justify-content: center; color: #fff; font-size: 10.5px; font-weight: 600; }
.rp-stack-legend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 8px; font-size: 10.5px; }
.rp-stack-legend span { display: inline-flex; align-items: center; gap: 5px; }
.rp-swatch { width: 9px; height: 9px; border-radius: 2px; flex: none; }

/* 表格 */
.rp-table { width: 100%; border-collapse: collapse; font-size: 10.5px; }
.rp-table th {
  text-align: left; font-weight: 600; padding: 5px 6px;
  border-bottom: 1.5px solid var(--foreground, #1c1f26);
  color: var(--foreground-secondary, #4a5160); white-space: nowrap;
}
.rp-table td { padding: 5px 6px; border-bottom: 1px solid var(--border-subtle, #e4e7ec); vertical-align: top; }
.rp-table td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.rp-table tr.is-slow td { background: #fdf0f0; }
.rp-table code { font-family: var(--font-mono, ui-monospace, Consolas, monospace); font-size: 9.5px; }

/* 横条排行（算子 Top-N / rank 构成） */
.rp-hbars { display: grid; gap: 5px; }
.rp-hbar { display: grid; grid-template-columns: 152px 1fr 64px; align-items: center; gap: 9px; font-size: 10.5px; }
.rp-hbar__n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--font-mono, monospace); font-size: 9.5px; }
.rp-hbar__t { height: 13px; background: var(--surface-3, #eceef1); border-radius: 2px; display: flex; }
.rp-hbar__f { border-radius: 2px; }
.rp-hbar__v { text-align: right; font-variant-numeric: tabular-nums; }

/* ── 问题页 ─────────────────────────────────────────────────── */

.rp-issue__head { display: flex; align-items: flex-start; gap: 9px; margin-bottom: 3px; }
.rp-issue__id { font-size: 17px; font-weight: 700; color: var(--primary, #2f6fce); font-variant-numeric: tabular-nums; line-height: 1.34; }
.rp-issue__title { flex: 1; font-size: 17px; font-weight: 600; line-height: 1.34; letter-spacing: -.01em; }
.rp-issue__meta { display: flex; gap: 14px; margin: 0 0 12px; font-size: 10.5px; color: var(--foreground-muted, #8b93a1); }
.rp-issue__meta b { color: var(--foreground, #1c1f26); font-variant-numeric: tabular-nums; }

.rp-evidence {
  margin-top: 10px; padding: 8px 11px;
  background: var(--surface-2, #f6f7f9); border-radius: var(--radius-md, 6px);
  font-size: 10.5px; line-height: 1.55;
}
.rp-evidence__t { font-weight: 600; color: var(--foreground-secondary, #4a5160); margin-right: 6px; }

.rp-impact { display: grid; gap: 8px; align-content: start; }
.rp-impact__q { font-size: 24px; font-weight: 700; line-height: 1.1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.rp-impact__q small { display: block; font-size: 10px; font-weight: 400; letter-spacing: 0; color: var(--foreground-muted, #8b93a1); margin-top: 2px; }
.rp-impact__bar { height: 8px; border-radius: 4px; background: var(--surface-3, #eceef1); overflow: hidden; }
.rp-impact__bar i { display: block; height: 100%; background: var(--rp-bad); }
.rp-impact__txt { font-size: 10.5px; line-height: 1.55; color: var(--foreground-secondary, #4a5160); }

.rp-steps { margin: 0; padding-left: 0; list-style: none; counter-reset: s; display: grid; gap: 5px; }
.rp-steps li { position: relative; padding-left: 22px; font-size: 10.5px; line-height: 1.55; counter-increment: s; }
.rp-steps li::before {
  content: counter(s); position: absolute; left: 0; top: 1px;
  width: 15px; height: 15px; border-radius: 50%;
  background: var(--foreground, #1c1f26); color: #fff;
  font-size: 9px; font-weight: 700; display: grid; place-items: center;
}
.rp-verify {
  margin-top: 9px; padding: 7px 11px; border-left: 3px solid var(--rp-ok);
  background: #f2f8f4; font-size: 10.5px; line-height: 1.55; border-radius: 0 4px 4px 0;
}
.rp-verify b { color: #14713f; }

/* 已排查未见异常 */
.rp-checks { display: grid; gap: 7px; }
.rp-check { display: grid; grid-template-columns: 16px 1fr; gap: 8px; font-size: 10.5px; line-height: 1.55; }
.rp-check__m { color: var(--rp-ok); font-weight: 700; }

/* 深链：屏幕可见，打印隐藏（打印时降级为脚注文本） */
.rp-tool-link {
  float: right; margin-left: 10px; font-size: 10px; text-decoration: none;
  color: var(--primary, #2f6fce); border: 1px solid var(--border-default, #d8dce3);
  border-radius: var(--radius-pill, 999px); padding: 1px 9px; background: var(--surface-1, #fff);
}
.rp-tool-link:hover { background: var(--tone-info-bg, #eaf1fb); }

.rp-empty { padding: 40px; text-align: center; color: var(--foreground-muted, #9aa1ad); }

/* ── 打印 ───────────────────────────────────────────────────── */

@page { size: A4 portrait; margin: 0; }

@media print {
  html, body { background: #fff; }
  .rp-toolbar, .rp-toc, .rp-screen-only { display: none !important; }
  .rp-doc { padding: 0; gap: 0; display: block; }
  .rp-page {
    /* 打印时留 1mm 余量：满额 297mm 的盒子在 297mm 纸上易因舍入溢出，多打一张空白页 */
    width: var(--rp-page-w); min-height: 296mm;
    margin: 0; box-shadow: none;
    break-after: page; page-break-after: always;
  }
  .rp-page:last-child { break-after: auto; page-break-after: auto; }
  .rp-print-only { display: inline !important; }
  /* 背景色是本报告的信息载体（判定色、堆叠条、泳道段），必须打出来 */
  * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  a { color: inherit; text-decoration: none; }
}

.rp-print-only { display: none; }

/* 窄屏兜底：A4 不缩放，只是允许横向滚动，保证版面确定性 */
@media screen and (max-width: 1100px) {
  .rp-toc { display: none; }
  .rp-doc { padding-left: 0; }
}

</style>

function setupBenefitTooltip() {
  const tip = document.createElement('div');
  tip.className = 'g-tooltip';
  document.body.appendChild(tip);

  document.addEventListener('mouseover', e => {
    const el = e.target.closest('[data-tooltip]');
    if (!el) return;
    tip.textContent = el.dataset.tooltip;
    tip.classList.add('visible');
  });

  document.addEventListener('mousemove', e => {
    if (!tip.classList.contains('visible')) return;
    const GAP = 10;
    let x = e.clientX + GAP;
    let y = e.clientY - tip.offsetHeight - GAP;
    if (x + tip.offsetWidth > window.innerWidth - 8) x = e.clientX - tip.offsetWidth - GAP;
    if (y < 8) y = e.clientY + GAP;
    tip.style.left = x + 'px';
    tip.style.top  = y + 'px';
  });

  document.addEventListener('mouseout', e => {
    if (!e.target.closest('[data-tooltip]')) return;
    tip.classList.remove('visible');
  });
}

async function loadPresetReports() {

}

// 自动加载每份报告目录下的 chart-data.json 侧车（若存在），按 report.id 并入
// 全局图表数据表。新报告无需改 app.js / chart-data.js：目录里带上 chart-data.json
// （由 gen-report-charts.mjs 从 evidence/*.db 生成）即可自动出图。
// 侧车结构：{ swimlane?, opView?, commView?, freeAnalysis?, sourceView? }，键为 action id。
async function loadReportChartData() {
  // 渲染期实际读取的对象（与 chart-data.js 注入的 window.* 同引用）
  window.FREE_ANALYSIS_DATA = window.FREE_ANALYSIS_DATA || {};
  const TARGET = {
    swimlane:     SWIMLANE_DATA,
    opView:       OP_VIEW_DATA,
    commView:     COMM_VIEW_DATA,
    freeAnalysis: window.FREE_ANALYSIS_DATA,
    sourceView:   SOURCE_VIEW_DATA,
  };
  await Promise.all(REPORTS.map(async r => {
    if (!r.filename) return;
    const base = r.filename.replace(/\/[^/]*$/, '');   // 去掉结尾 /report.md
    try {
      const resp = await fetch(base + '/chart-data.json');
      if (!resp.ok) return;
      const cd = await resp.json();
      for (const [key, store] of Object.entries(TARGET)) {
        if (!cd[key]) continue;
        store[r.id] = { ...(store[r.id] || {}), ...cd[key] };  // 侧车覆盖同 action 的旧值
      }
      console.log('chart-data 侧车已加载:', base + '/chart-data.json');
    } catch (e) { /* 侧车可选，无则跳过 */ }
  }));
}

function syncReportFormLink(report) {

async function renderRawReport(report) {
  const el = $('reportMdContent');
  if (!el) return;
  let md = report.rawMd;
  if (!md && report.filename) {
    el.innerHTML = '<div class="report-md-status">加载中…</div>';
    try {
      const res = await fetch(report.filename);
      if (!res.ok) throw new Error();
      md = await res.text();
      report.rawMd = md;
    } catch {
      el.innerHTML = '<div class="report-md-status">原始报告文件不可用</div>';
      return;
    }
  }
  if (!md) { el.innerHTML = '<div class="report-md-status">无原始报告</div>'; return; }
  const comparisonHtml = await renderReportComparison(report);
  el.innerHTML = comparisonHtml + `<div class="report-md-body">${marked.parse(md)}</div>`;
}

// 报告原文页签内容区上方的差异对比块（0605、0610 等记录提供对比文件时渲染）
async function renderReportComparison(report) {
  if (!report.comparisonFile) return '';
  let md = report.comparisonMd;
  if (!md) {
    try {
      const res = await fetch(report.comparisonFile);
      if (!res.ok) throw new Error();
      md = await res.text();
      report.comparisonMd = md;

function timelineFillSummary(meta) {
  const titleEl = $('tlSummaryTitle');
  const subEl   = $('tlSummarySub');
  if (titleEl && meta.title) titleEl.textContent = meta.title;
  if (!subEl) return;

  const parts = [];
  const steps = (meta.stepsPerRank || []).length;
  if (Array.isArray(meta.ranks) || typeof meta.ranks === 'number') {
    // profile_dir：多 rank 多机版 meta
    const slow = meta.slowRanks || [];
    const hosts = (meta.hosts || []).length;
    parts.push(`${meta.ranks} rank / ${hosts} host / 每 rank ${steps} step，层级 ${meta.hierarchy || 'Host ▸ Rank ▸ 分支'}（点击行首可折叠/展开，host 内真实对齐）`);
    if (slow.length) parts.push(`计算型慢卡：<b>Rank ${slow.join('、')}</b>，其余卡通信被大量“<b>等待同步</b>”占据（真实传输极短）＝在同步屏障处空等慢卡`);
    const hr = meta.hostRanks || {};
    const hostStr = Object.keys(hr).map(h => `${h}→R${hr[h].join('/R')}`).join('，');
    if (hostStr) parts.push(`机器分布：${hostStr}`);
  } else if (meta.rank !== undefined) {
    // level2：单 rank 版 meta
    parts.push(`${(meta.hosts || ['单机'])[0]} · Rank ${meta.rank} · ${steps} step，层级 ${meta.hierarchy || 'Rank ▸ 分支'}`);
    if (meta.note) parts.push(meta.note);
    if (meta.computingUs && meta.stageUs) {
      parts.push(`计算 ${(meta.computingUs/1000).toFixed(1)}ms / step 总时长 ${(meta.stageUs/1000).toFixed(1)}ms（占比 ${(meta.computingUs/meta.stageUs*100).toFixed(0)}%）`);
    }
  }
  if (meta.unavailableBranches && meta.unavailableBranches.length) {
    parts.push(`<span class="tl-na" title="${meta.unavailableBranches.join(' ｜ ').replace(/"/g, '&quot;')}">部分分支未渲染 ⓘ</span>`);
  }
  subEl.innerHTML = parts.join(' · ');
}

function activateTimelineTab(force) {
  const pane = $('tab-timeline');
  if (!pane) return;
  const reportId = timelineTabState.pendingReportId;
  const getData = TIMELINE_REGISTRY[reportId];
  const dataset = getData ? getData() : null;

  if (!dataset) {
    if (!pane.querySelector('.tl-empty-icon')) {
      pane.innerHTML = '<div class="tl-empty"><div class="tl-empty-icon">🏊</div><div>此报告无关联 Timeline 数据</div></div>';
    }
    timelineTabState.renderer = null;
    timelineTabState.builtForId = null;
    return;
  }

  if (!force && timelineTabState.builtForId === reportId && timelineTabState.renderer) {
    try { timelineTabState.renderer.onResize(); } catch (e) {}
    return;
  }

  if (!pane.querySelector('.tl-layout') && TIMELINE_SKELETON_HTML) pane.innerHTML = TIMELINE_SKELETON_HTML;

  const canvasEl = $('tlSwimlaneCanvas');
  const labelEl  = $('tlSwimlaneLabel');
  if (!canvasEl || !labelEl || typeof parseTraceJSON !== 'function' || typeof SwimlaneRenderer !== 'function') return;

  try {
    const parsed = parseTraceJSON(dataset.coreTasks);
    let analysis;
    try { analysis = (typeof analyzePerformance === 'function') ? analyzePerformance(parsed) : undefined; }
    catch (e) { analysis = undefined; }
    const renderer = new SwimlaneRenderer(canvasEl, labelEl, { labelWidth: 224 });
    // 标题格缩放读数占位：显示当前视窗可见的时间范围（无缩放功能，仅回显）
    const zoomReadout = $('tlZoomReadout');
    if (zoomReadout) renderer.onViewChange = ({ label }) => { zoomReadout.textContent = label; };
    renderer.loadData(parsed, analysis, dataset.laneTree || null);
    timelineFillSummary(dataset.meta || {});
    timelineTabState.renderer = renderer;
    timelineTabState.builtForId = reportId;
    bindTimelineViewToggle();
    requestAnimationFrame(() => { try { renderer.fitToView(); } catch (e) {} });
  } catch (e) {
    console.error('Timeline 泳道渲染失败', e);
    const lay = pane.querySelector('.tl-layout');
    if (lay) lay.innerHTML = `<div class="tl-empty"><div class="tl-empty-icon">🏊</div><div>Timeline 泳道渲染失败：${e && e.message ? e.message : e}</div></div>`;
  }
}

  const toggle = $('tlViewToggle');

  if (!toggle || !legendItems) return;

  if (!legendItems.dataset.defaultHtml) legendItems.dataset.defaultHtml = legendItems.innerHTML;
  toggle.querySelectorAll('.tl-view-btn').forEach(b => {
    const active = b.dataset.mode === 'op';
    b.classList.toggle('active', active);
    b.setAttribute('aria-selected', active ? 'true' : 'false');

  legendItems.classList.remove('tl-legend-note');

  if (toggle.dataset.bound) return;

  toggle.addEventListener('click', e => {

    const mode = btn.dataset.mode === 'op' ? 'op' : 'semantic';
    toggle.querySelectorAll('.tl-view-btn').forEach(b => {
      b.classList.toggle('active', b === btn);
      b.setAttribute('aria-selected', b === btn ? 'true' : 'false');

        li.innerHTML = '按算子名哈希着色：同一算子（同名内核）同色，不同算子颜色不同 · 悬停任务条查看具体算子名';
      } else {
        li.classList.remove('tl-legend-note');
        li.innerHTML = li.dataset.defaultHtml || '';
      }
    }
    timelineTabState.renderer?.setColorMode(mode);
  });
}

// ─── N/A 维度说明 ────────────────────────────────────────────
function getNaReason(dim, r) {
  const taskType = r.taskType || '';
  const subtitle = r.subtitle || '';
  const isOp = taskType.includes('算子');
  const isRL = taskType === 'RL 训练';
  const isSingleCard = subtitle.includes('单卡') || isOp;
  if (dim === '通信') {
    if (isOp) return '单算子调优任务不涉及跨卡通信，该维度不适用';
    if (isSingleCard && !isRL) return '单卡场景无跨卡通信链路，该维度不适用';
    return '本次 Profiling 未开启通信域事件采集';
  }
  if (dim === '内存') {
    if (isRL) return '本次采集 profile_memory=false，无 HBM/L2 带宽数据，内存子项记 N/A';
    return '本次 Profiling 未开启内存事件采集（需追加 memory 分析选项重新采集）';
  }
  if (dim === '均衡') {
    if (isOp) return '单算子调优无多卡负载均衡概念，该维度不适用';
    if (isRL) return '仅采集 rank 0 单卡数据，无法点名慢卡——需补采其余卡才能评估均衡度';
    if (isSingleCard) return '单卡场景无多卡均衡维度，该维度不适用';
    return '当前并行配置下无法评估跨卡负载均衡';
  }
  return '当前任务类型下无对应数据';
}

function setMetricCardProgress(card, value) {

// ============================================================
// 算子页签（规则 11）：分类汇总 + Top-N，与「关键问题」双向联动
// ============================================================
// 差异化不在"有一张算子表"——MindStudio 也有；而在于这张表里哪几行已经被诊断成问题。
// 所以 Top-N 每行都去匹配行动清单，命中的打徽标、可点击跳转；问题详情侧也给反向入口。
const opsState = { scope: 'core', sortKey: 'totalMs', sortDir: 'desc', filter: '' };
const OPS_PRIO_RANK = { P0: 0, P1: 1, P2: 2 };
const OPS_PRIO_COLOR = { P0: '#FF4B7B', P1: '#FF8C42', P2: '#666666' };

// 匹配前把两侧归一：小写 + 去掉非字母数字。这样报告里写的 "all-to-all" 能对上算子名里的
// "alltoall"，"MatMulV3" 能对上 "matmulv3"。中文字符一并去掉，只作为分隔存在。
function opsNorm(text) {
  return String(text || '').toLowerCase().replace(/[^a-z0-9]+/g, '');
}

// 算子 → 行动清单条目，**两级匹配**：
//   tier1（具体）= 全名 / 首段 / 去掉首段的剩余 / 长度 ≥5 的中间段，如 MatMulV2_lm_head → lm_head
//   tier2（泛化）= Type，如 MatMul —— 一个 Type 往往横跨多条问题，只在 tier1 全落空时兜底
// 不分级的话 "MatMul" 会把 lm_head 投影错配到 MoE 路由问题上：两者都是 MatMul，
// 但报告里点名 lm_head 的是另一条 P0。命中多条时取优先级最高的。
// 可靠性最终由规则 11 约束 4 保证（第 3 章点名的算子必须能在表中找到同名行）。
function opsCandidates(op) {
  const parts = String(op.name || '').split(/[_.]+/).filter(Boolean);
  const tier1 = [op.name, parts[0], parts.slice(1).join('_')]
    .concat(parts.filter((p) => p.length >= 5));
  return {
    tier1: [...new Set(tier1)].filter((c) => c && c.length >= 5).map(opsNorm).filter(Boolean),
    tier2: [op.type].filter((c) => c && c.length >= 4).map(opsNorm).filter(Boolean),
  };
}

function opIssueMatch(op, r) {
  if (!r || !r.actions || !r.actions.length) return null;
  const { tier1, tier2 } = opsCandidates(op);
  if (!tier1.length && !tier2.length) return null;
  const pick = (cands) => {
    if (!cands.length) return null;
    let best = null;
    for (const a of r.actions) {
      const issue = (r.issues || []).find((i) => +String(i.id).split('.')[1] === a.id);
      const text = opsNorm([a.problem, a.location, issue && issue.title, issue && issue.evidence, issue && issue.impact]
        .filter(Boolean).join(' '));
      if (!cands.some((c) => text.includes(c))) continue;
      if (!best || (OPS_PRIO_RANK[a.priority] ?? 9) < (OPS_PRIO_RANK[best.priority] ?? 9)) best = a;
    }
    return best;
  };
  return pick(tier1) || pick(tier2);
}

// 反向：某个行动项涉及哪些算子（供问题详情的「在算子表中查看」入口）
function issueOpMatches(a, r) {
  if (!r || !r.opStats || !r.opStats.top) return [];
  return r.opStats.top.filter((op) => {
    const m = opIssueMatch(op, r);
    return m && m.id === a.id;
  });
}

const OPS_COLUMNS = [
  { key: 'idx', label: '#', cls: 'num dim', sortable: false },
  { key: 'name', label: '算子', cls: 'name', sortable: false },
  { key: 'type', label: 'Type', cls: 'dim', sortable: false },
  { key: 'coreType', label: 'Core Type', cls: 'dim', sortable: false },
  { key: 'count', label: '次数', cls: 'num', sortable: true },
  { key: 'totalMs', label: '总耗时', cls: 'num', sortable: true },
  { key: 'pct', label: '占比', cls: 'num', sortable: true },
  { key: 'avgUs', label: '单次均值', cls: 'num', sortable: true },
  { key: 'p90Us', label: 'P90', cls: 'num', sortable: true },
  { key: 'shape', label: 'Input Shape', cls: 'dim', sortable: false },
  { key: 'opState', label: 'OP State', cls: 'dim', sortable: false },
  { key: 'diag', label: '诊断', cls: '', sortable: false },
];

function fmtUs(us) {
  if (us == null || !isFinite(us)) return '—';
  if (us >= 1000) { const d = fmtDuration(us / 1000); return `${d.value} ${d.unit}`; }
  return `${us.toFixed(0)} us`;
}
function fmtMsCell(ms) {
  const d = fmtDuration(ms);
  return d ? `${d.value} ${d.unit}` : '—';
}

function renderOpsTab(r) {
  const btn = document.getElementById('opsTabBtn');
  const catBoard = document.getElementById('opsCatBoard');
  const thead = document.getElementById('opsThead');
  const tbody = document.getElementById('opsTbody');
  if (!catBoard || !thead || !tbody) return;
  const os = r && r.opStats;

  // 报告未按规则 11 出表 → 页签禁用（与「计算图」页签同一处理），避免点进去看空壳
  if (btn) {
    const has = !!(os && (os.byCategory.length || os.top.length));
    btn.disabled = !has;
    if (!has && btn.classList.contains('active')) document.querySelector('.tab[data-tab="overview"]')?.click();
  }
  if (!os) { catBoard.innerHTML = ''; thead.innerHTML = ''; tbody.innerHTML = ''; return; }

  // ── 分类汇总：口径页签（core / phase），只在报告确实给了两种口径时才出现 ──
  const scopes = [...new Set(os.byCategory.map((c) => c.scope))];
  const scopeTabs = document.getElementById('opsScopeTabs');
  if (scopeTabs) {
    if (scopes.length <= 1) { scopeTabs.innerHTML = ''; opsState.scope = scopes[0] || 'core'; }
    else {
      scopeTabs.innerHTML = scopes.map((s) => {
        const label = s === 'phase' ? '按阶段' : '按核类型';
        return `<button type="button" role="tab" data-ops-scope="${s}" class="${opsState.scope === s ? 'is-selected' : ''}" aria-selected="${opsState.scope === s}">${label}</button>`;
      }).join('');
    }
  }
  const cats = os.byCategory.filter((c) => c.scope === opsState.scope);
  const catMax = Math.max(1, ...cats.map((c) => c.totalMs || 0));
  catBoard.innerHTML = cats.map((c) => {
    const w = ((c.totalMs || 0) / catMax) * 100;
    return `
      <div class="ops-cat__row">
        <span class="ops-cat__name">${escapeHtml(c.label)}</span>
        <span class="ops-cat__bar"><span class="ops-cat__fill" style="width:${w.toFixed(1)}%;background:${opsCatColor(c.label)}"></span></span>
        <span class="ops-cat__num">${fmtMsCell(c.totalMs)}</span>
        <span class="ops-cat__num">${c.pct != null ? c.pct.toFixed(1) + '%' : '—'}</span>
        <span class="ops-cat__sub">${c.count != null ? '×' + c.count : ''} · ${fmtUs(c.avgUs)}</span>
      </div>`;
  }).join('') || '<div class="ops-hint">报告未提供分类汇总表</div>';

  // ── Top-N 表 ──
  thead.innerHTML = '<tr>' + OPS_COLUMNS.map((col) => {
    const sorted = opsState.sortKey === col.key;
    const caret = sorted ? `<span class="ops-caret">${opsState.sortDir === 'desc' ? '▾' : '▴'}</span>` : '';
    return `<th class="${col.sortable ? '' : 'is-static'}${sorted ? ' is-sorted' : ''}"${col.sortable ? ` data-ops-sort="${col.key}"` : ''}>${escapeHtml(col.label)}${caret}</th>`;
  }).join('') + '</tr>';

  const q = opsState.filter.trim().toLowerCase();
  let rows = os.top.slice();
  if (q) rows = rows.filter((op) => `${op.name} ${op.type} ${op.coreType}`.toLowerCase().includes(q));
  const dir = opsState.sortDir === 'desc' ? -1 : 1;
  rows.sort((a, b) => {
    const av = a[opsState.sortKey], bv = b[opsState.sortKey];
    if (av == null && bv == null) return 0;
    if (av == null) return 1;                 // 缺数据一律沉底，不参与排序方向
    if (bv == null) return -1;
    return (av - bv) * dir;
  });

  tbody.innerHTML = rows.map((op, i) => {
    const act = opIssueMatch(op, r);
    const diag = act
      ? `<button type="button" class="ops-diag" data-ops-action="${act.id}" style="background:${OPS_PRIO_COLOR[act.priority]}22;color:${OPS_PRIO_COLOR[act.priority]}" title="${escapeHtml(act.problem)}">${act.priority} · 已诊断</button>`
      : '<span class="dim">—</span>';
    const dyn = /dynamic/i.test(op.opState || '');
    return `<tr>
      <td class="num dim">${i + 1}</td>
      <td class="name">${escapeHtml(op.name)}</td>
      <td class="dim">${escapeHtml(op.type || '—')}</td>
      <td class="dim">${escapeHtml(op.coreType || '—')}</td>
      <td class="num">${op.count != null ? op.count : '—'}</td>
      <td class="num">${fmtMsCell(op.totalMs)}</td>
      <td class="num">${op.pct != null ? op.pct.toFixed(1) + '%' : '—'}</td>
      <td class="num">${fmtUs(op.avgUs)}</td>
      <td class="num">${fmtUs(op.p90Us)}</td>
      <td class="dim">${escapeHtml(op.shape || '—')}</td>
      <td class="dim${dyn ? ' ops-state-dyn' : ''}">${escapeHtml(op.opState || '—')}</td>
      <td>${diag}</td>
    </tr>`;
  }).join('') || `<tr><td colspan="${OPS_COLUMNS.length}" class="dim" style="padding:20px;text-align:center">无匹配算子</td></tr>`;

  const cov = document.getElementById('opsCoverage');
  if (cov) {
    const sum = os.top.reduce((s, op) => s + (op.pct || 0), 0);
    cov.textContent = `共 ${os.top.length} 条，累计占 device 总耗时 ${sum.toFixed(1)}%`;
  }
}

// 分类条颜色：与总览构成条 / Timeline 图例同源，同一语义跨页签保持一致
function opsCatColor(label) {
  const l = String(label).toUpperCase();
  if (l.includes('HCCL') || l.includes('COMM')) return BREAKDOWN_COLOR.comm_exposed;
  if (l.includes('CPU')) return BREAKDOWN_COLOR.host_launch;
  if (l.includes('VECTOR')) return '#5aa86f';
  if (l.includes('FREE') || l.includes('空')) return BREAKDOWN_COLOR.bubble;
  return BREAKDOWN_COLOR.compute;
}

// 算子页签的交互一次性委托（排序 / 口径 / 过滤 / 诊断跳转），幂等
function bindOpsTab() {
  if (bindOpsTab._bound) return;
  bindOpsTab._bound = true;
  document.addEventListener('click', (e) => {
    const sortTh = e.target.closest && e.target.closest('[data-ops-sort]');
    if (sortTh) {
      const key = sortTh.dataset.opsSort;
      if (opsState.sortKey === key) opsState.sortDir = opsState.sortDir === 'desc' ? 'asc' : 'desc';
      else { opsState.sortKey = key; opsState.sortDir = 'desc'; }
      renderOpsTab(currentReport);
      return;
    }
    const scopeBtn = e.target.closest && e.target.closest('[data-ops-scope]');
    if (scopeBtn) { opsState.scope = scopeBtn.dataset.opsScope; renderOpsTab(currentReport); return; }

    // 诊断徽标 → 回总览并选中对应问题（算子表 → 关键问题）
    const diagBtn = e.target.closest && e.target.closest('[data-ops-action]');
    if (diagBtn) {
      const aid = +diagBtn.dataset.opsAction;
      document.querySelector('.tab[data-tab="overview"]')?.click();
      const card = document.querySelector(`.ic-card[data-id="${aid}"]`);
      if (card) { window.selectIssueCard(card); card.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
      return;
    }

    // 问题详情 →「在算子表中查看」（关键问题 → 算子表，按算子名过滤）
    const opsLink = e.target.closest && e.target.closest('[data-ops-filter]');
    if (opsLink) {
      opsState.filter = opsLink.dataset.opsFilter;
      opsState.sortKey = 'totalMs'; opsState.sortDir = 'desc';
      const btn = document.getElementById('opsTabBtn');
      if (btn && !btn.disabled) btn.click();
      const input = document.getElementById('opsFilter');
      if (input) input.value = opsState.filter;
      renderOpsTab(currentReport);
    }
  });
  const input = document.getElementById('opsFilter');
  if (input) input.addEventListener('input', () => { opsState.filter = input.value; renderOpsTab(currentReport); });
}

// ============================================================
// 指标看板 · 结果层（规则 9.1）
// ============================================================
// 绝对量，回答"这次跑多久、多快"。不做阈值着色——810 ms 是快是慢取决于模型和集群规模，
// 没有普适健康区间，硬套阈值只会误导；判断留给下面的结构层比率和跨任务对比。
function escapeHtml(value) {
  return String(value == null ? '' : value).replace(/[&<>"']/g, (ch) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[ch]));
}

const RESULT_CARDS = [
  { key: 'step_time_median', name: '单步耗时(中位)', kind: 'dur', tip: '剔除 warmup 后稳定区间的 step 耗时中位数。训练本身抖动 3~5%，故用中位数而非均值，也不用单个 step。' },
  { key: 'step_time_p90', name: '单步耗时(P90)', kind: 'dur', tip: '90 分位 step 耗时。与中位数拉开较大差距时说明存在长尾慢 step（常见于 dataloader、ckpt 保存、通信重传）。' },
  { key: 'throughput', name: '吞吐', kind: 'raw', tip: '端到端吞吐，单位随任务类型而定（tokens/s、samples/s、it/s）。跨任务对比时这是最直接的收益口径。' },
  { key: 'e2e_duration', name: '端到端时长', kind: 'dur', tip: 'active 采集窗口的墙钟时长。与「有效 step 数 × 单步耗时」差距过大时，说明采集窗口里混入了非稳态阶段。' },
];

// 时长格式化：内部一律 ms，展示时按量级切到 s
function fmtDuration(ms) {
  if (ms == null || !isFinite(ms)) return null;
  if (Math.abs(ms) >= 1000) return { value: (ms / 1000).toFixed(2), unit: 's' };
  if (Math.abs(ms) >= 10) return { value: ms.toFixed(0), unit: 'ms' };
  return { value: ms.toFixed(2), unit: 'ms' };
}

function renderResultBoard(r) {
  const zone = document.getElementById('metricResultZone');
  const board = document.getElementById('metricResultBoard');
  if (!zone || !board) return;
  const results = (r && r.results) || null;
  // 报告未按规则 9.1 提供结果指标表 → 整块隐藏，而不是摆一排"暂无数据"占位
  if (!results || !Object.keys(results).length) { zone.hidden = true; board.innerHTML = ''; return; }
  zone.hidden = false;
  board.innerHTML = RESULT_CARDS.map((def) => {
    const m = results[def.key];
    if (!m) return '';
    let valText = '—', unitText = '';
    if (def.kind === 'dur') {
      const d = fmtDuration(m.value);
      if (d) { valText = d.value; unitText = d.unit; }
    } else if (m.value != null) {
      valText = String(m.value);
      unitText = m.unit || '';
    } else {
      valText = m.raw || '—';
    }
    return `
      <div class="ovm-card ovm-result" data-metric="${def.key}">
        <div class="ovm-head"><span class="ovm-name">${escapeHtml(def.name)}</span><button class="ovm-info" type="button" aria-label="查看${escapeHtml(def.name)}说明" data-tip="${escapeHtml(def.tip)}">?</button></div>
        <div class="ovm-body"><span class="ovm-value">${escapeHtml(valText)}</span><span class="ovm-unit">${escapeHtml(unitText)}</span></div>
        <div class="ovm-status">${escapeHtml(m.note || '')}</div>
      </div>`;
  }).join('');
}

// ============================================================
// 指标看板 · 可信层（口径条）
// ============================================================
// step CV 决定上面绝对量和下面所有比率能不能信：CV 超阈值时，单点采样的比率全是噪声。
// 所以它不与其他指标平级摆成一张卡，而是作为整块看板的口径脚注常驻。
const STEP_CV_WARN = 10;

function renderTrustBar(r) {
  const bar = document.getElementById('metricTrustBar');
  if (!bar) return;
  const results = (r && r.results) || {};
  // step_cv 与指标卡走同一展示口径：display 优先（部分报告 value 存的是小数、由 display 给百分比），
  // 阈值判断也用展示值取数，避免卡片显示 0.02% 而口径条按 0.0002 去比阈值。
  const cvM = r && r.metrics && r.metrics.step_cv;
  let cvText = null, cvNum = null;
  if (cvM && cvM.value != null && cvM.value !== '') {
    cvText = cvM.display != null ? String(cvM.display) : `${cvM.value}%`;
    const parsed = cellNum(cvText);
    cvNum = parsed != null ? parsed : Number(cvM.value);
  }
  const parts = [];
  const shaky = cvNum != null && isFinite(cvNum) && cvNum > STEP_CV_WARN;

  if (cvText) {
    parts.push(`step 抖动 CV <b>${escapeHtml(cvText)}</b>`);
  }
  if (results.active_steps) {
    const warm = results.warmup_steps ? `，warmup ${results.warmup_steps.value} 已剔除` : '';
    parts.push(`有效 step <b>${results.active_steps.value}</b>${warm}`);
  } else if (results.warmup_steps) {
    parts.push(`warmup step <b>${results.warmup_steps.value}</b>`);
  }
  if (results.profiling_level) {
    parts.push(`采集档位 <b>${escapeHtml(results.profiling_level.raw)}</b>`);
  }
  if (!parts.length) { bar.innerHTML = ''; bar.hidden = true; return; }
  bar.hidden = false;
  bar.classList.toggle('is-shaky', shaky);
  const warnText = shaky
    ? `<span class="ovm-trust__warn">⚠ CV ${escapeHtml(cvText)} > ${STEP_CV_WARN}%，训练不稳定，以下比率类指标基于抖动区间，仅供参考</span>`
    : '';
  bar.innerHTML = parts.map((p) => `<span>${p}</span>`).join('') + warnText;
}

// ============================================================
// 指标看板 · 构成层（规则 9.2）
// ============================================================
// 色板与 Timeline 页签泳道图例同源，同一语义在两个页签里不能是两种颜色。
const BREAKDOWN_COLOR = {
  compute: '#1a8f52',        // 计算 —— 同泳道图例「计算（内核 / 聚合）」
  comm_exposed: '#2f6fce',   // 通信（未掩盖）—— 同「通信·传输」
  bubble: '#566173',         // 调度空泡 —— 同「空闲」
  host_launch: '#c15a1c',    // Host 下发 —— 同「通信（聚合）」暖色位
  other: '#6b7280',
};

function renderBreakdown(r) {
  const zone = document.getElementById('metricBreakdownZone');
  const stack = document.getElementById('metricBreakdown');
  const note = document.getElementById('metricBreakdownNote');
  if (!zone || !stack) return;
  const bd = r && r.breakdown;
  if (!bd || !bd.items || !bd.items.length) { zone.hidden = true; stack.innerHTML = ''; return; }
  zone.hidden = false;

  const total = bd.totalMs || bd.items.reduce((sum, it) => sum + it.ms, 0);
  // 图例放柱状条上面、数字放大成小型指标块（标签+色点在上，大号数值在下），
  // 视觉分量接近结果层/结构层的指标卡片，构成层卡片不再显得比上下两层矮一截；
  // 柱状条退到图例下面做「总览确认」用，不再是这块卡片里最抢眼的元素。
  stack.innerHTML =
    '<div class="ovm-stack__legend">' +
      bd.items.map((it) => {
        const pct = it.pct != null ? it.pct : (total > 0 ? (it.ms / total) * 100 : 0);
        const d = fmtDuration(it.ms);
        const color = BREAKDOWN_COLOR[it.key] || BREAKDOWN_COLOR.other;
        return '<span class="ovm-stack__item">' +
          `<span class="ovm-stack__item-label"><i style="background:${color}"></i>${escapeHtml(it.label)}</span>` +
          `<span class="ovm-stack__item-val">${d ? d.value : '—'}<small>${d ? d.unit : ''}</small><span class="ovm-stack__item-pct">${pct.toFixed(1)}%</span></span>` +
        '</span>';
      }).join('') +
    '</div>' +
    '<div class="ovm-stack__bar">' +
      bd.items.map((it) => {
        const pct = it.pct != null ? it.pct : (total > 0 ? (it.ms / total) * 100 : 0);
        const d = fmtDuration(it.ms);
        return `<span class="ovm-stack__seg" style="width:${pct.toFixed(2)}%;background:${BREAKDOWN_COLOR[it.key] || BREAKDOWN_COLOR.other}" title="${escapeHtml(it.label)} ${d ? d.value + ' ' + d.unit : ''} · ${pct.toFixed(1)}%"></span>`;
      }).join('') +
    '</div>';

  // 闭合校验（规则 9.2 硬性约束 1）：与单步耗时中位数偏差 > 2% 时点出来，
  // 否则用户会把一条不闭合的堆叠条当成完整的时间去向读。
  if (note) {
    const stepMs = r.results && r.results.step_time_median ? r.results.step_time_median.value : null;
    if (stepMs && total > 0) {
      const devPct = Math.abs(total - stepMs) / stepMs * 100;
      if (devPct > 2) {
        note.textContent = `合计 ${fmtDuration(total).value} ${fmtDuration(total).unit}，与单步耗时偏差 ${devPct.toFixed(1)}%，未闭合`;
        note.classList.add('is-warn');
      } else {
        // 闭合是预期状态，不用专门报一句"一致"——只在真出问题（未闭合）时才提示
        note.textContent = '';
        note.classList.remove('is-warn');
      }
    } else {
      note.textContent = '';
      note.classList.remove('is-warn');
    }
  }
}

// ============================================================
// 指标看板 · 结构层阈值（按任务类型取，不再全局硬编码）
// ============================================================
// 同一个「算子利用率 60%」阈值，训练场景合理，推理和 RL rollout 场景就会天天误报——
// 推理本来就有大量 host 下发与小 batch 空隙，RL rollout 更是 host 串行主导。
// 只覆写有明确依据的项，其余仍回落到卡片 data-warn。
const METRIC_WARN_BY_TASK = {
  '推理诊断': { op_utilization: 40, host_launch_gap_ratio: 10, critical_path_ratio: 65 },
  'RL 训练': { op_utilization: 30, host_launch_gap_ratio: 20, critical_path_ratio: 55 },
  '算子调优': { host_launch_gap_ratio: 15 },
};
function metricWarnFor(taskType, key, fallback) {
  const over = METRIC_WARN_BY_TASK[taskType];
  const v = over && over[key];
  return v != null ? String(v) : fallback;
}

// rankStats（规则 10）→ 结构层「Rank 间 step 离散度」卡片。
// 把派生结果写回 metrics，让它与其他结构指标走同一套渲染与阈值逻辑。
function injectRankMetric(r, metrics) {
  const rs = r && r.rankStats;
  if (!rs || rs.spreadPct == null) return metrics;
  const slow = rs.slowRanks && rs.slowRanks.length
    ? `最慢 Rank ${rs.slowRanks.join(' / ')}`
    : '无离群 rank';
  const src = rs.rows.some((row) => row.verdict === 'slow') ? '报告判定' : '按最晚进入通信推定';
  const dur = (ms) => { const d = fmtDuration(ms); return d ? `${d.value} ${d.unit}` : '—'; };
  return Object.assign({}, metrics, {
    rank_spread: {
      value: Math.round(rs.spreadPct * 10) / 10,
      note: `${slow}（${src}）；中位 ${dur(rs.median)}，极值 ${dur(rs.min)}–${dur(rs.max)}`,
    },
  });
}

function renderMetricBoard(r) {
  const board = document.getElementById('metricBoard');
  if (!board) return;
  const metrics = injectRankMetric(r, (r && r.metrics) || {});
  board.querySelectorAll('.ovm-card').forEach(card => {
    const key = card.dataset.metric;
    const valEl = card.querySelector('.ovm-value');
    const stEl = card.querySelector('.ovm-status');
    const m = metrics[key];
    setMetricCardProgress(card, NaN);

    // 芯片相关卡片（MFU / 显存利用率）：存原始量，按下拉所选峰值/容量换算，不走 m.value
    if (card.dataset.raw) {
      const raw = m ? Number(m[card.dataset.raw]) : NaN;
      card._raw = isFinite(raw) ? raw : NaN;
      card._note = (m && m.note) || '';
      // MFU 卡：若报告给出了端到端 MFU（拆解 PP bubble/通信/优化器等陪跑损耗后的真实值），
      // 卡片直接展示这个数字，而不是「stage0 cube 达成 ÷ 芯片峰值」这种偏高的单点估算
      // ——两者的差异正是「MFU 计算明细」抽屉要解释的内容。
      const e2e = m ? Number(m.e2e_pct) : NaN;
      card._e2ePct = isFinite(e2e) ? e2e : NaN;
      refreshChipCard(card);
      return;
    }

    card.classList.remove('ovm-ok', 'ovm-warn', 'ovm-bad', 'ovm-na');

    if (!m || m.value == null || m.value === '') {       // 无数据 → 占位
      valEl.textContent = '—';
      card.classList.add('ovm-na');
      if (stEl) stEl.textContent = '暂无数据';
      setMetricCardProgress(card, NaN);
      return;
    }

    const v = Number(m.value);
    valEl.textContent = (m.display != null) ? m.display : (isFinite(v) ? v : m.value);

    let status = m.status;                                // 显式状态优先
    const warnAttr = metricWarnFor(r && r.taskType, key, card.dataset.warn);
    if (!status && warnAttr != null && warnAttr !== '' && isFinite(v)) {
      const warn = Number(warnAttr);
      const breach = card.dataset.dir === 'high' ? v < warn : v > warn;
      status = breach ? 'warn' : 'ok';
    }
    if (status) card.classList.add('ovm-' + status);     // 无阈值且无显式状态 → 中性
    if (stEl) stEl.textContent = m.note || '';
    setMetricCardProgress(card, v);
  });

  // 下拉切换：MFU 与显存卡按「同一型号」联动（选项顺序一致，按 index 对齐），两张卡一起重算。只绑定一次
  if (!board._chipBound) {
    board._chipBound = true;
    board.addEventListener('change', e => {
      const sel = e.target.closest('.ovm-select');
      if (!sel) return;
      const idx = sel.selectedIndex;
      board.querySelectorAll('.ovm-chipcard .ovm-select').forEach(s => {
        if (s !== sel && idx < s.options.length) s.selectedIndex = idx;   // 同步到同型号
      });
      board.querySelectorAll('.ovm-chipcard').forEach(refreshChipCard);
    });
  }

  initMetricEditor();   // 「编辑」控制面板（显示/隐藏 + 拖动排序），幂等
}

// ── 结构层「编辑」控制面板：默认显示下列指标，可勾选增减、拖动排序 ──
// MFU 与显存利用率是结构层的必备项：前者是"算力用出来多少"的唯一口径，后者决定能不能
// 加 batch / 关重计算，两者都是优化决策的直接输入，不能只藏在「编辑」里。
// 它们的分母（芯片峰值算力 / HBM 容量）落盘数据里没有、要用户下拉选型号，
// 这个不确定性由卡片自己的说明气泡承担，不作为把它们移出默认集的理由。
const METRIC_BOARD_DEFAULT = [
  'critical_path_ratio', 'op_utilization', 'overlap_ratio', 'rank_spread', 'mfu', 'mem_util',
];

function metricCardLabel(card) {
  return (card.querySelector('.ovm-name')?.textContent || card.dataset.metric || '').trim();
}

function initMetricEditor() {
  const board = document.getElementById('metricBoard');
  const btn = document.getElementById('metricEditBtn');
  const panel = document.getElementById('metricEditor');
  if (!board || !btn || !panel || board._editorInit) return;
  board._editorInit = true;

  // 默认：仅显示 METRIC_BOARD_DEFAULT 的 4 个，并按该顺序前置；其余隐藏
  const present = METRIC_BOARD_DEFAULT.filter(k => board.querySelector(`.ovm-card[data-metric="${k}"]`));
  present.slice().reverse().forEach(k => {                 // 倒序逐个插到最前 → 正序前置
    board.insertBefore(board.querySelector(`.ovm-card[data-metric="${k}"]`), board.firstChild);
  });
  board.querySelectorAll('.ovm-card').forEach(c => {
    c.classList.toggle('ovm-hidden', !present.includes(c.dataset.metric));
  });

  btn.addEventListener('click', e => {
    e.stopPropagation();
    if (panel.classList.toggle('open')) renderMetricEditor();
  });
  panel.addEventListener('click', e => e.stopPropagation());
  document.addEventListener('click', () => panel.classList.remove('open'));
}

function renderMetricEditor() {
  const board = document.getElementById('metricBoard');
  const panel = document.getElementById('metricEditor');
  if (!board || !panel) return;
  const all = [...board.querySelectorAll('.ovm-card')];
  const shown = all.filter(c => !c.classList.contains('ovm-hidden'));
  const hidden = all.filter(c => c.classList.contains('ovm-hidden'));
  const row = (c, isShown) =>
    `<div class="dd-item${isShown ? '' : ' muted'}"${isShown ? ' draggable="true"' : ''} data-key="${c.dataset.metric}">
       <span class="dd-handle"${isShown ? '' : ' style="visibility:hidden"'}>⠿</span>
       <span class="dd-label">${metricCardLabel(c)}</span>
       <input type="checkbox"${isShown ? ' checked' : ''} data-key="${c.dataset.metric}"></div>`;
  panel.innerHTML =
    `<div class="dd-title">已显示 <span class="hint">拖动排序</span></div>` +
    `<div id="meShown">` + shown.map(c => row(c, true)).join('') + `</div>` +
    `<div class="dd-title">未显示 <span class="hint">勾选加入看板</span></div>` +
    hidden.map(c => row(c, false)).join('') +
    `<div class="dd-divider"></div>` +
    `<div class="dd-add" id="meAddCustom"><span class="dd-add-icon">+</span><span>新建自定义指标</span></div>`;
  bindMetricEditor();
}

function bindMetricEditor() {
  const board = document.getElementById('metricBoard');
  const panel = document.getElementById('metricEditor');

  // 新建自定义指标：入口先接好，具体的指标定义/公式表单待产品设计
  const addBtn = document.getElementById('meAddCustom');
  if (addBtn) addBtn.addEventListener('click', e => { e.stopPropagation(); });

  // 勾选切换显示/隐藏：显示则移到已显示末尾
  panel.querySelectorAll('input[type=checkbox]').forEach(cb => {
    cb.addEventListener('change', e => {
      e.stopPropagation();
      const card = board.querySelector(`.ovm-card[data-metric="${cb.dataset.key}"]`);
      if (!card) return;
      if (cb.checked) { card.classList.remove('ovm-hidden'); board.appendChild(card); }
      else { card.classList.add('ovm-hidden'); }
      renderMetricEditor();
    });
  });

  // 拖动排序（仅「已显示」区），结束后把面板顺序应用回看板 DOM
  const container = document.getElementById('meShown');
  if (!container) return;
  let dragEl = null;
  container.querySelectorAll('.dd-item').forEach(item => {
    item.addEventListener('dragstart', () => { dragEl = item; item.classList.add('dragging'); });
    item.addEventListener('dragend', () => {
      item.classList.remove('dragging');
      [...container.querySelectorAll('.dd-item')].forEach(el => {  // 按面板顺序依次 append
        const c = board.querySelector(`.ovm-card[data-metric="${el.dataset.key}"]`);
        if (c) board.appendChild(c);
      });
      board.querySelectorAll('.ovm-card.ovm-hidden').forEach(c => board.appendChild(c)); // 隐藏的置后
    });
  });
  container.addEventListener('dragover', e => {
    e.preventDefault();
    if (!dragEl) return;
    const after = metricEditorAfter(container, e.clientY);
    if (after == null) container.appendChild(dragEl);
    else container.insertBefore(dragEl, after);
  });
}

function metricEditorAfter(container, y) {
  const items = [...container.querySelectorAll('.dd-item:not(.dragging)')];
  let closest = { dist: -Infinity, el: null };
  for (const el of items) {
    const box = el.getBoundingClientRect();
    const offset = y - box.top - box.height / 2;
    if (offset < 0 && offset > closest.dist) closest = { dist: offset, el };
  }
  return closest.el;
}

// 按卡内下拉所选项，用原始量（达成算力 TF/s · 显存占用峰值 GB）换算百分比并着色
function refreshChipCard(card) {
  if (!card) return;
  const valEl = card.querySelector('.ovm-value');
  const stEl = card.querySelector('.ovm-status');
  const sel = card.querySelector('.ovm-select');
  const raw = card._raw;
  card.classList.remove('ovm-ok', 'ovm-warn', 'ovm-bad', 'ovm-na');

  if (!isFinite(raw)) {                                   // 无落盘原始量 → 占位（下拉仍可切换）
    valEl.textContent = '—';
    card.classList.add('ovm-na');
    if (stEl) stEl.textContent = card._note || '暂无数据';
    setMetricCardProgress(card, NaN);
    return;
  }

  const denom = Number(sel.value);
  const pct = (denom > 0) ? (raw / denom * 100) : NaN;
  const isMfu = card.dataset.metric === 'mfu';
  const hasE2e = isMfu && isFinite(card._e2ePct);
  valEl.textContent = hasE2e ? card._e2ePct.toFixed(0) : (isFinite(pct) ? pct.toFixed(1) : '—');
  setMetricCardProgress(card, hasE2e ? card._e2ePct : pct);
  // 显存触顶是绝对风险：即使容量分母来自用户选择，>=95% 仍明确标为异常。
  if (!isMfu && isFinite(pct) && pct >= 95) card.classList.add('ovm-bad');
  if (!isMfu && isFinite(pct) && pct >= 85 && pct < 95) card.classList.add('ovm-warn');

  // 状态行：把换算依据写清楚（原始量 + 当前所选项），便于核对。
  // 显存卡在告警/异常态还要补一句「为什么红 / 怎么办」——只给分子分母，用户看不出这是风险。
  if (stEl) {
    const opt = sel.options[sel.selectedIndex]?.textContent || '';
    stEl.textContent = hasE2e
      ? `端到端（拆 PP bubble/通信/优化器后）；cube 达成 ${raw} TF/s ÷ ${opt} ≈ ${isFinite(pct) ? pct.toFixed(0) : '—'}%`
      : isMfu
        ? `达成 ${raw} TF/s ÷ ${opt}`
        : `占用 ${raw} GB ÷ ${opt}${memUtilRiskNote(raw, denom, pct)}`;
  }
}

// 显存利用率的风险话术：接近/达到 HBM 容量意味着随时 OOM，必须点名后果与可执行动作
function memUtilRiskNote(raw, denom, pct) {
  if (!isFinite(pct) || !(denom > 0)) return '';
  const free = Math.max(0, denom - raw);
  const freeTxt = free < 1 ? `${(free * 1024).toFixed(0)} MB` : `${free.toFixed(1)} GB`;
  if (pct >= 99) return ` · ⚠ 已打满，仅剩 ${freeTxt}：随时 OOM，分配器反复回收还会拖慢 step。先开重计算 / 调小 micro-batch，再查碎片率`;
  if (pct >= 95) return ` · ⚠ 已触顶，剩 ${freeTxt}：batch 或序列长度再涨就会 OOM。建议开重计算、调小 micro-batch 或调整 TP/PP 切分`;
  if (pct >= 85) return ` · 余量仅 ${freeTxt}，接近上限，暂不建议再加 batch`;
  return '';
}

// ============================================================
// Tab 2: 问题
// ============================================================
// 关键问题排序：'benefit'(优化收益高→低，默认) | 'severity'(严重程度高→低) | 'difficulty'(修改难度低→高)
let issueSortMode = 'benefit';
const ISSUE_DIFF_RANK = { '低': 0, '中': 1, '高': 2 };
const ISSUE_PRIO_RANK = { P0: 0, P1: 1, P2: 2 };
// 标签悬浮提示文案：优先级（P0/P1/P2）与修复难度（高/中/低）
const ISSUE_PRIO_TIP = {
  P0: 'P0 · 最高优先级：对性能影响最大，建议立即处理',
  P1: 'P1 · 高优先级：影响较大，建议尽快处理',
  P2: 'P2 · 一般优先级：可在后续迭代中优化',
};
const ISSUE_DIFF_TIP = {
  '高': '修复难度：高 · 改动较大或涉及核心逻辑，需谨慎评估',
  '中': '修复难度：中 · 改动适中，需一定开发与验证成本',
  '低': '修复难度：低 · 改动较小，可快速落地',
};
const prioTip = p => ISSUE_PRIO_TIP[p] || '问题优先级';
const diffTip = d => ISSUE_DIFF_TIP[d] || '修复难度';

function sortIssueActions(actions) {
  const arr = actions.slice();
  if (issueSortMode === 'severity') {
    arr.sort((a, b) => (ISSUE_PRIO_RANK[a.priority] ?? 9) - (ISSUE_PRIO_RANK[b.priority] ?? 9)
      || (b.benefitNum || 0) - (a.benefitNum || 0));
  } else if (issueSortMode === 'difficulty') {
    arr.sort((a, b) => (ISSUE_DIFF_RANK[a.difficulty] ?? 9) - (ISSUE_DIFF_RANK[b.difficulty] ?? 9)
      || (b.benefitNum || 0) - (a.benefitNum || 0));
  } else { // benefit
    arr.sort((a, b) => (b.benefitNum || 0) - (a.benefitNum || 0));
  }
  return arr;
}

window.setIssueSort = function (mode) {
  issueSortMode = mode;
  if (currentReport) renderIssues(currentReport);
};

function renderIssues(r) {
  const issuesTab = document.querySelector('.tab[data-tab="issues"]');
  if (issuesTab) issuesTab.textContent = `问题 (${r.actions.length})`;

  const listEl = $('issuesList');
  if (!listEl) return;

  const sel = $('issueSortSelect');
  if (sel) sel.value = issueSortMode;

  const sortedActions = sortIssueActions(r.actions);
  listEl.innerHTML = sortedActions.map((a, idx) => {
    const pc = { P0: '#FF4B7B', P1: '#FF8C42', P2: '#666666' }[a.priority] || '#666666';
    return `
      <div class="ic-card${idx === 0 ? ' active' : ''}" data-id="${a.id}" data-report="${r.id}"
           onclick="selectIssueCard(this)">
        <div class="ic-card-title">${escHtml(a.problem)}</div>
        <div class="ic-card-meta">
          <span class="ac-priority" style="background:${pc}20;color:${pc}" data-tooltip="${escHtml(prioTip(a.priority))}">${a.priority}</span>
          ${a.benefitNum ? `<span class="ac-benefit" data-tooltip="预期单步总耗时减少：${a.benefit}">-${a.benefitNum}%</span>` : ''}
          <span class="ac-diff diff-${a.difficulty}" data-tooltip="${escHtml(diffTip(a.difficulty))}">${escHtml(a.difficulty)}</span>
        </div>
      </div>`;
  }).join('');

  if (sortedActions.length > 0) renderIssueDetail(r, sortedActions[0]);
}

window.selectIssueCard = function(cardEl) {
  const rid = cardEl.dataset.report;
  const aid = +cardEl.dataset.id;
  cardEl.closest('.issues-card-list')
    ?.querySelectorAll('.ic-card')
    .forEach(c => c.classList.remove('active'));
  cardEl.classList.add('active');
  if (!currentReport || currentReport.id !== rid) return;
  const a = currentReport.actions.find(x => x.id === aid);
  if (a) renderIssueDetail(currentReport, a);
};

// Tab 切换 / 复制 / 操作按钮 / 轻提示
window.frTab = function (btn, idx) {
  const root = btn.closest('.ac-fr');
  if (!root) return;
  // active = 本模块状态位；is-selected = 设计系统 tab-control 的选中态
  root.querySelectorAll('.ac-fr-tab').forEach((t, i) => {
    t.classList.toggle('active', i === idx);
    t.classList.toggle('is-selected', i === idx);
  });
  root.querySelectorAll('.ac-fr-scheme').forEach((p, i) => p.classList.toggle('active', i === idx));
};
window.frDiffView = function (mode) {
  window._frDiffMode = mode;
  document.querySelectorAll('.ac-fr-diff2').forEach(d => d.setAttribute('data-mode', mode));
  document.querySelectorAll('.ac-fr-vt-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === mode);
    b.classList.toggle('is-selected', b.dataset.mode === mode);
  });
};
window.frCopy = function (btn) {
  const text = decodeURIComponent(btn.dataset.copy || '');
  const done = () => { const o = btn.textContent; btn.textContent = '已复制'; btn.classList.add('copied');
    setTimeout(() => { btn.textContent = o; btn.classList.remove('copied'); }, 1400); };
  if (navigator.clipboard?.writeText) navigator.clipboard.writeText(text).then(done).catch(done);
  else done();
};
window.frAction = function (kind) {
  frToast(kind === 'branch' ? '演示环境：将新建分支并提交修复（未接入代码仓库）' : '演示环境：将就地应用修复（未接入代码仓库）');
};
function frToast(msg) {
  let t = document.getElementById('frToast');
  if (!t) { t = document.createElement('div'); t.id = 'frToast'; t.className = 'fr-toast'; document.body.appendChild(t); }
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._tm); t._tm = setTimeout(() => t.classList.remove('show'), 2200);
}

function fixReviewHtml(r, a) {
  const fr = FIX_REVIEW_DATA[r.id]?.[a.id];
  if (!fr || !fr.schemes?.length) return '';

  const tabsHtml = fr.schemes.map((s, i) =>
    `<button class="tab-control-item ac-fr-tab${i === 0 ? ' active is-selected' : ''}" onclick="frTab(this,${i})">`
    + `<span class="ac-fr-tab-name">${escHtml(s.name)}</span>`
    + (s.recommended ? `<span class="ac-fr-badge ac-fr-badge-rec">推荐</span>` : '')
    + (s.conceptual ? `<span class="ac-fr-badge ac-fr-badge-con">示意</span>` : '')
    + `</button>`
  ).join('');

  const mode = window._frDiffMode || 'split';
  const schemesHtml = fr.schemes.map((s, i) => {
    const copyLines = [];
    // 并排 diff：左右两列，自动行号
    let lnL = s.lnStart || 1, lnR = s.lnStart || 1;
    const splitHtml = (s.rows || []).map(row => {
      let kind, before = '', after = '';
      if (row.same !== undefined) { kind = 'same'; before = after = row.same; }
      else if (row.add !== undefined) { kind = 'add'; after = row.add; }
      else if (row.del !== undefined) { kind = 'del'; before = row.del; }
      else { kind = 'mod'; before = row.before || ''; after = row.after || ''; }
      const lL = (kind === 'add') ? '' : lnL++;
      const lR = (kind === 'del') ? '' : lnR++;
      if (kind !== 'del') copyLines.push(after);
      const lcls = (kind === 'del' || kind === 'mod') ? ' fr-cell-del' : '';
      const rcls = (kind === 'add' || kind === 'mod') ? ' fr-cell-add' : '';
      const sign = kind === 'add' ? '+' : kind === 'del' ? '-' : ' ';
      return `<tr>`
        + `<td class="fr-ln">${lL}</td>`
        + `<td class="fr-code${lcls}">${before !== '' || kind === 'del' || kind === 'mod' ? escHtml(before) : ''}</td>`
        + `<td class="fr-ln">${lR}</td>`
        + `<td class="fr-code${rcls}"><span class="fr-sign">${sign}</span>${escHtml(after)}</td>`
        + `</tr>`;
    }).join('');
    // 统一 diff：单列，增删上下交错
    let ulnL = s.lnStart || 1, ulnR = s.lnStart || 1;
    const uRow = (oldNo, newNo, sign, code, cls) =>
      `<tr class="fru-${cls}"><td class="fr-ln">${oldNo}</td><td class="fr-ln">${newNo}</td>`
      + `<td class="fr-code fru-code"><span class="fr-sign">${sign}</span>${escHtml(code)}</td></tr>`;
    const unifiedHtml = (s.rows || []).flatMap(row => {
      if (row.same !== undefined) return [uRow(ulnL++, ulnR++, ' ', row.same, 'same')];
      if (row.add !== undefined) return [uRow('', ulnR++, '+', row.add, 'add')];
      if (row.del !== undefined) return [uRow(ulnL++, '', '-', row.del, 'del')];
      return [uRow(ulnL++, '', '-', row.before || '', 'del'), uRow('', ulnR++, '+', row.after || '', 'add')];
    }).join('');

    const copyAttr = encodeURIComponent(copyLines.join('\n'));
    const segs = (s.path || '').split('/').filter(Boolean);
    const crumb = segs.map((seg, k) =>
      k === segs.length - 1 ? `<b>${escHtml(seg)}</b>` : escHtml(seg)).join('<span class="fr-sep">/</span>');

    return `
      <div class="ac-fr-scheme${i === 0 ? ' active' : ''}">
        <div class="ac-fr-rows">
          <div class="ac-fr-row"><span class="ac-fr-rl">根因定位</span><span class="ac-fr-rt">${escHtml(s.rootCause || '')}</span></div>
          <div class="ac-fr-row"><span class="ac-fr-rl">修改策略</span><span class="ac-fr-rt">${escHtml(s.strategy || '')}</span></div>
        </div>
        <div class="ac-fr-path">${crumb}</div>
        <div class="ac-fr-diff2" data-mode="${mode}">
          <div class="ac-fr-diff2-bar">
            <div class="tab-control ac-fr-vtoggle">
              <button class="tab-control-item ac-fr-vt-btn${mode === 'split' ? ' active is-selected' : ''}" data-mode="split" onclick="frDiffView('split')">Split</button>
              <button class="tab-control-item ac-fr-vt-btn${mode === 'unified' ? ' active is-selected' : ''}" data-mode="unified" onclick="frDiffView('unified')">Inline</button>
            </div>
            <button class="ac-fr-copy" data-copy="${copyAttr}" onclick="frCopy(this)">复制</button>
          </div>
          <div class="ac-fr-diff2-scroll">
            <table class="ac-fr-diff2-tbl fr-tbl-split"><tbody>${splitHtml}</tbody></table>
            <table class="ac-fr-diff2-tbl fr-tbl-unified"><tbody>${unifiedHtml}</tbody></table>
          </div>
        </div>
      </div>`;
  }).join('');

  return `
    <div class="ac-section-title ac-fr-title">智能修复预览</div>
    <div class="ac-fr">
      <div class="tab-control ac-fr-tabs">${tabsHtml}</div>
      ${schemesHtml}
      ${fr.caveat ? `<div class="ac-fr-caveat">⚠️ ${escHtml(fr.caveat)}</div>` : ''}
      <div class="ac-fr-actions">
        <button class="btn btn-sm btn-solid ac-fr-btn" type="button" onclick="frAction('branch')">新建分支并提交</button>
        <button class="btn btn-sm ac-fr-btn" type="button" onclick="frAction('edit')">修改到本分支</button>
      </div>
    </div>
  `;
}

// 证据文本里常见 `code`/**bold** 行内 markdown（如 `aten::copy_`、**AI Core MAC 占比**），
// 之前直接 escHtml 会把反引号/星号原样吐出来，读起来就是没解析的裸代码。用行内 markdown
// 渲染撑住这些 span，而不是整段走 marked.parse（那样会包一层 <p>，破坏表格排版）。
function mdInline(text) {
  if (!text) return '';
  if (typeof marked?.parseInline === 'function') {
    try { return marked.parseInline(text); } catch (e) { /* 回退到纯转义 */ }
  }
  return escHtml(text);
}

// 证据文本按「；」拆分句，每句再按「来源：细节」拆两列。只有真的拆出「来源」标签、
// 或本来就有多句可分行时才值得排成表格——单句又拆不出来源的话，表格只会是一整行
// 占两列，视觉上跟一段文字没区别，等于假表格；这种情况直接按段落排版，不硬套表格骨架。
function evidenceTableHtml(text) {
  if (!text) return '';
  // 报告解析出来的证据常是完整 markdown 块：含表格（| … |）、多级 -/1. 列表、`code`。
  // 这类内容必须整块交给 marked 渲染（与「报告原文」页签一致），否则下面按「；」拆句的
  // 启发式会把表格/列表的 | 与 - 原样吐成源码。只有不含这些块级结构的单段散文，才走
  // 「来源／细节」两列拆表。
  const hasMdBlock = /(^|\n)\s*\|.+\|/.test(text)              // markdown 表格行
                  || /(^|\n)\s*(?:[-*]|\d+\.)\s+\S/.test(text); // 无序/有序列表项
  if (hasMdBlock && typeof marked?.parse === 'function') {
    return `<div class="id-evidence-md ac-md">${marked.parse(text)}</div>`;
  }
  const clauses = text.split(/；/).map(s => s.trim()).filter(Boolean);
  if (!clauses.length) return '';
  const fileRe = /^([\w.\-]+\.(?:csv|json|db|log|md|py|txt|bin))(\s*\([^)]*\))?/;
  const parsed = clauses.map(clause => {
    const colonIdx = clause.search(/[：:]/);
    const fileMatch = clause.match(fileRe);
    let src = '', detail = clause;
    if (fileMatch && (colonIdx === -1 || colonIdx > fileMatch[0].length + 6)) {
      src = fileMatch[0].trim();
      detail = clause.slice(fileMatch[0].length).replace(/^[：:]\s*/, '').trim();
    } else if (colonIdx > -1 && colonIdx < 40) {
      src = clause.slice(0, colonIdx).trim();
      detail = clause.slice(colonIdx + 1).trim();
    }
    return { src, detail };
  });
  const worthTable = parsed.some(p => p.src) || parsed.length > 1;
  if (!worthTable) return `<div class="id-evidence-prose">${mdInline(text)}</div>`;
  const rows = parsed.map(({ src, detail }) => src
    ? `<tr><td class="iet-src"><span class="iet-src-pill">${escHtml(src)}</span></td><td class="iet-detail">${mdInline(detail)}</td></tr>`
    : `<tr><td class="iet-detail" colspan="2">${mdInline(detail)}</td></tr>`
  ).join('');
  return `<table class="id-evidence-table"><thead><tr><th>来源</th><th>细节</th></tr></thead><tbody>${rows}</tbody></table>`;
}

// 问题详情 →「在算子表中查看」：把这条问题涉及的算子带过去并自动过滤。
// 与算子表侧的「诊断」徽标构成闭环——结论 → 证据表 → 自己验一遍 → 回到结论。
function issueOpsLinkHtml(r, a) {
  const ops = issueOpMatches(a, r);
  if (!ops.length) return '';
  // 多个算子时用共同前缀做过滤词（如 MatMulV3_expert_ffn_up / _down → MatMulV3_expert）
  const filter = ops.length === 1 ? ops[0].name : (ops[0].type || String(ops[0].name).split('_')[0]);
  const total = ops.reduce((sum, op) => sum + (op.totalMs || 0), 0);
  return `<button type="button" class="id-ops-link" data-ops-filter="${escapeHtml(filter)}">在算子表中查看 ${ops.length} 个相关算子 · 合计 ${fmtMsCell(total)}</button>`;
}

  const commWrap = detailEl.querySelector('.ac-comm-wrap');

function initAcSwimlane(vp) {
  const rid = vp.dataset.rid;
  const aid = +vp.dataset.aid;
  const slEntry = vp._slData || SWIMLANE_DATA[rid]?.[aid];
  if (!slEntry || typeof SwimlaneRenderer === 'undefined') return;

  const inner = vp.children[0];
  const labelEl = inner.querySelector('.ac-sl-label');
  const canvasEl = inner.querySelector('.ac-sl-canvas');

  try {
    const parsed = parseTraceJSON(slEntry.data);
    const renderer = new SwimlaneRenderer(canvasEl, labelEl);
    vp._slRenderer = renderer;
    // 点击泳道小方块 → 按算子签名定位到对应框架源码片段（见 OP_CODE_MAP）
    renderer.onEventClick = (ev) => renderOpCodePanel(vp, ev);
    // double RAF: first frame requests layout, second gets correct dimensions
    requestAnimationFrame(() => {
      renderer.loadData(parsed, null);
      if (slEntry.annotations?.length) renderer.setAnnotations(slEntry.annotations);
      requestAnimationFrame(() => {
        renderer.fitToView(); renderer.onResize();
        // 默认横向定位到被标注的问题方块，并直接展示其源码（无需点击）
        if (rid === 'r20260618pp' || rid === 'r20260715pangu') {
          requestAnimationFrame(() => focusSwimlaneProblem(vp, renderer, slEntry));
        }
      });
    });
  } catch (e) {
    console.warn('swimlane init failed', e);
  }
}
