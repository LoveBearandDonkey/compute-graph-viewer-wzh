<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AMP Loss Scaling：把梯度从下溢区搬回安全区</title>
  <desc id="desc">左右双栏对比未使用与使用 65536 倍 AMP loss scale 时，loss 和梯度在数值表示范围中的位置。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef4fa"/>
    </linearGradient>
    <linearGradient id="blueBand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dceeff"/>
      <stop offset="1" stop-color="#edf7ff"/>
    </linearGradient>
    <linearGradient id="redBand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9e5"/>
      <stop offset="1" stop-color="#fff3f0"/>
    </linearGradient>
    <linearGradient id="greenBand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2f7e8"/>
      <stop offset="1" stop-color="#f2fbf4"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#d9e2ec" stroke-width="1" opacity="0.55"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#102a43" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: Inter, "Segoe UI", "Microsoft YaHei", sans-serif; fill: #16324f; }
      .panel-title { font-size: 30px; font-weight: 800; }
      .section-title { font-size: 23px; font-weight: 800; }
      .axis { font-size: 17px; font-weight: 650; fill: #526477; }
      .label { font-size: 20px; font-weight: 700; }
      .small { font-size: 16px; font-weight: 650; }
      .tiny { font-size: 14px; font-weight: 600; }
      .point { stroke: #ffffff; stroke-width: 5; paint-order: stroke; }
      .point-ring { fill: none; stroke: #334155; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="800" y="56" text-anchor="middle" font-size="38" font-weight="850" fill="#123d73">AMP Loss Scaling：把梯度从下溢区搬回安全区</text>

  <!-- BEFORE panel -->
  <g filter="url(#shadow)">
    <rect x="20" y="86" width="760" height="704" rx="20" fill="#ffffff" stroke="#e34b4b" stroke-width="3"/>
    <path d="M40 86 H760 A20 20 0 0 1 780 106 V154 H20 V106 A20 20 0 0 1 40 86Z" fill="#fff0ef"/>
  </g>
  <circle cx="170" cy="120" r="23" fill="#c81e2b"/>
  <text x="170" y="130" text-anchor="middle" font-size="28" font-weight="850" fill="#fff">1</text>
  <text x="205" y="130" class="panel-title" fill="#b91c1c">不乘 Loss Scale｜梯度下溢</text>

  <!-- BEFORE loss -->
  <text x="42" y="205" class="section-title">Loss</text>
  <text x="42" y="232" class="small">FP32 数值范围</text>
  <rect x="155" y="173" width="595" height="202" rx="10" fill="url(#blueBand)"/>
  <rect x="155" y="173" width="595" height="202" rx="10" fill="url(#grid)"/>
  <line x1="155" y1="173" x2="750" y2="173" stroke="#2563eb" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="742" y="164" text-anchor="end" class="small" fill="#1d4ed8">FP32 上界 3.4×10³⁸</text>
  <path d="M155 190 l-8 7 l16 7 l-16 7 l8 7" fill="none" stroke="#334155" stroke-width="2"/>
  <text x="174" y="218" class="tiny">动态范围极宽（示意断轴）</text>
  <circle cx="205" cy="314" r="15" fill="#1746e0" class="point"/>
  <circle cx="205" cy="314" r="19" class="point-ring"/>
  <text x="235" y="308" class="label" fill="#123da8">L = 3.1</text>
  <text x="235" y="335" class="small" fill="#3b6ca8">安全：远低于 3.4×10³⁸</text>
  <line x1="225" y1="354" x2="540" y2="354" stroke="#2563eb" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <text x="360" y="345" class="small" fill="#2563eb">backward（求梯度）</text>

  <!-- BEFORE gradient -->
  <text x="42" y="455" class="section-title">梯度</text>
  <text x="42" y="482" class="small">FP8 E5M2</text>
  <rect x="155" y="425" width="595" height="280" rx="10" fill="#ffffff"/>
  <rect x="155" y="425" width="595" height="280" rx="10" fill="url(#grid)"/>
  <!-- underflow boundary exp ~= -4.2, y=609 -->
  <rect x="155" y="609" width="595" height="96" fill="url(#redBand)"/>
  <line x1="155" y1="430" x2="750" y2="430" stroke="#f59e0b" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="742" y="420" text-anchor="end" class="small" fill="#d97706">E5M2 上界 57344</text>
  <line x1="155" y1="425" x2="155" y2="705" stroke="#334155" stroke-width="2"/>
  <!-- tick mapping: exponent e => y = 510 - 20e -->
  <g class="axis" text-anchor="end">
    <text x="143" y="435">10⁴</text><text x="143" y="475">10²</text><text x="143" y="515">10⁰</text>
    <text x="143" y="555">10⁻²</text><text x="143" y="595">10⁻⁴</text><text x="143" y="635">10⁻⁶</text><text x="143" y="675">10⁻⁸</text>
  </g>
  <g stroke="#aab7c4" stroke-width="1">
    <line x1="150" y1="430" x2="750" y2="430"/><line x1="150" y1="470" x2="750" y2="470"/><line x1="150" y1="510" x2="750" y2="510"/>
    <line x1="150" y1="550" x2="750" y2="550"/><line x1="150" y1="590" x2="750" y2="590"/><line x1="150" y1="630" x2="750" y2="630"/>
    <line x1="150" y1="670" x2="750" y2="670"/>
  </g>
  <line x1="155" y1="609" x2="750" y2="609" stroke="#e34b4b" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="732" y="601" text-anchor="end" class="tiny" fill="#b91c1c">qmin / FTZ 边界（依实现）</text>
  <text x="173" y="694" class="label" fill="#b91c1c">下溢 / 量化零区</text>
  <!-- Exact BEFORE point positions: 1e-5 y610, 1e-6 y630, 1e-7 y650, 1e-8 y670 -->
  <polyline points="265,610 355,630 445,650 535,670" fill="none" stroke="#c81e2b" stroke-width="3" stroke-dasharray="7 5"/>
  <g fill="#ef4444">
    <circle cx="265" cy="610" r="12" class="point"/><circle cx="265" cy="610" r="16" class="point-ring"/>
    <circle cx="355" cy="630" r="12" class="point"/><circle cx="355" cy="630" r="16" class="point-ring"/>
    <circle cx="445" cy="650" r="12" class="point"/><circle cx="445" cy="650" r="16" class="point-ring"/>
    <circle cx="535" cy="670" r="12" class="point"/><circle cx="535" cy="670" r="16" class="point-ring"/>
  </g>
  <g class="small" fill="#c81e2b" text-anchor="middle">
    <text x="265" y="585">1e-5</text><text x="355" y="605">1e-6</text><text x="445" y="625">1e-7</text><text x="535" y="645">1e-8</text>
  </g>
  <line x1="555" y1="680" x2="580" y2="720" stroke="#64748b" stroke-width="3" marker-end="url(#arrowGray)"/>
  <!-- zero baseline is deliberately outside the log plot -->
  <line x1="300" y1="741" x2="610" y2="741" stroke="#64748b" stroke-width="4"/>
  <g fill="#64748b">
    <circle cx="340" cy="741" r="10" class="point"/><circle cx="410" cy="741" r="10" class="point"/>
    <circle cx="480" cy="741" r="10" class="point"/><circle cx="550" cy="741" r="10" class="point"/>
  </g>
  <text x="170" y="724" class="small" fill="#475569">不同小梯度 → 同一量化编码 0</text>
  <text x="170" y="765" class="tiny" fill="#64748b">0 不在 log 轴上，因此单独画成横线</text>
  <circle cx="700" cy="738" r="32" fill="#fff" stroke="#c81e2b" stroke-width="8"/>
  <line x1="680" y1="718" x2="720" y2="758" stroke="#c81e2b" stroke-width="8"/>
  <line x1="720" y1="718" x2="680" y2="758" stroke="#c81e2b" stroke-width="8"/>
  <text x="700" y="782" text-anchor="middle" class="small" fill="#b91c1c">参数几乎不更新</text>

  <!-- AFTER panel -->
  <g filter="url(#shadow)">
    <rect x="820" y="86" width="760" height="704" rx="20" fill="#ffffff" stroke="#16a05d" stroke-width="3"/>
    <path d="M840 86 H1560 A20 20 0 0 1 1580 106 V154 H820 V106 A20 20 0 0 1 840 86Z" fill="#eefaf2"/>
  </g>
  <circle cx="970" cy="120" r="23" fill="#087a42"/>
  <text x="970" y="130" text-anchor="middle" font-size="28" font-weight="850" fill="#fff">2</text>
  <text x="1005" y="130" class="panel-title" fill="#087a42">乘 S = 65536｜进入安全区</text>

  <!-- AFTER loss -->
  <text x="842" y="205" class="section-title">Loss</text>
  <text x="842" y="232" class="small">FP32 数值范围</text>
  <rect x="955" y="173" width="595" height="202" rx="10" fill="url(#blueBand)"/>
  <rect x="955" y="173" width="595" height="202" rx="10" fill="url(#grid)"/>
  <line x1="955" y1="173" x2="1550" y2="173" stroke="#2563eb" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="1542" y="164" text-anchor="end" class="small" fill="#1d4ed8">FP32 上界 3.4×10³⁸</text>
  <path d="M955 190 l-8 7 l16 7 l-16 7 l8 7" fill="none" stroke="#334155" stroke-width="2"/>
  <text x="974" y="218" class="tiny">动态范围极宽（示意断轴）</text>
  <circle cx="1015" cy="286" r="15" fill="#1746e0" class="point"/>
  <circle cx="1015" cy="286" r="19" class="point-ring"/>
  <text x="1045" y="280" class="label" fill="#123da8">L′ = S × L ≈ 2.0×10⁵</text>
  <text x="1045" y="307" class="small" fill="#3b6ca8">仍在 FP32 内，距上界约 1.7×10³³ 倍</text>
  <line x1="1025" y1="354" x2="1340" y2="354" stroke="#2563eb" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <text x="1160" y="345" class="small" fill="#2563eb">backward（求梯度）</text>

  <!-- AFTER gradient: same exact scale -->
  <text x="842" y="455" class="section-title">梯度</text>
  <text x="842" y="482" class="small">FP8 E5M2</text>
  <rect x="955" y="425" width="595" height="280" rx="10" fill="url(#greenBand)"/>
  <rect x="955" y="425" width="595" height="280" rx="10" fill="url(#grid)"/>
  <rect x="955" y="609" width="595" height="96" fill="url(#redBand)"/>
  <line x1="955" y1="430" x2="1550" y2="430" stroke="#f59e0b" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="1542" y="420" text-anchor="end" class="small" fill="#d97706">E5M2 上界 57344</text>
  <line x1="955" y1="425" x2="955" y2="705" stroke="#334155" stroke-width="2"/>
  <g class="axis" text-anchor="end">
    <text x="943" y="435">10⁴</text><text x="943" y="475">10²</text><text x="943" y="515">10⁰</text>
    <text x="943" y="555">10⁻²</text><text x="943" y="595">10⁻⁴</text><text x="943" y="635">10⁻⁶</text><text x="943" y="675">10⁻⁸</text>
  </g>
  <g stroke="#aab7c4" stroke-width="1">
    <line x1="950" y1="430" x2="1550" y2="430"/><line x1="950" y1="470" x2="1550" y2="470"/><line x1="950" y1="510" x2="1550" y2="510"/>
    <line x1="950" y1="550" x2="1550" y2="550"/><line x1="950" y1="590" x2="1550" y2="590"/><line x1="950" y1="630" x2="1550" y2="630"/>
    <line x1="950" y1="670" x2="1550" y2="670"/>
  </g>
  <line x1="955" y1="609" x2="1550" y2="609" stroke="#e34b4b" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="1532" y="601" text-anchor="end" class="tiny" fill="#b91c1c">qmin / FTZ 边界（依实现）</text>
  <text x="973" y="694" class="label" fill="#b91c1c">下溢 / 量化零区</text>
  <!-- Exact AFTER positions. log10 values: -0.1805,-1.1805,-2.1805,-3.1805; y=510-20e -->
  <polyline points="1065,514 1155,534 1245,554 1335,574" fill="none" stroke="#087a42" stroke-width="3" stroke-dasharray="7 5"/>
  <g fill="#0b8f4d">
    <circle cx="1065" cy="514" r="12" class="point"/><circle cx="1065" cy="514" r="16" class="point-ring"/>
    <circle cx="1155" cy="534" r="12" class="point"/><circle cx="1155" cy="534" r="16" class="point-ring"/>
    <circle cx="1245" cy="554" r="12" class="point"/><circle cx="1245" cy="554" r="16" class="point-ring"/>
    <circle cx="1335" cy="574" r="12" class="point"/><circle cx="1335" cy="574" r="16" class="point-ring"/>
  </g>
  <g class="small" fill="#087a42" text-anchor="middle">
    <text x="1065" y="490">6.6e-1</text><text x="1155" y="510">6.6e-2</text><text x="1245" y="530">6.6e-3</text><text x="1335" y="550">6.6e-4</text>
  </g>
  <rect x="1370" y="475" width="160" height="94" rx="12" fill="#ffffff" stroke="#16a05d" stroke-width="2"/>
  <text x="1450" y="507" text-anchor="middle" class="label" fill="#087a42">未触碰下溢区</text>
  <text x="1450" y="536" text-anchor="middle" class="small" fill="#087a42">且远低于上界</text>
  <text x="1110" y="650" class="small" fill="#087a42">1e-5 × 65536 ≈ 6.6e-1</text>
  <text x="1110" y="675" class="small" fill="#087a42">1e-8 × 65536 ≈ 6.6e-4</text>
  <rect x="1290" y="704" width="190" height="66" rx="12" fill="#e5f8eb" stroke="#16a05d" stroke-width="2"/>
  <text x="1385" y="731" text-anchor="middle" class="small" fill="#087a42">unscale：g′/65536 = g</text>
  <text x="1385" y="755" text-anchor="middle" class="tiny" fill="#087a42">只在 optimizer 前除回去</text>
  <line x1="1484" y1="737" x2="1520" y2="737" stroke="#64748b" stroke-width="3" marker-end="url(#arrowGray)"/>
  <circle cx="1542" cy="737" r="23" fill="#087a42"/>
  <path d="M1530 737 l9 9 l17 -20" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bottom equation ribbon -->
  <rect x="20" y="810" width="1560" height="70" rx="16" fill="#e8f3ff" stroke="#4c9be8" stroke-width="2"/>
  <text x="800" y="854" text-anchor="middle" font-size="28" font-weight="750" fill="#123d73">∂(S·L)/∂w = S·∂L/∂w　→　只改变表示位置，不改变真实梯度与更新幅度</text>
</svg>
