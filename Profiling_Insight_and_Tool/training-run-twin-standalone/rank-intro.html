<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rank 的设计表达 · 分步入门</title>
<!-- 面向小白的 rank 分步讲解页，十步，每一步的图都长在上一步的图上：
     一张卡 → 一台机器 8 张 → 128 张等距矩阵 → PP 分四组（拉开、黄闪）→ DP 标 16 组（蓝闪）
     → TP 变形成上下两层（青闪）→ EP 标组（紫闪）→ 空框装进显存五档 → 选中 R23，
     四个维度的发射线逐维长出来（实线机内、虚线跨机）→ 展平：3D 卡阵压成
     config-relation-plane 那块平面画布（横轴 layer 按 PP 分块、纵轴一段里的 rank 序、
     顶 PP|Layer 与左 EDP|DP 两条量尺、滚轮缩放拖拽平移）。
     十步全是本页自己用 canvas 画的卡阵，样式照 rank-topology-3d 那份 pattern 的 3D 卡壳
     （灰边、灰白面、玻璃），编号照 demo 的 rankOf：rank = (pp·16 + dp)·2 + tp（tp 变得
     最快），右上角「打开原 pattern」过去时 R 号一一对得上。
     部署：deploy.yml「① 目录入口」那一行按页名列举，本页已加进去。 -->
<style>
  :root{
    --bg:#fff; --bg2:#f4f5f8; --fg:#131a2a; --fg2:#5b6472; --fg3:#9aa3b2; --fgrgb:19,26,42;
    --line:rgba(var(--fgrgb),.10); --bad:#c0392b;
    --card-front:rgba(255,255,255,.62); --card-right:rgba(236,239,244,.70); --card-top:rgba(247,248,251,.85);
    --tile:#fff;   /* 第 10 步展平格子的底色：浅色是白瓷砖，深色换成比底板略亮一档的石板灰 */
    --tp:#22D3EE; --pp:#FFAA3B; --dp:#4369EF; --ep:#9B3CF6;
    --red:220,38,38;   /* 实战场景里四档红的基色（rgb 三元，靠 alpha 分档） */
    --sans:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  }
  /* 深色主题：只换这一组 token，画布里的颜色也从这里读（readTheme） */
  /* 取值照原 pattern（vendor/pto-tokens/semantic.css 的 dark 段）：底 #080a0f，前景是白色的
     .92 / .66 / .46 三档，边线白 .16；卡面照 --pt-face1/2/3 的明暗关系用半透明白铺 */
  html[data-theme="dark"]{
    --bg:#080a0f; --bg2:rgba(255,255,255,.075); --fg:rgba(255,255,255,.92); --fg2:rgba(255,255,255,.66);
    --fg3:rgba(255,255,255,.46); --fgrgb:255,255,255; --line:rgba(var(--fgrgb),.16); --bad:#ff6b6b;
    --card-front:rgba(255,255,255,.07); --card-right:rgba(255,255,255,.10); --card-top:rgba(255,255,255,.14);
    --tile:#1a1e28; --red:255,107,107;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.7;
       -webkit-font-smoothing:antialiased;overflow:hidden}
  .page{height:100%;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:340px 1fr;
        grid-template-areas:"top top" "side stage" "foot foot"}

  .top{grid-area:top;display:flex;align-items:center;justify-content:space-between;padding:22px 36px 0 36px}
  /* 左上角是两枚页签，不是一枚 brand：当前这套分步入门是第一页，「实战场景」先留空位 */
  .top .tl{display:flex;align-items:flex-end;gap:16px}
  /* 页签左边那枚 IDE 式的侧栏开关：图标是一只框、里面一道竖线分出左栏；开着时左栏填色，收起时留空。
     它管两页的左栏——入门页的文字栏、实战页的案例目录 */
  .sidetg{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;color:var(--fg2);
          background:none;border:1px solid var(--line);border-radius:6px;padding:0;cursor:pointer;margin-bottom:2px}
  .sidetg:hover{color:var(--fg);border-color:rgba(var(--fgrgb),.3)}
  .sidetg svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linejoin:round}
  .sidetg svg .pane{fill:currentColor;stroke:none;opacity:.85}
  .page[data-side="off"] .sidetg svg .pane{fill:none}
  /* 收起：入门页左栏整列归零、画布吃满；实战页案例目录那列归零 */
  .page[data-side="off"]{grid-template-columns:0 1fr}
  .page[data-side="off"] .side{display:none}
  .page[data-side="off"] .stage{padding-left:36px}
  .page[data-side="off"] .scene{grid-template-columns:minmax(0,1fr)}
  .page[data-side="off"] .cs-rail{display:none}
  .top .tabs{display:flex;align-items:flex-end;gap:22px}
  .top .tabs button{font:inherit;font-weight:600;font-size:13px;letter-spacing:.02em;color:var(--fg3);background:none;border:0;
                    padding:0 0 6px;cursor:pointer;position:relative;white-space:nowrap}
  .top .tabs button:hover{color:var(--fg2)}
  .top .tabs button[aria-selected="true"]{color:var(--fg);font-weight:700}
  .top .tabs button[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--fg);border-radius:1px}
  /* ── 实战场景：左边一列案例，右边一张图 + 最多两行字 ───────────────────
     图全是 DOM（不是 canvas）：一张展平图，横轴 48 层按 PP 段分 4 块，
     纵轴是一段里的 32 张卡（k = dp·2 + tp），一格 = 这张卡的一层。
     格子尺寸由 fit() 按可用空间算，图居中撑满；四档红分四批亮起（背景色过渡，
     格与格之间按列错开 30ms，扫一遍过去）。 */
  .scene{grid-area:2 / 1 / 4 / 3;display:none;grid-template-columns:208px minmax(0,1fr);min-width:0;min-height:0;overflow:hidden}
  .page[data-tab="scene"] .scene{display:grid}
  .page[data-tab="scene"] .side,.page[data-tab="scene"] .stage,.page[data-tab="scene"] .foot{display:none}

  .cs-rail{padding:40px 12px 24px 36px;display:flex;flex-direction:column;gap:2px;min-height:0;overflow:auto}
  .cs-rail button{font:inherit;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:7px 9px;
                  cursor:pointer;color:var(--fg3);font-size:12px;line-height:1.5}
  .cs-rail button .n{font-family:var(--mono);font-size:10.5px;margin-right:6px;opacity:.8}
  .cs-rail button:hover{background:rgba(var(--fgrgb),.05);color:var(--fg2)}
  .cs-rail button[aria-current="true"]{background:rgba(var(--fgrgb),.07);color:var(--fg);font-weight:600}

  .cs-main{min-width:0;min-height:0;overflow:hidden;display:flex;flex-direction:column;padding:32px 36px 24px 12px}
  .cs-head{flex:none;text-align:center}
  .cs-head h1{font-size:19px;line-height:1.35;margin:0;font-weight:700}
  /* 段控顶在标题下面，那句话跟在段控之后，图占掉剩下的空间、横竖都居中 */
  /* 不限宽：一段一行字，宽度给到整幅图那么宽，尽量别折行 */
  .cs-cap{margin:23px auto 0;width:100%;min-height:26px;font-size:13.5px;line-height:1.7;color:var(--fg2)}
  .cs-figwrap{flex:1;min-height:0;min-width:0;display:flex;align-items:center;justify-content:center;padding:14px 0 4px;overflow:hidden}
  .cs-cap b{color:var(--fg);font-weight:600}
  .cs-cap .k{font-weight:700;color:rgb(var(--red))}
  /* 案例三：文案里提到哪一档显存，前面缀一枚那档的色块（与柱子 / 读数同色），读者对得上是柱子里哪一截 */
  .cs-cap .sw{display:inline-block;width:9px;height:9px;border-radius:2px;vertical-align:-1px;margin:0 3px 0 2px}
  .cs-cap code{font-family:var(--mono);font-size:12px;background:rgba(var(--fgrgb),.05);padding:1px 5px;border-radius:4px;color:var(--fg)}
  /* 四段段控：照分步入门那条 steps 的样子；条只用中性灰阶——走过的段实一点，当前段最深，颜色留给图 */
  /* 段数不定（案例三是五段）：等分的列数跟着按钮数走，别写死 4 列——多一段就掉到下一行 */
  .cs-steps{display:flex;gap:10px;width:100%;max-width:920px;margin:25px auto 0}
  .cs-steps button{font:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left;color:var(--fg3);min-width:0;flex:1 1 0}
  .cs-steps .lbl{display:block;font-size:11px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:6px}
  .cs-steps .bar{display:block;height:3px;border-radius:2px;background:rgba(var(--fgrgb),.08)}
  .cs-steps button:hover .lbl{color:var(--fg2)}
  .cs-steps button.done .lbl{color:var(--fg2)}
  .cs-steps button.done .bar{background:rgba(var(--fgrgb),.35)}
  .cs-steps button.cur .bar{background:var(--fg)}
  .cs-steps button.cur .lbl{color:var(--fg);font-weight:700}
  /* 播放键：段控左端一枚圆钮。全流程播着 → 暂停两竖；停着 / 单段循环 → 三角，点了回到全流程从头播 */
  .cs-steps .rep{flex:none;align-self:flex-end;display:inline-flex;align-items:center;justify-content:center;color:var(--fg2);
                 width:34px;height:34px;border:1px solid var(--line);border-radius:50%;padding:0;margin:0 6px 0 0;line-height:1}
  .cs-steps .rep svg{width:14px;height:14px;fill:currentColor}
  .cs-steps .rep .ic-pause{display:none}
  .cs-steps[data-play="full"] .rep .ic-pause{display:block}
  .cs-steps[data-play="full"] .rep .ic-play{display:none}
  .cs-steps .rep:hover{color:var(--fg);border-color:rgba(var(--fgrgb),.3)}

  /* 展平图本体 */
  .cs-plane{--cw:15px;--ch:12px;--cg:1px;--pad:3px}
  .cs-ptop{display:flex}
  .cs-bwrap{display:flex;gap:12px;position:relative}
  .cs-bh{position:relative;height:34px;flex:none}
  .cs-bh .pp{position:absolute;left:0;right:0;top:0;text-align:center;font-size:11px;font-weight:600;color:var(--fg2)}
  .cs-bh .tk{position:absolute;top:18px;font-family:var(--mono);font-size:9px;color:rgba(var(--fgrgb),.28);text-align:center;white-space:nowrap}
  .cs-bh .tk.hot{color:rgba(var(--red),.85);font-weight:600}
  .cs-pbody{display:flex}
  .cs-lr{position:relative;flex:none}
  .cs-lr .dp{position:absolute;right:8px;font-family:var(--mono);font-size:9px;color:rgba(var(--fgrgb),.28);display:flex;align-items:center;white-space:nowrap}
  .cs-lr .dp.hot{color:rgba(var(--red),.85);font-weight:600}
  .cs-block{position:relative;flex:none;background:rgba(var(--fgrgb),.05);border-radius:2px}
  .cs-row{position:absolute;display:flex;gap:var(--cg);height:var(--ch)}
  .cs-cell{width:var(--cw);height:100%;background:var(--tile);transition:background-color .55s ease,box-shadow .55s ease}
  /* 一行里从左到右错开一点，红就是扫过去的，不是整块一下子跳出来 */
  .cs-row .cs-cell:nth-child(2){transition-delay:25ms}
  .cs-row .cs-cell:nth-child(3){transition-delay:50ms}
  .cs-row .cs-cell:nth-child(4){transition-delay:75ms}
  .cs-row .cs-cell:nth-child(5){transition-delay:100ms}
  .cs-row .cs-cell:nth-child(6){transition-delay:125ms}
  .cs-row .cs-cell:nth-child(7){transition-delay:150ms}
  .cs-row .cs-cell:nth-child(8){transition-delay:175ms}
  .cs-row .cs-cell:nth-child(9){transition-delay:200ms}
  .cs-row .cs-cell:nth-child(10){transition-delay:225ms}
  .cs-row .cs-cell:nth-child(11){transition-delay:250ms}
  .cs-row .cs-cell:nth-child(12){transition-delay:275ms}
  /* 四档红：累进，走到第几段就填到第几档 */
  .cs-cell.hot{--f:rgba(var(--red),.95)}
  .cs-cell.l2{--f:rgba(var(--red),.44)}
  .cs-cell.l3{--f:rgba(var(--red),.25)}
  .cs-cell.l4{--f:rgba(var(--red),.12)}
  .cs-plane.s1 .cs-cell.l1,
  .cs-plane.s2 .cs-cell:is(.l1,.l2),
  .cs-plane.s3 .cs-cell:is(.l1,.l2,.l3),
  .cs-plane.s4 .cs-cell{background:var(--f, var(--tile))}
  .cs-plane .cs-cell.hot{box-shadow:0 0 0 1.5px rgb(var(--red));position:relative;z-index:3}
  .cs-plane.s1 .cs-cell.hot{animation:csPulse 1.5s ease-out infinite}
  @keyframes csPulse{0%{box-shadow:0 0 0 1.5px rgb(var(--red))}60%{box-shadow:0 0 0 5px rgba(var(--red),0)}100%{box-shadow:0 0 0 1.5px rgba(var(--red),0)}}
  @media (prefers-reduced-motion:reduce){
    .cs-cell{transition:none}
    .cs-plane.s1 .cs-cell.hot{animation:none}
  }
  /* ── 热力案例（案例二）：格子的底色由 JS 逐格写 inline（照 config-relation-plane 的色阶），
     不走上面那套四档红；整机横带外面一圈虚线框，横带显形那一段才亮出来 */
  .cs-cap .t{font-family:var(--mono);font-weight:700;font-size:12.5px;color:var(--fg)}
  .cs-nb{position:absolute;border:1.5px dashed rgba(var(--fgrgb),.75);border-radius:3px;pointer-events:none;z-index:3;
         opacity:0;transition:opacity .6s ease .3s}
  .cs-nb.on{opacity:1}
  .cs-plane.nt .cs-cell{transition:none!important}
  /* 热力案例不要逐列错开：每一格自己从上一状态的颜色渐到下一状态，整幅同时变 */
  .cs-plane.heat .cs-cell{transition-delay:0ms;transition-duration:.9s}
  /* 框大到装得下小牌时（.in）就把牌收进框里左上角，免得牌伸到图外面被裁掉；
     只圈一格的那枚（.up）把牌挂到框正上方，不然会压住同一行右边那串红格子 */
  .cs-nb.in span{left:4px;top:4px;transform:none;margin:0}
  .cs-nb.up span{left:50%;top:auto;bottom:100%;transform:translateX(-50%);margin:0 0 5px}
  .cs-nb span{position:absolute;left:100%;top:50%;transform:translateY(-50%);margin-left:7px;white-space:nowrap;
              font-family:var(--mono);font-size:10px;font-weight:600;color:var(--fg);background:var(--bg);padding:1px 5px;border-radius:4px;
              border:1px solid var(--line)}
  /* 胶囊段控：两枚等宽页签压在一条槽里，选块（.knob）是一块滑动的底色 —— 第四段它从左滑到右，
     读的人看得出「图变了是因为换了度量」而不是数据变了 */
  .cs-vtabs{display:grid;grid-template-columns:1fr 1fr;position:relative;width:max-content;margin:0 auto 10px;height:24px;
            padding:2px;border-radius:12px;background:rgba(var(--fgrgb),.06);isolation:isolate}
  .cs-vtabs button{font:inherit;font-size:11px;font-weight:600;color:var(--fg3);background:none;border:0;padding:0 12px;
                   cursor:pointer;position:relative;z-index:1;white-space:nowrap;line-height:20px;border-radius:10px;transition:color .3s ease}
  .cs-vtabs button:hover{color:var(--fg2)}
  .cs-vtabs button[aria-selected="true"]{color:var(--fg)}
  .cs-vtabs .knob{position:absolute;top:2px;bottom:2px;left:2px;width:calc(50% - 2px);border-radius:10px;background:var(--bg);
                  box-shadow:0 1px 2px rgba(0,0,0,.12);transition:transform .45s cubic-bezier(.4,0,.2,1)}
  .cs-vtabs.idle .knob{transform:translateX(100%)}
  html[data-theme="dark"] .cs-vtabs .knob{background:rgba(255,255,255,.14);box-shadow:none}
  .cs-legend{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px;height:20px;
             font-family:var(--mono);font-size:10px;color:var(--fg3)}
  .cs-legend .nm{color:var(--fg2);font-family:var(--sans);font-size:11px;font-weight:600;margin-right:4px}
  .cs-legend .bar{width:160px;height:8px;border-radius:4px}
  .cs-legend .hi{color:var(--fg2)}

  /* ── 案例三：上面 3D 卡阵（只亮选中一张）+ 右栏（放大的那张 + 读数），下面是组合工作台那条泳道 ── */
  .cs-figwrap.mem{align-items:stretch}
  /* 左右两列：左列上面卡阵、下面泳道；右列独占一列，放大的那张 + 读数 */
  .cs3{display:flex;width:100%;height:100%;min-height:0;gap:16px}
  .cs3-main{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;gap:10px}
  /* 两块画布 flex-basis 一律 0：画布的固有尺寸就是它的 width/height 属性，basis 取 auto 的话
     size() 一改背板、固有高度就翻 DPR 倍、flex 再把它撑大、ResizeObserver 再触发 size()……
     一帧一轮的布局反馈，整页跟着卡。basis 0 之后高度只由剩余空间决定，背板怎么改都不回流 */
  .cs3-main > canvas{flex:1 1 0;min-height:0;width:100%;display:block;cursor:pointer}
  /* 右列：读数卡贴底，放大的那张吃掉剩下的全部高度（画布里相机自己居中取景） */
  .cs3-side{flex:none;width:280px;display:flex;flex-direction:column;gap:10px;min-height:0}
  .cs3-side canvas.big{width:100%;flex:1 1 0;min-height:160px;display:block}
  .cs3-side .cs3-rd{flex:none;margin-top:auto}
  .cs3-rd{font-family:var(--mono);font-size:11.5px;color:var(--fg2);background:var(--bg2);border-radius:12px;padding:10px 12px}
  .cs3-rd .h{margin-bottom:6px}
  .cs3-rd .h b{display:block;font-family:var(--sans);font-size:14px;font-weight:800;color:var(--fg)}
  .cs3-rd .h span{font-size:10.5px;color:var(--fg3)}
  .cs3-rd .r{display:flex;align-items:center;gap:6px;line-height:1.7;transition:opacity .3s}
  .cs3-rd .r.off{opacity:.35}
  .cs3-rd .sw{width:9px;height:9px;border-radius:2px;flex:none}
  .cs3-rd .l{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cs3-rd .n{white-space:nowrap;font-variant-numeric:tabular-nums}
  .cs3-rd .t{display:flex;justify-content:space-between;margin-top:5px;padding-top:5px;border-top:1px solid var(--line);font-weight:800;color:var(--fg)}
  .cs3-rd .t .n.over{color:var(--bad)}
  .cs3-rd .bar{height:4px;border-radius:2px;background:rgba(var(--fgrgb),.08);margin-top:6px;overflow:hidden}
  .cs3-rd .bar i{display:block;height:100%;background:var(--fg);transition:width .15s linear}
  .cs3-rd .bar i.over{background:var(--bad)}
  .cs3-rd .f{margin-top:6px;font-size:10.5px;color:var(--fg3)}
  /* 泳道：组合工作台那一格（swimlane.html?chrome=0）原样嵌进来，只是没有 slot-head；
     高度按默认态（训练步全貌，5 行收着）量：时间轴 42 + 5 × 22 行 + 余量 = 176，
     不留能装展开行的空白——要看展开后的 rank 行不是这一案的事；
     iframe 等装配完（hideCss 注进去）再淡入；游标那层照它的 .xcursor 抄，颜色用本页的 DP 蓝 */
  .cs3-lane{flex:none;position:relative;height:176px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
  .cs3-lane iframe{display:block;width:100%;height:100%;border:0;opacity:0;transition:opacity 140ms ease}
  .cs3-lane[data-ready="1"] iframe{opacity:1}
  .cs3-lane .xcursor{position:absolute;inset:0;pointer-events:none;z-index:4}
  .cs3-lane .xcursor[hidden]{display:none}
  .cs3-lane .xcursor > i{position:absolute;top:42px;bottom:0;width:0;border-left:1.5px solid var(--dp);opacity:.85;transform:translateX(-.75px)}
  .cs3-lane .xcursor > i::before{content:'';position:absolute;top:-3px;left:-3.5px;width:8px;height:8px;border-radius:50%;background:var(--dp)}

  .foot{grid-area:foot;padding:8px 36px 26px 36px;display:flex;align-items:flex-end;gap:28px}

  @media (max-width:860px){

<script>
(function(){
  var VC = {tp:'#22D3EE', pp:'#FFAA3B', dp:'#4369EF', ep:'#9B3CF6', edp:'#E04FA8'};   /* edp：专家参数的副本组，只在第 9 步的连线里用 */
  /* 画布用的中性色全从 CSS token 读，切主题时重读一遍再重画 */
  var TH = {};
  /* 显存五档的基准色相照 demo 的 MEM_BASE；最终填色照 demo 的 syncTopologyPalette 按主题调：
     浅色原样用，深色保留色相、统一压到 S .82 / L .40（近中性的那档退成 L .48 的灰），
     这样第 8 / 9 步卡里的填充跟原组件深色下是同一套颜色 */
  var MEM_BASE = {w:'#5C86C7', g:'#6F9BA6', opt:'#9F93D1', act:'#8FBB7A', rsv:'#C8CACB'};
  var MEM_PROFILE = {dark:{s:.82, l:.40, neutralL:.48}, light:{preserve:true}};
  var MEMC = {};
  function hexToHsl(hex){
    var n = parseInt(hex.slice(1), 16), r = (n>>16)/255, g = ((n>>8)&255)/255, b = (n&255)/255;
    var max = Math.max(r,g,b), min = Math.min(r,g,b), d = max - min, h = 0, l = (max + min)/2, sat = d ? d/(1 - Math.abs(2*l - 1)) : 0;
    if(d){ if(max === r) h = ((g - b)/d)%6; else if(max === g) h = (b - r)/d + 2; else h = (r - g)/d + 4; h = ((h*60)%360 + 360)%360; }
    return {h:h, s:sat, l:l};
  }
  function hslToHex(h, sat, l){
    var c = (1 - Math.abs(2*l - 1))*sat, x = c*(1 - Math.abs((h/60)%2 - 1)), m = l - c/2;
    var q = h<60?[c,x,0]:h<120?[x,c,0]:h<180?[0,c,x]:h<240?[0,x,c]:h<300?[x,0,c]:[c,0,x];
    return '#' + q.map(function(v){ return Math.round((v + m)*255).toString(16).padStart(2, '0'); }).join('').toUpperCase();
  }
  function syncMemPalette(){
    var prof = MEM_PROFILE[document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light'];
    Object.keys(MEM_BASE).forEach(function(k){
      if(prof.preserve){ MEMC[k] = MEM_BASE[k]; return; }
      var hsl = hexToHsl(MEM_BASE[k]), neutral = hsl.s < .08;
      MEMC[k] = hslToHex(hsl.h, neutral ? 0 : prof.s, neutral ? prof.neutralL : prof.l);
    });
    /* 卡上的显存账是建卡时抄走的颜色，切主题后按档位补回来 */
    if(typeof cards !== 'undefined' && cards) cards.forEach(function(c){ if(c.mem) c.mem.forEach(function(m){ m.c = MEMC[m.k]; }); });
  }
  function readTheme(){
    var cs = getComputedStyle(document.documentElement), g = function(n){ return cs.getPropertyValue(n).trim(); };
    TH.bg = g('--bg'); TH.fg = g('--fg'); TH.fg2 = g('--fg2'); TH.fg3 = g('--fg3'); TH.rgb = g('--fgrgb');
    TH.face = {front:g('--card-front'), right:g('--card-right'), top:g('--card-top')}; TH.tile = g('--tile');
    syncMemPalette();
  }
  readTheme();
  /* ── 显存账：口径照 demo 的 opBytes / paramsPerCard / memParts / rankLoad 搬过来 ──
     配置就是 default128：tp2·cp1·pp4·dp16·ep8·etp1，48 层，hidden 4096，32 头 / 8 kv 头，
     ffn 2048，vocab 128256，seq 8192，64 专家，mbs 1，ga 8，HBM 64 GB，ZeRO 关。
     五档颜色照 MEM_BASE（见上面 syncMemPalette，随主题调）。路由不均 / 碎片那两项和 demo 一样是 sin-hash 的确定性合成。 */
  var CFG = {tp:2, cp:1, pp:4, dp:16, ep:8, etp:1, layers:48, hidden:4096, heads:32, kv:8, ffn:2048,
             vocab:128256, seq:8192, experts:64, mbs:1, ga:8, hbm:64};
  var GiB = Math.pow(2, 30), LPS = CFG.layers/CFG.pp, HD = CFG.hidden/CFG.heads;
  function opBytes(){
    var D = CFG;

  /* 体腔小图：一格 = 一份，填实的那格就是本卡持有的。ax = {nx, ix, lx, ny, iy, ly, c} */

          + '" style="fill:' + (on ? ax.c : 'transparent') + ';stroke:' + (on ? 'none' : 'var(--line)') + ';stroke-width:.5' + (on ? '' : ';stroke-dasharray:2 2') + '"/>';
      }

      cells += '<rect x="0.5" y="0.5" width="' + (BW - 1) + '" height="' + (BH - 1) + '" style="fill:none;stroke:var(--line);stroke-width:.5;stroke-dasharray:2 2"/>'
        + '<rect x="' + (ax.ix*cw).toFixed(1) + '" y="' + (ax.iy*ch).toFixed(1) + '" width="' + Math.max(1.5, cw).toFixed(1) + '" height="' + Math.max(1.5, ch).toFixed(1) + '" style="fill:' + ax.c + ';stroke:none"/>';

      + '<rect x="0" y="0" width="' + BW + '" height="' + BH + '" style="fill:none;stroke:var(--fg3);stroke-width:.9;stroke-dasharray:3 2"/></g>'
      + '<text x="' + (BW + 6) + '" y="' + (BH/2 + 4) + '" style="font-size:9.5px;fill:var(--fg3)">' + esc(ax.ly) + (ny > 1 ? '×' + ny : '') + '</text>'
      + '<text x="0" y="' + (BH + 13) + '" style="font-size:9.5px;fill:var(--fg3)">' + esc(ax.lx) + (nx > 1 ? '×' + nx : '') + '</text></svg>';

  /* 整条带的构成：按字节分宽度，每段上它自己那把刀的色 */
  function compStrip(blocks){

  }
  /* 体腔：三根轴各被自己那把刀切出格子（线用刀色），本卡持有的那一格填实。ax/ay/az = {n, dim, i} */
  function cavityBox3D(ax, ay, az, o){
    o = o || {};
    var W = 138, HH = 84, DD = 73, dx = W/Math.max(1, ax.n), dy = HH/Math.max(1, ay.n), dz = DD/Math.max(1, az.n), body = '', i;
    function ln(a, b, st){ return '<line x1="' + a[0].toFixed(1) + '" y1="' + a[1].toFixed(1) + '" x2="' + b[0].toFixed(1) + '" y2="' + b[1].toFixed(1) + '" style="' + st + '"/>'; }
    function gl(stp, dim){ return 'stroke:' + (VC[dim] || 'var(--line)') + ';stroke-width:' + (stp > 5 ? .75 : .5) + ';stroke-opacity:' + (stp > 5 ? .55 : .3); }

    if(dz*PC6 >= 2) for(i = 1; i < az.n; i++) body += ln(sproj(0, HH, i*dz), sproj(W, HH, i*dz), gl(dz*PC6, az.dim)) + ln(sproj(W, 0, i*dz), sproj(W, HH, i*dz), gl(dz*PC6, az.dim));

    var x0 = Math.min.apply(null, xs) - 3, x1 = Math.max.apply(null, xs) + 3, y0 = Math.min.apply(null, ys) - 3, y1 = Math.max.apply(null, ys) + 3;
    return '<svg viewBox="' + x0.toFixed(1) + ' ' + y0.toFixed(1) + ' ' + (x1 - x0).toFixed(1) + ' ' + (y1 - y0).toFixed(1) + '" width="' + (x1 - x0).toFixed(0) + '" height="' + (y1 - y0).toFixed(0) + '" style="margin:2px 0 0;overflow:visible">' + body + '</svg>';
  }
  /* 关系链小图：前向 A×W→out、反向 ∂L/∂out×A→∇W、更新 Opt+∇W→W(t+1)，链首链尾同一格。淡格可点跳过去 */
  function memChainFig(key){
    var K = key.indexOf('w:') === 0 ? 'w' : key;
    if(K === 'rsv') return '';
    var HERE = K, HCOL = MEMC[K], CH = 15, ROW = 22, TOP = 20, X0 = 26, out = '';
    function cell(x, y, w, k, txt){
      var on = k && k === HERE, col = k ? MEMC[k] : 'var(--fg3)';
      var g = '<rect x="' + x.toFixed(1) + '" y="' + y + '" width="' + w.toFixed(1) + '" height="' + CH + '" rx="3" style="fill:' + (k ? col : 'none') + ';fill-opacity:' + (k ? (on ? .95 : .3) : 0)
        + ';stroke:' + (on ? HCOL : 'var(--line)') + ';stroke-width:' + (on ? 1.5 : .7) + (k ? '' : ';stroke-dasharray:2 2') + '"/>'
        + '<text x="' + (x + w/2).toFixed(1) + '" y="' + (y + CH/2 + 3) + '" style="font-size:8px;font-weight:' + (on ? 800 : 600) + ';fill:' + (on ? 'var(--fg)' : 'var(--fg2)') + '" text-anchor="middle">' + esc(txt) + '</text>';

    function op(x, y, s){ return '<text x="' + x.toFixed(1) + '" y="' + (y + CH/2 + 3.5) + '" style="font-size:9px;fill:var(--fg3)" text-anchor="middle">' + esc(s) + '</text>'; }
    function rowLab(y, s){ return '<text x="0" y="' + (y + CH/2 + 3) + '" style="font-size:8px;fill:var(--fg3)">' + esc(s) + '</text>'; }

    [
      {lab:'前向', a:['act','激活 A'], o:'×', b:['w','权重 W'], c:[null,'out']},
      {lab:'反向', a:[null,'∂L/∂out'], o:'×', b:['act','激活 A'], c:['g','梯度 ∇W']},
      {lab:'更新', a:['opt','优化器态'], o:'+', b:['g','梯度 ∇W'], c:['w','W(t+1)']}
    ].forEach(function(r, i){
      var y = TOP + i*ROW;

      + '<path d="M' + (xW - 2.6).toFixed(1) + ' ' + (TOP - 4.5) + ' L' + xW.toFixed(1) + ' ' + (TOP - 0.5) + ' L' + (xW + 2.6).toFixed(1) + ' ' + (TOP - 4.5) + ' z" style="fill:var(--fg3)"/>'
      + '<text x="' + (xW + 6).toFixed(1) + '" y="' + (yU - 1.5) + '" style="font-size:7.5px;fill:var(--fg3)">下一步的 W</text>';

  function memBlockDetail(c, key){
    var D = CFG, p = c.pp, ep = c.dp & 7, segs = c.mem, wSeg = segs[0], Pn = wSeg.bytes/2;
    var rows = [], title = '', tint = 'var(--fg)', note = '', figs = [];
    function kv(k, v){ rows.push('<dt>' + esc(k) + '</dt><dd>' + v + '</dd>'); }
    function fig(svg, cap){ figs.push('<div class="rm-fig"' + (cap ? ' title="' + esc(cap) + '"' : '') + '>' + svg + '</div>'); }

        kv('层段', 'ℓ ' + LPS + '/' + D.layers + ' · L' + (p*LPS) + '–L' + ((p+1)*LPS - 1) + '（PP 定段，不切张量）');

      if(key === 'g')   note = '每个 DP 副本各吃各的微批、各算出一份偏导，步末归约成同一份——不归约，下一步各副本的权重就漂开了。';
      if(key === 'opt') note = '主参数 fp32 + 动量 m + 二阶矩 v。面积最大的一档，也是「换 optimizer 能省多少」的全部战场。';

  /* ── 第 10 步：展平视图 ──────────────────────────────────────────────

        var x = ox + (fx - ox)*f, yy = oy + (fy - oy)*f, w = ow + (fw - ow)*f, h = oh + (fh - oh)*f;
        /* 关系三档（照原画布）：行相关（这张卡）/ 列相关（这一层）/ 交叉（两者都在）；
           有选择时关系之外的格子压暗 */
        var colHit = selKey !== null && colKey(col) === selKey, rowHit = isSel;
        ctx.globalAlpha = f*(focus && !(rowHit || colHit) ? 0.32 : 1);
        /* 底色：最粗档落那一套的颜色（着色开着时）；其余一律是瓷砖色（--tile，随主题）+ 细描边——
           灰底叠灰底会粘成一片，瓷砖面靠描边分格，缩得只剩几个像素时描边就是格线本身 */
        var paintBg = tier === 1 && col.type === 'layer' && paintOn, rad = 0;   /* 方块，不带圆角 */
        if(rowHit && colHit){ ctx.fillStyle = hexA(BLUE, .62); rrect(x, yy, w, h, rad); }
        else if(rowHit || colHit){ ctx.fillStyle = hexA(BLUE, colHit ? .22 : .16); rrect(x, yy, w, h, rad); }
        else if(paintBg){ ctx.fillStyle = hexA(setColorOf(col, c), .42); rrect(x, yy, w, h, rad); }
        else if(w >= 4 && h >= 4){
          ctx.fillStyle = TH.tile; rrect(x, yy, w, h, rad);
          ctx.strokeStyle = 'rgba(' + FG + ',.34)'; ctx.lineWidth = 1;   /* 描边同前几步 3D 柱子的可见边（drawCard 里的 .34） */
          rstroke(x + 0.5, yy + 0.5, w - 1, h - 1, rad);
        } else { ctx.fillStyle = 'rgba(' + FG + ',.14)'; rrect(x, yy, w, h, 0); }
        if(tier === 2) drawSegs(x, yy, w, h, col, c, bandFont);
        else if(tier === 3) drawDetail(x + w/2, yy + h/2, col.type === 'layer' ? plane.panels.moe : plane.panels[col.id], detailS*k, col, c);
      });
      if(f < 1) return;
      if(isSel){
        ctx.globalAlpha = 1; ctx.fillStyle = hexA(BLUE, .12); rrect(rx, ry, rw, rh, 0);
        ctx.strokeStyle = BLUE; ctx.lineWidth = 1.5; ctx.strokeRect(rx + 0.5, ry + 0.5, rw - 1, rh - 1);
      }
      if(m.show){
        ctx.globalAlpha = late*(focus && !isSel ? 0.4 : 1);
        ctx.font = fontOf(isSel ? '600' : '400', rowFont, sans);
        ctx.fillStyle = isSel ? BLUE : 'rgba(' + FG + ',.42)';
        ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
        ctx.fillText('rank ' + c.r, view.x + (b.x - PL.LANE_EDGE)*k - 0.5*rowFont, ry + rh/2);
      }
    });
    /* TP 括号：每个 DP 的两行（TP0 / TP1）在行标道左侧圈一只，端帽穿过两行行标的纵向中心 */
    if(f >= 1 && m.show && tpOn){
      ctx.lineWidth = 1; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      plane.blocks.forEach(function(b){
        var lx = view.x + (b.x - plane.lane)*k + PL.TP_LEAD;
        if(lx > v.x1 || lx + PL.TP_GUTTER < v.x0) return;
        for(var d = 0; d < 16; d++){
          var top = view.y + (plane.rowY(2*d) + cellH/2)*k, bot = view.y + (plane.rowY(2*d + 1) + cellH/2)*k;
          if(bot < v.y0 || top > v.y1) continue;
          var on = sel !== null && cards[sel].pp === b.stage && cards[sel].dp === d;
          ctx.globalAlpha = late*(focus && !on ? 0.4 : 1);
          ctx.strokeStyle = ctx.fillStyle = on ? BLUE : 'rgba(' + FG + ',.42)';
          ctx.beginPath(); ctx.moveTo(lx + 6, top); ctx.lineTo(lx, top); ctx.lineTo(lx, bot); ctx.lineTo(lx + 6, bot); ctx.stroke();
          ctx.font = fontOf(on ? '600' : '500', rowFont, mono);
          ctx.fillText(bot - top >= 32 ? 'TP×2' : 'TP', lx + 6 + 0.35*rowFont, (top + bot)/2);
        }
      });
    }
    drawRulers(late, sel, focus);
    ctx.globalAlpha = 1;
  }

  /* 两条量尺 + 交汇的角。都按屏幕坐标铺、字号不随缩放变；底板是素白的（不铺灰），
     只靠分隔线分层；世界从底板下面滑过去 */
  function drawRulers(alpha, sel, focus){
    if(alpha <= 0) return;
    var v = viewport(), k = view.k, FG = TH.rgb, cellW = plane.cellW, cellH = plane.cellH;
    var selPP = sel !== null ? cards[sel].pp : -1, selDP = sel !== null ? cards[sel].dp : -1;
    var selKey = selLayer ? colKey(selLayer) : null, ticks = plane.ticks = [];
    var LINE = 'rgba(' + FG + ',.12)', SUB = 'rgba(' + FG + ',.07)';
    ctx.globalAlpha = alpha; ctx.lineWidth = 1;
    /* ── 顶部：第一层 PP stage，第二层列名（Layer / Emb / Norm / Head）── */
    ctx.fillStyle = TH.bg; ctx.fillRect(v.x0, 0, W - v.x0, PL.RULER_TOP_H);
    ctx.save(); ctx.beginPath(); ctx.rect(v.x0, 0, W - v.x0, PL.RULER_TOP_H); ctx.clip();
    var step = niceStep(cellW*k, PL.COL_MIN), narrow = cellW*k < PL.COL_MIN + 12;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    plane.blocks.forEach(function(b){
      var sx = view.x + b.x*k, sw = b.w*k; if(sx + sw < v.x0 || sx > v.x1) return;
      var cx0 = Math.max(sx, v.x0 - 1), cx1 = Math.min(sx + sw, v.x1);
      ctx.strokeStyle = SUB; ctx.beginPath(); ctx.moveTo(cx0 + 0.5, 0); ctx.lineTo(cx0 + 0.5, PL.RULER_PP_H); ctx.stroke();
      ctx.font = fontOf('500', 11, '--sans'); ctx.fillStyle = 'rgba(' + FG + ',.55)';
      if(cx1 - cx0 > 40) ctx.fillText(cx1 - cx0 > 70 ? 'PP Stage' + b.stage : 'PP' + b.stage, (cx0 + cx1)/2, PL.RULER_PP_H/2 + 0.5);
      b.cols.forEach(function(col, ci){
        var x = view.x + (b.x + ci*cellW)*k, w = cellW*k; if(x + w < v.x0 || x > v.x1) return;
        if(col.type === 'layer' && step > 1 && col.layer % step !== 0) return;
        var tw = Math.max(w, step > 1 ? PL.COL_MIN : 0), on = selKey !== null && colKey(col) === selKey, related = on || (sel !== null && b.stage === selPP);
        if(alpha >= 1) ticks.push({x:x, y:PL.RULER_PP_H, w:tw, h:PL.RULER_TOP_H - PL.RULER_PP_H, col:col});
        if(on){ ctx.fillStyle = hexA(BLUE, .12); ctx.fillRect(x, PL.RULER_PP_H, tw, PL.RULER_TOP_H - PL.RULER_PP_H); }
        ctx.strokeStyle = SUB; ctx.beginPath(); ctx.moveTo(x + 0.5, PL.RULER_PP_H); ctx.lineTo(x + 0.5, PL.RULER_TOP_H); ctx.stroke();
        ctx.globalAlpha = alpha*(focus && !related ? 0.4 : 1);
        if(col.type === 'layer'){
          ctx.font = fontOf(on ? '600' : '400', 11, '--sans'); ctx.fillStyle = related ? BLUE : 'rgba(' + FG + ',.42)';
          ctx.fillText(narrow ? col.short : col.label, x + tw/2, PL.RULER_PP_H + 13);
          ctx.font = fontOf('400', 9.5, '--sans'); ctx.fillStyle = related ? BLUE : 'rgba(' + FG + ',.32)';
          ctx.fillText('MoE', x + tw/2, PL.RULER_PP_H + 27);
        } else {
          ctx.font = 'italic ' + fontOf(on ? '600' : '400', 11, '--sans'); ctx.fillStyle = related ? BLUE : 'rgba(' + FG + ',.55)';
          ctx.fillText(col.label, x + tw/2, PL.RULER_PP_H + 19);
        }
        ctx.globalAlpha = alpha;
      });
    });
    ctx.restore();
    /* ── 左侧：第一层 EDP 副本，第二层它对应的那段 DP 号 ── */
    ctx.fillStyle = TH.bg; ctx.fillRect(0, v.y0, v.x0, H - v.y0);
    ctx.save(); ctx.beginPath(); ctx.rect(0, v.y0, v.x0, H - v.y0); ctx.clip();
    var rowStep = niceStep(2*cellH*k, PL.ROW_MIN);
    for(var g = 0; g < 2; g++){
      var y = view.y + plane.rowY(g*16)*k, h = plane.groupH*k; if(y + h < v.y0 || y > v.y1) continue;
      var cy0 = Math.max(y, v.y0 - 1), cy1 = Math.min(y + h, v.y1);
      ctx.strokeStyle = SUB; ctx.beginPath(); ctx.moveTo(0, cy0 + 0.5); ctx.lineTo(PL.RULER_EDP_W, cy0 + 0.5); ctx.stroke();
      ctx.font = fontOf('500', 11, '--sans'); ctx.fillStyle = 'rgba(' + FG + ',.55)'; ctx.textAlign = 'center';
      if(cy1 - cy0 > 14) ctx.fillText('EDP ' + g, PL.RULER_EDP_W/2, (cy0 + cy1)/2 + 0.5);
      for(var e = 0; e < 8; e += rowStep){
        var r = g*16 + e*2, rEnd = Math.min((g + 1)*16, r + 2*rowStep);
        var ty = view.y + plane.rowY(r)*k, th = (plane.rowY(rEnd - 1) + cellH - plane.rowY(r))*k;
        if(ty + th < v.y0 || ty > v.y1) continue;
        var dpNo = g*8 + e, ty0 = Math.max(ty, v.y0), ty1 = Math.min(ty + th, v.y1), on = focus && dpNo === selDP;
        ctx.strokeStyle = SUB; ctx.beginPath(); ctx.moveTo(PL.RULER_EDP_W, ty + 0.5); ctx.lineTo(v.x0, ty + 0.5); ctx.stroke();
        ctx.globalAlpha = alpha*(focus && !on ? 0.4 : 1);
        ctx.font = fontOf(on ? '600' : '400', 11, '--sans'); ctx.fillStyle = on ? BLUE : 'rgba(' + FG + ',.42)'; ctx.textAlign = 'right';
        if(ty1 - ty0 > 11) ctx.fillText('DP ' + dpNo, v.x0 - 5, (ty0 + ty1)/2 + 0.5);
        ctx.globalAlpha = alpha;
      }
    }
    ctx.restore();
    /* ── 角：写纵轴的口径；再描两条尺的边与两层之间的分隔线 ── */
    ctx.fillStyle = TH.bg; ctx.fillRect(0, 0, v.x0, v.y0);
    ctx.font = fontOf('500', 11, '--sans'); ctx.fillStyle = 'rgba(' + FG + ',.55)'; ctx.textAlign = 'center';
    ctx.fillText('EDP | DP', v.x0/2, v.y0/2 + 0.5);
    ctx.strokeStyle = SUB;
    ctx.beginPath(); ctx.moveTo(v.x0, PL.RULER_PP_H + 0.5); ctx.lineTo(W, PL.RULER_PP_H + 0.5);
    ctx.moveTo(PL.RULER_EDP_W + 0.5, v.y0); ctx.lineTo(PL.RULER_EDP_W + 0.5, H); ctx.stroke();
    ctx.strokeStyle = LINE;
    ctx.beginPath(); ctx.moveTo(0, v.y0 - 0.5); ctx.lineTo(W, v.y0 - 0.5); ctx.moveTo(v.x0 - 0.5, 0); ctx.lineTo(v.x0 - 0.5, H); ctx.stroke();
  }

  function draw(t){
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);
    var order = cards.slice().sort(function(a, b){ return (b.z - a.z) || (a.x - b.x) || (a.y - b.y); });
    order.forEach(function(c){ drawCard(c, t); });
    Object.keys(labs).forEach(function(kk){ var L = labs[kk]; if(L.a > 0.01) drawChip(L, L.a); });
    if(comm) drawComm(t);
    if(flatF > 0) drawPlane(t, flatF);
  }

  /* ── 步进 ────────────────────────────────────────────────────────── */
  var side = document.getElementById('side');
  var themeBtn = document.getElementById('themeBtn');
  themeBtn.addEventListener('click', function(){
    var t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', t);
    try{ localStorage.setItem('ri-theme', t); }catch(e){}
    readTheme();
    /* 「node 0」那块门牌的颜色是排布时从 TH 抄走的，切主题后补一刀 */
    [labs.node, lay && lay.labels.filter(function(l){ return l.key === 'node'; })[0]].forEach(function(l){ if(l) l.c = TH.fg2; });
    renderRankMem();   /* 读出卡里的色块也跟着显存色板换 */
    needDraw = true; tick();
  });

  var stepsEl = document.getElementById('steps');
  STEPS.forEach(function(s, i){
    var b = document.createElement('button');
    b.style.setProperty('--c', s.color);
    b.innerHTML = '<span class="lbl">' + (i+1) + ' · ' + s.key + '</span><span class="bar"></span>';
    b.addEventListener('click', function(){ go(i); });
    stepsEl.appendChild(b);
  });

  function go(i){
    i = Math.max(0, Math.min(STEPS.length - 1, i));
    if(i === step) return;
    step = i;
    var s = STEPS[i];
    side.classList.add('switching');
    setTimeout(function(){
      document.getElementById('no').textContent = 'STEP ' + (i+1) + ' / ' + STEPS.length;
      document.getElementById('title').textContent = s.title;
      document.getElementById('body').innerHTML = s.html;
      side.classList.remove('switching');
    }, 200);

    applyStep(i);

    document.getElementById('prev').disabled = i === 0;
    document.getElementById('next').disabled = i === STEPS.length - 1;
    Array.prototype.forEach.call(stepsEl.children, function(b, k){ b.classList.toggle('cur', k === i); b.classList.toggle('done', k < i); });
    try{ var q = new URLSearchParams(location.search); q.set('step', String(i+1)); history.replaceState(null, '', location.pathname + '?' + q.toString()); }catch(e){}
  }

  document.getElementById('prev').addEventListener('click', function(){ go(step - 1); });
  document.getElementById('next').addEventListener('click', function(){ go(step + 1); });
  document.addEventListener('keydown', function(e){
    if(e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
    if(pageEl.dataset.tab === 'scene') return;
    if(e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' '){ go(step + 1); e.preventDefault(); }
    else if(e.key === 'ArrowLeft' || e.key === 'ArrowUp'){ go(step - 1); e.preventDefault(); }
    else if(e.key === '0'){ go(0); }
  });
  window.addEventListener('resize', resize);

  /* ── 页签：intro 是这套分步入门，scene 先空着。状态写进 ?tab=，刷新还在同一页 ── */
  var pageEl = document.querySelector('.page'), tabsEl = document.getElementById('tabs');
  function setTab(id){
    if(id !== 'scene') id = 'intro';
    pageEl.dataset.tab = id;
    Array.prototype.forEach.call(tabsEl.children, function(b){ b.setAttribute('aria-selected', String(b.dataset.tab === id)); });
    try{ var q = new URLSearchParams(location.search); if(id === 'intro') q.delete('tab'); else q.set('tab', id);
         var qs = q.toString(); history.replaceState(null, '', location.pathname + (qs ? '?' + qs : '')); }catch(e){}
    if(id === 'intro') resize();          /* 画布刚从 display:none 回来，尺寸要重新量 */
  }
  tabsEl.addEventListener('click', function(e){ var b = e.target.closest('button[data-tab]'); if(b) setTab(b.dataset.tab); });
  /* 侧栏开关：记在 localStorage；两页的画布尺寸都跟着列宽变，广播一次 resize 让它们各自重量 */
  (function(){
    var btn = document.getElementById('sideTg'), on = true;
    try{ on = localStorage.getItem('ri-side') !== 'off'; }catch(e){}
    function apply(){
      if(on) delete pageEl.dataset.side; else pageEl.dataset.side = 'off';
      btn.setAttribute('aria-pressed', String(on));
      window.dispatchEvent(new Event('resize'));
    }
    btn.addEventListener('click', function(){ on = !on; try{ localStorage.setItem('ri-side', on ? 'on' : 'off'); }catch(e){} apply(); });
    apply();
  })();

  resize();
  var q0 = new URLSearchParams(location.search), st = parseInt(q0.get('step'), 10);
  go(isFinite(st) && st >= 1 ? st - 1 : 0);
  setTab(q0.get('tab'));

  /* 留给「实战场景」案例三：它要在自己的画布上再画一遍第 8 步那套卡阵（只亮一张），
     排布、投影、显存账、主题色都从这里拿，不另抄一份。TH / MEMC 是同一个对象，切主题后自动是新的 */
  window.RI = {cards:cards, layoutOf:layoutOf, U:U, TH:TH, MEMC:MEMC, VC:VC, CFG:CFG, GiB:GiB, shade:shade, hexA:hexA, dims:{CW:CW, CH:CH, CD:CD}};
})();
</script>
<script>
/* ── 实战场景：一个案例一张图，一段一行字 ──────────────────────────────
   案例一的原型：openPangu-2.0-Flash，2048 NPU，EP64 / TP1 / PP4 / DP8，FP8，step 15203
   被 NCCL timeout 打断（出处：定位链-openPangu-2.0-Flash.md「问题影响 2」）。四段传播的
   数量级一律照真实现场那套 1 → 64 → 256 → 2048 来写；图是拿本页那套 128 rank
   （tp2·pp4·dp16·ep8，48 层）缩小一号画的替身——每一跳撞的还是同三道边界
   （EP 组 → 模型副本 → DP 全局）。四段各一档红，分四批亮起。

   案例二是 infra 视角：同一幅展平图不再填「传播到哪」，而是当热力图填一个度量 ——
   取 config-relation-plane「负载热力」六个度量里的**计算时间**（这张卡在这一层上算一个
   micro-batch 用了多少 ms）。选它是因为它对应的故障形状是 infra 最高频要认的那一种：
   一台机器降频 / ECC 退化 / 风扇故障 → 算力打折 → 8 张卡 8 行整体抬起来，横带正好一台
   整机宽。四段是一根时间轴：日常分布（横向无结构）→ 苗头（降 6%，肉眼将将可辨）→
   横带显形（0.68 倍算力，config-relation-plane 里 FAULT.slowFactor 的取值）→ 换成互补的
   「空闲时间」看谁在为它买单。色阶照那页的 HEAT_RAMP（冷蓝 → 火红，中途绕开绿），
   浅色主题把冷端换成淡蓝灰，格子在白底上才不会一片墨。

   图的口径照第 10 步那张展平视图：横轴 48 层按 PP 段切 4 块（每块 12 层），纵轴 32 行 =
   一段里的 32 张卡（k = dp·2 + tp，两行一个 DP、8 行一台整机、16 行一个 EDP 副本），
   一格 = 一张卡的一层，整幅 4 × 32 = 128 张卡。差别只有两处：这里是 DOM 不是 canvas；
   两端的 Emb / Norm / Head 列省掉，只留 48 个 Transformer 层，让 4 块一样宽。
   格子尺寸由 fit() 按可用空间现算，图居中放到最大。 */
(function(){
  var railEl = document.getElementById('csRail'), mainEl = document.getElementById('csMain');
  if(!railEl || !mainEl) return;
  var pageEl = document.querySelector('.page'), tabsEl = document.getElementById('tabs');

  var G = {cols:12, rows:32, cw:15, ch:12, cg:1, pad:3, bgap:12, lw:46, ruler:34, legend:30, vtabs:30};
  function egap(){ return Math.max(8, Math.round(G.ch*1.1)); }     /* 副本缝 */
  function ngap(){ return Math.max(4, Math.round(G.ch*0.5)); }     /* 整机缝 */
  function rowTop(k){
    var y = 0, eg = egap(), ng = ngap();
    for(var i = 1; i <= k; i++){ y += G.ch + G.cg; if(i === 16) y += eg; else if(i % 8 === 0) y += ng; }
    return y;
  }
  function clamp(v, lo, hi){ return Math.min(hi, Math.max(lo, v)); }
  function isDark(){ return document.documentElement.getAttribute('data-theme') === 'dark'; }
  /* 按 .cs-figwrap 量出来的空间定格子大小：先按宽度给列宽，再按高度给行高，
     行高不超过列宽的 .85（格子偏方），列宽也不许比行高的 1.6 倍还宽。
     热力案例图下面多一条色阶图例，高度先扣掉。 */
  function fit(legend){
    var box = document.getElementById('csFig'); if(!box) return;
    var aw = box.clientWidth, ah = box.clientHeight - (legend ? G.legend + G.vtabs : 0);
    if(aw < 40 || ah < 40) return;
    var cw = Math.floor((aw - G.lw - 3*G.bgap - 4*(11*G.cg + 2*G.pad) - 2)/48);
    G.cw = clamp(cw, 7, 26);
    var slack = ah - G.ruler - 2*G.pad - 31*G.cg - 4;
    var ch = Math.floor((slack - Math.max(8, Math.round(G.cw*0.9)) - 2*Math.max(4, Math.round(G.cw*0.42)))/32);
    G.ch = clamp(Math.min(ch, Math.round(G.cw*0.85)), 6, 24);
    G.cw = Math.min(G.cw, Math.round(G.ch*1.6));
    G.bgap = clamp(Math.round(G.cw*0.8), 6, 14);
  }

  /* opt: {cls: 'sN' | 'heat', cell(rank, layer) → 档位 class（传播案例）, hotLayer, hotDP,
           band: {stage, k0, k1, label}（热力案例给整机横带画的虚线框，先藏着，sync 再亮）,
           marks: [{stage, s0, s1, ci0, ci1, k0, k1, label, inside, up}]（传播案例每段那枚黑标，
                   坐标按「第几块 + 块内第几列 / 第几行」给，一枚可横跨多块）} */
  function planeHTML(opt){
    var BW = G.cols*G.cw + (G.cols - 1)*G.cg, BOXW = BW + 2*G.pad, BOXH = rowTop(G.rows - 1) + G.ch + 2*G.pad;
    var h = ['<div class="cs-plane ' + opt.cls + '" id="csPlane" style="--cw:' + G.cw + 'px;--ch:' + G.ch + 'px">'], s, k, ci;
    h.push('<div class="cs-ptop"><div style="flex:none;width:' + G.lw + 'px"></div><div class="cs-bwrap" style="gap:' + G.bgap + 'px">');

      if(!last) last = ts;
      bt += ts - last; last = ts;
      while(bt >= BE[bi].dur){
        /* 段内循环：这一段最后一拍走完就跳回这一段第一拍，不停 */
        if(loopSt){ bt -= BE[bi].dur; bi = (bi === BE.length - 1 || BE[bi + 1].st !== loopSt) ? loopI0 : bi + 1; applyBeat(); buildRd(); continue; }
        if(bi === BE.length - 1){ bt = BE[bi].dur; playing = false; if(onEnd) onEnd(); break; }
        bt -= BE[bi].dur; bi++; applyBeat(); buildRd();
      }
      t = curT(); frame();
      if(playing) raf = requestAnimationFrame(tick);
    }
    function start(i){ loopSt = 0; bi = i; bt = 0; applyBeat(); buildRd(); lastStage = 0; playing = true; last = 0; cancelAnimationFrame(raf); raf = requestAnimationFrame(tick); }
    function play(){ start(0); }
    function stop(){ playing = false; loopSt = 0; cancelAnimationFrame(raf); last = 0; }
    /* 点段控：不停，只在这一段的几拍里反复播——从这一段第一拍开始，走完最后一拍再跳回来 */
    function showSeg(s){
      for(var i = 0; i < BE.length; i++) if(BE[i].st === s){
        stop(); start(i); loopSt = s; loopI0 = i; return;
      }
    }
    /* 点卡换主语：剧本停下，就看这张卡此刻的账 */
    function setSel(r){ if(r === sel) return; stop(); sel = r; buildRd(); frame(); }
    return {mount:mount, size:size, play:play, stop:stop, showSeg:showSeg, caps:caps,
            redraw:function(){ pushTheme(); buildRd(); frame(true); }, watch:function(f){ onStage = f; }, watchEnd:function(f){ onEnd = f; }};
  })();
  var ST3 = [
    {lbl:'1 · 开机：还没训练就占了一半', c:'#9F93D1'},
    {lbl:'2 · 正向：只有激活一档在涨', c:'#8FBB7A'},
    {lbl:'3 · 反向：一放一存，写梯度', c:'#6F9BA6'},
    {lbl:'4 · 梯度更新：改写权重、清零', c:'#5C86C7'},
    {lbl:'5 · 撞顶：热点专家那张第 4 份存入就 OOM', c:'#c0392b'}
  ];

  var CASES = [
    {t:'一个 Rank 出错，四步拖停整个集群',
     rail:'一个rank阻塞怎么波及全集群', st:ST1},
    {t:'集群状态全景，看形状就知道谁在拖后腿',
     rail:'集群状态热力全景', st:ST2, heat:true},
    {t:'一层里的一个热点专家，只有 stage 0 的四张卡 OOM',
     rail:'Rank 内存的动态变化监控', st:ST3, mem:true},
    {rail:'1F1B 的空泡', t:'PP 空泡把整网 MFU 拉到 38%', todo:true,
     plan:'纵轴按 4 个 PP 段各画一条时间条，末级 stage 的泡最大 —— 为什么加卡不涨吞吐。'},
    {rail:'均匀一片 = 不是坏卡', t:'q_b_proj FP8 溢出：所有 rank 同一个模式', todo:true,
     plan:'这张图要表达的恰恰是「没有形状」：不沿任何 PP / EP / DP 边界聚集，才判得出是全局精度问题。'},
    {rail:'单卡就能复现的那一类', t:'算子带宽瓶颈 + AICPU 回退，步耗时超标 40%', todo:true,
     plan:'按 rank 铺算子耗时占比，齐刷刷一致 —— 「图上有没有结构」本身就是第一道分叉判据。'}
  ];

  var cur = 0, stage = 4, timer = null;
  function active(){ return pageEl.dataset.tab === 'scene'; }
  function steps(){ return CASES[cur].st; }

  function railHTML(){
    return CASES.map(function(c, i){
      return '<button type="button" data-i="' + i + '" aria-current="' + (i === cur) + '">'
           + '<span class="n">' + (i + 1) + '</span>' + c.rail + (c.todo ? ' · 待补' : '') + '</button>';
    }).join('');
  }
  function repHTML(){
    return '<button type="button" class="rep" data-rep="1" title="播放 / 暂停" aria-label="播放 / 暂停">'
         + '<svg class="ic-play" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 3 14 9-14 9z"/></svg>'
         + '<svg class="ic-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg></button>';
  }
  function stepsHTML(){
    var ST = steps();
    return repHTML() + ST.map(function(s, i){
      return '<button type="button" data-s="' + (i + 1) + '" style="--fc:' + s.c + '" class="'
           + (i + 1 <= stage ? 'done ' : '') + (i + 1 === stage ? 'cur' : '') + '">'
           + '<span class="lbl">' + s.lbl + '</span><span class="bar"></span></button>';
    }).join('');
  }
  /* 播放状态：'full' 全流程在播 / 'loop' 单段循环 / 'idle' 停着；写在段控容器上，播放键的图标照它换 */
  var mode = 'idle';
  function setMode(m){ mode = m; var st = document.getElementById('csSteps'); if(st) st.dataset.play = m; }

  function render(){
    railEl.innerHTML = railHTML();
    var c = CASES[cur];
    if(c.todo){
      mainEl.innerHTML = '<div class="cs-head"><h1>' + c.rail + '</h1></div>'
        + '<div class="cs-todo"><span class="tag">待补 · 这张图打算怎么画</span><div>' + c.plan + '</div></div>';
      return;
    }
    mainEl.innerHTML = '<div class="cs-head"><h1>' + c.rail + '</h1><div class="cs-steps" id="csSteps"></div>'
      + '<p class="cs-cap" id="csCap"></p></div>'
      + '<div class="cs-figwrap' + (c.heat ? ' heat' : '') + (c.mem ? ' mem' : '') + '" id="csFig"></div>';
    paint();
    if(active()) play();
  }
  /* 图重画（尺寸变了要重排），文字与段控只换内容 */
  function paint(){
    var fig = document.getElementById('csFig'), c = CASES[cur]; if(!fig) return;
    if(c.mem){
      /* 案例三自己管画布；段变了它回调 sync 换文字（见 M3.watch）*/
      if(M3) M3.mount(fig);
      else fig.innerHTML = '<div class="cs-todo">这一案要借「Rank 的设计表达」那套卡阵，它没加载出来。</div>';
      return;
    }
    fit(c.heat);
    if(c.heat){
      fig.innerHTML = '<div><div class="cs-vtabs" id="csVtabs" role="tablist" aria-label="热力度量">'
        + '<button type="button" role="tab" data-v="busy">按计算时间</button><button type="button" role="tab" data-v="idle">按空闲时间</button><span class="knob" aria-hidden="true"></span></div>'
        + planeHTML({cls:'heat', band:{stage:SLOW_S, k0:SLOW_K0, k1:SLOW_K1, label:''}})
        + '<div class="cs-legend" id="csLegend"></div></div>';
    }else{
      fig.innerHTML = planeHTML({cls:'s' + stage, cell:cell1, hotLayer:FL, hotDP:11, marks:MK1});
    }
    sync();
  }
  /* 热力案例：每一段重算 1536 格的底色（inline style），每一格自己从旧色渐到新色（不逐列错开，
     扫描是传播案例的语言，这里变的是读数）；色阶图例跟着这一段的度量换文字 */
  function fillHeat(){
    var p = document.getElementById('csPlane'), lg = document.getElementById('csLegend'), band = document.getElementById('csBand');
    if(!p) return;
    var cells = p.querySelectorAll('.cs-cell'), i = 0;
    for(var s = 0; s < 4; s++) for(var k = 0; k < G.rows; k++) for(var ci = 0; ci < G.cols; ci++)
      cells[i++].style.background = fill2(s*32 + k, s*12 + ci, stage);
    var m = stage ? ST2[stage - 1] : null;
    if(band){ band.classList.toggle('on', !!(m && m.band)); if(m && m.band) band.firstChild.textContent = m.band; }
    /* 集群图上方那两枚视图页签：播到第四段时它自己切到「空闲时间」，示意这是换了个视图 */
    var vt = document.getElementById('csVtabs');
    if(vt){
      vt.classList.toggle('idle', !!m && m.view === 'idle');
      vt.querySelectorAll('button').forEach(function(b){ b.setAttribute('aria-selected', String(!!m && b.dataset.v === m.view)); });
    }
    if(lg){
      lg.innerHTML = m ? '<span class="nm">' + m.metric + '</span><span class="lo">' + m.rg[0].toFixed(1) + '</span>'
        + '<span class="bar" style="background:' + rampCSS() + '"></span><span class="hi">' + m.rg[1].toFixed(1) + ' ' + m.unit + '</span>' : '';
    }
  }
  function sync(){
    var p = document.getElementById('csPlane'), cap = document.getElementById('csCap'), st = document.getElementById('csSteps'), c = CASES[cur];
    if(c.heat) fillHeat();
    else if(p){
      p.className = 'cs-plane s' + stage;
      Array.prototype.forEach.call(p.querySelectorAll('[data-mk]'), function(el){ el.classList.toggle('on', +el.dataset.mk === stage); });
    }
    if(cap) cap.innerHTML = stage ? (c.mem && M3 ? M3.caps()[stage - 1] : c.st[stage - 1].cap) : '';
    if(st){ st.innerHTML = stepsHTML(); st.dataset.play = mode; }
  }
  function stop(){ if(timer){ clearTimeout(timer); timer = null; } if(M3) M3.stop(); setMode('idle'); }
  /* 分段动效：传播案例从空图开始一段一段亮起来；热力案例直接站在「健康运行中」那一幅上
     （第一幅是日常态，不该有从左铺到右的扫描——扫描是留给「问题出现」的），从第二段起才过渡 */
  function play(){
    stop();
    /* 案例三不是分段定时器，是一根连续走的游标：段是从游标位置读出来的 */
    setMode('full');
    if(CASES[cur].mem){ if(M3) M3.play(); return; }
    var heat = CASES[cur].heat, i, n = steps().length;
    if(heat){ stage = 1; syncInstant(); i = 2; } else { stage = 0; sync(); i = 1; }
    (function nextStep(){
      timer = setTimeout(function(){ stage = i; sync(); if(++i <= n) nextStep(); else { timer = null; setMode('idle'); } }, i === 1 ? 420 : (heat ? 2100 : 1700));
    })();
  }
  /* 点段控：反复播这一段——先瞬间退回上一段的样子，再过渡到这一段，停一会儿，再来。
     热力案例的第一段是日常态，本来就没有过渡可播，就只定格在那一幅上 */
  function loopStep(s){
    stop(); setMode('loop');
    var heat = CASES[cur].heat;
    if(heat && s === 1){ stage = 1; sync(); return; }
    (function cycle(){
      stage = s - 1; syncInstant();
      timer = setTimeout(function(){ stage = s; sync(); timer = setTimeout(cycle, heat ? 2100 : 1700); }, 420);
    })();
  }
  /* 关掉背景色过渡填一遍，下一帧再把过渡打开 */
  function syncInstant(){
    var p = document.getElementById('csPlane');
    if(p) p.classList.add('nt');
    sync();
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ if(p) p.classList.remove('nt'); }); });
  }

  railEl.addEventListener('click', function(e){
    var b = e.target.closest('button[data-i]'); if(!b) return;
    stop(); cur = +b.dataset.i; stage = (CASES[cur].st || []).length; render(); writeQ();
  });
  mainEl.addEventListener('click', function(e){
    /* 播放键：全流程播着就暂停；停着或单段循环着就回到全流程从头播 */
    if(e.target.closest('button[data-rep]')){ if(mode === 'full') stop(); else play(); return; }
    var v = e.target.closest('button[data-v]');
    /* data-v 是案例二的「计算 / 空闲」段控；案例三的泳道 / Layer 页签也带 data-v，那是 M3 自己管的（setView），别在这里把它的游标停掉 */
    if(v){ if(CASES[cur].mem) return; stop(); stage = v.dataset.v === 'idle' ? 4 : Math.min(Math.max(stage, 1), 3); sync(); return; }
    var b = e.target.closest('button[data-s]');
    if(b){
      if(CASES[cur].mem){ if(M3){ M3.showSeg(+b.dataset.s); setMode('loop'); } return; }   /* 只在那一段里循环；播放键才从头播 */
      loopStep(+b.dataset.s);
    }
  });
  function writeQ(){
    try{ var q = new URLSearchParams(location.search);
      if(cur) q.set('case', String(cur + 1)); else q.delete('case');
      var s = q.toString(); history.replaceState(null, '', location.pathname + (s ? '?' + s : ''));
    }catch(e){}
  }
  /* 页签切回来 / 窗口变化都要重量一次尺寸；不在这一页时不跑动效 */
  if(tabsEl) tabsEl.addEventListener('click', function(){
    setTimeout(function(){ if(active()){ paint(); play(); } else stop(); }, 0);
  });
  var rz = null;
  window.addEventListener('resize', function(){
    if(!active()) return;
    clearTimeout(rz); rz = setTimeout(paint, 120);
  });
  /* 热力的色阶分主题，切主题后把当前这一段重填一遍（段控条的颜色也随之换） */
  var themeBtn = document.getElementById('themeBtn');
  if(themeBtn) themeBtn.addEventListener('click', function(){
    setTimeout(function(){
      if(CASES[cur].mem){ if(M3){ M3.redraw(); sync(); } return; }
      if(!CASES[cur].heat) return;
      ST2.forEach(function(s, i){ s.c = heatColor([.28, .48, .85, .62][i]); });
      sync();
    }, 0);
  });

  if(M3){ M3.watch(function(st){ stage = st; sync(); }); M3.watchEnd(function(){ setMode('idle'); }); }
  var q0 = new URLSearchParams(location.search), ci = parseInt(q0.get('case'), 10);
  if(isFinite(ci) && ci >= 1 && ci <= CASES.length) cur = ci - 1;
  if(CASES[cur].st) stage = CASES[cur].st.length;
  render();
})();
</script>
