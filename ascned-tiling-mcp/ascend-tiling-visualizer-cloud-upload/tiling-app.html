  color: var(--foreground);
  font: var(--type-body);
  font-weight: var(--font-weight-medium);
  letter-spacing: 0;
  font-family: 'PingFang SC', -apple-system, BlinkMacSystemFont, sans-serif;
  cursor: pointer;
  white-space: nowrap;
  transition: background var(--duration-fast) var(--easing-default), border-color var(--duration-fast) var(--easing-default), color var(--duration-fast) var(--easing-default), box-shadow var(--duration-fast) var(--easing-default);
}
.nav-pill:hover {
  border-color: var(--border-strong);
  box-shadow: inset 0 1px 0 color-mix(in srgb, var(--foreground) 8%, transparent);
}
.nav-pill svg {
  opacity: 0.8;
  flex-shrink: 0;
}

.nav-pill-snap {
  border-color: var(--border-default);
}

.nav-pill-wrap.snap-main .nav-pill-snap {
  border-color: rgba(255, 255, 255, 0.28);
  box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.14);
}

.nav-pill-wrap.snap-root .nav-pill-snap {
  border-color: rgba(216, 185, 0, 0.66);
  box-shadow:
    0 0 0 1px rgba(216, 185, 0, 0.28),
    0 4px 10px rgba(216, 185, 0, 0.2);
}

.nav-pill-wrap.snap-leaf .nav-pill-snap {
  border-color: rgba(67, 213, 207, 0.72);
  box-shadow:
    0 0 0 1px rgba(67, 213, 207, 0.32),
    0 4px 10px rgba(67, 213, 207, 0.2);
}

.nav-source-tag {
  display: none;
  max-width: 190px;
  align-items: center;
  height: 24px;
  padding: 0 10px;
  border-radius: 12px;
  border: 1px solid var(--border-default);
  background: var(--surface-disabled);
  color: color-mix(in srgb, var(--foreground) 72%, transparent);
  font-size: 11px;
  font-family: var(--font-mono);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.nav-source-tag.visible {
  display: inline-flex;
}

/* Dropdown menu */
.nav-pill-menu {
  display: none;
  position: absolute;
  top: calc(100% + 5px);
  left: 0;
  z-index: 200;
  background: var(--background-elevated);
  border: 1px solid var(--border-default);
  border-radius: 10px;
  padding: 5px;
  min-width: 170px;
  max-height: 240px;
  overflow-y: auto;
  box-shadow: var(--shadow-lg);
}
.nav-pill-wrap.open .nav-pill-menu { display: block; }

.nav-pill-item {
  padding: 7px 12px;
  border-radius: 6px;
  font-size: 14px;
  font-weight: 500;
  font-family: 'PingFang SC', -apple-system, BlinkMacSystemFont, sans-serif;
  color: color-mix(in srgb, var(--foreground) 72%, transparent);
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.1s, color 0.1s;
}
.nav-pill-item:hover {
  background: var(--state-hover);
  color: var(--foreground);
}
.nav-pill-item.active {
  color: color-mix(in srgb, var(--primary) 84%, white 8%);
  background: color-mix(in srgb, var(--primary) 16%, transparent);
}

/* Timeline */
.nav-timeline-wrap {
  flex: none;
  width: auto;
  overflow-x: auto;
  overflow-y: hidden;
  height: 100%;
  display: flex;
  align-items: center;
  scrollbar-width: thin;
  scrollbar-color: rgba(255,255,255,0.08) transparent;
}
.nav-timeline-wrap::-webkit-scrollbar { height: 3px; }
.nav-timeline-wrap::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.14); border-radius: 2px; }

.nav-timeline {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 0 12px;
  white-space: nowrap;
}

.nav-stage-group {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.nav-stage-chip {
  height: 20px;
  padding: 0 12px;
  border-radius: 999px;
  border: 1px solid transparent;
  color: #f7f7f7;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.01em;
  font-family: 'PingFang SC', -apple-system, sans-serif;
  cursor: pointer;
  transition: transform 0.12s, box-shadow 0.12s, filter 0.12s;
}

.nav-stage-chip:hover {
  transform: translateY(-1px);
  filter: brightness(1.07);
}

.nav-stage-chip.stage-tensor {
  min-width: 60px;
  background: #4E76E8;
  border-color: rgba(114, 155, 255, 0.55);
  box-shadow: 0 0 0 1px rgba(114, 155, 255, 0.35), 0 4px 10px rgba(114, 155, 255, 0.26);
}

.nav-stage-chip.stage-tile {
  min-width: 42px;
  background: #5CB41C;
  border-color: rgba(106, 219, 2, 0.62);
  box-shadow: 0 0 0 1px rgba(106, 219, 2, 0.32), 0 4px 10px rgba(106, 219, 2, 0.22);
}

.nav-stage-chip.stage-split {
  min-width: 50px;
  background: #5CB41C;
  border-color: rgba(106, 219, 2, 0.62);
  box-shadow: 0 0 0 1px rgba(106, 219, 2, 0.32), 0 4px 10px rgba(106, 219, 2, 0.22);
}

.nav-stage-chip.stage-block {
  min-width: 53px;
  background: #B89500;
  border-color: rgba(216, 185, 0, 0.68);
  box-shadow: 0 0 0 1px rgba(216, 185, 0, 0.34), 0 4px 10px rgba(216, 185, 0, 0.24);
}

.nav-stage-chip.stage-execute {
  min-width: 60px;
  background: #2BADA8;
  border-color: rgba(67, 213, 207, 0.68);
  box-shadow: 0 0 0 1px rgba(67, 213, 207, 0.3), 0 4px 10px rgba(67, 213, 207, 0.24);
}

.nav-stage-chip.stage-unknown {
  background: #606060;
  border-color: rgba(160, 160, 160, 0.6);
}

.nav-dot-tooltip {
  position: fixed;
  display: none;
  transform: translate(-50%, calc(-100% - 6px));
  padding: 2px 6px;
  background: #1a1a1a;
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 4px;
  color: rgba(255,255,255,0.9);
  font-size: 12px;
  font-family: var(--font-mono);
  pointer-events: none;
  z-index: 9999;
  white-space: nowrap;
}

.nav-stage-dots {
  display: inline-flex;
  align-items: center;
  gap: 9px;
}

/* Pass dot */
.nav-pass-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--dot-color, #7f7f7f);
  border: none;
  padding: 0;
  cursor: pointer;
  flex-shrink: 0;
  transition: transform 0.12s, box-shadow 0.12s, opacity 0.12s;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
  opacity: 0.88;
}
.nav-pass-dot:hover {
  opacity: 1;
  transform: scale(1.34);
}
.nav-pass-dot.active {
  opacity: 1;
  transform: scale(1.66);
  box-shadow:
    0 0 0 1px rgba(255, 255, 255, 0.22),
    0 0 8px var(--dot-color, #fff);
}

@media (max-width: 1100px) {
  .nav-source-tag {
    display: none;
  }
}

@media (max-width: 820px) {
  .nav-bar {
    height: 40px;
  }

  .nav-shell {
    height: 40px;
  }

  .nav-left, .nav-right {
    gap: 5px;
    padding: 0 7px;
  }

  .nav-pill {
    height: 26px;
    padding: 0 10px;
    font-size: 13px;
  }

  .nav-stage-chip {
    height: 18px;
    padding: 0 10px;
    font-size: 11px;
  }

  .nav-timeline {
    gap: 7px;
    padding: 0 8px;
  }

  .nav-stage-dots {
    gap: 8px;
  }
}

/* ──── Control Flow Panel ──── */
.cf-panel {
  position: fixed;
  top: var(--toolbar-height);
  left: 0;
  width: 460px;
  height: calc(100vh - var(--toolbar-height));
  background: color-mix(in srgb, var(--background) 97%, transparent);
  border-right: 1px solid var(--border-subtle);
  flex-direction: column;
  z-index: 60;
  backdrop-filter: blur(8px);
  display: none;
}

@keyframes cf-slide-in {
  from { transform: translateX(-100%); opacity: 0; }
  to   { transform: translateX(0);     opacity: 1; }
}

.cf-panel.cf-visible {
  display: flex;
  animation: cf-slide-in 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

.cf-panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 36px;
  padding: 0 12px 0 14px;
  border-bottom: 1px solid var(--border-subtle);
  flex-shrink: 0;
}

.cf-panel-title {
  font: var(--type-label);
  color: var(--foreground-muted);
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.cf-toggle-btn {
  width: 24px;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: none;
  border-radius: var(--radius-sm);
  color: var(--foreground-muted);
  cursor: pointer;
  transition: color 0.15s, background 0.15s;
}

.cf-toggle-btn:hover {
  color: var(--foreground);
  background: var(--state-hover);
}


.cf-panel-body {
  flex: 1;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.cf-columns {
  display: flex;
  flex-direction: row;
  justify-content: space-between;
  align-items: flex-start;
  height: 100%;
  position: relative;
  overflow-y: auto;
  padding: 12px 0;
}

.cf-col {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
  flex-shrink: 0;
  padding: 0 8px;
}

.cf-col-source {
  width: 190px;
}

.cf-col-compiled {
  width: 190px;
}

.cf-col-label {
  font-size: 11px;
  font-weight: 500;
  color: color-mix(in srgb, var(--foreground) 28%, transparent);
  letter-spacing: 0.05em;
  text-transform: uppercase;
  padding: 0 6px;
  margin-bottom: 6px;
}

.cf-mapping-svg {
  position: absolute;
  top: 36px;
  left: 0;
  width: 100%;
  height: calc(100% - 36px);
  pointer-events: none;
  overflow: visible;
  z-index: 5;
}

.cf-node {
  border-radius: 6px;
  border: 1px solid rgba(255, 255, 255, 0.07);
  background: rgba(30, 30, 30, 0.8);
  padding: 6px 8px;
  transition: border-color 0.15s, background 0.15s;
}

.cf-node-main {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.cf-node-label {
  font-size: 11px;
  font-weight: 500;
  color: rgba(255, 255, 255, 0.75);
  font-family: var(--font-mono);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.cf-node-annotation {
  font-size: 11px;
  color: rgba(255, 255, 255, 0.35);
  font-family: var(--font-mono);
  line-height: 1.4;
}

.cf-node-entry {
  border-color: rgba(255, 255, 255, 0.12);
  background: rgba(40, 40, 40, 0.9);
}

.cf-node-entry > .cf-node-main > .cf-node-label {
  color: rgba(255, 255, 255, 0.5);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.cf-node-loop,
.cf-node-loop_unroll {
  border-color: rgba(255, 255, 255, 0.09);
  background: rgba(28, 28, 36, 0.85);
}

.cf-node-loop > .cf-node-main > .cf-node-label,
.cf-node-loop_unroll > .cf-node-main > .cf-node-label {
  color: rgba(180, 160, 255, 0.8);
}

.cf-node-unroll {
  background: rgba(26, 26, 26, 0.7);
  border-color: rgba(255, 255, 255, 0.06);
}

.cf-node-path {
  background: rgba(24, 24, 30, 0.8);
  border-color: rgba(255, 255, 255, 0.07);
}

.cf-node-path > .cf-node-main > .cf-node-label {
  color: rgba(120, 160, 255, 0.8);
}

.cf-clickable {
  cursor: pointer;
}

.cf-node-path.cf-clickable:hover,
.cf-node-unroll.cf-clickable:hover {
  border-color: rgba(124, 58, 237, 0.45);
  background: rgba(124, 58, 237, 0.08);
}

.cf-node-path.cf-active,
.cf-node-unroll.cf-active,
.cf-node-loop.cf-active {
  border-color: rgba(124, 58, 237, 0.7);
  background: rgba(124, 58, 237, 0.12);
  box-shadow: 0 0 0 1px rgba(124, 58, 237, 0.25);
}

.cf-node-path.cf-active > .cf-node-main > .cf-node-label,
.cf-node-unroll.cf-active > .cf-node-main > .cf-node-label {
  color: #a78bfa;
}

.cf-children {
  margin-top: 6px;
  padding-left: 10px;
  border-left: 1px solid rgba(255, 255, 255, 0.06);
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.cf-reopen-btn {
  width: 30px;
  height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 1px solid var(--border-default);
  border-radius: var(--radius-sm);
  color: var(--foreground-secondary);
  cursor: pointer;
  transition: color 0.15s, background 0.15s, border-color 0.15s;
  flex-shrink: 0;
}
.cf-reopen-btn:hover {
  color: var(--foreground);
  background: var(--state-hover);
  border-color: var(--border-strong);
}

/* ── Locked Flow Panel ──────────────────────────────────────────── */
.flow-panel {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  height: 280px;
  background: rgba(16, 16, 16, 0.97);
  border-top: 1px solid var(--toolbar-border);
  backdrop-filter: blur(14px);
  display: flex;
  flex-direction: column;
  z-index: 45;
  transform: translateY(100%);
  transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}
.flow-panel.open {
  transform: translateY(0);
}
.flow-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 12px;
  height: 36px;
  flex-shrink: 0;
  border-bottom: 1px solid var(--toolbar-border);
}
.flow-lock-icon {
  opacity: 0.4;
  flex-shrink: 0;
  color: var(--text-secondary);
}
.flow-title {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  opacity: 0.4;
  flex-shrink: 0;
}
.flow-stats {
  flex: 1;
  font-size: 12px;
  font-family: var(--font-mono);
  color: var(--text-secondary);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.flow-unlock {
  color: var(--text-secondary);
  border-color: transparent;
  background: transparent;
  flex-shrink: 0;
}
.flow-unlock:hover { color: var(--text-primary); background: var(--tag-bg); }

.flow-viewport {
  flex: 1;
  overflow: auto;
  position: relative;
}
.flow-graph-root {
  position: relative;
  display: block;
}

/* Detail panel — Lock button */
.detail-lock {
  padding: 3px 6px;
  color: var(--text-secondary);
  border-color: transparent;
  background: transparent;
  flex-shrink: 0;
  transition: color 0.15s, opacity 0.15s, background 0.15s;
}
.detail-lock:hover { color: var(--text-primary); background: var(--tag-bg); }
.detail-lock.locked { color: #7c3aed; }
.detail-lock:disabled {
  opacity: 0.38;
  cursor: not-allowed;
  background: transparent;
}

.pto-workbench-shell,
.workbench-frame {
  --pto-workbench-shell-gutter: 10px;
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
}

.pto-workbench-shell__panes,
.workbench-frame-split {
  min-width: 0;
  min-height: 0;
  flex: 1 1 auto;
  display: flex;
  align-items: stretch;
  gap: 0;
  overflow: hidden;
}

.pto-workbench-shell__panes[data-split-direction="vertical"],
.workbench-frame-split[data-split-direction="vertical"] {
  flex-direction: column;
}

.pto-workbench-shell__pane,
.workbench-pane {
  min-width: 0;
  min-height: 0;
  flex: 0 0 auto;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.pto-workbench-shell__pane-body,
.workbench-pane-body {
  min-width: 0;
  min-height: 0;
  flex: 1 1 auto;
  overflow: auto;
}

.pto-workbench-shell__split-gutter {
  flex: 0 0 var(--pto-workbench-shell-gutter, 10px);
  position: relative;
  min-width: var(--pto-workbench-shell-gutter, 10px);
  cursor: col-resize;
  touch-action: none;
  outline: none;
  background: transparent;
}

.pto-workbench-shell__split-gutter[data-split-direction="vertical"] {
  width: 100%;
  min-width: 0;
  min-height: var(--pto-workbench-shell-gutter, 10px);
  cursor: row-resize;
}

.pto-workbench-shell__split-gutter::before {
  content: "";
  position: absolute;
  top: 50%;
  left: 50%;
  width: 3px;
  height: 44px;
  border-radius: var(--radius-pill, 999px);
  transform: translate(-50%, -50%);
  background: color-mix(in srgb, var(--foreground-muted, rgba(255, 255, 255, 0.42)) 46%, transparent);
  transition:
    background var(--duration-fast, 100ms) var(--easing-default, ease),
    width var(--duration-fast, 100ms) var(--easing-default, ease),
    height var(--duration-fast, 100ms) var(--easing-default, ease);
}

.pto-workbench-shell__split-gutter[data-split-direction="vertical"]::before {
  width: 44px;
  height: 3px;
}

.pto-workbench-shell__split-gutter:hover::before,
.pto-workbench-shell__split-gutter:focus-visible::before,
body.pto-is-pane-resizing .pto-workbench-shell__split-gutter::before {
  background: color-mix(in srgb, var(--foreground-secondary, rgba(255, 255, 255, 0.62)) 72%, transparent);
}

.pto-workbench-shell__split-gutter:focus-visible {
  box-shadow: 0 0 0 2px var(--focus-ring, rgba(67, 105, 239, 0.42));
}

body.pto-is-pane-resizing,
body.pto-is-pane-resizing * {
  user-select: none;
}

    const resolved = clamp(radius, 0, Math.min(width, height) / 2);
    ctx.beginPath();
    ctx.moveTo(x + resolved, y);
    ctx.arcTo(x + width, y, x + width, y + height, resolved);
    ctx.arcTo(x + width, y + height, x, y + height, resolved);
    ctx.arcTo(x, y + height, x, y, resolved);
    ctx.arcTo(x, y, x + width, y, resolved);
    ctx.closePath();
  }

  function fitView(width, height, extent, padding) {
    const innerWidth = Math.max(1, width - padding.left - padding.right);
    const innerHeight = Math.max(1, height - padding.top - padding.bottom);
    const worldWidth = extent.columns * BASE_CELL;
    const worldHeight = extent.rows * BASE_CELL;
    const scale = Math.min(innerWidth / worldWidth, innerHeight / worldHeight, 1.6);
    return {
      scale,
      offsetX: padding.left + (innerWidth - worldWidth * scale) / 2,
      offsetY: padding.top + (innerHeight - worldHeight * scale) / 2,
    };
  }

  function cellScreenRect(cell, view) {
    return {
      x: view.offsetX + cell.column * BASE_CELL * view.scale,
      y: view.offsetY + cell.row * BASE_CELL * view.scale,
      width: cell.columnSpan * BASE_CELL * view.scale,
      height: cell.rowSpan * BASE_CELL * view.scale,
    };
  }

  function visible(rect, width, height) {
    return rect.x + rect.width >= 0 && rect.y + rect.height >= 0 && rect.x <= width && rect.y <= height;
  }

  function cellColors(cell, strokeAlpha = 0.09) {
    const background = tokenRgb('--background');
    const foreground = tokenRgb('--foreground');
    const surface2 = tokenRgb('--surface-2');
    const surface3 = tokenRgb('--surface-3');
    const tone = tokenRgb(TONE_TOKENS[cell.tone]);
    let fill = rgba(mix(surface2, background, 0.82), 0.96);
    let stroke = rgba(foreground, strokeAlpha);
    let text = rgba(foreground, 0.68);

    if (cell.style === 'empty') {
      fill = rgba(surface2, 0.32);
      text = rgba(foreground, 0.38);
    } else if (cell.style === 'aggregate') {
      fill = rgba(mix(surface3, background, 0.76), 0.98);
      stroke = rgba(foreground, strokeAlpha + 0.05);
    } else if (cell.tone !== 'neutral') {
      fill = rgba(mix(tone, background, 0.22), 0.96);
    }
    if (cell.states.has('row-focus')) fill = rgba(mix(tokenRgb('--primary'), background, 0.2), 0.98);
    if (cell.states.has('column-focus')) fill = rgba(mix(tokenRgb('--warning'), parseCssColor(fill) || background, 0.12), 0.98);
    if (cell.states.has('written')) {
      fill = rgba(mix(tokenRgb('--primary'), background, 0.34), 0.98);
      text = rgba(foreground, 0.78);
    }
    if (cell.states.has('muted')) {
      fill = rgba(surface2, 0.25);
      text = rgba(foreground, 0.35);
    }
    if (cell.states.has('selected')) {
      stroke = rgba(foreground, 0.92);
      text = rgba(foreground, 0.92);
      if (cell.style === 'aggregate') {
        fill = rgba(tokenRgb('--primary'), 1);
        stroke = rgba(tokenRgb('--primary-hover'), 1);
        text = rgba(foreground, 0.92);
      }
    }
    if (cell.states.has('current')) {
      fill = rgba(tokenRgb('--warning'), 1);
      stroke = rgba(mix(tokenRgb('--warning'), foreground, 0.66), 1);
      text = rgba(background, 0.92);
    }
    return { fill, stroke, text, tone, background, foreground };
  }

  function drawPaddingPattern(ctx, rect) {
    const foreground = tokenRgb('--foreground');
    const background = tokenRgb('--background');
    const surface3 = tokenRgb('--surface-3');
    const minDimension = Math.min(rect.width, rect.height);
    // A 20px cell is already a compact overview cell in the GM → UB lane.
    // Start adapting before the old 18px threshold so padding does not fade
    // into the grid before the user can zoom or hover it.
    const compactness = clamp((28 - minDimension) / 12, 0, 1);
    const wash = mix(foreground, surface3, 0.16 + compactness * 0.12);
    ctx.save();
    ctx.beginPath();
    ctx.rect(rect.x, rect.y, rect.width, rect.height);
    ctx.clip();

    ctx.fillStyle = rgba(wash, 0.2 + compactness * 0.24);
    ctx.fillRect(rect.x, rect.y, rect.width, rect.height);

    const step = minDimension < 24
      ? clamp(minDimension * 0.52, 4, 8)
      : clamp(minDimension * 0.42, 6, 12);
    ctx.strokeStyle = rgba(foreground, 0.22 + compactness * 0.32);
    ctx.lineWidth = minDimension < 22 ? 1.35 : 1;
    ctx.lineCap = 'square';
    for (let start = rect.x - rect.height; start < rect.x + rect.width; start += step) {
      ctx.beginPath();
      ctx.moveTo(start, rect.y + rect.height);
      ctx.lineTo(start + rect.height, rect.y);
      ctx.stroke();
    }

    if (minDimension < 24) {
      ctx.strokeStyle = rgba(mix(foreground, background, 0.72), 0.68);
      ctx.lineWidth = clamp(minDimension * 0.12, 1.2, 1.8);
      ctx.beginPath();
      ctx.moveTo(rect.x + rect.width * 0.18, rect.y + rect.height * 0.82);
      ctx.lineTo(rect.x + rect.width * 0.82, rect.y + rect.height * 0.18);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawAggregate(ctx, cell, rect, colors) {
    const minDimension = Math.min(rect.width, rect.height);
    if (minDimension < 7) return;
    const markerSize = clamp(minDimension * 0.22, 4, 28);
    const markerX = rect.x + (rect.width - markerSize) / 2;
    const markerY = rect.y + (rect.height - markerSize) / 2;
    const selected = cell.states.has('selected') || cell.states.has('current');
    const intensity = clamp(cell.summary?.intensity ?? 0.5, 0, 1);
    const markerColor = selected
      ? colors.foreground
      : cell.tone === 'neutral'
        ? tokenRgb('--foreground')
        : colors.tone;
    roundedRect(ctx, markerX, markerY, markerSize, markerSize, clamp(markerSize * 0.16, 1.5, 5));
    ctx.fillStyle = rgba(markerColor, selected ? 0.24 : 0.18 + intensity * 0.34);
    ctx.fill();
  }

  function fittedText(ctx, text, maxWidth) {
    if (ctx.measureText(text).width <= maxWidth) return text;
    let output = text;
    while (output.length > 1 && ctx.measureText(`${output}…`).width > maxWidth) output = output.slice(0, -1);
    return output ? `${output}…` : '';
  }

  function drawCell(ctx, cell, rect, strokeAlpha) {
    const colors = cellColors(cell, strokeAlpha);
    const minDimension = Math.min(rect.width, rect.height);
    const box = {
      x: rect.x,
      y: rect.y,
      width: Math.max(0.2, rect.width),
      height: Math.max(0.2, rect.height),
    };

    ctx.fillStyle = colors.fill;
    ctx.fillRect(box.x, box.y, box.width, box.height);
    if (cell.style === 'broadcast' && !cell.states.has('current')) {
      const grayMask = mix(tokenRgb('--foreground-secondary'), colors.background, 0.4);
      ctx.fillStyle = rgba(grayMask, 0.4);
      ctx.fillRect(box.x, box.y, box.width, box.height);
    }
    if (cell.style === 'padding' && !cell.states.has('current')) drawPaddingPattern(ctx, box);
    if (cell.style === 'aggregate') drawAggregate(ctx, cell, box, colors);

    ctx.save();
    ctx.strokeStyle = colors.stroke;
    ctx.lineWidth = cell.states.has('current') ? 2 : cell.states.has('selected') ? 1.5 : 1;
    ctx.strokeRect(box.x, box.y, box.width, box.height);
    ctx.restore();

    const mono = cssValue('--font-mono', 'ui-monospace, monospace');
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = colors.text;

    if (cell.style === 'aggregate') {
      return;
    }

    if (!cell.label || (minDimension < 40 && !cell.states.has('current'))) return;
    const fontSize = clamp(minDimension * 0.3, 11, 14);
    ctx.font = `700 ${fontSize}px ${mono}`;
    const label = fittedText(ctx, cell.label, Math.max(0, box.width - 8));
    if (label) ctx.fillText(label, box.x + box.width / 2, box.y + box.height / 2);
  }

  function createAggregateLayoutCells(source, inputOptions = {}) {
    if (!source || typeof source !== 'object') {
      throw new TypeError('PtoMatrixCanvas.createAggregateLayoutCells expects a source object.');
    }
    const rows = positiveInteger(source.rows);
    const columns = positiveInteger(source.columns);
    const requestedThumbnailRows = Number(inputOptions.thumbnailRows);
    const requestedThumbnailColumns = Number(inputOptions.thumbnailColumns);
    const blockRows = Number.isFinite(requestedThumbnailRows) && requestedThumbnailRows > 0
      ? Math.ceil(rows / Math.floor(requestedThumbnailRows))
      : positiveInteger(inputOptions.blockRows, 16);
    const blockColumns = Number.isFinite(requestedThumbnailColumns) && requestedThumbnailColumns > 0
      ? Math.ceil(columns / Math.floor(requestedThumbnailColumns))
      : positiveInteger(inputOptions.blockColumns, 16);
    const cells = [];

    for (let row = 0; row < rows; row += blockRows) {
      const rowSpan = Math.min(blockRows, rows - row);
      for (let column = 0; column < columns; column += blockColumns) {
        const columnSpan = Math.min(blockColumns, columns - column);
        cells.push({
          id: `aggregate-${row}-${column}`,
          row,
          column,
          rowSpan,
          columnSpan,
          style: 'aggregate',
          tone: VALID_TONES.has(inputOptions.tone) ? inputOptions.tone : 'neutral',
          summary: {
            rows: rowSpan,
            columns: columnSpan,
            count: rowSpan * columnSpan,
            min: NaN,
            max: NaN,
            mean: NaN,
            intensity: clamp(finiteOr(inputOptions.intensity, 0.5), 0, 1),
          },
        });
      }
    }
    return cells;
  }

  function createAggregatedCells(source, inputOptions = {}) {
    if (!source || typeof source !== 'object') {
      throw new TypeError('PtoMatrixCanvas.createAggregatedCells expects a source object.');
    }
    const rows = positiveInteger(source.rows);
    const columns = positiveInteger(source.columns);
    const values = source.values;
    const valueAt = typeof source.valueAt === 'function'
      ? source.valueAt
      : (row, column) => values?.[row * columns + column];
    if (!values && typeof source.valueAt !== 'function') {
      throw new TypeError('Aggregated matrix source requires values or valueAt(row, column).');
    }
    const cells = createAggregateLayoutCells({ rows, columns }, inputOptions);
    cells.forEach((cell) => {
      let min = Infinity;
      let max = -Infinity;
      let sum = 0;
      let count = 0;
      for (let localRow = 0; localRow < cell.rowSpan; localRow += 1) {
        for (let localColumn = 0; localColumn < cell.columnSpan; localColumn += 1) {
          const value = Number(valueAt(cell.row + localRow, cell.column + localColumn));
          if (!Number.isFinite(value)) continue;
          min = Math.min(min, value);
          max = Math.max(max, value);
          sum += value;
          count += 1;
        }
      }
      cell.summary.count = count;
      cell.summary.min = count ? min : NaN;
      cell.summary.max = count ? max : NaN;
      cell.summary.mean = count ? sum / count : NaN;
    });
    const means = cells.map((cell) => cell.summary.mean).filter(Number.isFinite);
    const minimumMean = means.length ? Math.min(...means) : 0;
    const maximumMean = means.length ? Math.max(...means) : 1;
    const meanRange = maximumMean - minimumMean || 1;
    cells.forEach((cell) => {
      cell.summary.intensity = Number.isFinite(cell.summary.mean)
        ? clamp((cell.summary.mean - minimumMean) / meanRange, 0, 1)
        : 0.5;
    });
    return cells;
  }

  function synchronizeScale(controllers, inputOptions = {}) {
    const validControllers = (Array.isArray(controllers) ? controllers : [])
      .filter((controller) => controller
        && typeof controller.getViewState === 'function'
        && typeof controller.setZoom === 'function');
    if (!validControllers.length) {
      throw new TypeError('PtoMatrixCanvas.synchronizeScale expects Matrix Canvas controllers.');
    }
    const scales = validControllers
      .map((controller) => Number(controller.getViewState().scale))
      .filter((scale) => Number.isFinite(scale) && scale > 0);
    if (!scales.length) throw new RangeError('Matrix Canvas controllers do not expose a valid scale.');
    const requestedScale = Number(inputOptions.scale);
    const scale = Number.isFinite(requestedScale) && requestedScale > 0
      ? requestedScale
      : inputOptions.strategy === 'maximum'
        ? Math.max(...scales)
        : Math.min(...scales);
    validControllers.forEach((controller) => controller.setZoom(scale));
    return scale;
  }

  function render(canvas, inputScene, inputOptions = {}) {
    if (!(canvas instanceof HTMLCanvasElement)) {
      throw new TypeError('PtoMatrixCanvas.render expects an HTMLCanvasElement.');
    }

    let scene = normalizeScene(inputScene);
    let options = { ...inputOptions };
    let cells = scene.cells.map((cell, index) => normalizeCell(cell, scene.extent, index)).filter(Boolean);
    let view = { scale: 1, offsetX: 0, offsetY: 0 };
    let userView = false;
    let needsFit = options.autoFit !== false;
    let observer = null;
    let frame = 0;
    let destroyed = false;
    let hovered = null;
    let pointer = null;

    const host = canvas.parentElement || document.body;
    host.classList.add('pto-matrix-canvas-host');
    const tooltip = document.createElement('div');
    tooltip.className = 'pto-matrix-canvas__tooltip';
    tooltip.setAttribute('role', 'tooltip');
    const tooltipTitle = document.createElement('div');
    tooltipTitle.className = 'pto-matrix-canvas__tooltip-title';
    const tooltipMeta = document.createElement('div');
    tooltipMeta.className = 'pto-matrix-canvas__tooltip-meta';
    tooltip.append(tooltipTitle, tooltipMeta);
    const liveStatus = document.createElement('div');
    liveStatus.className = 'pto-matrix-canvas__sr-status';
    liveStatus.setAttribute('aria-live', 'polite');
    host.append(tooltip, liveStatus);

    canvas.classList.add('pto-matrix-canvas');
    canvas.tabIndex = canvas.tabIndex >= 0 ? canvas.tabIndex : 0;
    canvas.setAttribute('role', 'application');
    canvas.setAttribute('aria-label', options.ariaLabel || 'Two-dimensional matrix tensor');
    canvas.setAttribute(
      'aria-description',
      'Use the wheel to scroll vertically, Shift plus wheel or a horizontal trackpad gesture to scroll horizontally, Control or Command plus wheel to zoom, and press F or 0 to fit.'
    );

    function dimensions() {
      const rect = canvas.getBoundingClientRect();
      return {
        width: Math.max(1, rect.width || canvas.clientWidth || 1),
        height: Math.max(1, rect.height || canvas.clientHeight || 1),
      };
    }

    function applyFit() {
      const { width, height } = dimensions();
      view = fitView(width, height, scene.extent, resolvePadding(options.padding));
      const minZoom = finiteOr(options.minZoom, 0.015);
      const maxZoom = finiteOr(options.maxZoom, 12);
      view.scale = clamp(view.scale, minZoom, maxZoom);
      constrainView();
      needsFit = false;
    }

    function scrollBounds() {
      const { width, height } = dimensions();
      const padding = resolvePadding(options.padding);
      const matrixWidth = scene.extent.columns * BASE_CELL * view.scale;
      const matrixHeight = scene.extent.rows * BASE_CELL * view.scale;
      const innerWidth = Math.max(1, width - padding.left - padding.right);
      const innerHeight = Math.max(1, height - padding.top - padding.bottom);
      const centeredX = padding.left + (innerWidth - matrixWidth) / 2;
      const centeredY = padding.top + (innerHeight - matrixHeight) / 2;
      return {
        minX: matrixWidth <= innerWidth ? centeredX : width - padding.right - matrixWidth,
        maxX: matrixWidth <= innerWidth ? centeredX : padding.left,
        minY: matrixHeight <= innerHeight ? centeredY : height - padding.bottom - matrixHeight,
        maxY: matrixHeight <= innerHeight ? centeredY : padding.top,
      };
    }

    function constrainView() {
      const bounds = scrollBounds();
      view.offsetX = clamp(view.offsetX, bounds.minX, bounds.maxX);
      view.offsetY = clamp(view.offsetY, bounds.minY, bounds.maxY);
      return bounds;
    }

    function matrixBounds() {
      return {
        x: view.offsetX,
        y: view.offsetY,
        width: scene.extent.columns * BASE_CELL * view.scale,
        height: scene.extent.rows * BASE_CELL * view.scale,
      };
    }

    function drawGrid(ctx, bounds, width, height) {
      if (options.showGrid === false) return;
      const spacing = BASE_CELL * view.scale;
      if (spacing < 5 || spacing > 180) return;
      const firstColumn = clamp(Math.floor((0 - view.offsetX) / spacing), 0, scene.extent.columns);
      const lastColumn = clamp(Math.ceil((width - view.offsetX) / spacing), 0, scene.extent.columns);
      const firstRow = clamp(Math.floor((0 - view.offsetY) / spacing), 0, scene.extent.rows);
      const lastRow = clamp(Math.ceil((height - view.offsetY) / spacing), 0, scene.extent.rows);
      ctx.strokeStyle = rgba(tokenRgb('--foreground'), 0.07);
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let column = firstColumn; column <= lastColumn; column += 1) {
        const x = view.offsetX + column * spacing;
        ctx.moveTo(x, Math.max(0, bounds.y));
        ctx.lineTo(x, Math.min(height, bounds.y + bounds.height));
      }
      for (let row = firstRow; row <= lastRow; row += 1) {
        const y = view.offsetY + row * spacing;
        ctx.moveTo(Math.max(0, bounds.x), y);
        ctx.lineTo(Math.min(width, bounds.x + bounds.width), y);
      }
      ctx.stroke();
    }

    function drawAxes(ctx, bounds) {
      if (options.showAxes === false) return;
      const foreground = tokenRgb('--foreground-secondary');
      const mono = cssValue('--font-mono', 'ui-monospace, monospace');
      ctx.fillStyle = rgba(foreground, 0.88);
      ctx.font = `600 12px ${mono}`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(scene.axes.columns, bounds.x + bounds.width / 2, bounds.y + bounds.height + 26);
      ctx.save();
      ctx.translate(bounds.x - 28, bounds.y + bounds.height / 2);
      ctx.rotate(-Math.PI / 2);
      ctx.fillText(scene.axes.rows, 0, 0);
      ctx.restore();
    }

    function paint() {
      if (destroyed) return;
      const { width, height } = dimensions();
      const dpr = Math.max(1, global.devicePixelRatio || 1);
      const backingWidth = Math.max(1, Math.floor(width * dpr));
      const backingHeight = Math.max(1, Math.floor(height * dpr));
      if (canvas.width !== backingWidth) canvas.width = backingWidth;
      if (canvas.height !== backingHeight) canvas.height = backingHeight;
      const ctx = canvas.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, width, height);
      if (needsFit) applyFit();
      else constrainView();

      const bounds = matrixBounds();
      ctx.save();
      roundedRect(ctx, bounds.x, bounds.y, bounds.width, bounds.height, 4);
      ctx.clip();
      ctx.fillStyle = rgba(tokenRgb('--surface-1'), 0.68);
      ctx.fillRect(bounds.x, bounds.y, bounds.width, bounds.height);
      drawGrid(ctx, bounds, width, height);
      cells.forEach((cell) => {
        const rect = cellScreenRect(cell, view);
        if (visible(rect, width, height)) drawCell(ctx, cell, rect, options.cellStrokeAlpha);
      });
      ctx.restore();

      roundedRect(ctx, bounds.x, bounds.y, bounds.width, bounds.height, 4);
      ctx.strokeStyle = rgba(tokenRgb('--foreground'), 0.14);
      ctx.lineWidth = 1;
      ctx.stroke();
      drawAxes(ctx, bounds);
    }

    function schedulePaint() {
      if (destroyed || frame) return;
      frame = global.requestAnimationFrame(() => {
        frame = 0;
        paint();
      });
    }

    function eventPoint(event) {
      const rect = canvas.getBoundingClientRect();
      return { x: event.clientX - rect.left, y: event.clientY - rect.top };
    }

    function hitTest(point) {
      const worldColumn = (point.x - view.offsetX) / (BASE_CELL * view.scale);
      const worldRow = (point.y - view.offsetY) / (BASE_CELL * view.scale);
      if (worldColumn < 0 || worldRow < 0
        || worldColumn >= scene.extent.columns || worldRow >= scene.extent.rows) return null;
      for (let index = cells.length - 1; index >= 0; index -= 1) {
        const cell = cells[index];
        if (worldColumn >= cell.column && worldColumn < cell.column + cell.columnSpan
          && worldRow >= cell.row && worldRow < cell.row + cell.rowSpan) return cell;
      }
      return null;
    }

    function tooltipCopy(cell) {
      if (!cell) return null;
      const range = cell.rowSpan > 1 || cell.columnSpan > 1
        ? `rows ${cell.row}–${cell.row + cell.rowSpan - 1} · columns ${cell.column}–${cell.column + cell.columnSpan - 1}`
        : `row ${cell.row} · column ${cell.column}`;
      if (cell.style !== 'aggregate') {
        const value = Number.isFinite(cell.value) ? ` · value ${cell.value}` : '';
        const style = cell.style !== 'value' ? ` · style ${cell.style}` : '';
        return { title: cell.label || cell.id, meta: `${range}${value}${style}` };
      }
      const summary = cell.summary;
      const stats = [
        `count ${summary.count}`,
        Number.isFinite(summary.min) ? `min ${Number(summary.min).toPrecision(4)}` : null,
        Number.isFinite(summary.max) ? `max ${Number(summary.max).toPrecision(4)}` : null,
        Number.isFinite(summary.mean) ? `mean ${Number(summary.mean).toPrecision(4)}` : null,
      ].filter(Boolean).join(' · ');
      return { title: `${summary.rows}×${summary.columns} aggregate`, meta: `${range} · ${stats}` };
    }

    function showTooltip(cell, point) {
      if (!cell || options.showTooltip === false) {
        tooltip.classList.remove('is-visible');
        tooltip.style.transform = 'translate(-9999px, -9999px)';
        return;
      }
      const copy = tooltipCopy(cell);
      tooltipTitle.textContent = copy.title;
      tooltipMeta.textContent = copy.meta;
      liveStatus.textContent = `${copy.title}. ${copy.meta}`;
      tooltip.classList.add('is-visible');
      const hostRect = host.getBoundingClientRect();
      const canvasRect = canvas.getBoundingClientRect();
      const localX = canvasRect.left - hostRect.left + point.x + 14;
      const localY = canvasRect.top - hostRect.top + point.y + 14;
      const maxX = Math.max(8, host.clientWidth - tooltip.offsetWidth - 8);
      const maxY = Math.max(8, host.clientHeight - tooltip.offsetHeight - 8);
      tooltip.style.transform = `translate(${clamp(localX, 8, maxX)}px, ${clamp(localY, 8, maxY)}px)`;
    }

    function setHovered(next, event) {
      if (hovered?.id === next?.id) {
        if (next && pointer) showTooltip(next, pointer);
        return;
      }
      hovered = next;
      showTooltip(next, pointer || { x: 0, y: 0 });
      options.onHover?.(next ? next.source : null, event);
    }

    function setZoom(nextScale, anchor) {
      const minZoom = finiteOr(options.minZoom, 0.015);
      const maxZoom = finiteOr(options.maxZoom, 12);
      const scale = clamp(finiteOr(nextScale, view.scale), minZoom, maxZoom);
      const point = anchor || { x: dimensions().width / 2, y: dimensions().height / 2 };
      const worldX = (point.x - view.offsetX) / view.scale;
      const worldY = (point.y - view.offsetY) / view.scale;
      view.offsetX = point.x - worldX * scale;
      view.offsetY = point.y - worldY * scale;
      view.scale = scale;
      constrainView();
      userView = true;
      needsFit = false;
      paint();
    }

    function onPointerMove(event) {
      pointer = eventPoint(event);
      setHovered(hitTest(pointer), event);
    }

    function onClick(event) {
      if (options.interactive === false) return;
      pointer = eventPoint(event);
      const cell = hitTest(pointer);
      setHovered(cell, event);
      options.onSelect?.(cell ? cell.source : null, event);
    }

    function onPointerLeave(event) {
      pointer = null;
      setHovered(null, event);
    }

    function onWheel(event) {
      if (options.interactive === false) return;
      if (event.ctrlKey || event.metaKey) {
        event.preventDefault();
        const point = eventPoint(event);
        const factor = Math.exp(-event.deltaY * 0.0014);
        setZoom(view.scale * factor, point);
        return;
      }

      // Let the browser handle normal page scrolling.
      // The matrix canvas only zooms when Ctrl/Cmd is pressed.
      return;
    }

    function onKeyDown(event) {
      if (options.interactive === false) return;
      if (event.key === 'f' || event.key === 'F' || event.key === '0') {
        event.preventDefault();
        controller.fit();
