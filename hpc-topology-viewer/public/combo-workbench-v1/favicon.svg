<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#10131a"/>
  <!-- 单个 rank 卡：等轴测 3D 盒子（左面 + 顶面 + 正面） -->
  <!-- 正面（最大面） -->
  <path d="M14 18 L46 18 L46 56 L14 56 Z" fill="#1a1f2e" stroke="#6b7a99" stroke-width="1.2" opacity=".85"/>
  <!-- 顶面 -->
  <path d="M14 18 L28 8 L60 8 L46 18 Z" fill="#252d40" stroke="#6b7a99" stroke-width="1.2" opacity=".85"/>
  <!-- 右侧面 -->
  <path d="M46 18 L60 8 L60 46 L46 56 Z" fill="#1e2536" stroke="#6b7a99" stroke-width="1.2" opacity=".85"/>
  <!-- 正面内部：水平记忆体色带 -->
  <!-- 权重带（蓝） -->
  <rect x="17" y="22" width="26" height="7" rx="1.5" fill="#5B8CFF" opacity=".75"/>
  <rect x="17" y="30" width="26" height="7" rx="1.5" fill="#4369EF" opacity=".65"/>
  <!-- 激活带（青） -->
  <rect x="17" y="38" width="26" height="5" rx="1.5" fill="#2dd4bf" opacity=".7"/>
  <!-- 梯度/优化器带（绿） -->
  <rect x="17" y="44" width="26" height="4" rx="1.5" fill="#56b870" opacity=".6"/>
  <!-- 右侧面内部：同步色带投影 -->
  <path d="M47 22 L57 14 L57 20 L47 28 Z" fill="#5B8CFF" opacity=".3"/>
  <path d="M47 30 L57 22 L57 28 L47 38 Z" fill="#4369EF" opacity=".25"/>
  <path d="M47 38 L57 30 L57 34 L47 42 Z" fill="#2dd4bf" opacity=".25"/>
  <path d="M47 44 L57 36 L57 39 L47 47 Z" fill="#56b870" opacity=".2"/>
</svg>
