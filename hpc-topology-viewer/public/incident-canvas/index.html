   ['DP · AllReduce', stall ? 0 : 14, 'var(--cell-mid)', stall ? '这一步没轮到' : '梯度同步']
  ].forEach(function (row) {
    var pr = el('div', 'portrow');
    pr.appendChild(el('span', 'mrow__l', row[0]));
    var bar = el('div', 'portbar');
    var fill = el('i'); fill.style.width = row[1] + '%'; fill.style.background = row[2];
    bar.appendChild(fill); pr.appendChild(bar);
    var v = el('span', 'mrow__l', row[3]); v.style.fontSize = '10.5px'; v.style.textAlign = 'right';
    pr.appendChild(v);
    bindTip(pr, row[0] + ' · ' + row[3]);
    b3.appendChild(pr);
  });
  right.appendChild(b3);

  var go = el('button', 'btn btn--sm'); go.type = 'button';
  go.style.alignSelf = 'flex-start';
  go.textContent = '把这张卡放到时间轴上 ▸';
  bindTip(go, '同一件事落在一个 step 的哪一刻——在画布上展开泳道那一格\n（嵌的是 /combo-workbench/swimlane.html 本体）');
  go.addEventListener('click', function () { expand('swimlane', true); });
  right.appendChild(go);

  box.appendChild(right);
  sh.canvas.appendChild(box);
  sh.canvas.style.overflow = 'hidden';
  setLinked(['west', 'east', 'south']);
}

/* ── 档 6 · 训推大盘 ────────────────────────────────────────────────
   前五档讲的是**这次故障**；这一档把同一时刻摆回**训练框架真的在盯的那块表**：
   pangu_sophon_pytorch 每个 log_interval 打印、写进 TensorBoard / Prometheus
   的那十条「关键少数」，加上触发早停的五个钩子。
   十格里凡是故事线没采到的一律写「—」——大盘上最容易骗人的正是「看起来每格都有数」。
   点任一格跳到本线里这个指标最差的那个事件。 */
function viewBoard() {
  var g = curGroup(), ev = curEvent();
  var b = ev ? (BOARD[ev.id] || { hooks: [], m: {} }) : { hooks: [], m: {} };
  var sh = stageShell('训推大盘 · 关键少数',
    ev ? (ev.time + ' · ' + ev.title) : (g.name + ' · 先在故事线上选一个事件'),
    '<b>口径来自 pangu_sophon_pytorch</b> · 这十条是真的会被打印、画成曲线的那几个；'
    + '值一律引用左边那条故事线的原文，没采到就写「—」，不替它编一个。');
  var box = el('div', 'bd');

  /* 先把「这一刻有读数的是哪几格」摆在栅格上方。
     十格里通常只有两三格有值——不是页面没加载，是这一跑的这一件事只打印了那几条。
     不说清楚的话，满屏的「—」会被读成「数据挂了」。 */
  var live = TRAIN_METRICS.filter(function (mt) {
    var c = b.m[mt.k]; return c && c.s !== 'na';
  });
  var firedHooks = (b.hooks || []).length;
  var now = el('div', 'bd__now');
  if (ev) {
    now.appendChild(el('span', '', '这一刻'));
    now.appendChild(el('span', 'lit', live.length + ' / ' + TRAIN_METRICS.length + ' 有读数'));
    if (live.length) {
      var nm = el('b', '', live.map(function (mt) { return mt.name; }).join('、'));
      now.appendChild(nm);
    }
    if (firedHooks) now.appendChild(el('span', '', '· ' + firedHooks + ' 个钩子会触发'));
    now.appendChild(el('span', 'dash', '其余 ' + (TRAIN_METRICS.length - live.length) + ' 格写「—」'));
    now.appendChild(el('span', '', '＝这一事件没采到，不是 0，也不是没加载'));
  } else {
    now.appendChild(el('span', '', '先在告警里点一个事件——十格读数按那一刻的原文填，没采到的写「—」'));
  }
  box.appendChild(now);

  var grid = el('div', 'bd__grid');
  TRAIN_METRICS.forEach(function (mt) {
    var cell = b.m[mt.k];
    var st = cell ? cell.s : 'na';
    var t = el('button', 'tile'); t.type = 'button';
    t.style.setProperty('--tone', STATEC[st]);
    if (!cell || st === 'na') t.dataset.na = '1'; else t.dataset.live = '1';
    var n = el('div', 'tile__n');
    n.appendChild(el('span', 'tile__name', mt.name));
    n.appendChild(el('span', 'tile__want', mt.want));
    t.appendChild(n);
    t.appendChild(el('div', 'tile__v', cell ? cell.v : '—'));
    if (cell && cell.why) t.appendChild(el('div', 'tile__why', cell.why));
    t.appendChild(el('div', 'tile__src', mt.src));
    bindTip(t, mt.name + (mt.unit || '') + '　期望 ' + mt.want + '\n' + mt.note
      + '\n出处：' + mt.src + '\n\n此刻：' + (cell ? cell.v + '（' + STATEN[st] + '）' : '本事件未采到这一格')
      + '\n点一下跳到本线里这一格最差的那个事件');
    /* 跳到本线里这个指标最差的事件：bad > warn > ok，同级取先出现的那个 */
    var rank = { bad: 3, warn: 2, ok: 1, na: 0 }, best = null, bestS = 0;
    g.events.forEach(function (e2) {
      var c2 = (BOARD[e2.id] || { m: {} }).m[mt.k];
      var s2 = c2 ? rank[c2.s] || 0 : 0;
      if (s2 > bestS) { bestS = s2; best = e2; }
    });
    if (best) t.addEventListener('click', function () { selectEvent(best.id, false); render(); });
    else t.dataset.na = '1';
    grid.appendChild(t);
  });
  box.appendChild(grid);

  var hooks = el('div', 'bd__hooks');
  TRAIN_HOOKS.forEach(function (hk) {
    var on = b.hooks.indexOf(hk.k) >= 0;
    var d = el('div', 'hook');
    if (on) d.dataset.on = '1';
    d.appendChild(el('div', 'hook__n', hk.name));
    d.appendChild(el('div', 'hook__s', hk.src));
    /* 一排小点 = 本线的事件序列，在哪个事件上会触发就点亮哪一颗。
       一颗都不亮也是信息：这两条线里「数据生产速度告警」一次都没响过。 */
    var dots = el('div', 'hook__dots');
    var fired = 0;
    g.events.forEach(function (e2) {
      var f = ((BOARD[e2.id] || { hooks: [] }).hooks || []).indexOf(hk.k) >= 0;
      if (f) fired++;
      var i = el('i'); if (f) i.dataset.f = '1';
      dots.appendChild(i);
    });
    d.appendChild(dots);
    bindTip(d, hk.name + '\n' + hk.src + '\n动作：' + hk.act
      + '\n\n本条故事线里' + (fired ? ('有 ' + fired + ' 个事件会触发它') : '一次都不触发'));
    hooks.appendChild(d);
  });
  box.appendChild(hooks);

  sh.canvas.appendChild(box);
  sh.canvas.style.overflow = 'hidden';
  setLinked(['north', 'west', 'east', 'sedge']);
}

/* ══════════════════════════════════════════════════════════════════════
   计算血缘 —— 同一个算子在五层里各叫什么名字
   这是观测台那一页的一项独门内容：一次故障报在 Kernel 层（比如
   「HCCL AllToAll executor」），而人能改的东西在模型语义层（Router 的 Top-2 gate）。
   中间隔着 FX 捕获、GE 融合、Runtime 下发三道转换，名字每过一道就换一次——
   不把这条链摆出来，「报错点」和「震中」就永远对不上号。
   下面三张表逐字取自原页的 LINEAGE_LOWERING / LINEAGE_STAGE_META：
   只收本页 11 个事件真正用到的那两个 op（gate / comm）加一个兜底。
   ══════════════════════════════════════════════════════════════════════ */
var LIN_STAGES = [
  { id:'model',   title:'模型语义',        system:'模型语义层，用于定位用户模型中的结构与算子意图' },
  { id:'fx',      title:'FX Graph',        system:'PyTorch FX 图层，用于记录框架捕获后的算子级表达' },
  { id:'ge',      title:'GE Graph',        system:'GE 图编译层，用于呈现昇腾侧 Lowering、融合与图优化结果' },
  { id:'runtime', title:'Runtime',         system:'CANN 运行时层，用于展示任务下发、Stream 与 Rank 执行位置' },
  { id:'kernel',  title:'Kernel / Executor', system:'Kernel 执行层，用于说明最终 Kernel、通信执行器与 Tiling 选择' }
];
/* lineage.bar 是结构条的 id，降级表按它的 op 查——本页只用到这两条 */
var LIN_BAR_OP = { gate: 'gate', a2a_dispatch: 'comm' };
var LIN_LOWERING = {
  gate: { fx:['aten.linear.default', 'aten.softmax.int', 'aten.topk.default'],
          ge:['MatMul', 'SoftmaxV2', 'TopK'],
          runtime:['Router MatMul task', 'Router select task'],
          kernel:['router_matmul_cube_v3', 'softmax_topk_vector_v4'] },
  comm: { fx:['call_function.npu_all_to_all'], ge:['HcomAllToAll'],
          runtime:['HCCL collective task'], kernel:['HCCL AllToAll executor'] }
};
var LIN_DEFAULT = { fx:['call_function.custom_op'], ge:['CustomOp'],
                    runtime:['Custom operator task'], kernel:['custom_aicore_kernel'] };
/* 两层之间发生了什么：节点数变少是融合、变多是拆分，其余按层各有定名 */
function linTransition(stageId, a, b) {
  if (stageId === 'model')   return a < b ? '捕获展开' : '捕获';
  if (stageId === 'fx')      return a > b ? '融合' : (a < b ? '拆分' : 'Lowering');
  if (stageId === 'ge')      return a > b ? '任务聚合' : '任务下发';
  if (stageId === 'runtime') return a > b ? '执行器合并' : 'Kernel 选择';
  return '';
}
function renderLineage() {
  var ev = curEvent(), pane = P.lineage, b = pane.body;
  b.innerHTML = '';
  if (!ev || !ev.lineage) {
    pane.title.textContent = '计算血缘';
    pane.sub.textContent = '先在故事线上选一个事件';
    b.innerHTML = '<p class="cnote">一次故障报在 Kernel 层，而人能改的东西在模型语义层，'
      + '中间隔着 FX 捕获、GE 融合、Runtime 下发三道转换——名字每过一道就换一次。'
      + '选一个事件，这里把那条链摆出来。</p>';
    return;
  }
  var L = ev.lineage;
  var low = LIN_LOWERING[LIN_BAR_OP[L.bar]] || LIN_DEFAULT;
  pane.title.textContent = '计算血缘 · ' + L.operator;
  pane.sub.textContent = [L.layer != null ? 'L' + L.layer : '',
                          L.segment ? SEGNAME[L.segment] || L.segment : '',
                          L.rank != null ? 'rank ' + L.rank : ''].filter(Boolean).join(' · ');
  var nodesOf = function (sid) { return sid === 'model' ? [L.operator] : (low[sid] || []); };
  var track = el('div', 'lin');
  LIN_STAGES.forEach(function (st, i) {
    var got = L.stages.indexOf(st.id) >= 0;
    var col = el('div', 'lin__st');
    col.dataset.got = got ? '1' : '0';
    var hd = el('div', 'lin__hd');
    hd.appendChild(el('span', 'lin__i', String(i + 1)));
    hd.appendChild(el('span', 'lin__t', st.title));
    col.appendChild(hd);
    bindTip(col, st.title + '\n' + st.system
      + (got ? '\n\n本事件在这一层采到了证据' : '\n\n本事件没有采到这一层——不是它不存在，是这一跑没留下这一层的记录'));
    var list = el('div', 'lin__nodes');
    nodesOf(st.id).forEach(function (n, idx) {
      var node = el('div', 'lin__n', n);
      if (L.originNode && L.originNode.stage === st.id && L.originNode.index === idx) {
        node.dataset.role = 'origin';
        node.appendChild(el('span', 'lin__tag', '传播源'));
      } else if (L.victimStage === st.id && idx === 0 && !(L.originNode && L.originNode.stage === st.id)) {
        node.dataset.role = 'victim';
        node.appendChild(el('span', 'lin__tag', '受影响'));
      }
      list.appendChild(node);
    });
    if (!nodesOf(st.id).length) list.appendChild(el('div', 'lin__none', '—'));
    col.appendChild(list);
    track.appendChild(col);
    if (i < LIN_STAGES.length - 1) {
      var arr = el('div', 'lin__arrow');
      arr.appendChild(el('span', null, '→'));
      var lb = linTransition(st.id, nodesOf(st.id).length, nodesOf(LIN_STAGES[i + 1].id).length);
      if (lb) arr.appendChild(el('span', 'lin__arrow-l', lb));
      track.appendChild(arr);
    }
  });
  b.appendChild(track);
  var note = el('p', 'cnote');
  note.innerHTML = '本事件采到的是 <b>' + L.stages.map(function (s) {
      var m = LIN_STAGES.filter(function (x) { return x.id === s; })[0];
      return m ? m.title : s; }).join(' / ')
    + '</b> 这几层；灰掉的那几层不是不存在，是这一跑没留下它们的记录。'
    + '降级口径逐字取自 config-relation-observer 的 <span class="mono">LINEAGE_LOWERING</span>。';
  b.appendChild(note);
}

/* ══════════════════════════════════════════════════════════════════════
   ⑫ 证据图 —— line / bars / stack / capacity 四种，取自事件自带的 chart
   量纲差几个数量级的两条读数不并到一根轴上（原页的规矩），所以这里
   一张图只画一种量，另一种进右边的读数区。
   ══════════════════════════════════════════════════════════════════════ */
var TONEC = {
  danger: 'var(--danger)', warning: 'color-mix(in srgb,var(--warning) 86%,transparent)',
  good: 'color-mix(in srgb,var(--success) 76%,transparent)', alt: 'var(--cell-mid)',
  base: 'var(--primary)'
};
function tc(t) { return TONEC[t] || TONEC.base; }
function renderChart(host, c) {
  host.innerHTML = '';
  if (!c) { host.appendChild(el('p', 'cnote', '这一级没有单独的证据图。')); return; }
  var t = el('div'); t.style.cssText = 'font:600 12px/1.4 var(--font-sans);margin-bottom:8px';
  t.textContent = c.title; host.appendChild(t);
  var wrap = el('div', 'chartwrap');
  var W = 380, H = 190;
  var svg = svgEl('svg', { viewBox: '0 0 ' + W + ' ' + H, preserveAspectRatio: 'none' });

  if (c.kind === 'line') {
    var L = 44, R = 8, TP = 14, B = 26;
    var vs = c.values, n = vs.length;
    var hi = Math.max.apply(null, vs), lo = Math.min.apply(null, vs.concat([0]));
    if (c.threshold) { hi = Math.max(hi, c.threshold.value); lo = Math.min(lo, c.threshold.value); }
    var span = hi - lo || 1;
    var X = function (i) { return L + i * (W - L - R) / (n - 1); };
    var Y = function (v) { return TP + (1 - (v - lo) / span) * (H - TP - B); };
    svg.appendChild(svgEl('rect', { x: L, y: TP, width: W - L - R, height: H - TP - B, fill: 'var(--surface-2)', rx: 3 }));
    if (c.threshold) {
      svg.appendChild(svgEl('line', { x1: L, y1: Y(c.threshold.value), x2: W - R, y2: Y(c.threshold.value),
        stroke: 'var(--warning)', 'stroke-width': 1.3, 'stroke-dasharray': '5 4' }));
      svg.appendChild(T(W - R, Y(c.threshold.value) - 4, c.threshold.label,
        { anchor: 'end', size: 9, fill: 'color-mix(in srgb,var(--warning) 80%,var(--foreground))', w: 600 }));
    }
    var d = '', area = '';
    vs.forEach(function (v, i) { d += (i ? ' L' : 'M') + X(i) + ' ' + Y(v); });
    area = d + ' L' + X(n - 1) + ' ' + (H - B) + ' L' + X(0) + ' ' + (H - B) + ' Z';
    svg.appendChild(svgEl('path', { d: area, fill: 'color-mix(in srgb,var(--primary) 18%,transparent)' }));
    svg.appendChild(svgEl('path', { d: d, fill: 'none', stroke: 'var(--primary)', 'stroke-width': 2 }));
    vs.forEach(function (v, i) {
      var isMark = c.mark && c.mark.index === i;
      svg.appendChild(svgEl('circle', { cx: X(i), cy: Y(v), r: isMark ? 4.4 : 2.6,
        fill: isMark ? tc(c.mark.tone) : 'var(--primary)',
        'data-tip': '第 ' + (i + 1) + ' 个采样点 · ' + v + (c.unit || '') }));
    });
    if (c.mark) svg.appendChild(T(Math.min(W - R, X(c.mark.index) + 6), Y(vs[c.mark.index]) - 8,
      c.mark.label, { anchor: 'end', size: 9.5, w: 700, fill: tc(c.mark.tone) }));
    svg.appendChild(T(L, H - 8, c.x[0], { size: 9, mono: true, fill: 'var(--foreground-muted)' }));
    svg.appendChild(T(W - R, H - 8, c.x[c.x.length - 1], { anchor: 'end', size: 9, mono: true, fill: 'var(--foreground-muted)' }));
    svg.appendChild(T(0, Y(hi) + 4, String(hi), { size: 9, mono: true, fill: 'var(--foreground-muted)' }));
    svg.appendChild(T(0, Y(lo) + 4, String(lo), { size: 9, mono: true, fill: 'var(--foreground-muted)' }));

  } else if (c.kind === 'bars') {
    var items = c.items, L2 = 112, rh = Math.min(20, (H - 10) / items.length - 3);
    var mx = Math.max.apply(null, items.map(function (i) { return i.value; }).concat(c.threshold ? [c.threshold.value] : []));
    items.forEach(function (it, i) {
      var y = 6 + i * ((H - 10) / items.length);
      svg.appendChild(T(L2 - 6, y + rh / 2 + 3.5, it.label, { anchor: 'end', size: 10, fill: 'var(--foreground-secondary)' }));
      svg.appendChild(svgEl('rect', { x: L2, y: y, width: W - L2 - 42, height: rh, rx: 2, fill: 'var(--surface-2)' }));
      var w = Math.max(1.5, (it.value / (mx || 1)) * (W - L2 - 42));
      svg.appendChild(svgEl('rect', { x: L2, y: y, width: w, height: rh, rx: 2, fill: tc(it.tone),
        'data-tip': it.label + ' · ' + it.value + (c.unit || '') }));
      svg.appendChild(T(W - 38, y + rh / 2 + 3.5, it.value + (c.unit || ''),
        { size: 9.5, mono: true, w: 700, fill: it.tone ? tc(it.tone) : 'var(--foreground)' }));
    });
    if (c.threshold) {
      var tx = L2 + (c.threshold.value / (mx || 1)) * (W - L2 - 42);
      svg.appendChild(svgEl('line', { x1: tx, y1: 2, x2: tx, y2: H - 14,
        stroke: 'var(--warning)', 'stroke-width': 1.3, 'stroke-dasharray': '5 4' }));
      svg.appendChild(T(tx + 3, H - 4, c.threshold.label, { size: 9,
        fill: 'color-mix(in srgb,var(--warning) 80%,var(--foreground))', w: 600 }));
    }

  } else if (c.kind === 'stack') {
    var tot = c.items.reduce(function (a, b) { return a + b.value; }, 0);
    var x = 8, bw = W - 16, by = 12, bh = 34;
    c.items.forEach(function (it) {
      var w = it.value / tot * bw;
      svg.appendChild(svgEl('rect', { x: x, y: by, width: Math.max(1, w - 1), height: bh,
        rx: 2, fill: tc(it.tone), 'data-tip': it.label + ' · ' + it.value + (c.unit || '') +
          '（' + (it.value / tot * 100).toFixed(it.value / tot < .01 ? 2 : 1) + '%）' }));
      x += w;
    });
    var ly = by + bh + 20;
    c.items.forEach(function (it, i) {
      svg.appendChild(svgEl('rect', { x: 8, y: ly + i * 22 - 8, width: 9, height: 9, rx: 2, fill: tc(it.tone) }));
      svg.appendChild(T(23, ly + i * 22, it.label, { size: 10.5, fill: 'var(--foreground-secondary)' }));
      svg.appendChild(T(W - 8, ly + i * 22, it.value + (c.unit || '') + '　' +
        (it.value / tot * 100).toFixed(it.value / tot < .01 ? 2 : 1) + '%',
        { anchor: 'end', size: 10, mono: true, w: 700, fill: it.tone ? tc(it.tone) : 'var(--foreground)' }));
    });

  } else if (c.kind === 'capacity') {
    /* 等距容器而不是构成条：这张图的分母是一张卡的 64 GB，装满了就是 OOM，
       平面色条表达不了「框满了」这件事。自底向上摞。 */
    var cap = c.cap, bx = 96, bw2 = 92, byy = 8, bhh = H - 26;
    svg.appendChild(svgEl('rect', { x: bx, y: byy, width: bw2, height: bhh, rx: 4,
      fill: 'var(--surface-2)', stroke: 'var(--border-strong)', 'stroke-width': 1.5 }));
    var acc = 0, labels = [];
    c.items.forEach(function (it) {
      var h = it.value / cap * bhh, y = byy + bhh - (acc + it.value) / cap * bhh;
      var rect = svgEl('rect', { x: bx + 1.5, y: y, width: bw2 - 3, height: Math.max(1, h),
        fill: tc(it.tone), opacity: it.void ? .5 : .9,
        'data-tip': it.label + ' · ' + it.value + (c.unit || '') + '（占 ' + (it.value / cap * 100).toFixed(1) + '%）' });
      svg.appendChild(rect);
      if (it.void) {
        var hatch = svgEl('rect', { x: bx + 1.5, y: y, width: bw2 - 3, height: Math.max(1, h),
          fill: 'url(#vd)', opacity: .8 });
        svg.appendChild(hatch);
      }
      labels.push({ y: y + h / 2, h: h, label: it.label,
        v: it.value + (c.unit || ''), tone: it.tone });
      acc += it.value;
    });
    /* 自顶向下推挤：上一条标签底下至少留 13px 再放下一条 */
    labels.sort(function (a, b) { return a.y - b.y; });
    var lastY = -99;
    labels.forEach(function (L) {
      var ly2 = Math.max(L.y, lastY + 13);
      lastY = ly2;
      if (Math.abs(ly2 - L.y) > 2.5) svg.appendChild(svgEl('line',
        { x1: bx - 5, y1: L.y, x2: bx - 5, y2: ly2 - 3, stroke: 'var(--border-strong)', 'stroke-width': .9 }));
      svg.appendChild(T(bx - 7, ly2 + 3.5, L.label, { anchor: 'end', size: 9.5,
        fill: L.tone ? tc(L.tone) : 'var(--foreground-secondary)' }));
      svg.appendChild(T(bx + bw2 + 7, ly2 + 3.5, L.v,
        { size: 9.5, mono: true, w: 700, fill: L.tone ? tc(L.tone) : 'var(--foreground)' }));
    });
    var defs = svgEl('defs');
    var pat = svgEl('pattern', { id: 'vd', width: 8, height: 8, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)' });
    pat.appendChild(svgEl('rect', { width: 4, height: 8, fill: 'var(--surface-1)', opacity: .55 }));
    defs.appendChild(pat); svg.appendChild(defs);
    svg.appendChild(T(bx + bw2 / 2, H - 6, cap + ' GB 容量', { anchor: 'middle', size: 9.5, mono: true, fill: 'var(--foreground-muted)' }));
  }
  wrap.appendChild(svg);
  host.appendChild(wrap);
  if (c.note) host.appendChild(el('p', 'cnote', c.note));
}


/* ══════════════════════════════════════════════════════════════════════
   ⑮ 主题桥 —— 认 ?theme=，也认 pto:state（与 combo-workbench 同一套约定，
   这一页因此可以直接当成那块台面上的一格嵌进去）
   ══════════════════════════════════════════════════════════════════════ */
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  document.body.dataset.theme = t;
  pushTheme();                 /* 三格内嵌 pattern 跟着换，不重载 */
  var b = document.getElementById('themeBtn');
  b.title = t === 'dark' ? '切回浅色' : '切换到深色';
  writeURL();
}
document.getElementById('themeBtn').addEventListener('click', function () {
  setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
});
window.addEventListener('message', function (e) {
  var d = e.data;
  if (!d || d.type !== 'pto:state') return;
  if (d.theme === 'dark' || d.theme === 'light') setTheme(d.theme);
  if (d.group && GROUPS.some(function (g) { return g.id === d.group; })) { S.group = d.group; S.eventId = null; render(); }
  if (d.event) {
    var hit = null;
    GROUPS.forEach(function (g) { g.events.forEach(function (ev) { if (ev.id === d.event) { hit = g.id; } }); });
    if (hit) { S.group = hit; S.rank = null; selectEvent(d.event, false); }
  }
  if (typeof d.rank === 'number' && d.rank >= 0 && d.rank < TOPO.world) selectRank(d.rank, false);
});

/* ══════════════════════════════════════════════════════════════════════
   ⑯ 自动播放 —— 按故事线顺序走一遍，带机制图的事件在原地把相位播完
   给的是「第一次打开这一页的人」一条不用动手的完整路径。
   ══════════════════════════════════════════════════════════════════════ */
var autoTimer = null;
function autoStop() {
  S.auto = false; clearInterval(autoTimer); clearInterval(playTimer);
  document.getElementById('autoBtn').setAttribute('aria-pressed', 'false');
  document.getElementById('autoLbl').textContent = '自动播放';
}
function autoStart() {
  var g = curGroup();
  S.auto = true;
  document.getElementById('autoBtn').setAttribute('aria-pressed', 'true');
  document.getElementById('autoLbl').textContent = '停止';
  var i = 0;
  var step = function () {
    if (!S.auto) return;
    var ev = g.events[i % g.events.length];
    S.rank = null;
    selectEvent(ev.id, false);
    if (ev.mechanism) { S.phase = 0; expand('mech', false); playPhases(); }
    else { collapse('mech'); }
    i++;
  };
  step();
  autoTimer = setInterval(step, 9000);
}
document.getElementById('autoBtn').addEventListener('click', function () {
  if (S.auto) autoStop(); else autoStart();
});
/* 手动操作即停：自动播放与人抢方向盘是最讨厌的一种交互 */
['pointerdown', 'wheel', 'keydown'].forEach(function (t) {
  vp.addEventListener(t, function () { if (S.auto) autoStop(); }, { passive: true });
});
document.getElementById('lineSeg').addEventListener('click', function () { if (S.auto) autoStop(); });

/* 键盘：← → 在事件间走，Esc 退一级，0 总览，F 回中心 */
window.addEventListener('keydown', function (e) {
  if (e.target && /input|textarea/i.test(e.target.tagName)) return;
  var g = curGroup(), idx = g.events.map(function (x) { return x.id; }).indexOf(S.eventId);
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
    e.preventDefault();
    var n = idx + (e.key === 'ArrowRight' ? 1 : -1);
    if (n < 0) n = g.events.length - 1;
    if (n >= g.events.length) n = 0;
    S.rank = null; selectEvent(g.events[n].id);
  } else if (e.key === 'Escape') {
    /* 没有「栈」可退了，收起就是退——所以先退下钻，再拆常备格：
       ① 从传播里分出去的三格（单卡 / 机制 / 血缘）
       ② 点事件时一起来的那两格（证据 + 传播）
       ③ 常备格从最靠外的一圈往里收
       原先这张表按纯几何排，最靠外的卡内解剖排在最前——结果刚点完一个事件
       按 Esc，收掉的是画布最左边那一格，而不是刚刚点出来的下钻。 */
    var order = ['rank', 'mech', 'lineage', 'evidence', 'event',
                 'anatomy', 'dim', 'netgraph', 'board', 'swimlane', 'story'];
    for (var i = 0; i < order.length; i++) {
      if (open[order[i]]) { collapse(order[i]); return; }
    }
  } else if (e.key === '0') { fitAll(); }
  else if (e.key === 'f' || e.key === 'F') { fitMain(); }
});


/* ══════════════════════════════════════════════════════════════════════
   ⑰ 启动
   ══════════════════════════════════════════════════════════════════════ */
readURL();
setTheme(document.documentElement.dataset.theme || 'light');
/* 主视图先装：它是这一页的主语，别的格子等它就位再补高亮（settleFrame 会补） */
loadFrame('main');
Object.keys(open).forEach(function (id) {
  P[id].root.hidden = false;
  if (P[id].def.kind === 'frame') loadFrame(id);
});
buildAlertSeg();
buildToolbars();
wireLinkage();
booting = false;
render();
/* 第一屏停在**主视图**，不是适配全部。
   适配全部要把六格常备面全框进来，落在 26% 上——那一屏好看，但主视图小到读不出
   一张卡，而并行拓扑恰恰是这一页的主语。所以开场就把镜头钉在它身上（约九成），
   四周各格只露一条边当路标；要看全貌按「适配全部」或双击空白，一次点击的事。 */
requestAnimationFrame(function () { fitMain(0); });
window.addEventListener('resize', function () {
  clearTimeout(window.__rz);
  window.__rz = setTimeout(function () {
    refit(0);
  }, 160);
});
})();
</script>
