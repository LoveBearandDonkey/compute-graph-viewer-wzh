<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="author" content="王欣迪" />
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>卡容器 · 一张卡里装了什么</title>
<style>
/* ═══ 独立原型页：与 demo 同一套 token（写死默认值，单文件可开）══════════
   这一页只回答一个问题：**这张卡的显存里装了什么** ——
   把「容器模型」（FIG 11）与「单卡两个正交视角」（FIG 14）合成一张图，
   并接上交集腔那两只腔：①权重体腔的成分、②激活体腔的成分，画法不同。
   确认满意后再集成进并行拓扑 demo 的 Rank 视图（先在这里单独演进）。 */
:root{
  --pt-tp:#22d3ee; --pt-pp:#ffaa3b; --pt-dp:#4369ef; --pt-ep:#9b3cf6; --pt-cp:#86c70f;
  --pt-bg:#f6f7f9; --pt-s1:#ffffff;
  --pt-fg:rgba(10,14,20,.92); --pt-fg2:rgba(10,14,20,.62); --pt-fg3:rgba(10,14,20,.42);
  --pt-bd:rgba(10,14,20,.14); --pt-bds:rgba(10,14,20,.26); --pt-danger:#d1242f;
  --pt-mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --pt-sans:-apple-system,"PingFang SC","Source Han Sans SC","Noto Sans CJK SC",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--pt-bg);color:var(--pt-fg);font-family:var(--pt-sans);overflow:hidden}
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid var(--pt-bd);background:var(--pt-s1);flex-wrap:wrap}
header h1{font-size:15px;font-weight:800}
header .sub{font-size:11px;color:var(--pt-fg2)}
.bar{display:flex;align-items:center;gap:6px;margin-left:auto;flex-wrap:wrap}
.cap{font-size:10px;color:var(--pt-fg3);font-family:var(--pt-mono);margin-right:2px}
.pb{font:600 11px var(--pt-sans);padding:4px 10px;border:1px solid var(--pt-bds);border-radius:99px;
    background:var(--pt-s1);color:var(--pt-fg2);cursor:pointer}
.pb.is-on{background:var(--pt-fg);border-color:var(--pt-fg);color:var(--pt-s1)}
.pb:hover{border-color:var(--pt-fg)}
.chip{font:600 10px var(--pt-mono);padding:3px 8px;border:1px solid var(--pt-bd);border-radius:99px;color:var(--pt-fg3)}
#stage{flex:1;min-height:0;cursor:grab}
#stage:active{cursor:grabbing}
#stage svg{width:100%;height:100%;display:block}
footer{padding:8px 18px 10px;border-top:1px solid var(--pt-bd);background:var(--pt-s1);font-size:10.5px;color:var(--pt-fg2);line-height:1.6}
footer b{color:var(--pt-fg)}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>一张卡里装了什么</h1>
    <span class="sub">卡 = 容器（容量 = 显存）· 两只腔的成分各自成层 —— 体积按真实字节比例</span>
    <div class="bar" id="bar"></div>
  </header>
  <div id="stage"></div>
  <footer id="foot"></footer>
</div>
<script>
(function(){
'use strict';
/* ═══ 配置：与 demo 的 default128 逐位相同（口径必须一致，数字才能互相印证）═══ */
var CFG = {world:128, tp:2, cp:1, pp:4, ep:8, etp:1, layers:48, hidden:4096, heads:32, kv:8,
           ffn:2048, vocab:128256, seq:8192, experts:64, topk:8, mbs:1, ga:8, hbm:64};

/* ═══ 字节口径：从 demo.html 原样搬运（opBytes → paramsPerCard → memParts）═══ */
function fmt(n){ return Number(n).toLocaleString('en-US'); }
function fmtGB(b){ return (b/Math.pow(2,30)).toFixed(b >= Math.pow(2,30)*10 ? 0 : 1); }
function fmtP(n){ return n>=1e9 ? (n/1e9).toFixed(2)+' B' : (n/1e6).toFixed(1)+' M'; }
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
function derive(c){
  var D = {}; for(var k in c) D[k] = c[k];
  D.moe = D.experts > 0;
  D.dp = D.world/(D.tp*D.cp*D.pp);
  D.layersPerStage = D.layers/D.pp;
  D.headDim = Math.floor(D.hidden/D.heads) || 1;
  return D;
}
function kvPerTp(D){ return Math.ceil(D.kv/D.tp); }
function opBytesSum(D){
  var hd = D.headDim, b = 0;
  b += 2*D.hidden*(D.heads/D.tp)*hd;            /* attn.q  列切 */
  b += 2*D.hidden*2*kvPerTp(D)*hd;              /* attn.kv 头切 */
  b += 2*(D.heads/D.tp)*hd*D.hidden;            /* attn.out 行切 */
  if(D.moe){
    b += 2*D.hidden*D.experts;                  /* router 复制 */
    b += 2*(D.experts/D.ep)*3*D.hidden*(D.ffn/D.etp); /* experts 桶切 */
  }else{
    b += 2*2*D.hidden*(D.ffn/D.tp) + 2*(D.ffn/D.tp)*D.hidden;
  }
  b += 2*2*D.hidden;                            /* norm×2 复制 */
  return b;
}
function paramsPerCard(D, p){
  var perLayer = opBytesSum(D)/2;
  var P = perLayer * D.layersPerStage;
  if(p===0) P += Math.ceil(D.vocab/D.tp)*D.hidden;
  if(p===D.pp-1) P += D.hidden*Math.ceil(D.vocab/D.tp);
  return P;
}
/* 权重带的内部：这一段（stage p）里每个算子的 bf16 字节与切法（demo 的 opBytes 同一口径） */
function opList(D, p){
  var hd = D.headDim, lps = D.layersPerStage, o = [];
  function add(id, cut, how, perLayerB){ o.push({id:id, cut:cut, how:how, b:perLayerB*lps}); }
  add('attn.q',  'tp', '列切 ×'+D.tp, 2*D.hidden*(D.heads/D.tp)*hd);
  add('attn.kv', 'tp', '头切 ×'+D.tp, 2*D.hidden*2*kvPerTp(D)*hd);
  add('attn.out','tp', '行切 ×'+D.tp, 2*(D.heads/D.tp)*hd*D.hidden);
  if(D.moe){
    add('router', 'none', '复制', 2*D.hidden*D.experts);
    add('experts','ep', '桶切 ×'+D.ep+'·ETP'+D.etp, 2*(D.experts/D.ep)*3*D.hidden*(D.ffn/D.etp));
  }else{
    add('mlp.gate/up', 'tp', '列切 ×'+D.tp, 2*2*D.hidden*(D.ffn/D.tp));
    add('mlp.down',    'tp', '行切 ×'+D.tp, 2*(D.ffn/D.tp)*D.hidden);
  }
  add('norm×2', 'none', '复制', 2*2*D.hidden);
  if(p===0)        o.push({id:'embed',   cut:'tp', how:'词表列切 ×'+D.tp, b:2*Math.ceil(D.vocab/D.tp)*D.hidden});
  if(p===D.pp-1)   o.push({id:'lm_head', cut:'tp', how:'词表列切 ×'+D.tp, b:2*D.hidden*Math.ceil(D.vocab/D.tp)});
  return o;
}
var ACT_COEF = 4;
function memParts(D, p){
  var P = paramsPerCard(D, p);
  var inflight = Math.max(1, Math.min(D.pp, D.ga) - p);
  var act = D.mbs*(D.seq/D.cp)*D.hidden*D.layersPerStage*ACT_COEF*inflight;
  return [
    {k:'w',   name:'权重',     unit:'bf16',    bytes:2*P,  from:'①', why:'参数 '+fmtP(P)+' × 2 B'},
    {k:'g',   name:'梯度',     unit:'bf16',    bytes:2*P,  from:'①', why:'同一份参数 × 2 B（反向要留）'},
    {k:'opt', name:'优化器态', unit:'fp32×3',  bytes:12*P, from:'①', why:'同一份参数 × 12 B（主参数+m+v）'},
    {k:'act', name:'激活·在途', unit:inflight+' μb', bytes:act, from:'②',
      why:'mbs·(s/cp)·h × '+D.layersPerStage+' 层 × 4 B × 在途 '+inflight+' μb'},
    {k:'rsv', name:'碎片/预留', unit:'', bytes:1.5*Math.pow(2,30), from:'—', why:'allocator 碎片与 workspace'}
  ];
}

/* ═══ 投影：等轴测 + 可拖拽 yaw/pitch（每个对象绕自身中心转）═══
   机位方向是 +(1,1,1)（对本投影：沿它移动屏上不动）——可见性与深度都从它来。 */
var C0 = Math.cos(Math.PI/6), S0 = Math.sin(Math.PI/6);
var yaw = 0, pitch = 0;
function rotV(dx, dy, dz){
  if(yaw || pitch){
    var cyw = Math.cos(yaw), syw = Math.sin(yaw), cpt = Math.cos(pitch), spt = Math.sin(pitch);
    var rx = dx*cyw + dz*syw, rz = dz*cyw - dx*syw;
    var ry = dy*cpt - rz*spt; rz = dy*spt + rz*cpt;
    return [rx, ry, rz];
  }
  return [dx, dy, dz];
}
function proj(x, y, z, ctr){
  var r = rotV(x-ctr[0], y-ctr[1], z-ctr[2]);
  return [(r[0]-r[2])*C0, ((r[0]+r[2])*S0 - r[1])];
}
function pts(a){ return a.map(function(p){ return p[0].toFixed(1)+','+p[1].toFixed(1); }).join(' '); }
function ln(a,b,st){ return '<line x1="'+a[0].toFixed(1)+'" y1="'+a[1].toFixed(1)+'" x2="'+b[0].toFixed(1)+'" y2="'+b[1].toFixed(1)+'" style="'+st+'"/>'; }
function txt(x,y,t,size,fill,anchor,extra){
  return '<text x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" text-anchor="'+(anchor||'middle')+'" font-size="'+size
    +'" font-family="var(--pt-mono)" style="fill:'+(fill||'var(--pt-fg2)')+'" '+(extra||'')+'>'+t+'</text>';
}
/* 容器 = 线框（DP-2 五类对象五种画法：容器永远不填色）。看得见的棱实线、被遮的棱虚线。 */
function boxWire(x,y,z,w,h,d,ctr,st,stHidden){
  var P8 = [proj(x,y,z,ctr),proj(x+w,y,z,ctr),proj(x+w,y,z+d,ctr),proj(x,y,z+d,ctr),
            proj(x,y+h,z,ctr),proj(x+w,y+h,z,ctr),proj(x+w,y+h,z+d,ctr),proj(x,y+h,z+d,ctr)];
  var E = [[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]];
  var out = '';
  E.forEach(function(e,i){ out += ln(P8[e[0]], P8[e[1]], (stHidden && (i===3||i===11||i===2)) ? stHidden : st); });
  return out;
}
/* 内容 = 实心体积。六个面全建、按旋转后的法线做背面剔除——凸盒剔除后可见面
   在投影上互不遮挡，无需排序。之前只画固定三面，转过 90° 就露出没画的那半边
   （「为什么半边没有显示」的根源就是它）。明度由旋转后的法线定档：
   朝上最亮、朝 +z 中、朝 +x 暗——默认机位下与旧三档逐位一致。 */
function boxFill(x,y,z,w,h,d,ctr,fill,o){
  o = o || {};
  var V = [[x,y,z],[x+w,y,z],[x+w,y,z+d],[x,y,z+d],[x,y+h,z],[x+w,y+h,z],[x+w,y+h,z+d],[x,y+h,z+d]];
  var P8 = V.map(function(v){ return proj(v[0],v[1],v[2],ctr); });
  var F = [ {i:[4,5,6,7], n:[0,1,0]},  {i:[0,3,2,1], n:[0,-1,0]},
            {i:[0,1,5,4], n:[0,0,-1]}, {i:[3,7,6,2], n:[0,0,1]},
            {i:[0,4,7,3], n:[-1,0,0]}, {i:[1,2,6,5], n:[1,0,0]} ];
  var st = 'stroke:'+(o.stroke||'var(--pt-bg)')+';stroke-width:'+(o.sw!==undefined?o.sw:.5)+(o.dash?';stroke-dasharray:'+o.dash:'');
  var op = o.opacity!==undefined ? ';fill-opacity:'+o.opacity : '';
  var out = '';
  F.forEach(function(f){
    var n = rotV(f.n[0], f.n[1], f.n[2]);
    if(n[0]+n[1]+n[2] <= 0.02) return;             /* 背面：机位在 +(1,1,1) */
    var shade = n[0]*0.26 + n[1]*0.83 + n[2]*0.47;
    var c = shade > .66 ? 'color-mix(in srgb,'+fill+' 88%, #fff 12%)'
          : shade > .36 ? 'color-mix(in srgb,'+fill+' 82%, #000 18%)'
          :               'color-mix(in srgb,'+fill+' 68%, #000 32%)';
    out += '<polygon points="'+pts([P8[f.i[0]],P8[f.i[1]],P8[f.i[2]],P8[f.i[3]]])+'" style="fill:'+c+op+';'+st+'"/>';
  });
  return out;
}

/* ═══ 状态 ═══ */
var ui = {stage:0, dpOne:false};
var q0 = new URLSearchParams(location.search);
if(q0.get('stage')) ui.stage = clamp(parseInt(q0.get('stage'),10)||0, 0, CFG.pp-1);
if(q0.get('dp')==='1') ui.dpOne = true;
var yq = parseFloat(q0.get('yaw')); if(isFinite(yq)) yaw = yq;
var pq = parseFloat(q0.get('pitch')); if(isFinite(pq)) pitch = clamp(pq,-1.2,1.2);
function urlWrite(){
  var q = new URLSearchParams();
  if(ui.stage) q.set('stage', ui.stage);
  if(ui.dpOne) q.set('dp','1');
  if(Math.abs(yaw)>1e-3 || Math.abs(pitch)>1e-3){ q.set('yaw',yaw.toFixed(3)); q.set('pitch',pitch.toFixed(3)); }
  var s = q.toString();
  history.replaceState(null,'', s ? '?'+s : location.pathname);
}

/* ═══ 成分的画法（两只腔，两种表达）═══
   ①权重体腔的三兄弟：实心灰阶三档（常驻——一份参数在卡上是 2+2+12 = 16 B）
   ②激活体腔：dp 蓝、半透、虚线棱（流动——每步换一批，在途 μb 逐段递减）
   碎片/预留：最浅一档。余量：容器线框空着的那截，画虚线水位线。 */
var TONE = {
  w:  {fill:'color-mix(in srgb, var(--pt-fg) 60%, var(--pt-bg))'},
  g:  {fill:'color-mix(in srgb, var(--pt-fg) 40%, var(--pt-bg))'},
  opt:{fill:'color-mix(in srgb, var(--pt-fg) 23%, var(--pt-bg))'},
  act:{fill:'var(--pt-dp)', opacity:.5, dash:'4 3', stroke:'var(--pt-dp)'},
  rsv:{fill:'color-mix(in srgb, var(--pt-fg) 10%, var(--pt-bg))'}
};

function render(){
  var D = derive(CFG);
  if(ui.dpOne){ D.world = D.tp*D.cp*D.pp; D.dp = 1; }   /* A3 演示：dp 不进任何公式，数字必须逐字不变 */
  var p = ui.stage;
  var segs = memParts(D, p), cap = D.hbm*Math.pow(2,30);
  var tot = segs.reduce(function(a,x){ return a+x.bytes; },0);
  var sc = 1/Math.max(cap, tot);
  var lps = D.layersPerStage, hK = Math.floor(D.hidden/D.tp), kE = D.experts/D.ep;

  var W = 1240, H = 820, parts = [];

  /* ── 主角：容器（线框）与它肚子里的层 ─────────────────────────────── */
  var BW = 210, BH = 320, BD = 150;                     /* 容器的三边（画布尺寸，非语义） */
  var ctr = [BW/2, BH/2, BD/2];
  var OX = 640, OY = 470;                               /* 容器在画布上的落点（投影原点偏移） */
  function G(inner){ return '<g transform="translate('+OX+','+OY+')">'+inner+'</g>'; }

  /* 层：从底往上（y 朝上），每层一只实心体积 + 右侧引线标注 */
  var acc = 0, labels = [], bandY = {};
  var inner = '';
  segs.forEach(function(sg){
    var f0 = acc*sc; acc += sg.bytes;
    var f1 = acc*sc;
    if(f1-f0 < 0.002) return;
    var t = TONE[sg.k];
    var y0 = BH*f0, y1 = BH*f1;
    bandY[sg.k] = {y0:y0, y1:y1};
    inner += boxFill(0, y0, 0, BW, y1-y0, BD, ctr, t.fill,
                     {opacity:t.opacity, stroke:t.stroke, sw:t.stroke? .9 : .5, dash:t.dash});
    /* 引线锚在这一层右棱的中点 */
    var a = proj(BW, (y0+y1)/2, BD/2, ctr);
    labels.push({k:sg.k, name:sg.name, unit:sg.unit, from:sg.from, why:sg.why,
                 gb:fmtGB(sg.bytes), ax:OX+a[0], ay:OY+a[1], big:(y1-y0)*sc>0});
  });

  /* ── 层的内部：哪块是哪个算子、被哪把刀切（与「抽出的 L0」同一套语汇）────
     ①家的三层（权重/梯度/优化器态）共用同一个横向分法——同一份参数的三本账，
     竖缝上下对齐；每一小块按**切它的那把刀**上色：TP 青 / EP 紫 / 复制不上色。
     attn.core 无参不占显存，所以它不在带里——列在旁注里说明。
     ②那层按在途 μb 分格（虚线缝）：每格一只还没算完的 micro-batch。 */
  var ops = opList(D, p), wSum = ops.reduce(function(a,x){ return a+x.b; },0);
  var KC = {tp:'var(--pt-tp)', ep:'var(--pt-ep)', none:null};
  var opSegs = [], axx = 0;
  ops.forEach(function(op0){
    var w0 = BW*op0.b/wSum;
    opSegs.push({id:op0.id, cut:op0.cut, how:op0.how, b:op0.b, x0:axx, x1:axx+w0});
    axx += w0;
  });
  /* 算子块只在**权重带**上着色——它就是「抽出的 L0」那排算子片折进容器的样子；
     梯度 / 优化器态保持灰（①家的常驻灰不能被刀色洗掉），只画**对齐的竖缝**：
     缝对上了，「同一分法 ×1 / ×6」不用一个字。 */
  if(bandY.w) opSegs.forEach(function(sgm){
    if(sgm.x1-sgm.x0 < .6) return;
    var col = KC[sgm.cut];
    if(col) inner += boxFill(sgm.x0, bandY.w.y0, 0, sgm.x1-sgm.x0, bandY.w.y1-bandY.w.y0, BD, ctr, col,
                             {opacity:.52, stroke:'var(--pt-bg)', sw:.4});
    else if(sgm.x0 > .5)
      inner += ln(proj(sgm.x0, bandY.w.y0, BD, ctr), proj(sgm.x0, bandY.w.y1, BD, ctr), 'stroke:var(--pt-bg);stroke-width:.6');
  });
  ['g','opt'].forEach(function(bk){
    var B = bandY[bk]; if(!B) return;
    opSegs.forEach(function(sgm){
      if(sgm.x0 < .5 || sgm.x1-sgm.x0 < 2) return;
      inner += ln(proj(sgm.x0, B.y0, BD, ctr), proj(sgm.x0, B.y1, BD, ctr),
                  'stroke:var(--pt-bg);stroke-width:.55;stroke-opacity:.8');
      inner += ln(proj(sgm.x0, B.y0, 0, ctr), proj(sgm.x0, B.y1, 0, ctr),
                  'stroke:var(--pt-bg);stroke-width:.55;stroke-opacity:.8');
    });
  });
  /* 权重带上给大块直接写名（其余交给右下角的算子清单） */
  if(bandY.w){
    opSegs.forEach(function(sgm){
      if(sgm.x1-sgm.x0 < 40) return;
      var cpt = proj((sgm.x0+sgm.x1)/2, (bandY.w.y0+bandY.w.y1)/2, BD, ctr);
      inner += txt(cpt[0], cpt[1]+3, sgm.id+' · '+sgm.how, 9, '#fff', 'middle',
                   'font-weight="700" paint-order="stroke" stroke="rgba(10,14,20,.55)" stroke-width="2.4"');
    });
  }
  if(bandY.act){
    var nIf = Math.max(1, Math.min(D.pp, D.ga) - p);
    for(var mi=1; mi<nIf; mi++){
      var mx = BW*mi/nIf;
      inner += ln(proj(mx, bandY.act.y0, BD, ctr), proj(mx, bandY.act.y1, BD, ctr),
                  'stroke:var(--pt-bg);stroke-width:.7;stroke-dasharray:2.5 2');
      inner += ln(proj(mx, bandY.act.y1, BD, ctr), proj(mx, bandY.act.y1, 0, ctr),
                  'stroke:var(--pt-bg);stroke-width:.7;stroke-dasharray:2.5 2');
    }
  }
  /* 水位线 + 余量：容器空着的那截也是信息 */
  var fTop = tot*sc;
  if(fTop < 0.985){
    var wl0 = proj(0, BH*fTop, 0, ctr), wl1 = proj(BW, BH*fTop, 0, ctr);
    var free = proj(BW/2, BH*(fTop+1)/2, 0, ctr);
    inner += ln(wl0, wl1, 'stroke:var(--pt-fg3);stroke-width:.8;stroke-dasharray:5 4');
    inner += txt(free[0], free[1], '余量 '+fmtGB(cap-tot)+' GB', 12, 'var(--pt-fg3)', 'middle', 'font-weight="700"');
  }
  /* 容器线框最后画（压在内容上面：容器装着内容，棱不能被层剖断） */
  inner += boxWire(0, 0, 0, BW, BH, BD, ctr,
                   'stroke:var(--pt-fg2);stroke-width:1.4',
                   'stroke:var(--pt-bd);stroke-width:1;stroke-dasharray:4 3');
  parts.push(G(inner));

  /* 容器抬头（地址=文字：门牌只标不画）——固定屏幕位，转视角也不压棱 */
  parts.push(txt(OX, 64, '卡 = 容器 · 显存 '+D.hbm+' GB', 15, 'var(--pt-fg)', 'middle', 'font-weight="800"'));
  parts.push(txt(OX, 82, '门牌 rank'+(p*D.tp*D.cp*(ui.dpOne?1:D.dp))+' · (tp0 cp0 dp0 pp'+p+' ep0) · 只标不画', 10, 'var(--pt-fg3)', 'middle'));

  /* 右侧标注列：名字 + GB + 来路（成分从哪只腔来）＋公式。引线不交叉：按 ay 排序后均匀落位 */
  labels.sort(function(a,b){ return b.ay - a.ay; });
  var LX = 950, ly0 = OY + 130, step = 64;
  labels.forEach(function(L, i){
    var y = ly0 - i*step;
    var col = L.k==='act' ? 'var(--pt-dp)' : (L.k==='rsv' ? 'var(--pt-fg3)' : 'var(--pt-fg)');
    parts.push(ln([L.ax+6, L.ay], [LX-10, y-4], 'stroke:var(--pt-bds);stroke-width:.8'));
    parts.push('<rect x="'+(LX-4)+'" y="'+(y-26)+'" width="10" height="10" style="fill:'+(TONE[L.k].fill)
      +(TONE[L.k].opacity?';fill-opacity:'+TONE[L.k].opacity:'')+';stroke:var(--pt-bds);stroke-width:.6"/>');
    parts.push(txt(LX+12, y-17, L.name+(L.unit?'（'+L.unit+'）':''), 13, col, 'start', 'font-weight="800"'));
    parts.push(txt(LX+252, y-17, L.gb+' GB', 13, col, 'end', 'font-weight="800"'));
    parts.push(txt(LX+12, y-3, (L.from!=='—' ? L.from+'腔 · ' : '')+L.why, 9.5, 'var(--pt-fg3)', 'start'));
  });
  /* 合计条 */
  var sumY = ly0 + 58;
  parts.push(ln([LX-4, sumY-34], [LX+252, sumY-34], 'stroke:var(--pt-bds);stroke-width:1'));
  parts.push(txt(LX+12, sumY-18, '合计 '+fmtGB(tot)+' / '+D.hbm+' GB', 14, tot>cap?'var(--pt-danger)':'var(--pt-fg)', 'start', 'font-weight="800"'));
  parts.push(txt(LX+12, sumY-4, tot>cap ? '装不下：OOM（空间问题，与利用率无关）' : '装满不会崩的是流；装满会崩的是这只', 9.5, 'var(--pt-fg3)', 'start'));

  /* ── 算子清单：权重带的内部逐块列出（编号与切法 = 「抽出的 L0」那排片的语汇）──
     梯度 / 优化器态与它同一分法（同缝对齐），只是每块 ×1 / ×6——不重复列。 */
  var opY = sumY + 24;
  parts.push(txt(LX-4, opY, '权重带的内部（本 stage · bf16）', 10.5, 'var(--pt-fg)', 'start', 'font-weight="800"'));
  parts.push(txt(LX-4, opY+13, '梯度/优化器态同一分法：每块 ×1 / ×6', 8.5, 'var(--pt-fg3)', 'start'));
  var rows = opSegs.slice().sort(function(a,b){ return b.b-a.b; });
  var small = rows.filter(function(r){ return r.b/wSum < .01; });
  rows = rows.filter(function(r){ return r.b/wSum >= .01; });
  if(small.length) rows.push({id:small.map(function(r){ return r.id; }).join('+'), cut:'none', how:'复制',
                              b:small.reduce(function(a,r){ return a+r.b; },0)});
  var rowY = opY + 28;
  rows.forEach(function(r){
    var col = KC[r.cut];
    parts.push('<rect x="'+(LX-4)+'" y="'+(rowY-8)+'" width="9" height="9" style="fill:'
      +(col ? 'color-mix(in srgb, '+col+' 45%, var(--pt-bg))' : 'color-mix(in srgb, var(--pt-fg) 18%, var(--pt-bg))')
      +';stroke:var(--pt-bds);stroke-width:.5"/>');
    parts.push(txt(LX+10, rowY, r.id, 9.5, 'var(--pt-fg)', 'start', 'font-weight="700"'));
    parts.push(txt(LX+96, rowY, r.how, 9, col||'var(--pt-fg3)', 'start', 'font-weight="700"'));
    parts.push(txt(LX+252, rowY, fmtGB(r.b)+' GB', 9.5, 'var(--pt-fg2)', 'end', 'font-weight="700"'));
    rowY += 15;
  });
  parts.push(txt(LX-4, rowY+4, 'attn.core 无参：在算子序列里、不在显存带里', 8.5, 'var(--pt-fg3)', 'start'));

  /* ── 来路①：权重体腔（索引空间小盒 + 黑腔）→ 三段灰 ────────────────── */
  var sW = 120, sH = 100, sD = 78;
  var sctr = [sW/2, sH/2, sD/2];
  var S1X = 205, S1Y = 600;
  function G1(inner){ return '<g transform="translate('+S1X+','+S1Y+')">'+inner+'</g>'; }
  var s1 = boxWire(0, 0, 0, sW, sH, sD, sctr, 'stroke:var(--pt-bd);stroke-width:1;stroke-dasharray:3 3');
  /* 三把刀的网格线（示意密度，不逐格画满）：ℓ←PP 横切 4、h←TP 竖切 2、e←EP 纵深 8 */
  var i;
  for(i=1;i<D.pp;i++) s1 += ln(proj(0,sH*i/D.pp,sD,sctr), proj(sW,sH*i/D.pp,sD,sctr), 'stroke:var(--pt-pp);stroke-width:.7;stroke-opacity:.55');
  for(i=1;i<D.tp;i++) s1 += ln(proj(sW*i/D.tp,0,sD,sctr), proj(sW*i/D.tp,sH,sD,sctr), 'stroke:var(--pt-tp);stroke-width:.7;stroke-opacity:.55');
  for(i=1;i<D.ep;i++) s1 += ln(proj(sW,0,sD*i/D.ep,sctr), proj(sW,sH,sD*i/D.ep,sctr), 'stroke:var(--pt-ep);stroke-width:.6;stroke-opacity:.45');
  /* 本卡的腔：黑色小长方体（交集腔的画法原样），位置随 stage 走 */
  var cy0 = sH*p/D.pp;
  s1 += boxFill(0, cy0, 0, sW/D.tp, sH/D.pp, sD/D.ep, sctr, 'var(--pt-fg)', {sw:.4});
  parts.push(G1(s1));
  parts.push(txt(S1X+ -sW*0.1, S1Y-108, '① 权重体腔（ℓ × h × e）', 12.5, 'var(--pt-fg)', 'start', 'font-weight="800"'));
  parts.push(txt(S1X+ -sW*0.1, S1Y-93, 'L'+(p*lps)+'–L'+((p+1)*lps-1)+' · h['+fmt(0)+','+fmt(hK)+') · E0–E'+(kE-1), 9.5, 'var(--pt-fg3)', 'start'));
  parts.push(txt(S1X+ -sW*0.1, S1Y-80, '这一腔的参数，在卡上是三份东西：2+2+12 = 16 B/参数', 9.5, 'var(--pt-fg2)', 'start'));
  /* 引线：腔 → 容器里三段灰的中段（梯度那段） */
  var c1 = proj(sW/D.tp/2, cy0+sH/D.pp/2, sD/D.ep/2, sctr);
  var gMid = labels.filter(function(L){ return L.k==='g'; })[0];
  if(gMid) parts.push(ln([S1X+c1[0]+8, S1Y+c1[1]], [gMid.ax-BW*C0*2-40, gMid.ay],
    'stroke:var(--pt-fg2);stroke-width:.9;stroke-dasharray:4 3;stroke-opacity:.7'));

  /* ── 来路②：激活体腔（蓝腔）→ 蓝段 ──────────────────────────────── */
  var S2X = 205, S2Y = 250;
  function G2(inner){ return '<g transform="translate('+S2X+','+S2Y+')">'+inner+'</g>'; }
  var s2 = boxWire(0, 0, 0, sW, sH, sD, sctr, 'stroke:var(--pt-bd);stroke-width:1;stroke-dasharray:3 3');
  for(i=1;i<D.pp;i++) s2 += ln(proj(0,sH*i/D.pp,sD,sctr), proj(sW,sH*i/D.pp,sD,sctr), 'stroke:var(--pt-pp);stroke-width:.7;stroke-opacity:.55');
  var dpN = ui.dpOne ? 1 : D.dp;
  for(i=1;i<dpN;i++) s2 += ln(proj(sW,0,sD*i/dpN,sctr), proj(sW,sH,sD*i/dpN,sctr), 'stroke:var(--pt-dp);stroke-width:.6;stroke-opacity:.45');
  s2 += boxFill(0, sH*p/D.pp, 0, sW, sH/D.pp, sD/dpN, sctr, 'var(--pt-dp)', {opacity:.55, stroke:'var(--pt-dp)', sw:.9, dash:'4 3'});
  parts.push(G2(s2));
  parts.push(txt(S2X-sW*0.1, S2Y-104, '② 激活体腔（ℓ × h × b × s）', 12.5, 'var(--pt-dp)', 'start', 'font-weight="800"'));
  parts.push(txt(S2X-sW*0.1, S2Y-89, 'b = 副本'+(ui.dpOne?0:0)+' 的 '+(D.mbs*D.ga)+' 样本 · s = 全部 '+fmt(D.seq)+' token', 9.5, 'var(--pt-fg3)', 'start'));
  parts.push(txt(S2X-sW*0.1, S2Y-76, '流动的成分：每步换一批，在途 μb 随 stage 递减', 9.5, 'var(--pt-fg2)', 'start'));
  var c2 = proj(sW/2, sH*p/D.pp+sH/D.pp/2, sD/dpN/2, sctr);
  var aMid = labels.filter(function(L){ return L.k==='act'; })[0];
  if(aMid) parts.push(ln([S2X+c2[0]+8, S2Y+c2[1]], [aMid.ax-BW*C0*2-40, aMid.ay],
    'stroke:var(--pt-dp);stroke-width:.9;stroke-dasharray:4 3;stroke-opacity:.6'));

  /* A3 对照读数（dp 开关按下时把「零差」写出来） */
  if(ui.dpOne){
    parts.push('<rect x="'+(S1X-24)+'" y="'+(S1Y+80)+'" width="330" height="46" rx="5" style="fill:color-mix(in srgb, var(--pt-dp) 7%, transparent);stroke:var(--pt-dp);stroke-width:1"/>');
    parts.push(txt(S1X-12, S1Y+98, 'DP=1 与 DP=16：右边五个数逐字相同 —— Δ = 0', 11, 'var(--pt-dp)', 'start', 'font-weight="800"'));
    parts.push(txt(S1X-12, S1Y+114, '五个公式里都没有 dp。加 DP 不买余量（A3）。', 9.5, 'var(--pt-fg2)', 'start'));
  }

  document.getElementById('stage').innerHTML =
    '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">'+parts.join('')+'</svg>';

  /* ── 顶栏 / 脚注 ── */
  var bar = '<span class="cap">stage</span>';
  for(var sp=0; sp<CFG.pp; sp++)
    bar += '<button class="pb'+(sp===p?' is-on':'')+'" data-act="stage" data-i="'+sp+'">PP'+sp
        + (sp===0?' <small>+词嵌入</small>':(sp===CFG.pp-1?' <small>+lm_head</small>':''))+'</button>';
  bar += '<span class="cap" style="margin-left:10px">A3 验证</span>'
      + '<button class="pb'+(ui.dpOne?' is-on':'')+'" data-act="dp1">DP=1 对照</button>'
      + ((Math.abs(yaw)>1e-3||Math.abs(pitch)>1e-3) ? '<button class="pb" data-act="reset">复位视角</button>' : '')
      + '<span class="chip">拖拽旋转</span>';
  document.getElementById('bar').innerHTML = bar;
  document.getElementById('foot').innerHTML =
    '<b>画法纪律（DP-2）</b>：容器 = 线框（永不填色） · 内容 = 实心体积（字节即体积） · 地址 = 文字（只标不画）。'
    + '①腔的三份成分同涨同缩（都是「参数 × 每参数字节」）；②腔那段每步换血，颜色与虚线棱都在说「它是流动的」。'
    + '另一只容器是<b>流</b>（容量 = 时间，装 kernel 队列）——装满不会崩、只是变慢；本页只画显存这只，装满就 OOM。';
  urlWrite();
}

/* ═══ 交互 ═══ */
document.addEventListener('click', function(ev){
  var b = ev.target.closest('[data-act]');
  if(!b) return;
  var act = b.getAttribute('data-act');
  if(act==='stage'){ ui.stage = +b.getAttribute('data-i'); render(); }
  else if(act==='dp1'){ ui.dpOne = !ui.dpOne; render(); }
  else if(act==='reset'){ yaw = 0; pitch = 0; render(); }
});
var drag = null;
var stage = document.getElementById('stage');
stage.addEventListener('pointerdown', function(ev){
  drag = {x:ev.clientX, y:ev.clientY, yaw:yaw, pitch:pitch, raf:0, moved:false, id:ev.pointerId};
});
stage.addEventListener('pointermove', function(ev){
  if(!drag) return;
  var dx = ev.clientX-drag.x, dy = ev.clientY-drag.y;
  if(Math.abs(dx)+Math.abs(dy) > 3 && !drag.moved){
    drag.moved = true;
    try{ stage.setPointerCapture(drag.id); }catch(e){}
  }
  if(!drag.moved) return;
  yaw = drag.yaw - dx*0.008;
  pitch = clamp(drag.pitch + dy*0.006, -1.2, 1.2);
  if(!drag.raf) drag.raf = requestAnimationFrame(function(){ if(drag) drag.raf = 0; render(); });
});
function endDrag(ev){
  if(!drag) return;
  if(drag.raf) cancelAnimationFrame(drag.raf);
  try{ stage.releasePointerCapture(ev.pointerId); }catch(e){}
  drag = null; render();
}
stage.addEventListener('pointerup', endDrag);
stage.addEventListener('pointercancel', endDrag);

render();
})();
</script>
</body>
</html>
