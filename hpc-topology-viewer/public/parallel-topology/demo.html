   （card-container 那一屏的「权重带的内部」也是它），这里只补上两头的 embed/lm_head
   —— 它们只属于首末段，正是 PP 那一刀留下的痕迹。
   PP 不出现在这张表里，因为**它不切任何一个张量**：它切的是「哪几层住在这张卡上」，
   是整条带的前提而不是带里的一块。这句话写在带头上（见读出卡的层段行）。 */
function wCutBlocks(D, ppRank, L){
  var lps = D.layersPerStage, o = [];
  opBytes(D).forEach(function(x){
    if(!x.b) return;
    var by = x.b * lps;
    if(x.id === 'experts' && L && L.expEven > 0) by *= L.expOwn / L.expEven;
    o.push({id:x.id, cut:x.cut, how:x.how, bytes:by});
  });
  var vOwn = L ? L.vocabOwn : Math.ceil(D.vocab/D.tp);
  if(ppRank === 0)        o.push({id:'embed',  cut:'tp', how:'词表列切 ×'+D.tp, bytes:2*vOwn*D.hidden});
  if(ppRank === D.pp-1)   o.push({id:'lm_head',cut:'tp', how:'词表列切 ×'+D.tp, bytes:2*D.hidden*vOwn});
  /* 同一把刀的块并排在一起，带上才读得出「青的这一截是 TP 切的」；复制的排最后 */
  var ord = {ep:0, tp:1, cp:2, sp:3, none:9};
  o.sort(function(a,b){ return (ord[a.cut]===undefined?8:ord[a.cut]) - (ord[b.cut]===undefined?8:ord[b.cut]); });
  return o;
}
function cutColor(c){ return (c && c !== 'none' && VC[c]) ? VC[c] : 'color-mix(in srgb, var(--pt-fg) 22%, var(--pt-bg))'; }

/* ══ ZeRO / 分布式优化器档位 ═══════════════════════════════════════════════
   本页原来把「非 ZeRO」写死进了口径（见下面 MEM_OBJ 里优化器态那条 silent，
   以及验收 A3「调 DP 容器纹丝不动」）。那句话本身没错，但它把一件很重要的事
   挡在了门外：**DP 不减显存，只在不开 ZeRO 时成立。**
   一旦沿 DP 域把三档模型态切开，DP 就从「只买吞吐」变成「也买余量」——A3 那条
   断言于是有了两面，两面都值得当场看见，所以它变成一个档位而不是一句注释。

   四档的语义按 DeepSpeed ZeRO 与 PyTorch FSDP 的官方定义（/parallel-reference/ §14 二）：
   注：本文件里更早的注释写的「§15」等，引的是 concept-map.html 那一版的编号——
   那份已在 2026-09 合并进 /parallel-reference/（原路径改成跳转桩），两份编号差一位。
   老注释保持原样不逐条追改（改错比不改更糟），新加的引用一律写全路径 + 新编号。
     0 ── 关：W/G/O 每张 DP 卡各一份完整的（DDP / 经典 Megatron 语义）
     1 ── 只切优化器态。这就是 Megatron 的分布式优化器：官方显存表
          「bf16 参数 + fp32 梯度 18 B → 6 + 12/d」拆开正好是 W2+G4 留本地、O12 除以 d
     2 ── 再切梯度（≈ FSDP SHARD_GRAD_OP）
     3 ── 连参数也切（= FSDP FULL_SHARD）。它与前两档不是程度差别而是**形态差别**：
          权重不再常驻，计算那一刻要 AllGather 拼回来，用毕丢弃——于是多出一格
          「AllGather 窗口」，那格才是这一档真正的代价，也是最常被漏算的一格。 */
function zeroLv(){
  var z = parseInt(cfg.zero, 10);
  return (isFinite(z) && z >= 0 && z <= 3) ? z : 0;
}
var ZERO_NAME = ['关（各卡一份完整）', 'ZeRO-1 · 切优化器态', 'ZeRO-2 · 再切梯度', 'ZeRO-3 / FSDP · 连参数也切'];
var ZERO_SHORT = ['ZeRO 关', 'ZeRO-1', 'ZeRO-2', 'ZeRO-3'];
/* 这一档被沿 DP 域切成几份：1 = 没切（整份压在本卡上）。三处口径共用这一个函数，
   免得 memParts、读出卡、说明表各写一遍除法，往后改一处漏两处。 */
function zeroDiv(D, k){
  var z = D.zero === undefined ? zeroLv() : D.zero;
  if(k === 'opt' || k === 'otmp') return z >= 1 ? D.dp : 1;
  if(k === 'g')                   return z >= 2 ? D.dp : 1;
  if(k === 'w')                   return z >= 3 ? D.dp : 1;
  return 1;
}

/* ══ 四类对象模型：谁被哪把刀切 → 因此发生哪一次通信 ═══════════════════════
   这张图原先只把「切分 → 通信」这条链给**权重**接通了：点权重带里某一块留 TP/EP，
   点梯度留 DP，剩下的档一律什么都不画。可「什么都不画」在三种完全不同的情形下
   长得一模一样——
     ① 压根没挨刀，所以真的不通信（碎片/预留）；
     ② 挨了刀、这套配置下确实不通信（优化器态，非 ZeRO）；
     ③ 挨了刀也通信，只是这张图没人接线（激活、优化器步临时区）。
   ③ 是漏，①② 是答案；三者画面相同，读者就分不出「这里没有」和「这里没画」。
   所以把每一类对象自己的**刀**与**因此发生的通信**写成一张显式的表，让地面流量带、
   卡对卡通信线、读出卡三处都来问它。memSibDims 的注释早就立过这个规矩——
   「渲染与读出卡共用同一份，免得两处各写一遍、往后改一处漏一处」——这里照办，
   顺手把散在渲染函数里那份 W_CUT_MAP（opBytes 的 cut 字段的第二份手抄本）也收进来。

   下面这段物理语义才是这张表真正的内容，代码只是把它抄下来：

     权重 W —— TP 切 h、EP 分 e、PP 定段；DP 方向上它是**复印**不是切。切开的那几片
       要在算子进出口拼回全长，于是有 TP 的 AllGather / Reduce-Scatter（TP 区的
       换轴器）与 EP 的 AllToAll（token 去专家所在的卡、算完回来）。复印件之间
       不为「凑齐一份权重」说话，所以 W 没有 DP 通信。

     梯度 ∇W —— 与权重是**同一份参数的同一份切分**，刀完全跟随 W，一根不多一根不少。
       它多出来的那一次通信在 DP 方向：dp 个副本各自吃不同的微批、各算出一份偏导，
       步末要 AllReduce 成同一份，否则下一步各副本的权重会漂开。
       反过来 TP/EP 方向不再单独记一次：那两刀在前向已经把张量拼回去过，反向是
       同一条路反着走，不是新的一次通信。

     优化器态 —— 刀同样跟随权重（fp32 主参数 + m + v，逐参数一一对应）。常规 DP 下
       它**步内不通信**：每个副本各存一整份，m/v/主参数都是本地读写，AllReduce 完的
       梯度到手就地更新。只有 ZeRO 把它按 DP 再分片，才会多出 param AllGather /
       grad Reduce-Scatter；而本页画的是非 ZeRO 口径——memParts 里那 12 B/参数
       说的正是「整份都压在本卡上」。所以这一档「不画通信」是**答案**：理由是
       「这套配置下没有」，与碎片那种「压根没有」不是一回事，读出卡要把这句写出来。

     优化器步·临时区 —— 它跟随的是**梯度**，不是权重。memParts 里这一档的定义就是
       「梯度归约成 fp32 的缓冲」——它就是 DP 那一次 AllReduce 落在显存上的那一块，
       同一件事的两面。所以它的通信照抄梯度那一条，只是标签上要说清「它就是这一次」。

     激活 A —— DP 切 b、CP 切 s、SP 切 s、PP 定段；**TP 不切它**：SP 只在算子之间把 s
       切开省显存，进 TP 区之前要 AllGather 回全长（memParts 里 act 用的正是整条
       D.hidden，没有除 tp）。它是这张图上唯一沿 PP 走的东西——段与段之间 P2P 传的
       就是激活；CP 组之间 AllGather 的是 KV（s 被切开了，算全局注意力得把别人那几段
       的 KV 取回来）；SP↔TP 之间换轴换的还是它。

     碎片/预留 —— 不参与任何一把刀，真的不通信。

   sib（点亮兄弟卡的轴）与 comm（画出来的通信）是**两件事**，不能合成一列：
   sib 问「谁和本卡凑齐一整份」，comm 问「本卡为这一份要跟谁说话」。激活最能说明
   区别——它沿 TP 有通信（换轴）却不沿 TP 分片，沿 DP 分片（各吃各的微批）却不为
   分片本身通信。合成一列的那一刻，这张图就开始把复制读成切分。 */
var MEM_OBJ = {
  w:   {sib:['pp','tp','ep'],
        comm:[{d:'tp', t:'AllGather / Reduce-Scatter · TP 换轴器'},
              {d:'ep', t:'AllToAll · EP 分桶'}]},
  g:   {sib:['pp','tp','ep'], follow:'跟随权重的切法——同一份参数的同一份切分',
        comm:[{d:'dp', t:'梯度 AllReduce · DP 组（反向末尾一次）'}]},
  opt: {sib:['pp','tp','ep'], follow:'跟随权重的切法',
        comm:[],
        silent:'常规 DP 下步内不通信：主参数 / m / v 整份都在本卡，就地更新。'},
  /* ZeRO-3 独有：权重的临时完整副本。它的兄弟轴与权重一样，通信却是 DP 方向的
     ——这正是「同一样东西，分片归属换了一根轴」最直白的一例。 */
  agw: {sib:['pp','tp','ep','dp'],
        comm:[{d:'dp', t:'参数 AllGather · DP 组（进算子前拼回全长，用毕丢弃）'}]},
  otmp:{sib:['pp','tp','ep'], follow:'跟随梯度——它就是那一次归约的落脚处',
        comm:[{d:'dp', t:'梯度 AllReduce · DP 组（这一档就是它的 fp32 缓冲）'}]},
  act: {sib:['pp','cp'],
        comm:[{d:'pp', t:'P2P · 段→段传的就是它'},
              {d:'cp', t:'AllGather(KV) · CP 组（s 被切开，注意力要全局）'},
              {d:'tp', t:'AllGather(s→h) / Reduce-Scatter(h→s) · TP=SP 换轴'}]},
  rsv: {sib:[], comm:[], silent:'不参与任何一把刀，真的不通信。'}
};
/* 权重带里每一块被哪把刀切。这本是 opBytes(D) 的 cut 字段，但那份要 D 才拿得到，
   而问「点开的这一块该画哪条通信」的地方（渲染循环里、读出卡里）手边常常只有一个
   key 串；embed / lm_head 又是 wCutBlocks 在 opBytes 之外补上的两块。所以这里留一份
   按 id 的静态查表——**只此一份**，原先渲染函数里那个同名的 W_CUT_MAP 已经删掉。 */
var MEM_WCUT = {'attn.q':'tp', 'attn.kv':'tp', 'attn.core':'none', 'attn.out':'tp',
  'router':'none', 'experts':'ep', 'mlp.gate/up':'tp', 'mlp.down':'tp', 'norm×2':'none',
  'embed':'tp', 'lm_head':'tp'};
/* key → 这一档（或权重带里这一块）的对象条目。'w:xxx' 是权重档的子块：它继承权重的
   语义，但**只保留切它那一把刀**——experts 只挨 EP，attn.* 只挨 TP，router/norm 一刀
   没挨。整档 w 是「这条带里各块的刀合起来」，单块是「我这一块的刀」，两级各答各的。 */
/* 开了 ZeRO 之后，三档模型态的「谁和本卡凑齐一份」「本卡为它跟谁说话」全变了：
   分片沿的是 DP 域，于是 DP 既进 sib（沿这根轴才凑得齐一整份），也进 comm
   （步末要把各自那一片规约/收齐）。静态表答不了这件事——它得看当前档位。 */
function zeroPatch(o, key){
  var z = zeroLv();
  if(z === 0 || (key !== 'w' && key !== 'g' && key !== 'opt')) return o;
  var sharded = (key === 'opt') || (key === 'g' && z >= 2) || (key === 'w' && z >= 3);
  if(!sharded) return o;
  var r = {sib:(o.sib||[]).concat(['dp']), comm:(o.comm||[]).slice(), follow:o.follow};
  if(key === 'opt') r.comm.push({d:'dp', t:'（分片持有）步末只更新本卡那一段，不再整份复印'});
  if(key === 'g')   r.comm = [{d:'dp', t:'梯度 ReduceScatter · DP 组（不再 AllReduce：只收本卡那一段）'}];
  if(key === 'w')   r.comm = r.comm.concat([{d:'dp', t:'参数 AllGather · DP 组（前向一次、反向一次，用毕丢弃）'}]);
  return r;
}
function memObj(key){
  if(!key) return {sib:[], comm:[]};
  if(key.indexOf('w:') === 0){
    var id9 = key.slice(2), ct9 = MEM_WCUT[id9] || 'none';
    /* embed / lm_head 只住一个 stage（PP 那一刀把它们留在首末段），ℓ 轴上没有兄弟——
       沿 PP 找过去只会找到没有这一块的卡，点亮它们是在说一件假的事。 */
    var sb9 = (id9 === 'embed' || id9 === 'lm_head') ? ['tp']
            : ct9 === 'ep' ? ['pp','ep'] : (ct9 === 'tp' ? ['pp','tp'] : ['pp']);
    var cm9 = ct9 === 'tp' ? [MEM_OBJ.w.comm[0]] : (ct9 === 'ep' ? [MEM_OBJ.w.comm[1]] : []);
    return {sib:sb9, comm:cm9, cut:ct9,
            silent: cm9.length ? '' : '这一块一刀没挨（复制或无参），本来就没有「拼回全长」这件事要跟人商量。'};
  }
  return zeroPatch(MEM_OBJ[key] || {sib:[], comm:[]}, key);
}
/* 选中的块被哪几根轴切——渲染（点亮兄弟卡）与读出卡（写哪几组）共用同一份。
   现在这份从 MEM_OBJ 里取，不再自己抄一遍。 */
function memSibDims(key){ return memObj(key).sib; }
/* 三处画通信的地方（容量视图的地面流量带、卡对卡通信线、读出卡的「对应通信」行）
   问的是同一个问题：这一维的通信现在该不该画。
   没点开任何一档时给的是**概览口径**——TP/EP/DP/PP 四条组级通信照旧全画，与改动前
   逐像素一致；CP 不在概览里（它从来没被画过，塞进默认会改掉所有人熟悉的那一屏）。
   点开某一档之后换成**这一档自己的**那几条：这时问的已经不是「这套切法一共有哪些
   通信」，而是「我盯着的这份东西为什么要过网络」——两个问题，答案本就不该一样，
   所以选中后出现概览里没有的 PP/CP 不是自相矛盾，是换了个问题。 */
function memCommWant(key){
  var w9 = {tp:false, cp:false, pp:false, dp:false, ep:false};
  if(!key){ w9.tp = true; w9.ep = true; w9.dp = true; w9.pp = true; return w9; }
  memObj(key).comm.forEach(function(c9){ w9[c9.d] = true; });
  return w9;
}

/* g 给了就按**那一张卡**算（见 rankLoad）；不给就是这一段的标准卡，读数与从前一字不差
   —— 聚合口径（每卡容量、A3 自检、四刀贡献对比）都走不给 g 这一路，免得被单卡的
   路由不均带偏：那些问的是「这套切法给一张卡留下多少」，不是「第 41 张卡此刻多少」。 */
function memParts(D, ppRank, g){
  var L = rankLoad(D, g);
  var P = paramsPerCard(D, ppRank, L);
  /* 训练步进度只作用在**逐卡**这一路（给了 g 的那一路）：那问的是「第 41 张卡此刻
     多少」。不给 g 的聚合口径（每卡容量、四刀贡献、A3 自检）照旧按峰值——它们问的是
     「这套切法给一张卡留下多少」，跟着游标晃就不是同一个问题了。 */
  var inflight = inflightAt(D, ppRank, (L && ACT_T !== null) ? (ACT_T + L.phase) : (L ? null : null));
  var act = D.mbs*(D.seq/D.cp)*D.hidden*D.layersPerStage*ACT_COEF*inflight * (L ? L.actK : 1);
  /* 优化器步的临时区：一步的最后，梯度要归约成 fp32、主参数按 m/v 更新，这中间会
     短暂多出一份 fp32 的梯度副本与更新临时量（4 B/参数）。这是实机上最经典的 OOM
     时刻——整步都好好的，最后一下没了；也正是「容量」这一屏要报的事。
     只在 t 的末段出现，不给时间轴就不算（默认那张读数还是稳态峰值）。 */
  var stepT = (L && ACT_T !== null) ? clamp(ACT_T + L.phase, 0, 1) : null;
  var optK = 0;
  if(stepT !== null && stepT > 0.88){
    var u = (stepT - 0.88) / 0.12;                 /* 末段 12% 里升起再落下 */
    optK = Math.sin(Math.PI * clamp(u, 0, 1));
  }
  /* 4 B/参数是**整份** fp32 梯度副本；实机是分桶归约的——一桶归约完就还回去，
     同一时刻驻留的只是其中一截。按 0.8 折算（≈3.2 B/参数）：这样峰值只把
     本来就吃紧的那几张顶过 88%，而不是整片一起翻红。告警要稀有才有信息量。 */
  var optTmp = 3.2 * P * optK;
  /* ZeRO / 分布式优化器：三档模型态沿 DP 域各切成 dp 份，本卡只留自己那一份。
     临时区跟着优化器态走——分布式优化器只对本卡那一段做 fp32 归约与更新。 */
  var zW = zeroDiv(D,'w'), zG = zeroDiv(D,'g'), zO = zeroDiv(D,'opt');
  /* ZeRO-3 独有的一格：常驻的是 1/dp，但计算那一刻必须拼回**一个 wrap 单元**的
     完整参数。本页把 wrap 单元取成一层（FSDP 最常见的包法就是一个 transformer
     block），再算上为了和计算重叠而预取的下一层，合计两层的完整参数。
     这一格不是省下来的，是这一档真正的代价——单看「16/dp」会把它漏掉。 */
  var agWin = (D.zero >= 3 && D.layersPerStage > 0) ? 2 * (2*P/D.layersPerStage) : 0;
  return [
    {k:'w', label:'权重 (bf16)'+(zW>1?' · 1/'+D.dp+' 分片':''), bytes:2*P/zW, color:MEMC.w, sub:wCutBlocks(D, ppRank, L), zdiv:zW},
    {k:'agw', label:'AllGather 窗口 · 一层+预取', bytes:agWin, color:MEMC.agw},
    {k:'g', label:'梯度 (bf16)'+(zG>1?' · 1/'+D.dp+' 分片':''), bytes:2*P/zG, color:MEMC.g, zdiv:zG},
    {k:'opt', label:'优化器态 (fp32×3)'+(zO>1?' · 1/'+D.dp+' 分片':''), bytes:12*P/zO, color:MEMC.opt, zdiv:zO},
    {k:'otmp', label:'优化器步·临时区 (fp32 梯度归约)', bytes:optTmp/zO, color:MEMC.otmp},
    /* mub 带出去给卡上那几道虚缝用：激活带按「在途几份微批」竖着分格，
       与 card-container 那只单卡同一画法——它是唯一按份数分的一档。 */
    {k:'act', label:'激活·在途'+(inflight >= 1 ? (Math.abs(inflight-Math.round(inflight))<0.05 ? Math.round(inflight) : inflight.toFixed(1)) : inflight.toFixed(1))+'μb', bytes:act, color:MEMC.act, mub:inflight},
    {k:'rsv', label:'碎片/预留', bytes:(L ? L.rsv : 1.5*Math.pow(2,30)), color:MEMC.rsv}
  ];
}
/* ── 生命周期：这一档此刻处在哪一相 ────────────────────────────────────────
   显存账回答「有多少」，这个函数回答「为什么现在有、什么时候走」。两句合起来
   才解释得了一张卡的读数——同一档、同样的 GB 数，在前向和在步末是两件事。

   t 是**这张卡自己的**步内进度（ACT_T 加上它的相位差，见 rankLoad.phase）：
   1F1B 稳态里各 stage 本来就不同步，「此刻」对整网无定义，只对「某张卡」有定义。
   没走带（t === null）时不编相位，直说这是峰值口径——瞎给一个相位比不给更糟。

   相序按 /parallel-reference/ §14 四那张状态机表：只有梯度与激活会消失，另两档在非 ZeRO-3 下
   全程常驻；ZeRO-3 把权重也变成会消失的东西，这正是它与前两档的形态差别。 */
function stateLife(D, k, t){
  var z = D.zero || 0, sharded = zeroDiv(D, k) > 1;
  if(t === null || t === undefined){
    if(k === 'act')  return '峰值口径（未走带）';
    if(k === 'otmp') return '只在步末露面';
    if(k === 'g')    return sharded ? '步末规约后的一片' : '步末规约后的一份';
    if(k === 'agw')  return '用毕丢弃';
    if(k === 'rsv')  return '与时间无关';
    return '常驻整步';
  }
  if(k === 'w'){
    if(z < 3) return t > 0.86 ? '就地更新中' : '常驻整步';
    if(t < 0.06) return '分片 · 还没拼';
    if(t < 0.40) return 'AllGather 完 · 前向在用';
    if(t < 0.86) return '再 AllGather · 反向在用';
    return '用毕丢弃 → 更新后的分片';
  }
  if(k === 'agw') return t < 0.86 ? '窗口开着（拼一层 + 预取）' : '窗口已关';
  if(k === 'g'){
    if(t < 0.40) return '尚未产生';
    if(t < 0.80) return '反向逐层生成 · 累积';
    if(t < 0.86) return sharded ? 'ReduceScatter 中' : 'AllReduce 中';
    if(t < 0.97) return sharded ? '本卡那一片（已规约）' : '完整（已规约）';
    return '清零';
  }
  if(k === 'opt')  return t > 0.86 ? '被读写更新' : '常驻整步 · 不动';
  if(k === 'otmp') return t > 0.88 ? '步末冒出来' : '此刻不存在';
  if(k === 'act'){
    if(t < 0.40) return '前向逐层堆积';
    if(t < 0.86) return '反向逐层释放';
    /* 不写「已清空」：memParts 的在途份数在步末仍有 1 份（inflightAt 只要 0<t<1
       就至少留一份——手上总有正在算的那一批）。写清空而右边还挂着 1.8 GB，
       读者第一反应是这张卡的数错了。 */
    return '收尾排空 · 还压着最后一份';
  }
  return '与时间无关';
}
/* 归属：这一档此刻归谁。模型态问这个，执行态问上面那个——两类状态要两套读法
   （/parallel-reference/ §14 一）。写成一句短语，跟在字节数后面。 */
function stateOwn(D, k, g){
  var co = coordsOf(g, D);
  if(k === 'act' || k === 'rsv' || k === 'otmp') return '';
  if(k === 'agw') return '临时拼回全长';
  if(zeroDiv(D, k) > 1) return 'DP 第 '+co.d+'/'+D.dp+' 段';
  return 'DP 复印';
}

/* ── 容量判定：这张卡此刻装不装得下 ─────────────────────────────────────
   壳是 HBM 容量（固定），装进去的是这一刻的五档。时间轴走到峰值时，路由不均那几张
   卡是真的会顶出去的——这一屏的价值恰恰在这儿：不是「平均每卡 51GB，够用」，
   而是「第 37 张卡在这一刻超了 3.2GB，因为它那个专家桶收到的 token 多 34%」。
   越界原因只报**可变的那几档**（激活、碎片）超出各自基准多少：权重/梯度/优化器态
   是常驻的，它们不会「突然」把卡撑爆，说它们没有信息量。 */
var CAP_AMBER = 0.70, CAP_RED = 0.88;   /* 两条警戒线：卡上画出来的就是这两条 */
var CAP_C = {amber:'var(--highlight-mte-amber-600, #CA8A04)', red:'var(--pt-danger)'};
function capVerdict(D, ppRank, g){
  var segs = memParts(D, ppRank, g);
  var tot = segs.reduce(function(a,x){ return a+x.bytes; }, 0);
  var cap = D.hbm*Math.pow(2,30);
  var base = memParts(D, ppRank);                     /* 同一段的标准卡：拿来说「多出多少」 */
  var bm = {}; base.forEach(function(x){ bm[x.k] = x.bytes; });
  var over = tot - cap;
  var why = [];
  if(over > 0){
    segs.forEach(function(x){
      if(x.k !== 'act' && x.k !== 'rsv' && x.k !== 'otmp') return;
      var d = x.bytes - (bm[x.k] || 0);
      if(d > 0.05*Math.pow(2,30)) why.push({k:x.k, label:x.label, d:d});
    });
    why.sort(function(a,b){ return b.d - a.d; });
  }
  var r = tot/cap;
  return {
    tot:tot, cap:cap, over:over, ratio:r,
    /* 四档，两条警戒线就是卡上画的那两条：
       70% 橙 —— 还能跑，但已经没有余量吃一次路由抖动；
       88% 红 —— 再有一点波动就 OOM，实机上这条线之后基本要动切法了；
       >100% 顶出去 —— 这一刻真的放不下。 */
    level: over > 0 ? 'oom' : (r >= CAP_RED ? 'red' : (r >= CAP_AMBER ? 'amber' : 'ok')),
    why: why, segs: segs
  };
}
/* 全网聚合一遍容量判定：宿主（rank-topology-lite 集群总览那一档）要一句
   「⚠ 128/4000 卡超容量」，逐卡判定复用 capVerdict——跟悬停提示、选中详情卡
   同一处口径，不为总览另起一份容易跟正式判定读数对不上的近似算法。
   顺手记一下 ratio 最高的那张卡：总览角标点开就直接下钻到它，不用先经过
   「随便选一张再看是不是这张最惨」。 */
function ptoClusterBrief(){
  var D = derive(cfg);
  if(!D.ok) return null;
  var n = {ok:0, amber:0, red:0, oom:0}, worst = null, worstRatio = -1;
  for(var r=0; r<D.world; r++){
    var co = coordsOf(r, D);
    var V = capVerdict(D, co.p, r);
    n[V.level]++;
    if(V.ratio > worstRatio){ worstRatio = V.ratio; worst = r; }
  }
  return { world:D.world, hbm:D.hbm, n:n, worst:worst };
}
/* 本刀对「每卡容量」的贡献：把这一维设回 1，看同一张卡会装多少。

   这就是 A3「加 DP 不买余量」的现场证明，而不是一句口号。 */
function memWithoutKnife(D, dim, ppRank){
  var D2 = {}, k;

  else if(dim==='ep') D2.ep = 1;
  else if(dim==='cp') D2.cp = 1;

function holdRows(g,D){
  var co = coordsOf(g,D), l0 = co.p*D.layersPerStage, l1 = (co.p+1)*D.layersPerStage-1, rows=[];
  rows.push(['五元组区间','<small>'+esc(quintRow(g,D))+'</small>（§03·可逆）']);
  rows.push(['持有占比','<small>ℓ '+D.layersPerStage+'/'+D.layers+' · h '+fmt(Math.floor(D.hidden/D.tp))+'/'+fmt(D.hidden)
    +(D.moe?' · e '+(D.experts/D.ep)+'/'+D.experts:'')+' · b '+(D.mbs*D.ga)+'/'+fmt(D.gbs)
    +' · s '+(D.cp>1?fmt(D.seq/D.cp)+'/'+fmt(D.seq):'全部')+'</small>——卡=各维区间的<b>交集</b>，不是小整网']);
  rows.push(['层段','L'+l0+'–L'+l1+'（'+D.layersPerStage+' 层 / stage '+co.p+'）']);
  /* 逐算子形状：左边补一枚**与显存读出卡同一套**的色块（按切它那把刀着色，
     cutColor 就是那张卡里权重带内部用的同一个函数）。反馈：「显示形式和着色
     要跟那张卡统一」——同一份东西在两张卡上是同一个颜色，读者才不用记两套。 */
  opBytes(D).forEach(function(o){
    if(!(o.b || o.id==='attn.core')) return;
    rows.push(['<span style="display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:middle;background:'
      + (o.b ? cutColor(o.cut) : 'transparent') + ';border:1px solid ' + cutColor(o.cut) + '"></span>' + esc(o.id),
      '<code>'+esc(o.shape)+'</code>']);
  });
  if(D.moe){
    var me = epOf(co.t,co.c,co.d,D), kE = D.experts/D.ep, e0 = me.ep*kE;
    rows.push(['专家桶','E'+e0+'–E'+(e0+kE-1)+'（ep_rank '+me.ep+'）']);
  }
  if(co.p===0) rows.push(['embedding','<code>['+fmt(Math.ceil(D.vocab/D.tp))+', '+fmt(D.hidden)+']</code>（仅 stage 0）']);
  if(co.p===D.pp-1) rows.push(['lm_head','<code>['+fmt(D.hidden)+', '+fmt(Math.ceil(D.vocab/D.tp))+']</code>（仅末 stage）']);
  var a = '<code>['+D.mbs+', '+fmt(D.seq/D.cp)+', '+fmt(D.hidden)+']</code>';
  if(D.cp>1) a += '<br><small>CP 双段：#'+co.c+' 与 #'+(2*D.cp-1-co.c)+'（V5）</small>';
  rows.push(['激活/μbatch', a]);
  return rows;
}

/* ═════════ 1F1B 合成调度（FR-7） ═════════ */
function schedule(D){
  var PP=D.pp, GA=Math.min(D.ga,8), F=1, B=2, truncated=D.ga>GA;
  var order=[],s,m;
  for(s=0;s<PP;s++){
    var w=Math.min(GA,PP-1-s), ops=[];
    for(m=0;m<w;m++) ops.push({t:'F',m:m});
    var fi=w, bi=0;
    while(fi<GA || bi<GA){ if(fi<GA) ops.push({t:'F',m:fi++}); if(bi<GA) ops.push({t:'B',m:bi++}); }
    order.push(ops);
  }
  var fEnd=[],bEnd=[],blocks=[],clock=[];
  for(s=0;s<PP;s++){ fEnd.push({}); bEnd.push({}); clock.push(0); }
  var ptr=order.map(function(){return 0;}), guard=PP*GA*4+8, prog=true;
  while(prog && guard-->0){
    prog=false;
    for(s=0;s<PP;s++){
      while(ptr[s]<order[s].length){
        var op=order[s][ptr[s]], dep=0, durn=op.t==='F'?F:B;
        if(op.t==='F'){ if(s>0){ if(fEnd[s-1][op.m]===undefined) break; dep=fEnd[s-1][op.m]; } }
        else{
          if(fEnd[s][op.m]===undefined) break;
          dep=fEnd[s][op.m];
          if(s<PP-1){ if(bEnd[s+1][op.m]===undefined) break; dep=Math.max(dep,bEnd[s+1][op.m]); }
        }
        var t0=Math.max(clock[s],dep), t1=t0+durn;
        blocks.push({s:s,m:op.m,type:op.t,t0:t0,t1:t1,recv:(op.t==='F'&&s>0)||(op.t==='B'&&s<PP-1)});
        clock[s]=t1;
        if(op.t==='F') fEnd[s][op.m]=t1; else bEnd[s][op.m]=t1;
        ptr[s]++; prog=true;
      }
    }
  }
  var T=0;
  for(s=0;s<PP;s++){ blocks.push({s:s,type:'AR',t0:clock[s],t1:clock[s]+1.4}); T=Math.max(T,clock[s]+1.4); }
  return {blocks:blocks,T:T,GA:GA,truncated:truncated};
}


/* 通信九层里那几层「不跨卡」的画法，曾经是四块自带边框的浮动小面板
   （路由 / 时序 / 影响 / rank 内），由各视图摆在选中卡旁边。整段删掉了：
   反馈原话是「不希望是一个一个卡片，我希望这个关系是真真正正发生在每一个图里
   的图元之间的，不是增加一个卡片，和现在的连线一样真正在图中」。
   现在这四层各自落在真图元上——
     · 路由 → EP 那几条边逐条按 token 数给宽度，数字标在对端卡上；
     · 时序 / 影响 → 写在**这条边自己**的芯片上（何时 / 代价），边宽随耗时；
     · rank 内 → 沿选中卡自己的那一叠层（层构成）或五档色带（显存占用）连线。
   一步里 F/B/AllReduce 的排布仍然是「时间·流」那一屏的事，九格里那两格点得过去。 */


/* ═════════ 线型语义（§8）：由原语决定，与维度无关 ═════════ */
function edgeSVG(pts, prim, color, opts){
  opts = opts || {};
  var w = opts.w || 2, out='', i, j, n = pts.length, mid = opts.mid || 'x';
  /* alltoall 那一支原来把线宽写死（0.7–1.8 的伪随机），opts.w 传进来就用它：
     路由那一档要靠**条宽**表达「这条边分到多少 token」，宽度不能是装饰。 */
  if(n<2) return '<g></g>';
  function line(a,b,st){ return '<line x1="'+a[0].toFixed(1)+'" y1="'+a[1].toFixed(1)+'" x2="'+b[0].toFixed(1)+'" y2="'+b[1].toFixed(1)+'" style="'+st+'"/>'; }
  if(prim==='p2p'){
    for(i=0;i<n-1;i++) out += line(pts[i],pts[i+1],'stroke:'+color+';stroke-width:'+w+';marker-end:url(#arr'+mid+')');
    if(opts.ring!==false && n>2) out += line(pts[n-1],pts[0],'stroke:'+color+';stroke-width:'+w+';stroke-opacity:.5;marker-end:url(#arr'+mid+')');
  }else if(prim==='allreduce'){
    out += '<polygon points="'+ptsStr(pts)+'" style="fill:none;stroke:'+color+';stroke-width:'+(w+0.6)+';stroke-linejoin:round"/>';
  }else if(prim==='allgather'||prim==='reducescatter'){
    var dash = prim==='allgather'?'7 4':'2 5';
    out += '<polygon points="'+ptsStr(pts)+'" style="fill:none;stroke:'+color+';stroke-width:'+w+';stroke-dasharray:'+dash+';stroke-linejoin:round"/>';
    pts.forEach(function(p){
      out += prim==='allgather'
        ? '<rect x="'+(p[0]-3)+'" y="'+(p[1]-3)+'" width="6" height="6" style="fill:var(--pt-s1);stroke:'+color+';stroke-width:1.4"/>'
        : '<rect x="'+(p[0]-3)+'" y="'+(p[1]-3)+'" width="6" height="6" transform="rotate(45 '+p[0]+' '+p[1]+')" style="fill:'+color+'"/>';
    });
  }else if(prim==='alltoall'){
    /* opts.hub 给了就只画**本卡与组内每一张**的那几根（星形），不画全网格。
       8 张卡的全网格是 28 条对角长线，横竖交叉铺满半屏——那是「这一组内部
       一共有多少条边」的画法；而点开一张卡时问的是「这一张跟谁来往」，星形
       正好是那个答案，还省下四分之三的线。两种画法说的是同一件事的两个问题，
       没给 hub（组一级的概览）时仍旧是全网格。 */
    if(opts.hub != null && opts.hub >= 0 && opts.hub < n){
      for(i=0;i<n;i++){
        if(i === opts.hub) continue;
        out += line(pts[opts.hub],pts[i],'stroke:'+color+';stroke-width:'+(opts.w || 1.05)+';stroke-opacity:.8;stroke-linecap:round');
      }
    }else{
      for(i=0;i<n;i++) for(j=i+1;j<n;j++){
        var lw = 0.7 + ((i*7+j*13)%3)*0.55;
        out += line(pts[i],pts[j],'stroke:'+color+';stroke-width:'+lw.toFixed(2)+';stroke-opacity:.72');
      }
    }
  }
  /* 这一层（卡对卡的**组拓扑**）刻意不加流动虚线，和别处的通信线不一样：
     它的每一根都横跨整屏（allreduce 是一只 16 边形、alltoall 是几十条对角长线），
     一条线的重绘区域就等于整张图，实测在物理平铺 + 选中卡那一档，35 条这样的
     线把帧间隔从 16.7ms 顶到 83ms（12fps）——而同样条数的短线（侧视 192 条、
     正视 80 条）一点代价都没有。「它是活的」这层修饰不值一次可感的掉帧；
     这一层要回答的本来也是「一共连了几张卡、连成什么形状」，形状是静态的。
     真正需要「往哪边搬」的是锚在算子上的那几条线，那一层已经有了。 */
  return '<g>'+out+'</g>';
}
function defsSVG(){

/* 一只 3D 盒（三可见面）；cls 面用 token 类，动态描边走 style */

      out9 += '<polygon points="'+ptsStr([P9[fc.i[0]],P9[fc.i[1]],P9[fc.i[2]],P9[fc.i[3]]])+'" style="fill:'+c9+';'+st+'"/>';
    });
    return '<g'+(o.attrs||'')+(o.opacity != null && o.opacity < 1 ? ' opacity="'+o.opacity+'"' : '')+'>' + out9 + '</g>';
  }
  if(o.wire){ /* 容器线框：只画棱 */
    var p8 = [proj(x,y,z,s),proj(x+w,y,z,s),proj(x+w,y,z+d,s),proj(x,y,z+d,s),proj(x,y+h,z,s),proj(x+w,y+h,z,s),proj(x+w,y+h,z+d,s),proj(x,y+h,z+d,s)];
    var E = [[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]];
    return '<g'+(o.attrs||'')+'>'+E.map(function(e){
      return '<line x1="'+p8[e[0]][0].toFixed(1)+'" y1="'+p8[e[0]][1].toFixed(1)+'" x2="'+p8[e[1]][0].toFixed(1)+'" y2="'+p8[e[1]][1].toFixed(1)+'" style="'+st+(o.dash?';stroke-dasharray:'+o.dash:'')+'"/>';
    }).join('')+'</g>';
  }
  return '<g'+(o.attrs||'')+' '+(o.gstyle?'style="'+o.gstyle+'"':'')+'>'
    + '<polygon class="f1" points="'+ptsStr(f.top)+'" style="'+st+(o.topFill?';fill:'+o.topFill:'')+'"/>'
    + '<polygon class="f2" points="'+ptsStr(f.left)+'" style="'+st.replace(/stroke-width:[\d.]+/,'stroke-width:'+((o.sw||1)*0.8))+'"/>'
    + '<polygon class="f3" points="'+ptsStr(f.right)+'" style="'+st.replace(/stroke-width:[\d.]+/,'stroke-width:'+((o.sw||1)*0.8))+'"/>'
    + (o.inner||'') + '</g>';
}
/* 画布上的解释性文字统一走这一枚：只留短名 + ⓘ，整句进 <title>。
   反馈是「页面上很多解释文字，只留标题加正文，解释收进 hover」——SVG 的
   <text> 本来就带 <title> 子元素的原生悬停，不必另搭一套 tooltip；
   ⓘ 要留着，否则「这里有东西可看」这件事在画面上就没有记号了。 */
function txtI(x,y,short9,tip9,size,fillVar,anchor,extra){
  return '<text x="'+(+x).toFixed(1)+'" y="'+(+y).toFixed(1)+'" text-anchor="'+(anchor||'middle')+'" font-size="'+size+'" '
    + 'font-family="var(--pt-mono)" style="fill:'+(fillVar||'var(--pt-fg3)')+';cursor:help" pointer-events="all" '+(extra||'')+'>'
    + short9 + ' <tspan style="opacity:.55">ⓘ</tspan><title>'+esc(tip9)+'</title></text>';
}
function txt(x,y,t,size,fillVar,anchor,extra){
  return '<text x="'+(+x).toFixed(1)+'" y="'+(+y).toFixed(1)+'" text-anchor="'+(anchor||'middle')+'" font-size="'+size+'" font-family="var(--pt-mono)" style="fill:'+(fillVar||'var(--pt-fg2)')+'" '+(extra||'')+'>'+t+'</text>';
}

/* ═════════ 单维切分（模板 = 参照系最后一张总图）═════════
   粒度做竖轴：输入 → 整网 → 层 → 算子 → kernel；rank 柱（虚线容器）贯穿全高。
   块的横跨范围 = 共有关系；kernel 永不跨柱；通信画在对应粒度层的柱间。
   五个维共用同一模板——只有「归属边界线的位置」与「片的着色」在变（§02/§03/§07/§15）。 */
var GY = {ker:0, op:3.4, lay:6.8, net:10.2, inp:14.4};   /* 输入与粒度链之间留缝：它是另一个对象，不在包含链里 */
function quintRow(g, D){ /* 索引五元组：这张卡的 rank 元组 ⇢ 五根轴上的区间（§03，双链可逆 §07） */
  var co = coordsOf(g, D), l0 = co.p*D.layersPerStage;
  var hK = Math.floor(D.hidden/D.tp);
  var parts = ['ℓ∈[L'+l0+',L'+((co.p+1)*D.layersPerStage-1)+']', 'h∈['+fmt(co.t*hK)+','+fmt((co.t+1)*hK)+')'];
  if(D.moe){ var me = epOf(co.t,co.c,co.d,D), kE = D.experts/D.ep; parts.push('e∈[E'+(me.ep*kE)+',E'+((me.ep+1)*kE-1)+']'); }
  else parts.push('e=—');
  parts.push('b=副本'+co.d+'的 '+(D.mbs*D.ga)+' 样本', 's=段'+co.c+'∪段'+(2*D.cp-1-co.c));
  return parts.join(' · ');
}
function S0(){ return (sel!==null && sel<9999999) ? sel : 0; }
/* 算子名收短：真图里的名字是「Q Up Linear」「Sparse FlashAttention」「Down Projection」
   这种带类别后缀的全称，横排 35 个时后缀占掉一半宽度却不带信息（这一行里**全是**
   Linear/Projection）。去掉共有的后缀与前缀，剩下的才是把它跟邻居区分开的那部分；
   全名在悬停里一个字不少。 */
function shortOp9(s){
  return String(s)
    .replace(/\s*(Linear|Projection|Proj|Layer|Block|Module)$/i, '')
    .replace(/^(Sparse|Dense)\s+/i, '')
    .replace(/\s{2,}/g, ' ')
    .trim() || String(s);
}

function renderDim(D){
  var dim = ui.cutDim;
  var size = {tp:D.tp, pp:D.pp, cp:D.cp, dp:D.dp, ep:D.ep}[dim];
  var col = VC[dim];

  /* 该维没切开：给说明与一键预置，不硬画（DP-5） */
  if(size <= 1 || (dim==='ep' && !D.moe)){
    var fix = dim==='cp' ? {id:'longcp', label:'载入「长序列 CP」预置'} : {id:'default128', label:'载入默认 128 卡（含 EP8）'};
    $('stage').innerHTML = '<div class="pt-blocked"><div><b style="color:'+col+'">'+DIMN[dim]+' = '+size+'</b><br>'
      + '<span style="font-size:12.5px">当前配置里这一维没有发生切分——没有片、没有组内通信,也就没有可画的关系(宁缺毋误)。</span><br>'
      + '<button class="pb" data-act="preset" data-id="'+fix.id+'">'+fix.label+'</button></div></div>';
    renderDimBar(D, dim);
    $('stageNote').hidden = true; $('detach').hidden = true;
    return;
  }

  /* ═══ 布局：与刀序·切分链同一套平面语法（等距投影撑不住 16+ 份，会剪成一条斜带） ═══
     · 内容总宽 MW 恒定 ⇒ 切成几份就每份 MW/size：切得越多每份越小（面积守恒）
     · 卡行在最下，一格一份，**竖直对齐**就是映射——不用画落线，对齐本身在说话
     · 一格不是一张卡：ghost 退叠 + 标 world/size 的真实张数，全量在图上可数
     · 份数超 LIM 时余下画成按比例的压缩带（宽度=tail·slot），不是"+N 柱相同"那种省略 */
  var X0 = 172, MW = 652, RL = X0+MW+14;          /* 左标尺 / 内容带 / 右判词 */
  var R = {inp:46, net:126, lay:192, op:272, ker:348, card:398};
  var HR = {inp:30, net:30, lay:30, op:34, ker:20, card:60};
  var H = 512;
  /* 全量：不设上限——份数多到画不下时降级的是**标注**，不是份数本身。
     压缩带因此不再出现（tail 恒 0），代码留着是为了万一以后又要给上限。 */
  var N = size, tail = 0;
  var slot = MW / size, gap = Math.min(2, slot*.09);
  var groupsPer = Math.round(D.world/size);
  var kE = D.moe ? D.experts/D.ep : 0;
  var groups = Math.round(D.world/size);
  var parts = [], inter = [], colBack = [], opHit = [];  /* colBack：容器柱（垫底）· inter：吃事件的透明命中层 */
  /* opHit 单独一层、压在 inter 之上：算子行的悬停说明必须盖过贯穿全高的容器柱，
     否则柱子（DOM 里在后）把事件全接走，写在 <title> 里的全名一个也弹不出来。
     柱身其余高度照常可点，选卡不受影响。 */
  function rect(x,y,w,h,fill,stroke,sw,extra){
    return '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+Math.max(.6,w).toFixed(1)+'" height="'+h.toFixed(1)
      + '" style="fill:'+fill+';stroke:'+(stroke||'var(--pt-bds)')+';stroke-width:'+(sw===undefined?.8:sw)+'" '+(extra||'')+'/>';
  }
  /* ── 立体：斜投影（cabinet），深度只产生一个固定偏移向量 (D,-E)。
     关键是 **X 不受深度影响**——等距投影里 screenX=(x−z) 会把 16 份柱列剪成一条斜带，
     斜投影不会：份还是并排的，面积守恒照旧，同时块有了体积（内容=实心体，§15）。 ── */
  var D3 = 11, E3 = 6.5;
  function slab(x,y,w,h,fill,stroke,sw,extra){
    var st = stroke||'var(--pt-bds)', sww = (sw===undefined?.8:sw), ex = extra||'';
    var side = (x+w)+','+y+' '+(x+w+D3)+','+(y-E3)+' '+(x+w+D3)+','+(y+h-E3)+' '+(x+w)+','+(y+h);
    var top  = x+','+y+' '+(x+w)+','+y+' '+(x+w+D3)+','+(y-E3)+' '+(x+D3)+','+(y-E3);
    return '<polygon points="'+side+'" style="fill:'+fill+';stroke:'+st+';stroke-width:'+(sww*.7)+'" '+ex+'/>'
      + '<polygon points="'+side+'" style="fill:rgba(0,0,0,.16);stroke:none" '+ex+'/>'
      + '<polygon points="'+top+'" style="fill:'+fill+';stroke:'+st+';stroke-width:'+(sww*.7)+'" '+ex+'/>'
      + '<polygon points="'+top+'" style="fill:rgba(255,255,255,.34);stroke:none" '+ex+'/>'
      + rect(x, y, w, h, fill, st, sww, ex);
  }
  /* 线框盒（容器/父块外框）：只有棱，没有面——容器无厚度、不抢内容的视觉重量 */
  function wire3(x,y,w,h,stroke,sw,extra){
    var ex = extra||'', s = 'stroke:'+stroke+';stroke-width:'+sw+';fill:none';
    return rect(x, y, w, h, 'none', stroke, sw, ex)
      + '<polyline points="'+x+','+y+' '+(x+D3)+','+(y-E3)+' '+(x+w+D3)+','+(y-E3)+' '+(x+w)+','+y+'" style="'+s+'" '+ex+'/>'
      + '<line x1="'+(x+w+D3)+'" y1="'+(y-E3)+'" x2="'+(x+w+D3)+'" y2="'+(y+h-E3)+'" style="'+s+'" '+ex+'/>'
      + '<line x1="'+(x+w)+'" y1="'+(y+h)+'" x2="'+(x+w+D3)+'" y2="'+(y+h-E3)+'" style="'+s+'" '+ex+'/>';
  }
  function sx(i){ return X0 + i*slot; }                       /* 第 i 份的左边 */
  function scx(i){ return X0 + i*slot + slot/2; }             /* 第 i 份的中心 */
  var wide = slot > 30;                                       /* 够宽才逐格标注 */
  var cardTier = slot > 68 ? 2 : slot > 34 ? 1 : 0;           /* 卡格标注档位：全 / 序号+容量 / 只序号 */
  /* 右侧判词 */
  /* 这一屏每一档右边都是「一行主 + 一行解释」。解释一律收进悬停（主行后面缀
     一枚 ⓘ）——反馈：「外面的解释性文字还是有点多，只留标题加正文」。 */
  function say(y, main, sub){
    if(sub) parts.push(txtI(RL, y, main, sub, 9, col, 'start', 'font-weight="700"'));
    else parts.push(txt(RL, y, main, 9, col, 'start', 'font-weight="700"'));
  }
  /* 共有：一整块横跨全宽 —— 谁都没切它 */
  function spanLane(y, h, label, sub, tint){
    parts.push(slab(X0, y, MW, h, tint||mix('var(--pt-fg2)',16), 'var(--pt-bds)', .8));
    say(y+h/2-2, label, sub);
  }
  /* 真切：外框跨满（合起来=那一个）+ size 份紧贴（每份 1/size） */
  function cutLane(y, h, tintOf, labelOf){
    parts.push(wire3(X0, y, MW, h, col, 1.1));
    for(var j=0;j<N;j++){
      parts.push(slab(sx(j)+gap/2, y+1.5, slot-gap, h-3, tintOf(j), 'transparent', 0, 'pointer-events="none"'));
      var l = labelOf ? labelOf(j) : '';
      if(l && wide) parts.push(txt(scx(j), y+h/2+3, l, 7.4, 'var(--pt-fg)', 'middle', 'pointer-events="none"'));
    }
    if(tail>0) tailBand(y, h, tintOf(N-1));
  }
  /* 压缩带：宽度就是 tail·slot（真实占比），不省面积、只省标注 */
  function tailBand(y, h, tint){
    var x0 = sx(N), w = X0+MW-x0;
    parts.push(slab(x0+gap/2, y+1.5, w-gap, h-3, tint, 'transparent', 0, 'opacity=".45" pointer-events="none"'));
    if(w > 34) parts.push(txt(x0+w/2, y+h/2+3, '+'+tail+' 份', 7.4, 'var(--pt-fg2)', 'middle', 'font-weight="700" pointer-events="none"'));
  }
  /* 复印：各自成框、等大 —— 不是变小（DP 在模型侧的动作） */
  function copyLane(y, h, tint, label){
    for(var j=0;j<N;j++){
      parts.push(slab(sx(j)+gap/2, y, slot-gap, h, tint, 'var(--pt-bds)', .8, 'pointer-events="none"'));
      if(wide && j===0 && label) parts.push(txt(scx(j), y+h/2+3, label, 7.4, 'var(--pt-fg)', 'middle', 'pointer-events="none"'));
      if(j<N-1 && slot>16) parts.push(txt(sx(j+1), y+h/2+4, '≡', Math.min(13, slot*.4), col, 'middle', 'font-weight="800" pointer-events="none"'));
    }
    if(tail>0){
      var x0 = sx(N), w = X0+MW-x0;
      parts.push(slab(x0+gap/2, y, w-gap, h, tint, 'var(--pt-bds)', .6, 'opacity=".5" pointer-events="none"'));
      if(w > 34) parts.push(txt(x0+w/2, y+h/2+3, '+'+tail+' 份', 7.4, 'var(--pt-fg2)', 'middle', 'font-weight="700" pointer-events="none"'));
    }
  }

  /* 每份的代表卡（其余维取 0；EP 走折叠平面反解） */
  var colRanks = [];
  for(var i0=0;i0<N;i0++){
    if(dim==='tp') colRanks.push(rankOf(i0,0,0,0,D));
    else if(dim==='cp') colRanks.push(rankOf(0,i0,0,0,D));
    else if(dim==='dp') colRanks.push(rankOf(0,0,i0,0,D));
    else if(dim==='pp') colRanks.push(rankOf(0,0,0,i0,D));
  }
  if(dim==='ep') colRanks = epMembers(rankOf(0,0,0,0,D), D).slice(0,N);

  /* ── 包含链的样本层：整网⊃层⊃算子⊃kernel 不是四样东西，是同一份内容的
     逐级放大——光在左侧标尺写「⊃」是**说**，不是**画**。这里选定一层（L·li）
     当样本，让放大真的发生两跳：层→算子（⊕ 锥张开到整行）、算子→kernel
     （⊕ 锥收进选中那张卡的柱里）。锥落在柱里那一下就是两条线的交点：
     内容的包含链到 kernel 为止，落位的容器（卡）从 kernel 接手。
     选哪层：MoE 模型选换挡后的第一层（算子最全，EP 那一刀也在场），
     稠密模型选 L0。lps 覆盖不到时退回段首。 */
  var Lc = D.layers, lpsC = D.layersPerStage;
  var denseTopC = D.moe ? Math.min(2, Lc) : Lc;
  var laySpanN = D.pp > 1 ? lpsC : Lc;               /* 层那一行代表的层数（stage0 段或全部） */
  var liHi = (D.moe && denseTopC < laySpanN) ? denseTopC : 0;
  /* 整网行的真图刻度：L 层逐层画出来，Dense 段与 MoE 段异色、两头是入口/出口——
     和 3D 场景「层与层不一样」的那套事实同一口径，整网不再是一块无内容的灰板。 */
  function netTicks(x0, w, y, h, mark){
    var cap = Math.min(9, w*0.03), pad = 1.6, iw = (w - cap*2 - pad*2)/Lc;
    parts.push(rect(x0, y+3, cap, h-6, mix('var(--pt-fg2)',34), 'var(--pt-bds)', .6, 'pointer-events="none"'));
    parts.push(rect(x0+w-cap, y+3, cap, h-6, mix('var(--pt-fg2)',34), 'var(--pt-bds)', .6, 'pointer-events="none"'));
    if(cap > 7){
      parts.push(txt(x0+cap/2, y+h+8, '入口', 6.2, 'var(--pt-fg2)', 'middle', 'pointer-events="none"'));
      parts.push(txt(x0+w-cap/2, y+h+8, '出口', 6.2, 'var(--pt-fg2)', 'middle', 'pointer-events="none"'));
    }
    for(var t9 = 0; t9 < Lc; t9++){
      var tx = x0 + cap + pad + t9*iw;
      var tc = t9 < denseTopC ? mix(VC.tp, 34) : (D.moe ? mix(VC.ep, 30) : mix('var(--pt-fg2)',22));
      parts.push(rect(tx, y+5, Math.max(.5, iw*.78), h-10, tc, 'transparent', 0, 'pointer-events="none"'));
    }
    if(mark){
      var mx = x0 + cap + pad + liHi*iw - .8;
      parts.push(rect(mx, y+2.5, Math.max(1.4, iw*.78)+1.6, h-5, 'none', 'var(--pt-fg)', 1.3, 'pointer-events="none"'));
      return [mx, Math.max(1.4, iw*.78)+1.6];
    }
    return null;
  }
  var netMark = null, layMark = null;

  /* ── 输入②（激活体的入口）：另一个对象，虚线圈出、不在包含链上 ── */
  if(dim==='cp'){
    /* CP 的动词=切一条序列：2·CP 段 + 首尾配对弧（因果均衡） */
    var segN = 2*size, segW = MW/segN;
    parts.push(wire3(X0, R.inp, MW, HR.inp, col, 1.1));
    for(var sg=0;sg<segN;sg++){
      var ownerC = sg<size ? sg : 2*size-1-sg;
      parts.push(slab(X0+sg*segW+.6, R.inp+1.5, segW-1.2, HR.inp-3, mix(col, 14+Math.round(ownerC/(size-1||1)*40)), 'transparent', 0, 'pointer-events="none"'));
      if(segW>22) parts.push(txt(X0+sg*segW+segW/2, R.inp+HR.inp/2+3, '段'+sg, 7.2, 'var(--pt-fg2)', 'middle', 'pointer-events="none"'));
    }
    for(var pc=0;pc<N;pc++){
      var aX = X0+pc*segW+segW/2, bX = X0+(2*size-1-pc)*segW+segW/2, hArc = 10+pc*5;
      parts.push('<path d="M'+aX+' '+(R.inp-2)+' C '+aX+' '+(R.inp-2-hArc)+', '+bX+' '+(R.inp-2-hArc)+', '+bX+' '+(R.inp-2)+'" style="fill:none;stroke:'+mix(col,70)+';stroke-width:1.1"/>');
    }
    say(R.inp+HR.inp/2-2, '序列 → 2·CP='+segN+' 段；c 拿 段c ∪ 段'+(2*size-1)+'−c',
        '每段 '+fmt(D.seq/segN)+' token · 合起来=1 条');
  }
  else if(dim==='dp'){
    cutLane(R.inp, HR.inp, function(j){ return mix(col, 18+Math.round(j/(N-1||1)*34)); }, function(j){ return 'b份'+j; });
    say(R.inp+HR.inp/2-2, '全局批真切 ×DP='+size+'（每份 '+(D.mbs*D.ga)+' 样本）',
        '外框=GBS '+fmt(D.gbs)+' · 每份 1/'+size);
  }
  else{
    var inpCut = [];
    if(D.dp>1) inpCut.push('b 已被 DP 切（本组见 dp0）');
    if(D.cp>1) inpCut.push('s 已被 CP 切（cp0）');
    spanLane(R.inp, HR.inp, '输入 — 本维不切输入',
      inpCut.length?inpCut.join(' · '):(dim==='tp'?'TP 切权重体的 h 轴':dim==='pp'?'PP 切层序 ℓ 轴':'EP 重分组专家 e 轴'));
  }
  parts.push(rect(X0-6, R.inp-6, MW+12, HR.inp+12, 'none', 'var(--pt-fg3)', .8, 'stroke-dasharray="5 4" pointer-events="none"'));

  /* ── 整网 ── */
  if(dim==='dp'){
    copyLane(R.net, HR.net, mix('var(--pt-fg2)',18), null);
    /* 复印件逐份画真图刻度：等大不是一句话，是每份里同样的 L 层排布 */
    for(var nc9 = 0; nc9 < N; nc9++)
      netMark = netTicks(sx(nc9)+gap/2+1, slot-gap-2, R.net+2, HR.net-4, nc9===0) || netMark;
    say(R.net+HR.net/2-2, '整网 — 复印 ×'+size+'（每份=原尺寸）',
        '同一把刀：输入变小 · 模型等大（A3）');
  }
  else{
    spanLane(R.net, HR.net, '整网 — 逻辑上一张，不属于任何格', '本组是 '+fmt(groups)+' 个同构组之一');
    netMark = netTicks(X0+2, MW-4, R.net+1, HR.net-2, true);
  }

  /* ── 层 ── */
  if(dim==='pp'){
    var rise = Math.min(9, 26/size);
    parts.push(wire3(X0, R.lay, MW, HR.lay, col, 1.1));
    for(var jp=0;jp<N;jp++){
      var yj = R.lay + jp*rise;
      parts.push(slab(sx(jp)+gap/2, yj, slot-gap, HR.lay-rise*.6, mix(col, 26+Math.round(jp/(N-1||1)*30)), 'var(--pt-bds)', .7, 'pointer-events="none"'));
      if(wide) parts.push(txt(scx(jp), yj+13, 'stage'+jp, 7.4, 'var(--pt-fg)', 'middle', 'font-weight="700" pointer-events="none"'));
      if(wide) parts.push(txt(scx(jp), yj+22, 'L'+(jp*D.layersPerStage)+'–L'+((jp+1)*D.layersPerStage-1), 6.8, 'var(--pt-fg2)', 'middle', 'pointer-events="none"'));
      if(jp<N-1){
        parts.push('<path d="M'+(sx(jp+1)-1)+' '+(yj+6)+' l 7 0 l -3 4 z" style="fill:'+col+'" pointer-events="none"/>');
        parts.push('<path d="M'+(sx(jp+1)+7)+' '+(yj+HR.lay-8)+' l -7 0 l 3 -4 z" style="fill:'+mix(col,55)+'" pointer-events="none"/>');
      }
    }
    if(tail>0) tailBand(R.lay+(N-1)*rise, HR.lay-rise*.6, mix(col,52));
    say(R.lay+HR.lay/2-2, '层 — 真切 ×PP='+size+'：段合起来=1 份整网',
        '升阶=有序 · ▸F 上行 · 淡▸B 下行');
  }
  else if(dim==='dp'){
    copyLane(R.lay, HR.lay, mix('var(--pt-fg2)',18), null);
    say(R.lay+HR.lay/2-2, '层 — 同一份，逐字节相同（≡）', '复制≠共有：容器纹丝不动（§08）');
  }
  else if(D.pp>1) spanLane(R.lay, HR.lay, '层 — 本组只持 stage0：L0–L'+(D.layersPerStage-1), 'ℓ 已被 PP 切——那是 PP 干的，不是本维', mix(VC.pp,10));
  else spanLane(R.lay, HR.lay, dim==='ep'?'层 — MoE 层在每个 stage 里':'层 — 不切 ℓ，每格都过全部层');

  /* ── 层行上的样本层：同一层在整网行与层行各有位置，细线连起来——
     这一跳是**同宽重读**（分层），不是放大；放大从下一跳才开始。 */
  (function(){
    var lx, lw;
    if(dim==='pp'){
      var j9 = Math.min(N-1, Math.floor(liHi/lpsC)), rise9 = Math.min(9, 26/size);
      lw = (slot-gap)/lpsC;
      lx = sx(j9)+gap/2 + ((liHi - j9*lpsC)/lpsC)*(slot-gap);
      layMark = [lx, Math.max(1.4, lw), R.lay + j9*rise9, HR.lay - rise9*.6];
    }else if(dim==='dp'){
      lw = (slot-gap)/Lc;
      lx = sx(0)+gap/2 + (liHi/Lc)*(slot-gap);
      layMark = [lx, Math.max(1.4, lw), R.lay, HR.lay];
    }else{
      lw = MW/laySpanN;
      lx = X0 + (liHi/laySpanN)*MW;
      layMark = [lx, Math.max(1.4, lw), R.lay, HR.lay];
    }
    parts.push(rect(layMark[0], layMark[2], layMark[1], layMark[3], mix('var(--pt-fg)',7), 'var(--pt-fg)', 1.3, 'pointer-events="none"'));
    parts.push(txt(layMark[0]+layMark[1]/2, layMark[2]-3, 'L'+liHi, 6.8, 'var(--pt-fg)', 'middle', 'font-weight="800" pointer-events="none"'));
    if(netMark) parts.push('<line x1="'+(netMark[0]+netMark[1]/2)+'" y1="'+(R.net+HR.net-2)+'" x2="'+(layMark[0]+layMark[1]/2)+'" y2="'+(layMark[2]+1)
      +'" style="stroke:var(--pt-fg3);stroke-width:.9" pointer-events="none"/>');
  })();

  /* ── 算子（真算子序列，宽∝每卡字节；被本维切的画成 size 片） ── */
  var opPos = {};
  var co0 = (function(){ var c = coordsOf(Math.min(S0(), D.world-1), D);
    return {tp:c.t, cp:c.c, dp:c.d, pp:c.p, ep:(D.moe?epOf(c.t,c.c,c.d,D).ep:0)}[dim] || 0; })();
  function opLane(cutKind){
    /* 优先用真整网的算子（35 个真节点 + 手工标注的切法/轴/原因），拿不到才退回内置示意口径。
       宽度口径两者不同：真数据按类别权重（真图无 shape），内置按每卡字节——图上分别标明。 */
    var rops = realOps(D, (sel!==null && sel<D.world) ? sel : 0), useReal = !!rops, ops, sh;
    if(useReal){
      ops = rops.filter(function(o){ return !o.comm; });        /* 通信算子是动作，另画成线 */
      sh = ops.map(function(o){ return o.w; });
    }else{
      ops = opBytes(D).filter(function(o){ return o.b>0 || o.id==='attn.core'; });
      var totB = ops.reduce(function(a,o){ return a+o.b; }, 0);
      sh = ops.map(function(o){ return clamp(o.b, totB*.07, totB*.30); });
    }
    opLane.real = useReal; opLane.commOps = useReal ? rops.filter(function(o){ return o.comm; }) : [];
    opLane.lastX = [-1e9, -1e9];   /* 两行标签各自的右边界，逐个排开、装不下就不写 */
    var shT = sh.reduce(function(a,x){ return a+x; }, 0);
    var og = 2, usable = MW - og*(ops.length-1), x = X0;
    ops.forEach(function(o, oi){
      var w = usable*sh[oi]/shT;
      opPos[o.id] = {x:x, w:w};
      var isCut = cutKind && (o.cut===cutKind || (cutKind==='tp' && o.cut==='sp'));
      var pieces = (useReal && o.total) ? o.total : size;      /* 真标注带 total：片数用真的 */
      if(!useReal && o.b===0) parts.push(wire3(x, R.op+6, w, HR.op-12, 'var(--pt-fg3)', .7, 'stroke-dasharray="3 3" pointer-events="none"'));
      else if(useReal && !isCut && o.cut==='none') parts.push(wire3(x, R.op+6, w, HR.op-12, 'var(--pt-fg3)', .7, 'stroke-dasharray="3 3" pointer-events="none"'));
      else if(isCut){
        /* 片数用真标注的 total（如 q_b_proj 沿 head 切 32 份，本卡持 16–31），
           没有标注时退回本刀的份数 size。片贴片=面积守恒，跟别处一个纪律。 */
        var np = Math.max(1, Math.min(pieces, 64)), pw = w/np;
        var hot = (useReal && o.range && o.total) ? Math.floor(o.range[0]/(o.total/np)) : co0;
        parts.push(wire3(x, R.op, w, HR.op, col, 1, 'pointer-events="none"'));
        for(var q=0;q<np;q++)
          parts.push(slab(x+q*pw+.4, R.op+1.5, Math.max(.6,pw-.8), HR.op-3,
            mix(col, q===hot ? 62 : 30), 'transparent', 0, 'pointer-events="none"'));
        /* 被切最宽的那个算子当 kernel 锥的起点：热片（本卡那片）→ 本卡的柱 */
        if(!opLane.tgt || w > opLane.tgt.w)
          opLane.tgt = {id:o.id, label:(o.label||o.id), w:w, hotX:x+hot*pw+.4, hotW:Math.max(.6,pw-.8)};
      }
      else parts.push(slab(x, R.op+3, w, HR.op-6, mix('var(--pt-fg2)',16), 'var(--pt-bds)', .6, 'pointer-events="none"'));
      /* CP 不切权重，kernel 锥退而锚在 attention 上：CP 的通信与算子改写都发生在这儿 */
      if(useReal && !opLane.attn && /attention|mla/i.test(o.id) && !o.comm)
        opLane.attn = {id:o.id, label:(o.label||o.id), hotX:x, hotW:w};
      var lbl = useReal ? (o.label||o.id) : o.id;
      /* ── 标签：值优先、名字够短才写、写不下就只留悬停 ──────────────────
         原来两行交错（+9/+18 与 +18/+27）把「名字」和「沿哪根轴」挤进同一个 y：
         奇数格的名字与偶数格的轴名正好撞在 +18 上，35 个算子横排下来是一片糊。
         改成两组各占两行、组间不重叠（+9/+17 与 +28/+36），再按**实测宽度**逐个
         排：装不下就不写（名字在悬停里一个字不少），装得下也只写短名——
         全长写在 <title> 里。这跟画布上芯片那套纪律是同一条：图上只留最必要的，
         其余 hover。 */
      /* 单行，不再上下交错：交错是为了给挤不下的名字腾地方，但它把第二行推到
         kernel 那一带上，和放大锥的说明撞在一起——而现在名字**只在装得进自己
         那一格时**才写，本来就不会压邻居，交错就没有理由再存在了。 */
      var row9 = 0, fs9 = 7;
      var short9 = shortOp9(lbl);
      /* 轴名用**短号**（h / head / e / s，o.axis），不用中文长名（o.axisName）：
         这一行写的是值——沿哪根轴、切成几片——名字那一行已经有悬停兜底了。 */
      var axL9 = (useReal && isCut && o.axis) ? (o.axis+'×'+pieces) : '';
      var budget9 = w + og*0.6;
      /* 先按**本块自己的宽度**裁名字：装不进自己的格子就不写（写出去就是压邻居）。 */
      var fit9 = Math.max(0, Math.floor(budget9 / (fs9*0.62)));
      if(short9.length > fit9) short9 = fit9 >= 5 ? short9.slice(0, fit9-1)+'…' : '';
      if(axL9.length * 6.4 * 0.62 > budget9) axL9 = '';
      var need9 = Math.max(short9.length*fs9*0.62, axL9.length*6.4*0.62);
      var nY9 = R.op+HR.op+9, aX9 = x+w/2;
      if((short9 || axL9) && aX9 - need9/2 > opLane.lastX[row9] + 2){
        if(short9) parts.push(txt(aX9, nY9, short9, fs9, isCut?col:'var(--pt-fg3)', 'middle',
          (isCut?'font-weight="700" ':'')+'paint-order="stroke" stroke="var(--pt-bg)" stroke-width="2.4" pointer-events="none"'));
        if(axL9) parts.push(txt(aX9, nY9+8, axL9, 6.4, col, 'middle',
          'paint-order="stroke" stroke="var(--pt-bg)" stroke-width="2.2" pointer-events="none"'));
        opLane.lastX[row9] = aX9 + need9/2;
      }
      /* 悬停给全量：全名 + 切法 + 轴 + 本卡拿到的区间 + 标注里的原因。
         图上写不下的每一个字都在这儿，一个不少。 */
      opHit.push('<rect x="'+x.toFixed(1)+'" y="'+R.op+'" width="'+Math.max(1,w).toFixed(1)+'" height="'+HR.op
        + '" style="fill:transparent;cursor:help"><title>'+esc(lbl
        + (isCut ? ' · 被 '+DIMN[dim]+' 沿 '+(o.axisName||o.axis||'—')+' 切 '+pieces+' 片'
                   + (o.range ? '（本卡持 '+o.range[0]+'–'+o.range[1]+'）' : '')
                   + (o.partial ? ' · 算出的是 partial，需归约' : '')
                 : (o.cut==='none' ? ' · 本维不切（各格相同）' : ' · 由别的刀切'))
        + (o.note ? ' —— '+o.note : ''))+'</title></rect>');
      x += w + og;
    });
  }
  if(dim==='tp'){
    opLane('tp');
    say(R.op+HR.op/2-2, '算子 — 锯开 ×TP='+size+'：每片 1/'+size,
        'q/kv/out/mlp 被切 · 每格 '+fmtGB(2*paramsPerCard(D,0))+' GB（片非整层）');
  }
  else if(dim==='ep'){
    opLane('ep');
    say(R.op+HR.op/2-2, '算子 — experts 重分组 ×EP='+size+'（每桶 '+kE+'）',
        'EP 是视图不是新轴（勘误 K）');
    var ex = opPos['experts'], rt = opPos['router'];
    if(ex){   /* 路由：token 动态挑 top-k 个桶——运行时的，不是静态切开 */
      var tk0 = rt ? rt.x+rt.w/2 : ex.x-14, ty0 = R.op-24;
      parts.push('<circle cx="'+tk0+'" cy="'+ty0+'" r="3.2" style="fill:'+col+'" pointer-events="none"/>');
      parts.push(txt(tk0, ty0-7, '一个 token', 7.6, col, 'middle', 'font-weight="700" pointer-events="none"'));
      var picks = [1, Math.min(N-1, 5)];
      for(var bi=0;bi<N;bi++){
        var tgx = ex.x+(bi+.5)*(ex.w/size), hit = picks.indexOf(bi)>=0;
        parts.push('<line x1="'+tk0+'" y1="'+(ty0+4)+'" x2="'+tgx+'" y2="'+R.op+'" style="stroke:'+col+';stroke-width:'+(hit?1.6:.55)+';stroke-dasharray:'+(hit?'none':'2 4')+';opacity:'+(hit?.95:.28)+'" pointer-events="none"/>');
      }
      /* 说明放右栏第三行：这一带的 y 正好是 tp/ep 的归属边界线，写在图里会压线 */
      parts.push(txt(RL, R.op+HR.op/2+20, 'top-'+(D.topk||2)+' 动态路由：每 token 挑自己的桶', 7.6, 'var(--pt-fg2)', 'start'));
      parts.push(txt(RL, R.op+HR.op/2+31, '路由是运行时的 · 切分是静态的', 7.6, 'var(--pt-fg3)', 'start'));
    }
  }
  else if(dim==='pp'){
    cutLane(R.op, HR.op, function(j){ return mix(col, 20+Math.round(j/(N-1||1)*20)); }, null);
    say(R.op+HR.op/2-2, '算子 — 随层归属（段里有哪些层）', '面积守恒同上一行');
  }
  else if(dim==='dp'){
    copyLane(R.op, HR.op, mix('var(--pt-fg2)',16), null);
    say(R.op+HR.op/2-2, '算子 — 同一份，逐字节相同', '加 DP 不买余量（A3）');
  }
  else{
    /* CP 也走真算子带：它确实不切任何权重（isCut 全 false，35 个算子全画成整块），
       但「不切」值得用真图说——每个算子都完整地在，s 轴上变少的是流过它们的 token。 */
    opLane('cp');
    say(R.op+HR.op/2-2, '算子 — 权重完整（CP 只切激活的 s 轴）',
        '每卡 token 少 1/'+size+' · 算子一个不缺');
  }

  /* ── 放大锥①：层 → 算子。样本层张开成整行——「算子行就是 L·liHi 的内部」。
     这一跳尺寸不守恒（一层张满全宽），所以标 ⊕，跟切分链同一条纪律。
     PP 不画这只锥：它的算子行讲的是「随层归属」（哪段有哪些层的算子），
     不是一层的内部——锥画上去就是把归属说成了放大。 */
  if(layMark && dim!=='pp'){
    var cnA = dim==='dp' ? sx(0)+gap/2 : X0, cnB = dim==='dp' ? sx(0)+slot-gap/2 : X0+MW;
    var cnY0 = layMark[2]+layMark[3]+1, cnY1 = R.op-2;
    ['<line x1="'+layMark[0]+'" y1="'+cnY0+'" x2="'+cnA+'" y2="'+cnY1+'"',
     '<line x1="'+(layMark[0]+layMark[1])+'" y1="'+cnY0+'" x2="'+cnB+'" y2="'+cnY1+'"'].forEach(function(l9){
      parts.push(l9+' style="stroke:var(--pt-fg3);stroke-width:1;stroke-dasharray:4 3;opacity:.75" pointer-events="none"/>');
    });
    parts.push(txt(X0+4, cnY1-6, '⊕ 放大 · L'+liHi+' 的内部（算子级）', 7.2, 'var(--pt-fg2)', 'start',
      'font-weight="700" paint-order="stroke" stroke="var(--pt-bg)" stroke-width="2.6" pointer-events="none"'));
  }

  /* ── kernel：永不跨格 ── */
  for(var q2=0;q2<N;q2++){
    var kw = (slot-gap)/3.4;
    for(var kr=0;kr<3;kr++)
      parts.push(slab(sx(q2)+gap/2+kr*(kw+1.5), R.ker, kw, HR.ker, mix('var(--pt-fg2)', 34-kr*7), 'transparent', 0, 'pointer-events="none"'));
  }
  if(tail>0) tailBand(R.ker, HR.ker, mix('var(--pt-fg2)',28));
  /* ── 放大锥②：算子 → kernel，而且收进**选中那张卡的柱**。起点按刀选：
     TP/EP 从被切最宽那个算子的**热片**出发（本卡拿的那一片）；CP 没有片，
     从 attention 出发（它的通信与算子改写都在这儿）。DP 与 PP 不画这只锥：
     DP 的算子行是复印件（没有单算子坐标）、PP 讲的是归属——两者的落位都由
     竖直对齐说完了。终点是第 co0 根柱的 kernel 块。这一下把两条线钉在一起：
     整网⊃层⊃算子⊃kernel 是**内容**的包含链，卡是**落位**的容器——
     链的末端（kernel）永远整只落在某一根柱里，两条线在这儿相交。 */
  (function(){
    var src = (dim==='tp'||dim==='ep') ? opLane.tgt : opLane.attn;
    if(!src || dim==='pp') return;
    var i9 = Math.max(0, Math.min(N-1, co0));
    var kx0 = sx(i9)+gap/2, kx1 = sx(i9)+slot-gap/2;
    var ky0 = R.op+HR.op+1, ky1 = R.ker-2;
    ['<line x1="'+src.hotX+'" y1="'+ky0+'" x2="'+kx0+'" y2="'+ky1+'"',
     '<line x1="'+(src.hotX+src.hotW)+'" y1="'+ky0+'" x2="'+kx1+'" y2="'+ky1+'"'].forEach(function(l9){
      parts.push(l9+' style="stroke:var(--pt-fg3);stroke-width:1;stroke-dasharray:4 3;opacity:.75" pointer-events="none"/>');
    });
    parts.push(rect(kx0-1.2, R.ker-1.5, (kx1-kx0)+2.4, HR.ker+3, 'none', 'var(--pt-fg)', 1.2, 'pointer-events="none"'));
    var midX9 = Math.max(X0+70, Math.min(X0+MW-70, (src.hotX+src.hotW/2+kx0+(kx1-kx0)/2)/2));
    parts.push(txt(midX9, ky1-5, '⊕ '+(src.label.length>13?src.label.slice(0,12)+'…':src.label)
      +((dim==='tp'||dim==='ep')?' 的本卡那片':'')+' → 这张卡的 kernel', 7.2, 'var(--pt-fg2)', 'middle',
      'font-weight="700" paint-order="stroke" stroke="var(--pt-bg)" stroke-width="2.6" pointer-events="none"'));
  })();
  say(R.ker+HR.ker/2-2, 'kernel — 永不跨柱（柱壁就是它的边界）',
      '内容链（整网⊃层⊃算子⊃kernel）到这儿收进柱：末端整只落进卡，容器从此接手');

  /* ── 卡（容器）：一柱一份，虚线柱贯穿全高（rank 是柱上的门牌，容器是卡本身 §15）。
     柱脚放门牌与容量计；整柱可点。竖直对齐 = 映射：柱里那一份就是它持有的。 ── */
  parts.push(txt(X0-10, R.card+16, '卡（容器）', 10.5, 'var(--pt-fg)', 'end', 'font-weight="800"'));
  parts.push(txt(X0-10, R.card+29, '容量 = 显存', 7.8, 'var(--pt-fg3)', 'end'));
  parts.push(txt(X0-10, R.card+40, '柱里那一份', 7.4, col, 'end'));
  parts.push(txt(X0-10, R.card+50, '就是它持有的', 7.4, col, 'end'));
  var CT = R.inp-13, CB = R.card+HR.card;             /* 柱顶（含输入行）/ 柱底 */
  for(var i=0;i<N;i++){
    var isSel = sel===colRanks[i], cx0 = sx(i)+gap/2, cw = slot-gap;
    var stI = coordsOf(colRanks[i], D).p;
    var memI = memParts(D, stI).reduce(function(a,x){ return a+x.bytes; }, 0);
    var frac = Math.min(1, memI/(D.hbm*Math.pow(2,30))), over = frac > .9;
    for(var gh=Math.min(groupsPer-1,2); gh>=1; gh--){  /* 同构卡退叠（真实张数由文字兜底） */
      var go = gh*3;
      colBack.push(rect(cx0+go, CT-go, cw, CB-CT, 'var(--pt-bg)', 'var(--pt-bd)', .6, 'stroke-dasharray="2 3" opacity="'+(.5-gh*.13).toFixed(2)+'" pointer-events="none"'));
    }
    /* 柱身：极淡体积感 + 虚线壁（容器边界），选中转实线 */
    colBack.push(rect(cx0, CT, cw, CB-CT, isSel?mix('var(--pt-fg)',5):mix('var(--pt-fg)',2), 'transparent', 0, 'pointer-events="none"')
      + wire3(cx0, CT, cw, CB-CT, isSel?'var(--pt-fg)':'var(--pt-bds)', isSel?1.6:1,
              isSel?'pointer-events="none"':'stroke-dasharray="7 3" pointer-events="none"'));
    /* 柱脚：门牌区（与柱身同宽，底色略深，读作"这根柱的脚") */
    colBack.push(rect(cx0, R.card, cw, HR.card, isSel?mix('var(--pt-fg)',8):mix('var(--pt-fg)',4), 'transparent', 0, 'pointer-events="none"'));
    inter.push('<g class="dimcol" data-g="'+colRanks[i]+'" style="cursor:pointer">'

/* ═════════ 可转动的整网 3D 场景 ═════════
   整网不是一条填了色的带子，是**一叠真的层板**：每一层是一块竖着的板，板面就是

   DP 复印 = 整只 deck 复制若干份（等大成叠）；PP 切分切的就是这些复制体。
   转台投影：yaw 绕竖轴转、pitch 抬头。u 向右 · w 向深处 · v 向下（v 就是真图自己的 y）。 */
function turn3(u, v, w, yaw, pitch){
  var cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
  var rx = u*cy + w*sy;
  var rz0 = w*cy - u*sy;
  return [rx, v*cp - rz0*sp, v*sp + rz0*cp];
}
/* 场景：整网 deck × DP 复印 × PP 切段。返回 {body, hit, note} */
/* 刀序 = 在同一个三维场景里一刀一刀往下切，每一刀切的是上一刀的产物。
   这就是「切分链」与「单维切分」合起来的样子：链给次序，单维给每一刀干了什么。
   持有量沿途只降不升——除了 DP 那一刀：复印之后这张卡还持有整个副本，一点没减（A3）。 */
var KNIVES = [
  {k:'net', n:'整网',    s:'逻辑上一张，还没切；输入也还是一整块全局批'},
  {k:'dp',  n:'DP 复印',  s:'复印整网 —— 模型不切、每份等大；同一把刀真切输入的 b 轴'},
  {k:'pp',  n:'PP 切段',  s:'切层序 ℓ —— 每一份复制体都被切开（面积守恒），段与段之间掰开'},
  {k:'cp',  n:'CP 切序列',s:'切 s 轴 —— 切的是输入不是整网：权重持有量一点不变'},
  {k:'tp',  n:'TP 锯片',  s:'锯算子 h 轴 —— 刀口在算子内部，非本卡的片打成斜纹'},
  {k:'ep',  n:'EP 分桶',  s:'重组专家 e 轴 —— 不是新轴，是对同一批卡的重解释'}
];
/* 序号按**本配置里真正落下的刀**连号——CP/EP 被配置过滤掉时不该在编号上留个洞 */
var KNUM = ['','①','②','③','④','⑤','⑥'];
function knifeSteps(D){
  return KNIVES.filter(function(q){
    if(q.k==='ep') return !!(D.moe && D.ep>1);
    if(q.k==='cp') return D.cp>1;
    return true;
  }).map(function(q, i){
    return {k:q.k, n:(i?KNUM[i]:'')+q.n, s:q.s};
  });
}
/* 第 step 刀落下时，k 这一刀是不是已经切过了（按刀的**种类**判断，不按下标——
   CP/EP 会按配置被过滤掉，下标是浮动的） */
function cutBy(ST, step, k){
  for(var i=1; i<=step && i<ST.length; i++) if(ST[i].k===k) return true;
  return false;
}

function holdDenom(D, step){
  var ST = knifeSteps(D), d = 1;
  if(cutBy(ST, step, 'pp')) d *= D.pp;

  if(cutBy(ST, step, 'ep') && D.moe) d *= D.ep;
  return d;
}

  function anchorLi8(p8){ return Math.min(L - 1, p8*lps + (lps >> 1)); }

         · 另一条发现光收进深还不够——层间距本身太小（48 层压在 1.7 个单位里），

     一加磨砂立刻现形：后排卡的面糊在前排卡的棱上，前面的线反而更淡。 */
  copyOrder.sort(function(a,b){ return b.z - a.z; });
  /* 同一列里 pp 段之间也要远的先画。w 往哪个方向变远随 yaw 变号（转过 90° 就反

     叠在一起就是一张平面的网格。真实世界里远处会被空气滤淡，这是人眼最先认的
     那条深度线索，也是最省事的：不改几何，只按投影深度调三样东西（棱的粗细与

     一帧 1 秒出头，就是「打开卡转动/缩放非常卡」的大头）。列的包围盒拿 8 个
     角点投影一次便宜地量出来；四周留 25% 边距，小幅平移不露白，露了也有

  /* ── 弱化档合并成 path：卡模式全量近 3 万个 <polygon>，九成是各卡里同款样式的

      + 'L'+pts[2][0].toFixed(1)+' '+pts[2][1].toFixed(1)+'L'+pts[3][0].toFixed(1)+' '+pts[3][1].toFixed(1)+'Z';

       的壳对不上——PP 没落下时二者本就重合（只有一段），PP 落下时会变成内容摆

      lab.push(txt(pc[0], ly, esc(bn3 ? n.label : (it[2] || n.label))+esc(tag), 6.4, 'var(--pt-fg)', 'middle',

  if(revLi >= 0 && IXg){

/* ═════════ 视图七 · 一个 step 的五幕：跟住一张卡走完全程 ═════════
   前面几张图都是**静态的关系**。这张图补的是时间上的先后，以及一条最容易被跳过的分界：
   哪些事**只做一次**（开机 / 报到 / 备料），哪些事**每个 micro-batch 都重来**（进料 / 开算 / 接力）。
   把它讲成一个能复述的故事：跟住一张卡，从 128 个一模一样的进程，走到步末那一次梯度 AllReduce。
   第 4 幕是两条链唯一的交点——算子（逻辑侧末级）与 kernel 队列（物理侧末级）在 kernel 处碰头。 */
var ACTS = [
  {t:'开机',       s:'一模一样的进程',     once:true},
  {t:'报到',       s:'一维编号 → 四位门牌', once:true},
  {t:'备料',       s:'只建自己那一份',      once:true},
  {t:'进料',       s:'token 每步换一批',    once:false},
  {t:'开算',       s:'算子落成 kernel',     once:false},
  {t:'接力与收束', s:'流水线 + 步末 AllReduce', once:false}
];
function renderStory(D){
  var g = (sel!==null && sel<D.world) ? sel : 0;
  var co = coordsOf(g, D), me = D.moe ? epOf(co.t,co.c,co.d,D) : null;
  var A = clamp(ui.act|0, 0, ACTS.length-1), act = ACTS[A];
  var H = 636, parts = [], hits = [];
  var lps = D.layersPerStage, l0 = co.p*lps, l1 = (co.p+1)*lps-1;
  var hK = Math.floor(D.hidden/D.tp), plane = D.tp*D.cp*D.dp;
  function ln(a,b,st){ return '<line x1="'+a[0].toFixed(1)+'" y1="'+a[1].toFixed(1)+'" x2="'+b[0].toFixed(1)+'" y2="'+b[1].toFixed(1)+'" style="'+st+'"/>'; }
  function rc(x,y,w,h,fill,stroke,sw,extra){
    return '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+Math.max(.4,w).toFixed(1)+'" height="'+Math.max(.4,h).toFixed(1)
      +'" style="fill:'+fill+';stroke:'+(stroke||'none')+';stroke-width:'+(sw===undefined?0:sw)+'" '+(extra||'')+'/>';
  }
  /* 有厚度的块（斜投影：深度恒为 (dx,−dy)，X 不受深度影响） */
  function slab(x,y,w,h,fill,dx,dy,extra){
    if(w<=.3) return '';
    var s2 = '';
    if(dx>0){
      s2 += '<polygon points="'+x.toFixed(1)+','+y.toFixed(1)+' '+(x+w).toFixed(1)+','+y.toFixed(1)+' '
        +(x+w+dx).toFixed(1)+','+(y-dy).toFixed(1)+' '+(x+dx).toFixed(1)+','+(y-dy).toFixed(1)
        +'" style="fill:color-mix(in srgb,'+fill+' 70%, #fff 30%)" pointer-events="none"/>';
      s2 += '<polygon points="'+(x+w).toFixed(1)+','+y.toFixed(1)+' '+(x+w+dx).toFixed(1)+','+(y-dy).toFixed(1)+' '
        +(x+w+dx).toFixed(1)+','+(y+h-dy).toFixed(1)+' '+(x+w).toFixed(1)+','+(y+h).toFixed(1)
        +'" style="fill:color-mix(in srgb,'+fill+' 72%, #000 28%)" pointer-events="none"/>';

  }
  /* 卡阵：行 = stage（PP），列 = stage 内平面（tp·cp·dp）——三个组在这个排布上各有各的形状 */
  function lattice(LX, LY, LW, LH, o){

      var gg = r*cols + c2;
      if(gg >= D.world) continue;
      var x = LX + c2*cw, y = LY + r*ch, hot = gg===g;

      s2 += slab(x, y+dep, Math.max(.5,cw-Math.max(.35,cw*.09)), Math.max(.5,ch-Math.max(.35,ch*.14)), f, dep, dep*.6, 'pointer-events="none"');
    }
    /* 命中层单独铺一遍透明格。格子细到 2px 以下就不铺了——那时候点谁都是碰运气；
       但**格子照画**（份数是真的），只是把「这里点不动」如实说出来，不装成能点。 */
    if(cw < 2) s2 += txt(LX, LY-8, '格子已细到 '+cw.toFixed(1)+'px：'+fmt(D.world)+' 张全画出来了，但点选请用顶栏的「选中卡」输入框',
                         7.4, 'var(--pt-fg3)', 'start');
    if(cw >= 2) for(var r2=0; r2<rows; r2++) for(var c3=0; c3<cols; c3++){

      11, 'var(--pt-fg)', 'middle', 'font-weight="700"'));
    parts.push('<g pointer-events="none">'+L0.body+'</g>');

    parts.push(txt(485, 400, '唯一的差别 = 一个数字 global_rank（0…'+(D.world-1)+'）', 10.5, VC.dp, 'middle', 'font-weight="800"'));
    parts.push(txtI(485, 416, '门牌号要到下一幕才算出来', '此刻谁也还不知道自己该干什么：全局 rank 只是一个数字，还没有映射成「我负责哪一段」。', 8.4, 'var(--pt-fg3)'));
    narr = ['行只按编号分段（0–'+(plane-1)+' / '+plane+'–…），不是 stage —— 此刻还没有 stage 这回事，门牌号要到第 1 幕才算出来；这个排法眼下只是「为了摆得下」。',
            '这一幕是整个训练里唯一「所有卡完全对称」的时刻：同一份代码、同一份权重定义、同一份配置，差别只有一个数字。'];
  }

  if(A===1){

    var PX = 28, PY = 82;

    parts.push(rc(PX, PY+24, 300, 62, mix('var(--pt-fg)',4), 'var(--pt-bd)', 1, 'rx="5"'));
    parts.push(txt(PX+10, PY+41, 'g = ((pp·DP + dp)·CP + cp)·TP + tp', 9.2, 'var(--pt-fg2)', 'start'));
    parts.push(txt(PX+10, PY+56, fmt(g)+' = (('+co.p+'·'+D.dp+' + '+co.d+')·'+D.cp+' + '+co.c+')·'+D.tp+' + '+co.t,
      10, 'var(--pt-fg)', 'start', 'font-weight="800"'));
    parts.push(txt(PX+10, PY+74, '逆解：tp=g%TP · cp=⌊g/TP⌋%CP · dp=⌊g/TP·CP⌋%DP · pp=⌊g/TP·CP·DP⌋（可逆 §07）', 7.2, 'var(--pt-fg3)', 'start'));

/* ═ 训练数据标注：与 training-sidecar 同一套确定性合成口径（sin-hash 伪随机，

/* ══ 载体：这条边走哪张网 ═══════════════════════════════════════════════════

     · UB 平面   —— 384 NPU + 192 CPU **非阻塞全互联**，承载 TP/EP 这类细粒度
                   并行、池化内存的点对点访问、MoE 的 token dispatch/combine
     · RDMA 平面 —— RoCE，每 NPU 400Gbps，只有 NPU 参与；**跨超节点**才用它
     · VPC 平面  —— 管理/存储/对外，不承载训练通信，这里不画

   ⚠ 一条口径假设，图上也写着：**超节点内一律按 UB 同一档算，不区分板内 /
   板间 / 机架间**。公开资料的说法是「单板内、单板间、机架间 NPU 全互联」，
   读起来是同一档；但板间与机架间到底有没有降速，要灵衢团队确认。真有差异时

/* 两张卡之间：先判平面（UB / RoCE），UB 再判它落在哪一档。返回的是一个**新对象**，

function fabricOf(a9, b9, D){

/* ══ 载体 × 载荷 → 传输时间的**下界** ═════════════════════════════════════

     字既不进框内跟第一行算子抢位置，也不飘在框外没着落——层级这一维就一直看得见。
     原来写在框内左上角，紧贴顶边的那些通信横线（AllGather / Reduce-Scatter，标签
     居中）会正好压上来（实机可见「MoE F|Router Gate」这种两串字互抠）；上一版改成
     「位置被占就不写」，代价是层级名整片消失。骑线之后位置天然是空的，

  var nrect = null;
  function nodeRects(){

    drawNodes.forEach(function(n){
      if(o.clip && !inClu(n.parent, o.clip, clu)) return;
      /* 通信节点不占位：它在图上是一条线，不是体（画法见下面 opv:comm 那一支），
         把它当矩形收进来的话，它自己的标签会被自己的框判成「位置被占」。 */
      if(n.colorKey === 'opv:comm') return;
      nrect.push([TX(n.x - n.width/2), TY(n.y - n.height/2), n.width*scx, n.height*scy]);
    });
    return nrect;

  /* 右侧读数能写多长：写到**同一水平带上右边第一个节点**为止，不是写到格子边。

      var free8 = nodeRects().every(function(r8){

        +(x+w+E3x).toFixed(1)+','+(y-E3y).toFixed(1)+' '+(x+E3x).toFixed(1)+','+(y-E3y).toFixed(1)
        +'" style="fill:'+mix(col,26)+';fill-opacity:'+op+';stroke:none"/>');
      out.push('<polygon points="'+(x+w).toFixed(1)+','+y.toFixed(1)+' '+(x+w+E3x).toFixed(1)+','+(y-E3y).toFixed(1)+' '
        +(x+w+E3x).toFixed(1)+','+(y+h-E3y).toFixed(1)+' '+(x+w).toFixed(1)+','+(y+h).toFixed(1)
        +'" style="fill:'+mix('var(--pt-fg)',26)+';fill-opacity:'+op+';stroke:none"/>');
    }
    var didCut = false;
    if(!gh && o.cuts){
      /* h 枝（竖切）与 s 枝（横切）各配自己的刀；两把都在 = 网格，本卡拿其中一格 */
      var cutH = null, hxH = '', colH = byH ? dimColor(byH.dim) : col;
      if(byH && byH.dim === 'tp' && o.cuts.tp){ cutH = o.cuts.tp; hxH = o.cuts.hxTP||'hxTP'; }
      else if(byH && byH.dim === 'ep' && o.cuts.ep){ cutH = o.cuts.ep; hxH = o.cuts.hxEP||'hxEP'; }
      else if(!byH && dim === 'sp' && o.cuts.tp && !o.cuts.sp){ cutH = o.cuts.tp; hxH = o.cuts.hxTP||'hxTP'; colH = col; }
      var cutV = null, hxV = '', colV = byS ? dimColor(byS.dim) : col;
      if(byS && byS.dim === 'sp' && o.cuts.sp){ cutV = o.cuts.sp; hxV = o.cuts.hxSP||'hxSP'; }
      else if(byS && byS.dim === 'cp' && o.cuts.cp){ cutV = o.cuts.cp; hxV = o.cuts.hxCP||'hxCP'; }
      if(cutH && cutH.count > 1 && w*zs/cutH.count < 1.5) { /* 片薄到亚像素：整块打纹，不逐片画 */
        out.push('<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+h.toFixed(1)
          +'" rx="'+(1/zs).toFixed(2)+'" style="fill:url(#'+hxH+');fill-opacity:'+op+';stroke:'+colH+';stroke-width:'+(0.4/zs).toFixed(2)+';stroke-opacity:'+op+'"/>');
        didCut = true; cutH = null; cutV = null;
      }
      if(cutV && cutV.count > 1 && h*zs/cutV.count < 1.4){
        if(!didCut){
          out.push('<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+h.toFixed(1)
            +'" rx="'+(1/zs).toFixed(2)+'" style="fill:url(#'+hxV+');fill-opacity:'+op+';stroke:'+colV+';stroke-width:'+(0.4/zs).toFixed(2)+';stroke-opacity:'+op+'"/>');
          didCut = true;
        }
        cutV = null;
      }
      if(cutH && cutH.count > 1 && cutV && cutV.count > 1){
        /* 网格：竖 = h 上第几片，横 = s 上第几段；本卡那一格实心 */
        var kw = w*0.12/cutH.count, kh = h*0.12/cutV.count;
        for(var gi = 0; gi < cutH.count; gi++) for(var gj = 0; gj < cutV.count; gj++){
          var gx = x + w*gi/cutH.count, gy = y + h*gj/cutV.count;
          var gw2 = w/cutH.count - kw, gh2 = h/cutV.count - kh;
          var mine2 = gi === cutH.mine && gj === cutV.mine;
          var half = gi === cutH.mine || gj === cutV.mine;
          out.push('<rect x="'+gx.toFixed(1)+'" y="'+gy.toFixed(1)+'" width="'+gw2.toFixed(1)+'" height="'+gh2.toFixed(1)+'" rx="'+(0.8/zs).toFixed(2)+'" '
            +'style="fill:'+(mine2 ? mix(colH,58) : half ? mix(colH,14) : 'none')
            +';fill-opacity:'+op+';stroke:'+(gj === cutV.mine ? colH : colV)+';stroke-width:'+((mine2?.9:.3)/zs).toFixed(2)+';stroke-opacity:'+op+'"/>');
        }
        didCut = true;
      } else if(cutH && cutH.count > 1){
        var kerf = w*0.15/cutH.count;
        for(var si = 0; si < cutH.count; si++){
          var sx = x + w*si/cutH.count, sw = w/cutH.count - kerf;
          var isMine = si === cutH.mine;
          out.push('<rect x="'+sx.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+sw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="'+(1/zs).toFixed(2)+'" '
            +'style="fill:'+(isMine?mix(colH,55):'url(#'+hxH+')')+';fill-opacity:'+op
            +';stroke:'+colH+';stroke-width:'+((isMine?.8:.3)/zs).toFixed(2)+';stroke-opacity:'+op+'"/>');
        }
        didCut = true;
      } else if(cutV && cutV.count > 1){
        var kerfV = h*0.15/cutV.count;
        for(var sj = 0; sj < cutV.count; sj++){
          var sy2 = y + h*sj/cutV.count, sh2 = h/cutV.count - kerfV;
          var isMineV = sj === cutV.mine;
          out.push('<rect x="'+x.toFixed(1)+'" y="'+sy2.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+Math.max(0.7/zs,sh2).toFixed(2)+'" rx="'+(1/zs).toFixed(2)+'" '
            +'style="fill:'+(isMineV?mix(colV,55):'url(#'+hxV+')')+';fill-opacity:'+op
            +';stroke:'+colV+';stroke-width:'+((isMineV?.8:.3)/zs).toFixed(2)+';stroke-opacity:'+op+'"/>');
        }
        didCut = true;
      }
    }
    if(!didCut)
    out.push('<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+h.toFixed(1)
      +'" rx="'+(1.5/zs).toFixed(2)+'" style="fill:'+mix(col, dim?46:16)+';fill-opacity:'+op+';stroke:'+(dim?col:'var(--pt-bds)')
      +';stroke-width:'+((dim?.9:.5)/zs).toFixed(2)+';stroke-opacity:'+op+'"/>');
    /* 过路的块高亮：与正视/3D 同一句判定（blockHLOn），画在节点体（含切痕那几条
       分支）画完之后——router 那块会被 forceColor 强改成 EP 色（见上面 col 那段），
       色只管填充，不该把这圈虚线记号也吃掉，单独一层叠上去才不会被它盖过。
       推进 acts（不是 out）：out/acts/txts 最后按这个顺序拼接（见函数末尾 return），
       acts 排在节点体之后、文字标签之前——线框压得住节点填充，又不会挡住读数字。 */
    if(ui.hlBlock && blockHLOn(n)){
      var hb9 = 2.4/zs;
      acts.push('<rect class="hlring" x="'+(x-hb9).toFixed(1)+'" y="'+(y-hb9).toFixed(1)
        +'" width="'+(w+hb9*2).toFixed(1)+'" height="'+(h+hb9*2).toFixed(1)
        +'" rx="'+(3/zs).toFixed(2)+'" style="fill:none;stroke:'+VC.dp+';stroke-width:'+(1.4/zs).toFixed(2)
        +';stroke-dasharray:'+(4/zs).toFixed(2)+' '+(2.8/zs).toFixed(2)+'"/>');
    }
    if(o.label && h*zs > 5){
      /* 真标签 + 真区间：和 3d-deck 上写的那一行是同一份数据。
         维名用切分表自己的 dimName（它会给出 SP 这种本页 DIMN 里没有的），
         total=0 的退化情形（如 experts=0 的专家桶）不硬标一个假区间。
         显隐按「字装不装得下」判：节点屏宽 ≥ 字长×2.2 才写——字号是恒定的（地图式），
         早写会和邻居的字叠成一团，晚一点出现反而清楚（放大自然会露出来）。 */
      /* 没挑中任何一份时（cuts.mine < 0，见 frontScene 里 pick9 那段）不写
         「TP0/4096」：那个 0 是「第几份」，而这时并没有选中谁——它是 rank 0 的坐标
         退化出来的假读数。改写刀的份数：切成几份是事实，拿第几份才是选择。 */
      var cut9 = (part && o.cuts && o.cuts[part.dim]) || null;
      var tag = !(part && part.total > 0) ? ''
        : (cut9 && cut9.count > 1 && cut9.mine < 0)
          ? ' · '+(part.dimName || String(dim).toUpperCase())+'×'+cut9.count
          : ' · '+(part.dimName || String(dim).toUpperCase())+part.range[0]+'/'+part.total+(s1 && s1.partial ? '↯' : '');
      var labOn9 = o.fitLabel || w*zs > Math.max(26*fk, (String(n.label).length + tag.length)*3.2*fk);
      /* 数据标注（sidecar 解剖图里节点旁那枚白胶囊的那行字）：比名字再晚一档出现。
         **优先写进节点框内、名字正下方**——归属要靠「在框里」说话。写在框外时
         它落在两行节点中间的空当里，上下都不挨着谁，读者一样判断不出算哪一个的。
         框实在太矮才退到框外，那时补一根从框底垂下来的短引线，把归属钉死。
         宽度不够整条时按重要性递减截断（sdOpMetric 的 maxCh），不整条丢。 */
      /* 装不下「名字 · 切分区间」就先丢区间，别丢名字——区间在悬停与明细卡里都有，
         而没有名字这个框就什么也不是了（分栏铺满之后框宽只有原来的六成，
         「Q Latent Linear · TP2048/4096」这种长串一律落到门槛外，整片没名字）。 */
      if(tag && w*zs <= (String(n.label).length + tag.length)*3.2*fk && w*zs > String(n.label).length*3.2*fk) tag = '';
      /* 分栏铺满是「照着屏幕把整张图排好」的取景，不是地图——那里字号该**缩到装得下**，
         而不是装不下就不写。地图式的恒定字号在可缩放的方阵里才成立：那里字小了可以
         放大，而这里已经没有放大这一步了，不写就是永远看不到。 */
      var fitK = 1;
      if(o.fitLabel){
        var need9 = (String(n.label).length + tag.length)*3.2*fk;
        if(need9 > w*zs) fitK = Math.max(0.62, (w*zs) / need9);
      }
      var nmW9 = (String(n.label).length + tag.length)*3.2*fk*fitK;
      var mtx9 = '', two9 = false, one9 = false, side9 = false;
      /* 铺满取景里链两侧是大片空白（层模板本来就是一条竖链），读数就走**节点正右侧**、
         与节点同一条基线，再拉一根短引线——和 sidecar 解剖图里那枚白胶囊同一个位置。
         这在方阵里行不通（两列卡并排时右侧就是隔壁那张卡，归属会含糊），
         但铺满时右边只有空白，一行一个读数，读起来就是一张表。 */
      if(o.metricSide && o.metricLi != null && !gh && labOn9)
        side9 = !!sideMetric(n, x, y, w, h, metricColor(o.metricLi, n));
      if(!side9 && labOn9 && o.metricLi != null && !gh){
        mtx9 = opMetric9(o.metricLi, n, Math.floor(w*zs/(3.0*fk)));
        /* 够高就上下两行都收在框里；不够高就**接在名字后面同一行**（同样在框里）。
           这两种都是「在框内」，归属没有歧义；写到框外一律不做——框外那条空当
           上下都不挨着谁，读者只能靠距离猜（实机就是这样把读数认到下一个算子头上的）。 */
        two9 = h*zs >= 13.5*fk && (o.fitLabel || w*zs >= mtx9.length*3.0*fk);
        one9 = !two9 && w*zs >= (String(n.label).length + tag.length)*3.2*fk + mtx9.length*3.0*fk + 8*fk;
        if(!two9 && !one9){
          mtx9 = opMetric9(o.metricLi, n, Math.max(4, Math.floor((w*zs - nmW9 - 8*fk)/(3.0*fk))));
          one9 = !!mtx9 && w*zs >= nmW9 + mtx9.length*3.0*fk + 8*fk;
          if(!one9) mtx9 = '';
        }
      }
      if(labOn9)
        /* 名字后面挤成一行的读数（one9）：挤在同一行、空间本来就紧（见上面 one9 的
           判定用的还是名字那档 3.2/3.0 宽度预算），但字号可以比名字略大一档——
           显式给 tspan 一个比父 text（5.4*fitK/zs）大约 1.15x 的 font-size，
           读数比名字醒目一点，又不至于把这行已经很满的宽度预算撑爆。 */
        txts.push(txt(x+w/2, y+h/2+(two9 ? -2.2*fk : 2*fk)/zs,
                    esc(n.label)+esc(tag)+((one9 && !side9) ? '<tspan fill="'+metricColor(o.metricLi, n)+'" font-weight="700" font-size="'+(5.4*fitK*fk/zs*1.15).toFixed(2)+'">  '+esc(mtx9)+'</tspan>' : ''),
                    5.4*fitK*fk/zs, gh?'var(--pt-fg3)':'var(--pt-fg)', 'middle',
                    (dim?'font-weight="700" ':'')+HALO+'pointer-events="none"'));
      /* ── 名字装不下时**优先写值** ────────────────────────────────────────
         反馈两条合在一处：「优先显示值」「整网图的展开之前讨论过应该是每个都有
         值的，为什么现在不显示数值了」。原来的判定是「名字装不下 → 这个框什么
         都不写」，于是框一窄，整片算子连一个数都没有；而名字在悬停与明细卡里
         都拿得到，数值不画在图上就真的看不到。
         所以补一条兜底：名字装不下、但按框宽截断后的读数装得下，就只写读数。
         连三四个字符都塞不进才真的空着。 */
      if(!labOn9 && o.metricLi != null && !gh && h*zs >= 5.5){
        var mo9 = opMetric9(o.metricLi, n, Math.max(3, Math.floor(w*zs/(3.0*fk))));
        if(mo9 && w*zs >= mo9.length*2.7*fk)
          txts.push(txt(x+w/2, y+h/2+2*fk/zs, esc(mo9),
            Math.max(4.2, Math.min(5.8, (w*zs)/(mo9.length*0.86*fk)))*fk/zs,
            metricColor(o.metricLi, n), 'middle', 'font-weight="800" '+HALO+'pointer-events="none"'));
      }
      if(two9 && !side9)
        /* 读数才是这张卡真正被读的理由（名字只是找到它是谁）：单独成行时色权
           顶格给到 fg、加粗——不动字号预算（3.4–4.6，装得下几个字是算好的），
           只把视觉重量从「名字的附注」搬回「正文」，异常/接近阈值再往上加一档
           警示色（跟点开看到的完整明细同一个判断，不是另起一套）。 */
        /* 读数字号地板/天花板从 3.4–4.6 提到 4.4–6.2，明显大过名字（5.4*fitK）；
           fitLabel 自缩路径里的每字符宽度常数 0.62 按新天花板同比例放大到 0.84，
           使「装不装得下」的估算继续跟着新字号走。 */
        txts.push(txt(x+w/2, y+h/2+5.8*fk/zs, esc(mtx9),
                    Math.max(4.4, Math.min(6.2, o.fitLabel ? (w*zs)/(mtx9.length*0.84*fk) : 6.2))*fk/zs,
                    metricColor(o.metricLi, n), 'middle', 'font-weight="700" '+HALO+'pointer-events="none"'));
    }
    /* 点开这个算子看完整明细（图上写的只是摘要）。命中面走调用方给的 hit 层：
       body 层整体 pointer-events:none，提示与点击都只能挂在 hit 上。 */
    if(o.hitArr && o.metricLi != null && !gh && w*zs > 6 && h*zs > 3){
      o.hitArr.push('<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+h.toFixed(1)
        +'" style="fill:transparent;cursor:pointer" data-act="opdetail" data-nid="'+esc(n.id)+'" data-li="'+o.metricLi+'"'
        +' data-key="'+esc(o.hitKey||'')+'"><title>'+esc(n.label)+' · L'+o.metricLi+'：点开看完整读数</title></rect>');
    }
  });
  return out.join('') + acts.join('') + txts.join('');
}

/* ═════════ 视图六 · 映射（两个视角）═════════
   C「映射」这一段要答两个不同的问题，所以是两个视角，不是两张图：
     · 视角① 双链映射 —— 哪一级映到哪一级（结构）
     · 视角② 交集腔   —— 这张卡装了哪一块（载荷）
   默认给①：先知道刀落在哪一级，再看那一级交出来的腔是什么。 */
function renderSolid(D){
  if(ui.persp === 'cav') return renderSolidCav(D);
  if(ui.persp === 'grid') return renderSolidGrid(D);
  return renderSolidMap(D);
}
/* ═════════ 视角① 双链映射（FIG 09 的三维化）═════════
   两条链都是包含链，各 5 级，但两条链的级与级并不对齐——所以连线是斜的，斜不是画风，是事实。
   全图真正的主张只有一句：四个并行维度全部收在「卡」这一级。
   往上两级（机 / 集群）只决定拓扑与带宽——它们不持有内容，所以画成空线框；
   往下两级（计算单元 / 片上 buffer）与并行完全无关——算子融合与 tiling 不跨卡、不通信。
   「卡」这一级不是一只盒子，是一整个卡阵平面（机内 8 卡 × 若干台机），四条梁全落在这个平面上；
   顺带就能核对两条常被念错的约束：TP 分片必须机内（组要落在同一行）· PP 划分可跨机（链本来就跨行）。
   机制框是扁的：机制是动作，不是容器——参照系里只有卡与流两个容器画成体。 */
function renderSolidMap(D){
  var g = (sel!==null && sel<D.world) ? sel : 0;
  var H = 700, parts = [], hits = [];
  var PER = 8, MACH = Math.ceil(D.world/PER);      /* 机 = 8 卡：FIG09 的拓扑假设，不由并行配置推出 */
  function ln(a,b,st){ return '<line x1="'+a[0].toFixed(1)+'" y1="'+a[1].toFixed(1)+'" x2="'+b[0].toFixed(1)+'" y2="'+b[1].toFixed(1)+'" style="'+st+'"/>'; }
  function poly(pts, st, extra){ return '<polygon points="'+ptsStr(pts)+'" style="'+st+'" '+(extra||'')+'/>'; }
  /* 水平板：容器才有体积（斜投影，深度恒为 (dx,−dy)） */
  function plate(px,py,w,dx,dy,th,o){
    o = o || {};
    var st = 'stroke:'+(o.stroke||'var(--pt-bds)')+';stroke-width:'+(o.sw||1)+(o.dash?';stroke-dasharray:'+o.dash:'');
    var pc = o.pct || 0, base = o.base || 'var(--pt-fg)';
    function F(k){ return pc ? mix(base, Math.min(70, pc*k)) : 'none'; }
    return poly([[px,py],[px+w,py],[px+w+dx,py-dy],[px+dx,py-dy]], 'fill:'+F(1)+';'+st)
         + poly([[px,py],[px+w,py],[px+w,py+th],[px,py+th]], 'fill:'+F(2.1)+';'+st)
         + poly([[px+w,py],[px+w+dx,py-dy],[px+w+dx,py-dy+th],[px+w,py+th]], 'fill:'+F(3)+';'+st);
  }
  function cell(px,py,w,dx,dy,a0,a1,b0,b1){       /* 板上 (a 沿宽, b 沿深) 的一格 */
    function P(a,b){ return [px + a*w + b*dx, py - b*dy]; }
    return [P(a0,b0), P(a1,b0), P(a1,b1), P(a0,b1)];
  }
  var LX = 36, LW = 112, LDX = 32, LDY = 18, LTH = 6;
  var MX0 = 224, MW0 = 244, MH0 = 30;
  var PX0 = 540, PW0 = 118, PDX = 34, PDY = 19, PTH = 6;
  var CDX = 104, CDY = 64, CW0 = 168, CTH = 9;      /* 卡阵平面：它是主角，给足深度 */
  var LOG = [
    {k:'net', y:132, t:'整网',      s:D.layers+' 层的图'},
    {k:'lay', y:220, t:'层 ℓ',      s:'层子图 · PP 切成 '+D.pp+' 段'},
    {k:'exp', y:308, t:'expert e',  s:D.moe?('仅 MoE 层存在 · '+D.experts+' 个'):'仅 MoE 层存在（本配置无）'},
    {k:'op',  y:396, t:'算子',      s:'MatMul · Softmax'},
    {k:'ten', y:484, t:'张量',      s:'权重 · 激活值'}
  ];
  var PHY = [
    {k:'clu',  y:118, t:'集群',        s:'world_size '+fmt(D.world)+' 张卡'},
    {k:'mac',  y:202, t:'机',          s:PER+' 卡 · 机内高带宽 · 共 '+fmt(MACH)+' 台'},
    {k:'card', y:352, t:'卡',          s:'显存 + 计算单元 + 流', big:true},
    {k:'unit', y:474, t:'计算单元',    s:'矩阵 + 向量单元'},
    {k:'buf',  y:552, t:'片上 buffer', s:'各级缓存'}
  ];
  var LY = {}, PY = {};
  LOG.forEach(function(q){ LY[q.k] = q.y; });
  PHY.forEach(function(q){ PY[q.k] = q.y; });

/* ═════════ 视图六 · 交集腔：卡为什么是「这一块」 ═════════
   前五视图各答一问：单维答「一把刀怎么切」、刀序答「几把刀什么次序」、解剖答「卡里有什么」。
   这一张答最后一问——**为什么恰好是这一块**，而这一问只能靠三维说清楚。
   两个对象各有自己的索引空间，轴数不同（§03 五元组：恰好一根轴对一把刀）：
     · 权重体① = ℓ × h × e     三轴 ← PP 切 ℓ、TP 切 h、EP 切 e
     · 激活体② = ℓ × h × b × s 四轴 ← 多出 DP 切的 b、CP 切的 s
   每把刀是**一整片板**（切穿整只盒子，不是切一小块）；三片板相交剁出一个小长方体，
   那就是这张卡持有的全部——体积 ∶ 全盒 = 持有占比。卡不是缩小的整网，是**区间的交集**。
   两条不对称在轴数上直接看得见，不用一句口号：
     · DP 在①上**没有轴** → 它只能把整只盒子复印一叠，格子数与格子大小全不变
       ⇒ 换副本时腔纹丝不动、体积一点不少 = A3「加 DP 不买余量」的几何证明
       （数值证明在单维切分的反事实里：若 DP=1，同一张卡还是这么多字节。两处互相印证。）
     · EP 在②上没有轴 → 路由是动作（把 token 送去别的卡），不是静态切分。 */
function renderSolidCav(D){
  var g = (sel!==null && sel<D.world) ? sel : 0;
  var co = coordsOf(g, D), me = D.moe ? epOf(co.t, co.c, co.d, D) : null;
  var H = 880, parts = [], hits = [];
  var L1 = layerOn('L1'), L2 = layerOn('L2'), L3 = layerOn('L3'), L4 = layerOn('L4');
  var hK = Math.floor(D.hidden/D.tp), kE = D.moe ? D.experts/D.ep : 0, lps = D.layersPerStage;
  var SEC = !!ui.act2;

  /* ── 可转动投影：拖动时覆盖全局 proj，让 boxSVG / solidBox 自动拿到旋转后的坐标 ── */
  var origProj = proj;
  var cavYaw = ui.cavYaw||0, cavPitch = ui.cavPitch||0;
  var hasRot = Math.abs(cavYaw) > 1e-6 || Math.abs(cavPitch) > 1e-6;
  var rcx = 0, rcy = 0, rcz = 0;
  if(hasRot){
    var cryw = Math.cos(cavYaw), sryw = Math.sin(cavYaw);
    var crpch = Math.cos(cavPitch), srpch = Math.sin(cavPitch);
    proj = function(x,y,z,s){
      var dx = x-rcx, dy = y-rcy, dz = z-rcz;
      var rx = dx*cryw + dz*sryw;
      var rz = dz*cryw - dx*sryw;
      var ry = dy*crpch - rz*srpch;
      var rz2 = dy*srpch + rz*crpch;
      return origProj(rx+rcx, ry+rcy, rz2+rcz, s);
    };
    /* 实心盒（boxSVG fill）要按同一套旋转判面朝向——见 boxSVG 顶上的说明 */
    projRot = function(n){
      var rx = n[0]*cryw + n[2]*sryw, rz3 = n[2]*cryw - n[0]*sryw;
      var ry = n[1]*crpch - rz3*srpch; rz3 = n[1]*srpch + rz3*crpch;
      return [rx, ry, rz3];
    };
  }
  var TY = 322, TX1 = SEC ? 372 : 500, TX2 = 700, BW = 142, BH = 132;
  var BD1 = D.moe ? 104 : 40, BD2 = 104;
  /* 读数放**左栏**：右上角是常驻的读出卡（.pt-detail，304px），右栏会被它盖住——
     版面必须按真实的浮层排，不能画完了让读者自己去关卡片。 */
  var RX = 24, RW = 190;

  function ln(a,b,st){ return '<line x1="'+a[0].toFixed(1)+'" y1="'+a[1].toFixed(1)+'" x2="'+b[0].toFixed(1)+'" y2="'+b[1].toFixed(1)+'" style="'+st+'"/>'; }
  function p3(x,y,z){ return proj(x,y,z,1); }
  function hexPts(w,h,d){ /* 盒子的屏幕轮廓（等轴测下恒是这个六边形）——复印件只画剪影 */
    return [p3(0,h,0), p3(w,h,0), p3(w,0,0), p3(w,0,d), p3(0,0,d), p3(0,h,d)];
  }

  /* ── 一只索引空间盒 ──────────────────────────────────────────
     外框（结构线）+ 三组刀面（每把刀在三个可见面上留下的线）+ 三片板 + 交集腔 + 三根可点的轴尺。
     ax/ay/az = {n 份数, dim 哪把刀, i 本卡拿第几份, name 轴名, k chainpick 键, lab(i) 刻度文字}
     x 轴走屏幕右下、z 轴走左下、y 轴朝上——三根轴各由一把刀认领，认领关系写在轴尺上。 */
  function solidBox(o){
    var W = o.w, HH = o.h, DD = o.d, ax = o.ax, ay = o.ay, az = o.az;
    var dx = W/ax.n, dy = HH/ay.n, dz = DD/az.n;
    var x0 = ax.i*dx, y0 = ay.i*dy, z0 = az.i*dz;
    var body = '', hit = '', i;
    /* 份数大到画不下时降的是线宽与标注，不是份数——细密纹理本身就是「真切了这么多刀」 */
    function gridStyle(step, col){
      var sw = step>4?.9:step>2?.6:.4, op = step>4?.58:step>2?.42:.26;
      return 'stroke:'+col+';stroke-width:'+sw+';stroke-opacity:'+op;
    }
    if(L1){
      body += boxSVG(0,0,0,W,HH,DD,1,{wire:true, stroke:'var(--pt-bd)', sw:1, dash:'3 3'});
      var st = gridStyle(dy, VC[ay.dim]);
      for(i=1;i<ay.n;i++) body += ln(p3(0,i*dy,DD), p3(W,i*dy,DD), st) + ln(p3(W,i*dy,0), p3(W,i*dy,DD), st);
      st = gridStyle(dx*C, VC[ax.dim]);
      for(i=1;i<ax.n;i++) body += ln(p3(i*dx,HH,0), p3(i*dx,HH,DD), st) + ln(p3(i*dx,0,DD), p3(i*dx,HH,DD), st);
      st = gridStyle(dz*C, VC[az.dim]);
      for(i=1;i<az.n;i++) body += ln(p3(0,HH,i*dz), p3(W,HH,i*dz), st) + ln(p3(W,0,i*dz), p3(W,HH,i*dz), st);
    }
    /* 三片板：每把刀留下的区间**铺满另外两根轴**——刀是板不是块，这是「一整片切穿」的形 */
    if(L2){
      function slab(x,y,z,w,h,d,dim,n){
        /* n=1 = 这把刀没切开：板就是整只盒子，照常上色会把盒子刷成一片纯色，压淡且不描棱 */
        if(n===1) return '<g opacity=".07">'+boxSVG(x,y,z,w,h,d,1,{fill:VC[dim]})+'</g>';
        return '<g opacity=".26">'+boxSVG(x,y,z,w,h,d,1,{fill:VC[dim]})+'</g>'
             + boxSVG(x,y,z,w,h,d,1,{wire:true, stroke:VC[dim], sw:.7});
      }
      body += slab(0,0,z0,W,HH,Math.max(dz,.8), az.dim, az.n);
      body += slab(x0,0,0,Math.max(dx,.8),HH,DD, ax.dim, ax.n);
      body += slab(0,y0,0,W,Math.max(dy,.8),DD, ay.dim, ay.n);
      body += boxSVG(x0,y0,z0,dx,dy,dz,1,{fill:'var(--pt-fg)', stroke:'var(--pt-fg)', sw:1});
    }
    /* 腔的棱始终画：薄到 1px 也得能定位（dz 小 = 这张卡真的只占这么一薄片，不放大骗人）。
       data-cav 是给页外核对用的把手：换 DP 副本时 data-cav="w" 的坐标必须逐字不变（A3）。 */
    body += boxSVG(x0,y0,z0,Math.max(dx,.7),Math.max(dy,.7),Math.max(dz,.7),1,
                   {wire:true, stroke:o.cav||'var(--pt-fg)', sw:1.7,
                    attrs:' data-cav="'+(o.cavId||'')+'" data-cav-size="'+dx.toFixed(3)+','+dy.toFixed(3)+','+dz.toFixed(3)+'"'});
    /* ETP：在 e 腔**内部**再沿专家自己的 ffn 维切一刀（不是外面那根 h 轴，同属「算子内部」那一类） */
    if(o.etp>1) for(i=1;i<o.etp;i++){
      var ex = x0 + dx*i/o.etp;
      body += ln(p3(ex,y0+dy,z0), p3(ex,y0+dy,z0+dz), 'stroke:'+VC.ep+';stroke-width:.8;stroke-dasharray:2 2;stroke-opacity:.8');
    }

    /* 轴尺：刀在这根轴上留下的刻度。点一格换卡（复用 chainpick 的可逆坐标算术 §07）。
       画得下写全名，写不下降成序号，再写不下只标端点与选中——降的是标注，份数一个不少。 */
    function ruler(a, A, B, out, pad, anchor){
      var pa = p3(A[0],A[1],A[2]), pb = p3(B[0],B[1],B[2]);
      var vx = (pb[0]-pa[0])/a.n, vy = (pb[1]-pa[1])/a.n;
      var step = Math.sqrt(vx*vx+vy*vy), col = VC[a.dim];
      var tier = step > 34 ? 2 : step > 13 ? 1 : 0;
      var hw = Math.max(7, Math.min(24, step*.92));
      body += ln([pa[0]+out[0]*pad, pa[1]+out[1]*pad], [pb[0]+out[0]*pad, pb[1]+out[1]*pad], 'stroke:'+col+';stroke-width:1;stroke-opacity:.65');
      for(var j=0;j<a.n;j++){
        var hot = j===a.i;
        var mx = pa[0]+vx*(j+.5)+out[0]*pad, my = pa[1]+vy*(j+.5)+out[1]*pad;
        body += ln([pa[0]+vx*j+out[0]*pad, pa[1]+vy*j+out[1]*pad], [pa[0]+vx*j+out[0]*(pad+4), pa[1]+vy*j+out[1]*(pad+4)],
                   'stroke:'+col+';stroke-width:'+(hot?1.6:.7)+';stroke-opacity:'+(hot?1:.5));
        if(L4 && (tier===2 || tier===1 || hot || j===0 || j===a.n-1))
          body += txt(mx+out[0]*11, my+out[1]*11+3, esc(tier===2 ? a.lab(j) : String(j)), hot?8.6:7.3,
                      hot?col:'var(--pt-fg3)', anchor||'middle', hot?'font-weight="800"':'');
