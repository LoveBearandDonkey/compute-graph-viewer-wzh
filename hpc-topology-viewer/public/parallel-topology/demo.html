<!-- 入口 HTML 一律不进浏览器缓存。
     资源引用已经带 ?v=<短SHA>，改了内容就换 URL、自然绕开缓存；但**页面本身**
     没有这层保护——链接一旦被收藏（尤其是带着某次构建的 ?v= 旧戳那种），
     查询串算进缓存键，浏览器就一直拿那份旧副本，页面在 Pages 上早就更新了也看不见。
     实际发生过：启动页给的链接是最新戳，手里那条旧戳链接却停在几周前的构建。
     这几个文件都是几十到几百 KB 的单文件入口，每次回源重新校验的代价可以忽略，
     换来的是「点开就是最新」。GitHub Pages 不让自定义响应头，只能走 meta。 -->
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<title>并行拓扑 · PRD Demo（应用形态）</title>
<!-- PTO Design System：与逻辑魔方 / net-sharding 同一 token 层；缺失时以下所有 var() 均带回退值 -->
<link rel="stylesheet" href="../vendor/pto-design-system/styles.css">
<!-- 真数据层（缺失时本页自动退回内置口径，单文件打开仍可用）：
     · model-graphviz/graph.js   —— openPangu 整网图：55 个真节点（35 个算子 + 6 个通信算子）
     · net-sharding/pattern.js   —— createModel() 是**纯数据层**（它自己的契约写明无 DOM/无渲染），
       带一张手工标注的 SHARD 表：每个节点被哪把刀沿哪根张量轴切、为什么、是否 partial、
       通信原语把分片状态从什么搬到什么。shardOfNode(id, rank) 还给出这张卡实际持有的区间。
     真图**没有 shape**，所以字节仍由配置算——算子行的宽度按类别权重，不冒充字节。 -->
<script src="../vendor/model-graphviz/graph.js"></script>
<script src="../vendor/net-sharding/pattern.js"></script>
<!-- 正视/侧视**不再嵌 sidecar**：这两张图改由本页自己的 SVG 渲染器重画（frontScene /
     sideScene），画的仍是同一份 OPENPANGU_GRAPH 真图 + net-sharding 真切分表——内容
     与 model-architecture-training-sidecar 那两张一致，但少了 3 份 vendor 脚本、每格
     5,686 个 DOM 节点的挂载，以及 fit/clone 那一整条时序链（正是「嵌入导致加载问题」
     的来源）。3d-deck / training-sidecar 的 css+js 因此不再引入。 -->
<link rel="stylesheet" href="../vendor/pto-tokens/foundation.css">
<link rel="stylesheet" href="../vendor/pto-tokens/semantic.css">
<link rel="stylesheet" href="../vendor/pto-tokens/components.css">
<link rel="stylesheet" href="../vendor/pto-design-system/css/style.css">
<link rel="stylesheet" href="../vendor/rubik-cube/pattern.css">
<style>
/* ════════════════════════════════════════════════════════════════════
   parallel-topology demo —— PRD 的应用形态呈现（参照逻辑魔方 pattern 的壳）。
   纪律与 net-sharding 相同：视觉一律取 token（带回退），维度只用签名色；
   五类对象五种画法：容器=线框、内容=实心体积、结构=无厚度线、地址=文字、动作=连线。
   ════════════════════════════════════════════════════════════════════ */
.pt-root{
  --pt-tp: var(--dim-tp, #22d3ee);
  --pt-pp: var(--warning, #ffaa3b);
  --pt-dp: var(--primary, #4369ef);
  --pt-ep: var(--highlight-l0a-violet-400, #9b3cf6);
  --pt-cp: var(--highlight-ub-green-600, #86c70f);
  --pt-bg: var(--background, #f6f7f9);
  --pt-s1: var(--surface-1, #ffffff);
  --pt-s2: var(--surface-2, #eef0f3);
  --pt-fg: var(--foreground, rgba(10,14,20,.92));
  --pt-fg2: var(--foreground-secondary, rgba(10,14,20,.62));
  --pt-fg3: var(--foreground-muted, rgba(10,14,20,.42));
  --pt-bd: var(--border-default, rgba(10,14,20,.14));
  --pt-bds: var(--border-strong, rgba(10,14,20,.26));
  --pt-danger: var(--danger, #d1242f);
  --pt-face1: color-mix(in srgb, var(--pt-s1) 94%, #ffffff 6%);
  --pt-face2: color-mix(in srgb, var(--pt-s1) 88%, #000000 12%);
  --pt-face3: color-mix(in srgb, var(--pt-s1) 78%, #000000 22%);
  --pt-mono: var(--font-mono, ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace);
  --pt-sans: var(--font-sans, -apple-system, "PingFang SC", "Source Han Sans SC", "Noto Sans CJK SC", sans-serif);
  position:fixed; inset:0; display:flex; flex-direction:column; overflow:hidden;
  background:var(--pt-bg); color:var(--pt-fg); font-family:var(--pt-sans); font-size:13px;
}
/* light 模式画布纯白：--background token 默认是浅灰 #f6f7f9，这里只盖 light、dark 不动。
   根变量盖底色，视窗本体（.pt-stage）再钉一层白，保证视窗背景是真白、不露灰。 */
:root[data-theme="light"] .pt-root{--pt-bg:#ffffff}
:root[data-theme="light"] .pt-stage{background:#ffffff}
.pt-root *{box-sizing:border-box}
.pt-root button{font-family:inherit; cursor:pointer}
.pt-root .mono{font-family:var(--pt-mono)}

/* ── 顶栏 ── */
.pt-bar{
  flex:none; display:flex; align-items:center; gap:10px 14px; flex-wrap:wrap;
  padding:8px 14px; border-bottom:1px solid var(--pt-bd); background:var(--pt-s1); z-index:12;
}
.pt-title{line-height:1.25; margin-right:2px}
.pt-title b{font-size:14px}
.pt-title .sub{display:block; font-size:12px; color:var(--pt-fg2)}
.pt-title .sub a{color:inherit}
/* 工具条上的控件统一成 32px 高、999 圆角：分段器（刀 / 视角）连壳算 32，
   单颗胶囊（图例 / 通信 / 数据）与开关（Rank / 整网）也是 32，一条线上齐平。 */
/* 控件要立在页面上，就得有自己的**面**和一条边：全去掉之后浅灰控件浮在浅灰页面上，
   边界靠猜（实机就是「都看不清了」）。所以底色回到卡片白、加一条 1px 细边；
   「少描边多填充」管的是控件**内部**（一格一框那种），不是控件与页面的分界。 */
.pt-seg{display:inline-flex; gap:2px; padding:3px; border:1px solid var(--pt-bd); border-radius:999px; background:var(--pt-s1)}
.pt-seg button{
  min-height:24px; padding:0 12px; font-size:12px; font-weight:600; border:none; border-radius:999px;
  background:transparent; color:var(--pt-fg2);
}
.pt-seg button:hover{color:var(--pt-fg)}
.pt-seg button.is-on{background:var(--c, var(--pt-fg)); color:var(--pt-bg)}
/* 顶栏配置分区：cBtn/kBtns/physBtn（切分）· vBtns/lBtns（机位）· mvBtn/dispBtn（标注）
   本来是 7 颗独立的 .pt-seg/.pb 胶囊各按各的贴在一起，越加越多之后读不出谁跟谁是
   一伙的。加一层分区只改视觉分组（一条竖线隔开三段），不碰任何一颗按钮自己的
   交互——物理平铺仍然是它自己的 .pt-seg（不与五刀合并，见 physBtn 处的注释），
   只是现在这三个字面上也都站在「切分」这一段里，不再孤零零飘在右边。 */
.pt-zone{display:inline-flex; align-items:center; gap:6px; padding-right:8px; margin-right:2px; border-right:1px solid var(--pt-bd)}
.pt-zone:last-child{border-right:none; padding-right:0; margin-right:0}
/* 正视的换层步进（‹ Ln ›）：与机位段控同一族，但两头是**动作**不是并列选项，
   所以收窄、读数用等宽居中；到头的那一颗按下去没有下一层，灰掉而不是留着骗点。 */
.pt-lstep button{padding:0 8px; font-family:var(--pt-mono)}
.pt-lstep button:nth-child(2){min-width:44px; color:var(--pt-fg); font-weight:700}
.pt-lstep button[disabled]{opacity:.32; pointer-events:none}
.pt-chips{display:inline-flex; gap:5px; flex-wrap:wrap; align-items:center}
.pt-chip{
  font-family:var(--pt-mono); font-size:12px; padding:3px 10px; border-radius:999px;
  border:1px solid var(--pt-bd); color:var(--pt-fg2); background:var(--pt-s1);
}
.pt-chip b{color:var(--pt-fg)}
.pt-chip.is-btn:hover{border-color:var(--pt-bds); color:var(--pt-fg)}
.pt-chip.err{color:#fff; background:var(--pt-danger); border-color:var(--pt-danger); font-weight:700}
.pt-actions{margin-left:auto; display:inline-flex; gap:6px}
.pt-actions button{
  min-height:28px; padding:0 13px; font-size:12px; font-weight:600; border-radius:999px;
  border:1px solid var(--pt-bd); background:var(--pt-s1); color:var(--pt-fg2);
}
.pt-actions button:hover{border-color:var(--pt-bds); color:var(--pt-fg)}
.pt-actions button.is-on{background:var(--pt-fg); border-color:var(--pt-fg); color:var(--pt-bg)}

/* ── 主区 ── */
.pt-main{flex:1 1 auto; position:relative; min-height:0}
.pt-stage{position:absolute; inset:0; padding:0}
/* will-change 提前把整张 SVG 提成合成层：gesture 中改它的 CSS transform 就只是
   位图拉伸（GPU 上近乎免费），不触发两三万个矢量图元的重光栅化 */
.pt-stage svg{width:100%; height:100%; display:block; will-change:transform}
.pt-rubik{position:absolute; inset:0; min-height:0}
.pt-rubik[hidden]{display:none}
/* 魔方自带一整条顶栏（着色/注入/连线/并行度输入/预设，就是它的配置面板入口）。
   不能像 sidecar 那样一藏了之——藏掉配置就没了。往下挪开我们那排胶囊即可，
   两套控件各管各的：我们的管「看哪一维、切哪几刀」，它的管魔方自己的读法。 */
.pt-rubik .prc-topbar{top:56px !important}
.pt-rubik .prc-more{top:104px !important}
.pt-rubik .prc-root{--prc-topbar-offset:56px}
/* 但它的**标题**要收掉：魔方是被我们挂进来的一格画面，不是另一张图。它自带的
   「逻辑魔方」一露出来，同一个左上角就有两个名字在争；名字统一由 .pt-stagetitle
   那一条给（关闭整网时写在副标题里）。收掉之后顶栏只剩控件一个孩子，
   space-between 会把它甩到左边，所以顺手改成靠右。 */
.pt-rubik .prc-brandname{display:none}
.pt-rubik .prc-topbar{justify-content:flex-end}
/* ── 缩放 HUD：比例读数 + 步进 + 居中/复位（3D 与正/侧/顶视共用）───────────
   浮在舞台左下角。比例是**当前视图的 zoom3**（1 = 该视角 tab 的标准机位刚好装下
   整个场景），gesture 中由 applyViewTransform 直接改数字，不等重绘。 */
.pt-zoomhud{
  position:absolute; left:14px; bottom:12px; z-index:7;
  display:flex; align-items:center; gap:4px;
  padding:4px; border-radius:999px; border:1px solid var(--pt-bd);
  background:color-mix(in srgb, var(--pt-s1) 88%, transparent);
  backdrop-filter:blur(6px);
}
.pt-zoomhud[hidden]{display:none}
.pt-zoomhud button{
  min-width:26px; height:26px; padding:0 8px; border:none; border-radius:999px;
  background:transparent; color:var(--pt-fg2); font-size:13px; font-weight:700; line-height:1;
}
.pt-zoomhud button:hover{background:var(--pt-s2); color:var(--pt-fg)}
.pt-zoomhud .zpct{
  font-family:var(--pt-mono); font-size:12px; font-weight:700; min-width:52px;
  color:var(--pt-fg); text-align:center;
}
.pt-zoomhud .zsep{width:1px; height:16px; background:var(--pt-bd); margin:0 2px}
/* 居中/复位两枚改画图标。PTO 那套设计系统只给了图标**槽位**的约定（.btn-icon /
   .cp-btn-icon：正方、padding 0、内容居中、图形吃 currentColor），没随包发图形资产，
   所以图按同一套笔法自己画：16 视框、1.6 描边、圆头圆角，和启动页 .src 那些一个手感。
   svg 不吃点击，省得 data-act 的事件委托要从 <path> 往上爬。 */
.pt-zoomhud .zicon{
  width:26px; min-width:26px; padding:0;
  display:inline-flex; align-items:center; justify-content:center;
}
.pt-zoomhud .zicon svg{width:16px; height:16px; display:block; pointer-events:none}
/* ── 选组 HUD：TP·SP / CP / EP / DP / PP 的「看哪一组」切换，样式与缩放 HUD 同族。
   这些切换在四个视角里是**同一个东西**，所以做成一条统一的悬浮配置栏钉在画布
   下沿居中，不随图缩放平移；3D 场景里贴着图的那几条轨照旧（图内语境读数）。
   每个并行维一张独立的小圆角卡（tab），容器本身透明只管排版；容器不吃点击
   （pointer-events:none），tab 之间的空隙照样能拖画布。
   从画布左下角贴边居左排。能一行排就一行：fitGroupHud 量过不换行的自然宽度，
   贴底那条带（右侧给缩放 HUD 留 224px＝HUD 自身 194 + 贴边 14 + 留白 16；居中/复位
   两枚从两字文字按钮改成图标之后 HUD 从 222 缩到 194，这个数跟着一起收）装得下
   就贴底一行；装不下加 .is-lift
   整条抬到缩放 HUD 上面用全宽。全宽仍装不下四组并排时，不再硬挤成 flex-wrap
   换行——组挨组各占一截、断在哪全看窗口宽度，读者得自己拼——改成收成一颗按钮
   （.is-collapsed），点开是竖排小卡：一组一行，组内该怎么换行还怎么换，但组与
   组之间不再抢同一行的位置（见 .pt-ghsummary、renderGroupHud、fitGroupHud）。
   容器写死 flex-wrap:nowrap：这三档本来就是「一行 → 抬起来一行 → 收成一颗钮」，
   中间没有「换行」这一档。可它原来仍留着 flex-wrap:wrap，于是只要 fitGroupHud
   量宽度时字体还没换完（等宽/中文字体 swap 之后每格都会宽几像素），量出来的
   need 偏小、判定「装得下」，实际布局却挤不下——四组就断成两行，DP 那组孤零零
   掉到第二行，正是自己注释里说要避免的那种断法。nowrap 之后量偏了最多是右边
   顶出去一点点，不会再断行；下面另加一次 fonts.ready 之后的重量，把量偏本身修掉。
   点选走 data-act=chainpick，与图内轨/门牌同一套坐标算术。 */
.pt-grouphud{
  position:absolute; left:14px; right:224px; bottom:12px; z-index:7;
  display:flex; flex-wrap:nowrap; align-items:center; justify-content:flex-start; gap:6px 10px;
  pointer-events:none;
}
.pt-grouphud.is-lift{right:14px; bottom:52px}
.pt-grouphud[hidden]{display:none}
/* 一组一张卡：**填充**画出边界，不再描边。一排十几格、四组并排时，格格带框就是
   几十条线堆在一起，颜色也跟着乘上去——颜色在这一屏是有含义的（每把刀一个色），
   一旦每一格都染上，那个含义就被稀释成装饰了。所以：格子用中性填充，
   颜色只留给**选中的那一格**（它是这排门牌唯一要回答的问题：现在看的是第几组）。 */
.pt-ghgrp{
  display:inline-flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:3px;
  max-width:100%; padding:5px 11px; border-radius:12px; border:1px solid var(--pt-bd);
  background:color-mix(in srgb, var(--pt-s1) 92%, transparent);
  box-shadow:0 1px 3px rgba(0,0,0,.05);
  backdrop-filter:blur(6px); pointer-events:auto;
}
.pt-ghgrp > b{font-family:var(--pt-mono); font-size:12px; font-weight:800; margin-right:2px; color:var(--c); white-space:nowrap}
.pt-ghc{
  min-width:20px; height:19px; padding:0 6px; border-radius:8px; border:0;
  background:color-mix(in srgb, var(--pt-fg) 10%, transparent);
  color:var(--pt-fg2); font-family:var(--pt-mono); font-size:12px; font-weight:700; line-height:19px; white-space:nowrap;
}
.pt-ghc.is-on{background:var(--c); color:#fff}
/* 选组 HUD 是四个机位唯一都在的那条控件——它读的也是 sel，所以来路也得说清楚：
   过路高亮时不填实底，改成"虚线描边 + 本色文字"。跟画布上那圈虚线外框是同一句话，
   只是换成了 HTML 的说法（SVG 里那圈用不上，按钮本来就有边框位可用）。 */
.pt-ghc.is-on.is-hl{background:none; color:var(--c); box-shadow:inset 0 0 0 1.4px var(--c);
  border:1px dashed var(--c); line-height:17px; padding:0 5px}
.pt-ghc:hover{background:color-mix(in srgb, var(--pt-fg) 20%, transparent); color:var(--pt-fg)}
.pt-ghc.is-on:hover{background:var(--c); color:#fff}
.pt-ghc.is-on.is-hl:hover{background:none; color:var(--c)}
/* 收起态：.pt-gh-groups 平时是 display:contents（对 flex 布局透明，四张组卡
   直接当 .pt-grouphud 自己的 flex item，量宽度、换行都跟没包过一层一样）。
   连全宽都装不下时才切成收起——这时把它整个藏起来，换一颗按钮站台。 */
.pt-gh-groups{display:contents}
.pt-grouphud.is-collapsed .pt-gh-groups{display:none}
.pt-ghsummary{
  display:none; align-items:center; gap:5px; height:26px; padding:0 10px 0 12px; border-radius:12px;
  border:1px solid var(--pt-bd); background:color-mix(in srgb, var(--pt-s1) 92%, transparent);
  box-shadow:0 1px 3px rgba(0,0,0,.05); backdrop-filter:blur(6px); pointer-events:auto;
  font-family:var(--pt-mono); font-size:12px; font-weight:700; color:var(--pt-fg2);
}
.pt-ghsummary:hover{color:var(--pt-fg); border-color:var(--pt-bds)}
.pt-ghsummary b{
  min-width:18px; height:18px; padding:0 4px; border-radius:999px; font-size:12px; line-height:18px;
  background:var(--pt-s2); color:var(--pt-fg2); font-family:var(--pt-mono);
}
.pt-ghsummary i{font-style:normal; font-size:12px; opacity:.7}
.pt-grouphud.is-collapsed .pt-ghsummary{display:inline-flex}
/* 展开：竖排一张浮卡，钉在按钮正上方——不再挤那一整条底边，所以不用再证明
   「四组能不能排成一行」，一组一行，组内该怎么换行还怎么换（.pt-ghgrp 自带
   flex-wrap）。宽度上限由 fitGroupHud 按容器实测写成 --gh-panel-max。 */
.pt-grouphud.is-collapsed.is-open .pt-gh-groups{
  display:flex; flex-direction:column; align-items:flex-start; gap:6px;
  position:absolute; left:0; bottom:32px; z-index:8; max-width:var(--gh-panel-max, 380px);
  background:var(--pt-s1); border:1px solid var(--pt-bd); border-radius:14px; padding:9px;
  box-shadow:0 10px 30px rgba(0,0,0,.16); pointer-events:auto;
}
.pt-stagebar{
  position:absolute; top:10px; right:14px; z-index:6; display:flex; gap:6px; flex-wrap:wrap; align-items:center;
  justify-content:flex-end; max-width:min(82%, 940px);
}
/* ── 舞台右上只留一颗配置钮 ────────────────────────────────────────────
   原来这条工具条上并排摆着七八组控件（模式 / 五刀 / 物理 / 四个机位 / 换层 /
   数据 / 显示），窄一点的容器里它自己换行、糊成三四行压在画布上（工作台那两格
   400–620px 宽时最明显）。全部收进一颗按钮里的面板，画布上只剩这颗钮和「搜索」
   ——搜索是**提问**（我想找哪张卡），其余是**配置**（这一屏怎么画），两件事。
   形制照 vendor/rubik-cube 那颗：圆钮 + 一枚推杆图标，点开是一列分组。 */
.pt-cfg{position:relative; display:inline-flex}
.pt-cfgbtn{
  width:38px; height:38px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center;
  border:1px solid var(--pt-bd); background:var(--pt-s1); color:var(--pt-fg2); box-shadow:0 2px 8px rgba(0,0,0,.08);
}
.pt-cfgbtn:hover{background:var(--pt-s2); border-color:var(--pt-bds); color:var(--pt-fg)}
.pt-cfgbtn.is-on{background:var(--pt-fg); border-color:var(--pt-fg); color:var(--pt-bg)}
/* 面板**常驻 DOM**、只用 display 收起：工作台（combo-workbench）靠翻进 iframe 点
   [data-act=mvpick] 来同步「数据标注」那几类，节点如果随开合进出 DOM，它就同步
   不到了。收起时不占位、不吃事件，行为与「不在」一样。 */
.pt-cfgpanel{display:none}
.pt-cfgpanel.is-open{
  display:block; position:absolute; top:44px; right:0; z-index:22;
  /* 302px 太窄：并行度那五格＋应用被挤到换行，通信连线/数据标注那两组
     逐条竖排的勾选（各 5 条）又把面板拉得比视口还高，纵向必出滚动条。
     宽度放宽到能装下五格并行度那一整行；勾选列表改两栏（见下），
     两者一起把纵向长度压下来，先天不必滚动才是目标，不是滚得动就行。 */
  width:min(var(--settings-panel-width), calc(100vw - 32px));
  /* 640px 那道硬顶是老版本按 302px 窄面板估的余量，宽度/两栏都改完之后内容还是
     比它高（七组东西摞起来，实测 784px）——顶得太低，宽度那些改动等于白做，
     滚动条照样出现。改成只用视口高度兜底（88vh），不再叠一个更小的硬顶。 */
  max-height:calc(100vh - 116px); overflow:auto; scrollbar-gutter:stable;
  background:var(--settings-panel-bg); border:1px solid var(--settings-panel-border);
  border-radius:var(--settings-panel-radius); padding:var(--settings-panel-padding);
  box-shadow:var(--settings-panel-shadow);
}
.pt-root.embed .pt-cfgpanel.is-open{max-height:calc(100vh - 68px)}
.pt-cfgpanel .cg{padding:var(--settings-section-padding-y) 0; border-top:1px solid var(--border-subtle); display:flex; flex-wrap:wrap; gap:var(--settings-section-gap)}
.pt-cfgpanel .cg > h6, .pt-cfgpanel .cg > .cgrow, .pt-cfgpanel .cg > .pnum, .pt-cfgpanel .cg > .cnote, .pt-cfgpanel .cg > .acts{flex:1 1 100%}
/* 通信连线 / 数据标注：逐条竖排在窄面板里没办法，面板宽了就该收成两栏——
   同样五条，高度砍掉近一半。 */
.pt-cfgpanel .cg > button.mvi{flex:1 1 calc(50% - 4px)}
.pt-cfgpanel .cg:first-child{border-top:0; padding-top:0}
.pt-cfgpanel h6{
  margin:0; font:var(--type-label); letter-spacing:.04em;
  color:var(--settings-section-label-fg); font-weight:600;
}
.pt-cfgpanel .cgrow{display:flex; gap:8px; flex-wrap:wrap; align-items:center; animation:none}
.pt-cfgpanel .pb, .pt-cfgpanel .pt-sw, .pt-cfgpanel .pt-seg button{height:var(--settings-control-height); font-size:var(--settings-content-font-size)}
.pt-cfgpanel .pt-seg{padding:3px; border-radius:var(--settings-control-radius); background:var(--segmented-control-bg); border-color:var(--segmented-control-border)}
.pt-cfgpanel .pt-seg button{border-radius:var(--radius-sm)}
/* 「观察方式」里逻辑切分下答不上的两组（卡片内容/设备排列）：置灰但不消失，
   位置留住，读者知道「切到设备视图就能点」，不用东找西找。 */
.pt-cfgpanel .pt-seg button:disabled{opacity:var(--button-disabled-opacity); cursor:not-allowed}
.pt-cfgpanel .pt-sw{padding:0 6px; border:0; border-radius:var(--settings-control-radius); background:transparent}
.pt-cfgpanel .pt-sw:hover{background:var(--state-hover); border-color:transparent}
.pt-cfgpanel .pt-sw i{width:var(--switch-width); height:var(--switch-height); background:var(--switch-bg)}
.pt-cfgpanel .pt-sw i::after{width:var(--switch-thumb-size); height:var(--switch-thumb-size)}
.pt-cfgpanel .pt-sw.is-on{border-color:transparent}
.pt-cfgpanel .pt-sw.is-on i{background:var(--switch-bg-checked)}
/* 并行度：五个数字格 + 一颗「应用」。**不即时生效**——一位一位敲的中间值
   （tp 从 16 敲成 2 时会先经过 1）每一下都重推一次整张图，画面乱闪、还会
   顺带弹出一堆约束报错。攒在草稿里，按「应用」或回车才落。 */
.pt-cfgpanel .pnum{display:flex; gap:8px; flex-wrap:wrap; align-items:flex-end}
.pt-cfgpanel .pnum label{display:flex; flex-direction:column; gap:4px; font-size:var(--settings-content-font-size); color:var(--pt-fg3); font-family:var(--pt-mono)}
.pt-cfgpanel .pnum label b{font-weight:700; letter-spacing:.06em}
.pt-cfgpanel .pnum input{
  width:48px; height:var(--settings-control-height); padding:0 8px; border-radius:var(--input-radius); border:1px solid var(--input-border);
  background:var(--input-bg); color:var(--pt-fg); font-family:var(--pt-mono); font-size:var(--settings-content-font-size); text-align:center;
}
.pt-cfgpanel .pnum input:focus-visible{outline:none; border-color:var(--primary); box-shadow:0 0 0 3px var(--focus-ring)}
.pt-cfgpanel .pnum .derv{
  height:var(--settings-control-height); min-width:48px; padding:0 8px; border-radius:var(--input-radius); border:1px dashed var(--input-border);
  display:flex; align-items:center; justify-content:center; color:var(--pt-fg2);
  font-family:var(--pt-mono); font-size:var(--settings-content-font-size);
}
.pt-cfgpanel .capply{
  height:var(--settings-control-height); padding:0 12px; border-radius:var(--button-radius); border:1px solid transparent;
  background:var(--button-solid-bg); color:var(--button-solid-fg); font-size:var(--settings-content-font-size); font-weight:600;
}
.pt-cfgpanel .capply:hover:not(:disabled){background:var(--button-solid-bg-hover)}
.pt-cfgpanel .capply:focus-visible{outline:none; box-shadow:0 0 0 3px var(--focus-ring)}
.pt-cfgpanel .capply:disabled{opacity:var(--button-disabled-opacity); cursor:not-allowed}
.pt-cfgpanel .cnote{margin-top:0; font-size:var(--settings-content-font-size); color:var(--pt-fg3); line-height:var(--settings-content-line-height)}
/* 逐类勾选（通信 / 图层 / 数据标注）复用数据下拉那套勾的长相 */
.pt-cfgpanel button.mvi{
  display:flex; width:100%; min-height:var(--settings-control-height); align-items:center; gap:8px; text-align:left; margin:0;
  border:0; background:none; padding:0 8px; border-radius:var(--radius-sm); color:var(--pt-fg); font-size:var(--settings-content-font-size); font-weight:500;
}
.pt-cfgpanel button.mvi:hover{background:var(--pt-s2)}
.pt-cfgpanel button.mvi s{
  flex:none; width:var(--checkbox-size); height:var(--checkbox-size); border-radius:var(--checkbox-radius); border:1px solid var(--checkbox-border);
  text-decoration:none; color:transparent; font-size:12px; line-height:14px; text-align:center;
}
.pt-cfgpanel button.mvi.is-on s{background:var(--checkbox-bg-checked); border-color:var(--checkbox-bg-checked); color:var(--checkbox-fg-checked)}
.pt-cfgpanel button.mvi em{margin-left:auto; font-style:normal; font-size:var(--settings-content-font-size); color:var(--pt-fg3); font-family:var(--pt-mono)}
.pt-cfgpanel button.mvi[disabled]{opacity:var(--button-disabled-opacity); cursor:not-allowed}
.pt-cfgpanel .acts{display:flex; gap:8px; margin:0}
.pt-cfgpanel .acts button{
  flex:1; height:var(--settings-control-height); border-radius:var(--button-radius); border:1px solid var(--button-outline-border);
  background:var(--button-outline-bg); color:var(--button-outline-fg); font-size:var(--settings-content-font-size); font-weight:500;
}
.pt-cfgpanel .acts button:hover{background:var(--button-outline-bg-hover); border-color:var(--button-outline-border); color:var(--pt-fg)}
.pt-cfgpanel .acts button:focus-visible{outline:none; box-shadow:0 0 0 3px var(--focus-ring)}
/* 画布的名字：与右上工具条同一条基线，裸文字不放卡片上（沿用魔方 pattern 的做法）。
   默认不显示——顶栏在的时候那儿已经写着「并行拓扑」了，这里再来一遍就是印两遍。 */
.pt-stagetitle{
  position:absolute; top:10px; left:16px; z-index:6; display:none;
  align-items:flex-start; min-height:44px; pointer-events:none;
}
.pt-root.embed .pt-stagetitle{display:flex; gap:10px; pointer-events:auto; z-index:8}
.pt-stagetitle b{font-size:15px; font-weight:800; letter-spacing:-.01em; color:var(--pt-fg); white-space:nowrap}
/* 返回钮的位置：舞台左上角。顶栏在的时候画布左上是空的，直接顶到 10px；
   嵌入形态那儿写着画布的名字，就让到名字下面一行（名字那行 min-height 44px）。 */
.pt-backbar{position:absolute; top:10px; left:16px; z-index:9; display:flex; align-items:center; gap:8px}
.pt-backbar[hidden]{display:none}
.pt-root.embed .pt-backbar{top:56px}
.pt-backbar .pb{font-weight:700}
.pt-stagecopy{display:flex; align-items:center; gap:6px; max-width:min(540px, calc(100vw - 110px)); pointer-events:none}
/* 名字后面那颗「？」：原来常驻一行小字复述这句话，占着画布一行空间；
   收进这颗徽标里，需要的人悬停/聚焦才看到，原生 title 属性做提示，
   不用另起一套 tooltip 组件。它自己要接得住悬停，所以单独把 pointer-events 开回来。 */
.pt-stagehelp{
  pointer-events:auto; flex:none; width:15px; height:15px; border-radius:50%; padding:0;
  border:1px solid var(--pt-bd); background:var(--pt-s1); color:var(--pt-fg3);
  font-size:10px; font-weight:700; line-height:1; display:inline-flex; align-items:center; justify-content:center;
  cursor:help;
}
.pt-stagehelp:hover{color:var(--pt-fg2); border-color:var(--pt-fg3)}
.pb{
  height:32px; padding:0 14px; font-size:12.5px; font-weight:700; border-radius:999px;
  border:1px solid var(--pt-bd); background:var(--pt-s1); color:var(--pt-fg2);
}
/* 模式开关比旁边那些筛选胶囊重一档：它切换的是整屏在讲什么，不是过滤一个维度。
   实心底、白字、更大的字号，一眼看得出「这是主开关」。 */
/* ── 模式开关（Rank / 整网）：二元状态用开关组件，不用动作按钮、不上颜色。
   颜色在这一屏是有含义的（每把刀一个色），模式开关借来用会串味；状态交给拨钮说。 */
.pt-sw{
  display:inline-flex; align-items:center; gap:8px; height:32px; padding:0 14px 0 10px;
  border-radius:999px; border:1px solid var(--pt-bd); background:var(--pt-s1);
  color:var(--pt-fg2); font-size:12.5px; font-weight:700;
}
.pt-sw:hover{background:var(--pt-s2); border-color:var(--pt-bds); color:var(--pt-fg)}
.pt-sw i{
  flex:none; width:28px; height:16px; border-radius:999px; background:var(--pt-bds);
  position:relative; transition:background .16s;
}
.pt-sw i::after{
  content:''; position:absolute; top:2px; left:2px; width:12px; height:12px; border-radius:50%;
  background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.25); transition:left .16s;
}
.pt-sw.is-on{color:var(--pt-fg); border-color:var(--pt-bds)}
.pt-sw.is-on i{background:var(--pt-fg)}
.pt-sw.is-on i::after{left:14px}
.pb:hover{background:var(--pt-s2); border-color:var(--pt-bds); color:var(--pt-fg)}
.pb.is-on{background:var(--pt-fg); color:var(--pt-bg)}
/* 刀序带上「本刀」那一颗染本刀的色，不用通用的黑底：颜色在这一屏是有含义的
   （青=TP·SP 紫=EP 橙=PP 蓝=DP 绿=CP），选中态染成黑的等于把这条含义丢掉。
   与选组 HUD 里 .pt-ghc.is-on 同一条规矩。 */
.pt-cutseq.is-on{background:var(--c); color:#fff; border-color:var(--c)}
.pb:disabled{opacity:.38; cursor:not-allowed; text-decoration:line-through}
.pb.mono{font-family:var(--pt-mono); font-weight:600}
.pb .cmn{font-size:12px; opacity:.75; margin-left:4px; font-weight:400}
.pt-cap{font-family:var(--pt-mono); font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--pt-fg3); align-self:center; margin:0 2px}
/* ── 数据标注多选（数值 / 梯度 / 性能 / MoE / 训练）：与 training-sidecar 的
   「数据」按钮同一套交互——按钮上带计数，展开是一列勾选 + 全选/全部隐藏。
   它不是刀（不改变切分），也不是单一图层（一次管五类），所以给它一个自己的
   下拉，而不是往工具条上再摊五颗胶囊。 */
.pt-mv{position:relative; display:inline-flex}
.pt-mv > .pb{display:inline-flex; align-items:center; gap:5px}
.pt-mv > .pb b{
  min-width:18px; height:18px; padding:0 4px; border-radius:999px; font-size:12px; line-height:18px;
  background:var(--pt-s2); color:var(--pt-fg2); font-family:var(--pt-mono);
}
/* 这颗按钮不该用实心色块喊话：它是个筛选器，不是状态开关，实心橙一压
   整条工具条的重心就跑到它身上了。改成描边 + 中性底，只有计数那颗小胶囊提示
   「开着几类」。菜单里同理——五个勾一律用中性色，行底不再各染各的。 */
.pt-mv > .pb.is-on{
  background:color-mix(in srgb, var(--pt-fg) 9%, transparent); color:var(--pt-fg);
}
.pt-mv > .pb.is-on b{background:var(--pt-s2); color:var(--pt-fg2)}
.pt-mv > .pb i{font-style:normal; font-size:12px; opacity:.7}
.pt-mvmenu{
  position:absolute; top:32px; right:0; z-index:20; width:190px;
  background:var(--menu-bg); border:1px solid var(--menu-border); border-radius:var(--menu-radius); padding:var(--menu-padding);
  box-shadow:var(--menu-shadow);
}
.pt-mvmenu .acts{display:flex; gap:6px; margin-bottom:7px}
.pt-mvmenu .acts button{
  flex:1; height:var(--settings-control-height); border-radius:var(--button-radius); border:1px solid var(--button-outline-border);
  background:var(--button-outline-bg); color:var(--button-outline-fg); font-size:12px; font-weight:500;
}
.pt-mvmenu .acts button:hover{background:var(--button-outline-bg-hover); border-color:var(--button-outline-border); color:var(--pt-fg)}
.pt-mvmenu > button.mvi{
  display:flex; width:100%; min-height:var(--menu-item-height); align-items:center; gap:8px; text-align:left; margin:0;
  border:0; background:none; padding:0 var(--menu-item-padding-x); border-radius:var(--menu-item-radius); color:var(--pt-fg); font-size:12px; font-weight:500;
}
.pt-mvmenu > button.mvi:hover{background:var(--pt-s2)}
.pt-mvmenu > button.mvi.is-on{background:transparent}
.pt-mvmenu > button.mvi s{
  flex:none; width:var(--checkbox-size); height:var(--checkbox-size); border-radius:var(--checkbox-radius); border:1px solid var(--checkbox-border);
  text-decoration:none; color:transparent; font-size:12px; line-height:14px; text-align:center;
}
.pt-mvmenu > button.mvi.is-on s{background:var(--checkbox-bg-checked); border-color:var(--checkbox-bg-checked); color:var(--checkbox-fg-checked)}
.pt-mvmenu > button.mvi em{margin-left:auto; font-style:normal; font-size:12px; color:var(--pt-fg3); font-family:var(--pt-mono)}
/* ── 算子明细卡：点一个算子，完整读数**跟着那个算子**浮出来（图上写的只是摘要）。
   跟随而不是固定在角落：读数与它说的那个东西之间要有视线上的连线，
   卡飘在角落的话，读者得自己记住刚才点的是哪一个。缩放/平移时重新贴位。 */
.pt-opcard{
  position:absolute; z-index:9; width:300px; max-height:calc(100% - 24px); overflow:auto;
  background:var(--pt-s1); border:1px solid var(--pt-bd); border-radius:14px;
  box-shadow:0 10px 34px rgba(0,0,0,.18); padding:13px 15px 12px;
}
.pt-opcard[hidden]{display:none}
/* ── 选中 rank 的容器卡：128 只壳里塞不下的「卡里装了什么」，点亮哪只给哪只浮出来。
   钉在左下（底沿让开 groupHud 那排选组 pill）；场景转台/缩放都不影响它——
   它读的是选中卡的账，不是机位。 */
.pt-rankmem{
  position:absolute; left:14px; bottom:60px; z-index:8; width:340px;
  max-height:calc(100% - 92px); overflow:auto;
  background:var(--pt-s1); border:1px solid var(--pt-bd); border-radius:14px;
  box-shadow:0 10px 34px rgba(0,0,0,.16); padding:10px 13px 8px;
}
.pt-rankmem[hidden]{display:none}
.pt-rankmem .rm-h{display:flex; align-items:center; gap:6px; flex-wrap:wrap}
.pt-rankmem .rm-h b{font-size:14px; font-weight:800; color:var(--pt-fg); white-space:nowrap}
.pt-rankmem .rm-h span{font-family:var(--pt-mono); font-size:12px; color:var(--pt-fg3); flex:1; line-height:1.35}
.pt-rankmem .rm-x{
  margin-left:auto; border:1px solid var(--pt-bd); background:none; border-radius:8px;
  width:22px; height:22px; line-height:1; cursor:pointer; color:var(--pt-fg3); font-size:12px;
}
.pt-rankmem .rm-x:hover{color:var(--pt-fg); border-color:var(--pt-bds)}
.pt-rankmem svg{display:block; width:100%; height:auto; margin-top:2px}
/* ── 可点的那几行（每一档 / 权重里每一块）────────────────────────────────
   整行都是命中面：这些行本来就窄（11.5px 的表格行），只让色块或文字可点的话
   要瞄准，而这一步的动作是「我要看这一块」，不该考验鼠标。
   选中那行反白一层它**自己的**颜色（--rmc 由行内 style 给），于是「点开的是
   哪一块」在图例上与卡上那条带同一个颜色，不用回头对照。 */
.pt-rankmem tr.rm-p{cursor:pointer}
.pt-rankmem tr.rm-p:hover > td{background:var(--pt-s2)}
.pt-rankmem tr.rm-p.on > td{
  background:color-mix(in srgb, var(--rmc, var(--pt-fg)) 16%, transparent);
}
.pt-rankmem tr.rm-p.on > td:first-child{box-shadow:inset 2px 0 0 var(--rmc, var(--pt-fg))}
/* 二级读数：点开一块之后跟在表格下面的那一段。不另开浮层——它讲的是表里
   某一行的内部，浮层会把它和那一行的关系切断。 */
.pt-rankmem .rm-d{
  margin-top:5px; padding:7px 8px 6px; border-radius:9px;
  background:var(--pt-s2); border:1px solid var(--pt-bd);
  font-family:var(--pt-mono); font-size:12px; line-height:1.5; color:var(--pt-fg2);
}
.pt-rankmem .rm-d .rm-dh{display:flex; align-items:center; gap:5px; margin-bottom:3px}
.pt-rankmem .rm-d .rm-dh b{font-size:12px; color:var(--pt-fg); font-weight:800}
.pt-rankmem .rm-d .rm-dh .rm-dx{
  margin-left:auto; border:0; background:none; cursor:pointer;
  color:var(--pt-fg3); font-size:12px; line-height:1; padding:1px 3px;
}
.pt-rankmem .rm-d .rm-dh .rm-dx:hover{color:var(--pt-fg)}
.pt-rankmem .rm-d dl{display:grid; grid-template-columns:auto 1fr; gap:1px 8px; margin:0}
.pt-rankmem .rm-d dt{color:var(--pt-fg3); white-space:nowrap}
.pt-rankmem .rm-d dd{margin:0; color:var(--pt-fg2)}
.pt-rankmem .rm-d .rm-note{margin-top:3px; color:var(--pt-fg3); font-size:12px; line-height:1.5}
/* 通信五元组：一次搬运记全需要五样（源 / 张量含前后 layout / 并行域 / 原语 / 宿）。
   每一条独占一块、左边一道刀色竖条——同一档下常常有两三条（激活就有 PP/CP/TP 三条），
   连成一段文字会分不清哪一行属于哪一条。 */
.pt-rankmem .rm-d .c5{margin-top:5px; padding:4px 0 4px 8px; border-left:2px solid var(--c, var(--pt-bd))}
.pt-rankmem .rm-d .c5.off{opacity:.55; border-left-style:dashed}
.pt-rankmem .rm-d .c5 .c5h{color:var(--pt-fg); font-weight:700; margin-bottom:2px}
.pt-rankmem .rm-d .c5 .c5h .c5d{color:var(--c); font-weight:800; margin-right:4px}
.pt-rankmem .rm-d .c5 dd b{color:var(--pt-fg); font-weight:700}
.pt-rankmem .rm-d .c5why{color:var(--pt-fg3); font-size:11.5px; line-height:1.45}
/* ── solo 档（第三档单卡下钻）的浮卡群：显存构成不再挤进一张带嵌套明细的
   表格（.pt-rankmem），拆成几张"纯卡片"各自贴着卡壳上那一条带浮着——
   参照 incident-canvas 关键少数看板"关键数据都是卡片悬浮在画布上"那条
   语汇，也是反馈原话"纯卡片"。容器本身不接管点击（转台/缩放的拖拽要
   照常落到画布上），每张卡自己开一小块热区。 */
.pt-memcards{position:absolute; inset:0; z-index:8; pointer-events:none}
.pt-memcards[hidden]{display:none}
.mc-card{
  position:absolute; pointer-events:none; width:148px;
  background:var(--pt-s1); border:1px solid var(--pt-bd); border-radius:10px;
  box-shadow:0 6px 20px rgba(0,0,0,.16); padding:7px 10px;
  font-family:var(--pt-mono); transition:opacity .15s ease;
}
.mc-card .mc-k{font-size:11px; color:var(--pt-fg3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.mc-card .mc-v{font-size:14px; font-weight:800; color:var(--pt-fg); margin-top:1px}
.mc-card.mc-over .mc-v{color:var(--mc-over-c, var(--pt-danger))}
/* 每张卡自己一根引线，指回它在卡壳上那条带——纯色细线，不抢卡片本身的注意力。 */
.mc-leader{position:absolute; height:1.5px; background:rgba(255,255,255,.55); transform-origin:0 50%; pointer-events:none; box-shadow:0 0 2px rgba(0,0,0,.4)}
/* 汇总卡（rank 号 + 坐标 + 合计/余量）：这一组浮卡里唯一一张"这是谁"的卡，
   钉在卡壳门牌旁边，字号比单档卡大一档、宽一档，一眼分得出它是索引不是数据。 */
.mc-sum{width:190px}
.mc-sum .mc-rank{font-size:15px; font-weight:800; color:var(--pt-fg)}
.mc-sum .mc-coord{font-size:11px; color:var(--pt-fg3); margin-top:1px; line-height:1.4}
.mc-sum .mc-tot{margin-top:5px; padding-top:5px; border-top:1px solid var(--pt-bd); font-size:12.5px; font-weight:800; color:var(--pt-fg)}
.mc-sum.mc-over .mc-tot{color:var(--mc-over-c, var(--pt-danger))}
.mc-sum .mc-rem{font-size:11px; color:var(--pt-fg3); font-weight:400}
/* 粒度标签：三级粒度（副本之间 / 分块之间 / 段与段之间 / rank 内）要一眼能比，
   所以每块都带一枚，位置固定在原语那一行下面。 */
.pt-rankmem .rm-d .c5gr{color:var(--c, var(--pt-fg3)); font-size:10.5px; letter-spacing:.04em; opacity:.85; margin-bottom:2px}
.pt-rankmem .rm-d .c5g{margin:3px 0 4px}
/* 九层可观测性（§15 六）落在这一条边上，再加一格物理侧的「载体」＝十格：
   实心答得出、描边只答了一半、
   虚线是缺、极淡是不适用。做成格子而不是一句话，是因为这九层的**缺口位置**本身
   就是结论（缺首尾两端 vs 缺中间完全不是一回事），位置只有排成一排才读得出来。 */
.pt-seg.pt-seg-wrap{flex-wrap:wrap}
.pt-rankmem .rm-d .c5m{display:flex; gap:2px; margin-top:5px; flex-wrap:wrap}
.pt-rankmem .rm-d .c5m i{font-style:normal; font-size:9.5px; line-height:15px; min-width:17px; padding:0 1px;
  text-align:center; border-radius:3px; border:1px solid var(--pt-bd); color:var(--pt-fg3); background:var(--pt-bg)}
.pt-rankmem .rm-d .c5m i.y{background:var(--c, var(--pt-fg2)); border-color:var(--c, var(--pt-fg2)); color:var(--pt-bg); font-weight:700}
.pt-rankmem .rm-d .c5m i.h{border-color:var(--c, var(--pt-fg2)); color:var(--c, var(--pt-fg2)); font-weight:700}
.pt-rankmem .rm-d .c5m i.n{border-style:dashed}
.pt-rankmem .rm-d .c5m i.na{opacity:.32}
.pt-rankmem .rm-d .c5m i.go{cursor:pointer}
.pt-rankmem .rm-d .c5m i.go:hover{border-color:var(--pt-fg2); color:var(--pt-fg)}
/* 体腔小图：图在上、一行标注在下。标注只写图上读不出来的那点（区间、口径），
   图上已经画着的（几份、第几份）不再抄一遍。 */
.pt-rankmem .rm-d .rm-fig{margin:4px 0 2px}
.pt-rankmem .rm-d .rm-fig svg{width:auto; max-width:100%; margin:0}
.pt-rankmem .rm-d .rm-cap{display:block; color:var(--pt-fg3); font-size:12px; line-height:1.5; margin-top:2px}
.pt-opcard .oc-h{display:flex; align-items:flex-start; gap:10px}
.pt-opcard .oc-k{
  font-family:var(--pt-mono); font-size:12px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--c, var(--pt-accent, #4f6bed)); font-weight:700;
}
.pt-opcard h4{margin:3px 0 0; font-size:15px; font-weight:800; color:var(--pt-fg); line-height:1.3}
.pt-opcard .oc-x{
  margin-left:auto; flex:none; width:26px; height:26px; border-radius:999px; border:1px solid var(--pt-bd);
  background:var(--pt-s2); color:var(--pt-fg2); font-size:14px; line-height:1;
}
.pt-opcard .oc-x:hover{color:var(--pt-fg); border-color:var(--pt-bds)}
.pt-opcard .oc-d{margin:8px 0 0; font-size:12px; line-height:1.6; color:var(--pt-fg2)}
.pt-opcard .oc-v{margin-top:10px; background:var(--pt-s2); border-radius:10px; padding:8px 10px}
.pt-opcard .oc-v div{display:flex; gap:10px; align-items:baseline; padding:3px 0}
.pt-opcard .oc-v span{font-family:var(--pt-mono); font-size:12px; color:var(--pt-fg3); flex:1}
.pt-opcard .oc-v b{font-family:var(--pt-mono); font-size:16px; font-weight:700; color:var(--pt-fg)}
.pt-opcard .oc-s{
  margin-top:9px; padding:7px 10px; border-radius:9px; font-size:12px; font-weight:700;
  border:1px solid color-mix(in srgb, var(--sc) 45%, transparent);
  background:color-mix(in srgb, var(--sc) 12%, transparent); color:var(--sc);
}
.pt-opcard .oc-f{margin-top:9px; font-family:var(--pt-mono); font-size:12px; line-height:1.6; color:var(--pt-fg3)}

/* 浮动卡通用 */
.pt-card{
  position:absolute; z-index:8; background:var(--pt-s1); border:1px solid var(--pt-bd);
  border-radius:14px; box-shadow:0 8px 28px rgba(0,0,0,.14); padding:12px 14px;
}
/* 右侧读出卡（FR-3） */
/* 从工具条下面起头：top:10px 时它会顶到胶囊那一排底下，把「EP」和「卡维度」
   这两颗按钮压住——读出卡是次要信息，不该挡住控件。 */
.pt-detail{left:14px; right:auto; top:auto; bottom:60px; width:230px; max-height:calc(100% - 72px); overflow:auto; font-size:12px}
.pt-detail h4{margin:0 0 6px; font-family:var(--pt-mono); font-size:13px; font-weight:800; color:var(--pt-fg); display:flex; justify-content:space-between; align-items:center; gap:8px}
.pt-detail .grank{font-family:var(--pt-mono); font-size:21px; font-weight:800}
.pt-detail .grank small{font-size:12px; font-weight:400; color:var(--pt-fg3); margin-left:6px}
.pt-x{border:none; background:none; color:var(--pt-fg3); font-size:14px; padding:0 3px}
.pt-x:hover{color:var(--pt-danger)}
.coords{display:flex; flex-wrap:wrap; gap:4px; margin:7px 0}
.coords .c{font-family:var(--pt-mono); font-size:12px; border:1px solid var(--pt-bd); border-radius:5px; padding:1.5px 7px; color:var(--pt-fg2)}
.coords .c.hot{color:#fff; border-color:transparent; background:var(--c)}
.pt-detail .formula{font-family:var(--pt-mono); font-size:12px; color:var(--pt-fg2); background:var(--pt-s2); border-radius:6px; padding:6px 8px; margin:7px 0; line-height:1.7; overflow-x:auto}
.pt-detail table{width:100%; border-collapse:collapse; font-size:12px; margin:4px 0}
.pt-detail td{padding:2.5px 3px; border-bottom:1px solid color-mix(in srgb, var(--pt-bd) 55%, transparent); vertical-align:top}
.pt-detail td:first-child{color:var(--pt-fg3); font-family:var(--pt-mono); font-size:12px; white-space:nowrap}
.pt-detail code{font-family:var(--pt-mono); font-size:12px; background:var(--pt-s2); padding:.5px 4px; border-radius:4px}
.pt-detail .rev{margin-top:9px; border-top:1px solid var(--pt-bd); padding-top:8px}
.pt-detail .rev input{width:56px; font-family:var(--pt-mono); font-size:12px; padding:2px 6px; border:1px solid var(--pt-bd); border-radius:6px; background:var(--pt-s2); color:var(--pt-fg)}
.rankchips{display:flex; flex-wrap:wrap; gap:3px; margin-top:5px}
.rankchips button{font-family:var(--pt-mono); font-size:12px; padding:1px 6px; border-radius:5px; border:1px solid var(--pt-bd); background:var(--pt-s2); color:var(--pt-fg2)}
.rankchips button:hover{border-color:var(--pt-bds); color:var(--pt-fg)}
.pt-go{display:inline-block; margin-top:7px; font-size:12px; font-weight:600; color:var(--pt-dp); cursor:pointer}

/* 抽屉（配置 / 验收）：从顶栏落下，右侧 */
.pt-drawer{top:10px; right:14px; width:min(680px, calc(100% - 28px)); max-height:calc(100% - 20px); overflow:auto; z-index:11}
.pt-drawer h4{margin:0 0 8px; font-family:var(--pt-mono); font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--pt-fg3)}
.cfg-cols{display:grid; grid-template-columns:repeat(auto-fit, minmax(196px, 1fr)); gap:10px 16px}
.frow{display:flex; align-items:center; gap:7px; margin-bottom:6px; font-size:12px}
.frow label{flex:0 0 108px; color:var(--pt-fg2); display:flex; align-items:center; gap:5px}
.frow input{width:84px; font-family:var(--pt-mono); font-size:12px; padding:3px 7px; border:1px solid var(--pt-bd); border-radius:6px; background:var(--pt-s2); color:var(--pt-fg)}
.frow input:disabled{opacity:.5}
.frow .hint{font-family:var(--pt-mono); font-size:12px; color:var(--pt-fg3)}
.frow.derived{background:color-mix(in srgb, var(--pt-dp) 10%, transparent); border-radius:7px; padding:4px 6px; margin-left:-6px}
.frow.derived .val{font-family:var(--pt-mono); font-weight:800; font-size:13px; color:var(--pt-dp)}
.stepn{display:inline-block; font-family:var(--pt-mono); font-size:12px; color:var(--pt-bg); background:var(--pt-fg3); border-radius:50%; width:18px; height:18px; line-height:18px; text-align:center; flex:none}
.dk{font-family:var(--pt-mono); font-weight:700; font-size:12px; padding:0 5px; border-radius:4px; color:#fff; background:var(--c)}
.verr,.vwarn,.vok{border-radius:8px; padding:7px 11px; margin-top:7px; font-size:12px; border:1px solid}
.verr{background:color-mix(in srgb, var(--pt-danger) 9%, transparent); border-color:color-mix(in srgb, var(--pt-danger) 40%, transparent); color:var(--pt-danger)}
.vwarn{background:color-mix(in srgb, var(--pt-pp) 10%, transparent); border-color:color-mix(in srgb, var(--pt-pp) 40%, transparent); color:color-mix(in srgb, var(--pt-pp) 70%, var(--pt-fg) 30%)}
.vok{background:color-mix(in srgb, var(--pt-cp) 10%, transparent); border-color:color-mix(in srgb, var(--pt-cp) 40%, transparent); color:color-mix(in srgb, var(--pt-cp) 60%, var(--pt-fg) 40%)}
.fixes{margin-top:5px; display:flex; flex-wrap:wrap; gap:5px}
.fixes button{font-family:var(--pt-mono); font-size:12px; padding:2px 9px; border-radius:var(--button-radius); border:1px solid currentColor; background:transparent; color:inherit}
.fixes button:hover{background:var(--pt-danger); border-color:var(--pt-danger); color:#fff}
.diagrow{display:flex; flex-wrap:wrap; gap:6px; margin-top:9px}
.dstat{font-family:var(--pt-mono); font-size:12px; padding:3px 9px; border-radius:7px; border:1px solid var(--pt-bd); color:var(--pt-fg2); background:var(--pt-s2)}
.dstat.warn{border-color:color-mix(in srgb, var(--pt-pp) 55%, transparent); color:color-mix(in srgb, var(--pt-pp) 75%, var(--pt-fg) 25%)}
.acc-t{width:100%; border-collapse:collapse; font-size:12px}
.acc-t td{padding:5px 7px; border-bottom:1px solid color-mix(in srgb, var(--pt-bd) 55%, transparent); vertical-align:top}
.acc-t td:first-child{font-family:var(--pt-mono); font-weight:700; white-space:nowrap}
.badge{font-family:var(--pt-mono); font-size:12px; padding:1.5px 7px; border-radius:999px; white-space:nowrap; border:1px solid}
.badge.pass{color:color-mix(in srgb, var(--pt-cp) 65%, var(--pt-fg) 35%); border-color:color-mix(in srgb, var(--pt-cp) 50%, transparent); background:color-mix(in srgb, var(--pt-cp) 10%, transparent)}
.badge.manual{color:var(--pt-fg2); border-color:var(--pt-bd); background:var(--pt-s2)}
.badge.fail{color:var(--pt-danger); border-color:var(--pt-danger)}

/* 抽离图 / 折叠提示：舞台内底部浮动 */
.pt-detach{left:14px; bottom:12px; width:min(600px, 62%); z-index:7; padding:10px 12px}
.pt-detach svg{width:100%; height:auto; display:block}
/* 层反查：工具条上那颗控件 + 左下角那张拆解卡。
   拆解卡贴着图例的位置（两者不会同时打开——一个讲形状、一个讲某一层的去向）。 */
/* 属性搜索：标签区 + 「＋ 搜索」按钮 + 弹出的属性/取值面板 */
.pt-qbar{
  position:absolute; top:6px; left:14px; z-index:7;
  display:flex; justify-content:flex-start; max-width:calc(100% - 28px);
}
.pt-root.embed .pt-qbar{position:static; max-width:none}
.pt-psearch{position:relative; display:inline-flex; align-items:center; gap:4px; flex-wrap:wrap; justify-content:center}
.pt-cfgsearch .pt-psearch{width:100%; justify-content:flex-start}
.pt-cfgsearch .pt-pmenu{position:static; flex:1 0 100%; min-width:100%; margin-top:4px; box-shadow:none; background:var(--state-muted)}
.pt-qchip{
  display:inline-flex; align-items:center; gap:4px; height:26px; padding:0 4px 0 7px;
  border:1px solid var(--c); border-radius:999px; background:var(--pt-bg); color:var(--c);
  font-family:var(--pt-mono); font-size:12px; font-weight:700; white-space:nowrap;
}
.pt-qchip i{font-style:normal; font-weight:500; opacity:.7; font-family:var(--pt-sans,inherit)}
.pt-qchip.is-bad{border-style:dashed; opacity:.65}
.pt-qchip button{border:0; background:none; color:inherit; cursor:pointer; font-size:13px; line-height:1; padding:0 2px; opacity:.7}
.pt-qchip button:hover{opacity:1}
/* 和 .pb 同一套实心胶囊：虚线看着像「待填的占位框」，和这一屏别的控件不是一路 */
.pt-padd{
  min-height:26px; padding:0 11px; border:1px solid var(--pt-bd); border-radius:999px;
  background:var(--pt-s1); color:var(--pt-fg2); cursor:pointer;
  font-size:12px; font-weight:600; white-space:nowrap; transition:background .15s, color .15s;
}
.pt-padd:hover{background:var(--pt-s2); color:var(--pt-fg)}
.pt-psearch.is-open .pt-padd{background:var(--pt-fg); border-color:var(--pt-fg); color:var(--pt-bg)}
.pt-pclr{border:0; background:none; color:var(--pt-fg3); cursor:pointer; font-size:14px; line-height:1; padding:0 2px}
.pt-pmenu{
  position:absolute; top:32px; left:0; z-index:20; min-width:min(206px, calc(100vw - 32px));
  background:var(--pt-s1); border:1px solid var(--pt-bd); border-radius:10px; padding:7px;
  box-shadow:0 10px 30px rgba(0,0,0,.16);
}
.pt-pmenu .hd{font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--pt-fg3); margin:1px 3px 6px}
.pt-pmenu > button{
  display:flex; width:100%; align-items:baseline; gap:7px; text-align:left;
  border:0; background:none; cursor:pointer; padding:5px 6px; border-radius:6px; color:var(--pt-fg);
}
.pt-pmenu > button:hover{background:var(--pt-s2)}
.pt-pmenu > button b{font-size:12px}
.pt-pmenu > button span{font-size:12px; color:var(--pt-fg3); font-family:var(--pt-mono)}
.pt-pmenu .opts{display:flex; flex-wrap:wrap; gap:4px}
.pt-pmenu .opts button{
  border:1px solid var(--c); color:var(--c); background:var(--pt-bg); cursor:pointer;
  border-radius:999px; padding:3px 9px; font-family:var(--pt-mono); font-size:12px; font-weight:700;
}
.pt-pmenu input{
  width:100%; height:26px; padding:0 7px; font-family:var(--pt-mono); font-size:12px;
  border:1px solid var(--pt-bd); border-radius:6px; background:var(--pt-bg); color:var(--pt-fg);
}
.pt-pmenu .tip{font-size:12px; color:var(--pt-fg3); margin:5px 3px 1px}
.pt-revbox{
  position:absolute; left:14px; top:42px; z-index:7;
  width:min(330px, 48%); background:var(--pt-s1); border:1px solid var(--c, var(--pt-bd));
  border-radius:var(--settings-panel-radius); padding:var(--settings-panel-padding); font-size:12px; color:var(--pt-fg2); line-height:1.55;
  box-shadow:0 8px 28px rgba(0,0,0,.14);
}
.pt-revbox h5{
  margin:0 0 6px; font-family:var(--pt-mono); font-size:12px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--pt-fg3);
  display:flex; justify-content:space-between; align-items:center; gap:8px;
}
.pt-revbox h5 button{border:0;background:none;color:var(--pt-fg3);cursor:pointer;font-size:14px;line-height:1}
.pt-revbox .rl{display:flex; gap:6px; align-items:flex-start; margin:3px 0}
.pt-revbox .rl .dk{flex:none; margin-top:1px}
.pt-revbox .sum{
  margin-top:6px; padding-top:5px; border-top:1px solid var(--pt-bd);
  font-size:12px; color:var(--pt-fg);
}
.pt-revbox .qsec{border-top:1px solid var(--pt-bd); padding-top:6px; margin-top:7px}
.pt-revbox .qsec:first-of-type{border-top:0; padding-top:0; margin-top:0}
.pt-revbox .qsec h6{margin:0 0 4px; font-size:12px; font-weight:800; color:var(--c); font-family:var(--pt-mono)}
.pt-revbox{max-height:calc(100% - 60px); overflow:auto}
/* 图例：压在左下角的浮层。它是**对照表**不是正文——每行一个真形状 + 一句话，
   形状用内联 SVG 画，和画布上那一笔走同一套颜色与描边，不能是「差不多的示意」。 */
/* 图例改挂在标题下方、横铺一条：它是**对照表**，横着排一行一行读起来更快，
   也不再压住画布左下角那些读数。位置够就一行，不够自适应换行。 */
.pt-legend{
  position:absolute; left:14px; right:14px; top:46px; z-index:7;
  max-height:42%; overflow:auto;
  background:var(--settings-panel-bg); border:1px solid var(--settings-panel-border); border-radius:var(--settings-panel-radius);
  padding:var(--settings-panel-padding); font-size:12px; color:var(--pt-fg2); line-height:1.5;
  box-shadow:var(--settings-panel-shadow);
}
.pt-legend h5{
  margin:0 0 7px; font-family:var(--pt-mono); font-size:12px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--pt-fg3);
  display:flex; justify-content:space-between; align-items:center; gap:8px;
}
.pt-legend h5 button{
  border:0; background:none; color:var(--pt-fg3); cursor:pointer;
  font-size:14px; line-height:1; padding:0 2px;
}
.pt-legend h5 button:hover{color:var(--pt-fg)}
.pt-legend .lg-sec{
  margin:8px 0 4px; font-weight:700; color:var(--pt-fg); font-size:12px;
  border-top:1px solid var(--pt-bd); padding-top:7px;
}
.pt-legend .lg-sec:first-of-type{border-top:0; margin-top:0; padding-top:0}
.pt-legend .lg-body{display:flex; flex-wrap:wrap; gap:4px 14px; align-items:flex-start}
.pt-legend .lg-row{display:flex; gap:7px; align-items:flex-start; margin:2px 0; flex:0 1 auto; max-width:330px}
/* 分组标题在横铺里要自己占满一整行，否则它会挤在两条图例中间当第三条读 */
.pt-legend .lg-sec{flex:1 0 100%}
.pt-legend .lg-row svg{flex:0 0 auto; margin-top:1px}
.pt-legend .lg-row b{color:var(--pt-fg); font-weight:700}
.pt-legend .lg-row i{font-style:normal; color:var(--pt-fg3)}
.pt-legend code{font-family:var(--pt-mono); font-size:12px; background:var(--pt-s2); padding:.5px 4px; border-radius:4px}
.pt-note{
  position:absolute; left:14px; bottom:12px; z-index:5; max-width:min(520px, 60%);
  background:var(--pt-s1); border:1px solid var(--pt-bd); border-left:3px solid var(--pt-fg);
  border-radius:8px; padding:7px 11px; font-size:12px; color:var(--pt-fg2);
}
.pt-note .pb{margin-left:6px; min-height:28px; padding:0 9px; font-size:12px}
.pt-detach:not([hidden]) ~ .pt-note{bottom:auto; top:10px; left:50%; transform:translateX(-50%)}
/* 读出卡也钉在左下（left:14 / bottom:60，宽 230）——它一露面就把这条索引条压在
   底下，索引五元组那排芯片一个字都读不到。让开到卡的右侧，两者各占各的地方。 */
.pt-detail:not([hidden]) ~ .pt-note{left:258px; max-width:min(520px, calc(100% - 288px))}
/* 动画字幕 */
.pt-animcap{
  position:absolute; left:50%; transform:translateX(-50%); bottom:14px; z-index:9; display:none;
  font-family:var(--pt-mono); font-size:12px; background:color-mix(in srgb, var(--pt-fg) 92%, transparent);
  color:var(--pt-bg); border-radius:999px; padding:6px 16px; max-width:80%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.pt-animcap b{color:var(--pt-bg)}
/* 舞台被配置错误封锁 */
.pt-blocked{position:absolute; inset:0; display:grid; place-content:center; text-align:center; color:var(--pt-fg2); z-index:4; font-size:13px}
.pt-blocked b{color:var(--pt-danger)}
.pt-blocked .pb{margin-top:10px; justify-self:center}

/* ── 底栏 ── */
/* 嵌入模式（?host=cockpit）：藏掉本页顶栏——驾驶舱的格头已经写了这是哪一格，
   配置与选中卡由宿主统一驱动，再留一条自己的顶栏就是两套控制器打架。
   底部图层条保留：L5 通信 / 原语这些是**本格自己的**开关，宿主并不代管。 */
/* 嵌入形态：整页只剩画布。顶栏和页脚都收掉——分享出去的那条链接要的是一张图，
   不是一个带导航的小站；舞台工具条留着，那是这张图自己的控件。 */
.pt-root.embed .pt-bar{display:none}
.pt-root.embed .pt-main{border-top:0}
.pt-root.embed .pt-foot{display:none !important}
.pt-foot{flex:none; border-top:1px solid var(--pt-bd); background:var(--pt-s1); padding:6px 14px 8px; z-index:10; display:flex; flex-direction:column; gap:5px}
.pt-lrow{display:flex; align-items:center; gap:6px; flex-wrap:wrap}
.pt-sep{width:1px; height:16px; background:var(--pt-bd); margin:0 4px}

/* tooltip */
#tip{position:fixed; z-index:50; pointer-events:none; display:none; background:var(--pt-fg); color:var(--pt-bg);
  font-family:var(--pt-mono); font-size:12px; padding:5px 9px; border-radius:7px; line-height:1.6; max-width:270px}

/* SVG 通用类：容器面 / 文字（颜色全走 token，明暗随主题翻转） */
.f1{fill:var(--pt-face1)} .f2{fill:var(--pt-face2)} .f3{fill:var(--pt-face3)}
.tI{fill:var(--pt-fg)} .tII{fill:var(--pt-fg2)} .tIII{fill:var(--pt-fg3)}
.lane{fill:var(--pt-s2); stroke:var(--pt-bd)}
@keyframes pulse2{0%,100%{opacity:.06} 30%,70%{opacity:1}}
.pulse2{animation:pulse2 .46s ease-in-out 2}
.pulse1{animation:pulse2 .8s ease-in-out 1}
/* 刀序链的变形效果：变形带自上而下生长、子块随后浮现 */
.mband{transform-box:fill-box;transform-origin:top center;animation:mgrow .5s ease-out both}
@keyframes mgrow{from{transform:scaleY(.04);opacity:0}to{transform:scaleY(1);opacity:1}}
.cgrow{animation:cfade .55s ease-out both;animation-delay:.22s}
@keyframes cfade{from{opacity:0}to{opacity:1}}
/* ── 过路高亮的视觉语言（三个机位共用一套）─────────────────────────────
   为什么不复用「选中」那套实线加粗：这一屏此刻亮着的那张卡有两种来路，读者
   必须一眼分得出——
     · 实线加粗 = **我在这儿点的**：浮读出卡、写进 URL、广播给宿主，退出要靠
       再点一次或点空白；
     · 虚线外框 = **别的视图点过来的**（宿主转来的 hl）：不落标签、不浮读出卡、
       点画布空白就散。
   两者若长得一样，读者就无从判断「这张卡是我选的还是它照过来的」，也就不知道
   该去哪一格收手——这正是联动做出来却读不懂的根源。
   外框而不是换填色：填色是这一屏自己的信息（载荷/切痕/维度色），被高亮借走
   就等于抹掉一层真内容；外框长在图元**之外**，不占用任何已有的编码位。
   脉冲慢而浅（1.7s、.45→1，无限循环）：只够说明「这是活的、来自别处」，
   比 .pulse2 那种短促强闪弱得多——后者是「刚刚发生了一次变化」的一次性提示，
   而过路高亮是一个会持续一段时间的状态，强闪会一直抢注意力。 */
@keyframes hlpulse{0%,100%{opacity:.45} 50%{opacity:1}}
.hlring{animation:hlpulse 1.7s ease-in-out infinite}
/* 过路高亮的说明徽标：贴在舞台左下角，替代那张被刻意藏起来的读出卡回答
   「这一片为什么亮着」。它不带任何逐卡读数（那正是读出卡被藏起来的理由），
   只说来路与散掉的手势。 */
.pt-hlbadge{
  position:absolute; left:14px; bottom:14px; z-index:9;
  display:flex; align-items:center; gap:7px;
  background:var(--pt-bg); border:1px dashed var(--pt-fg3); border-radius:8px;
  padding:5px 9px; font-family:var(--pt-mono); font-size:12px; color:var(--pt-fg2);
  pointer-events:none; max-width:min(60%, 340px); line-height:1.5;
}
.pt-hlbadge b{color:var(--pt-fg); font-weight:800}
.pt-hlbadge .hlk{
  width:12px; height:12px; flex:none; border-radius:3px;
  border:1.4px dashed var(--c, var(--pt-fg2)); background:none;
}

/* ── 通信线上的「流动」：这根线此刻正在往哪边搬东西 ─────────────────────
   通信线原来只画「谁跟谁」——一根静止的弧，既读不出方向，也读不出它是活的。
   这里让线自己跑起来（虚线沿着路径位移）。四条纪律，每条都有它的理由：

   · 走 CSS 不走 JS。这一屏满配是一万多个 SVG 图元，JS 定时器逐帧改
     stroke-dashoffset 等于每帧都去碰一遍 DOM——这张图连转台重建都得靠 420ms
     防抖才压得住，再挂一个每帧跑的定时器就是直接卡死。CSS 动画交给渲染线程
     自己跑：场景重建时它不会被打断，场景不重建时也没有一个空转的定时器在吃电。

   · 位移量不写死，由元素用 --cfd 报上来。画通信线的地方有三处，各自的尺度基准
     完全不同（3D 弧与地面流量带用场景单位、卡内算子线除 zs、侧视条除 FS_Z）；
     位移必须正好等于虚线周期的整数倍，循环才接得上，否则每轮末尾会跳一下。
     所以周期由调用方按自己的尺度算好写进 --cfd，这里统一走「位移 = 周期×2」。

   · 反向那一路额外错开半个周期（animation-delay 取负值）。双向通信要画两股
     反着跑的流，同相位的话两条虚线严丝合缝地叠在一起，看着还是一条单向线；
     错开半周期，两股流才是交错着穿过对方的样子。

   · 时间函数是 steps(20)，不是 linear——这不是审美选择。stroke-dashoffset 不能
     由合成器代劳，值一变就得重画那条路径；这张图里一条 3D 通信弧的包围盒盖着
     上万个算子图元，于是「每帧都变一点」等于每帧重新光栅化半屏。实测 3D + 选中
     卡那一档：linear 中位帧间隔 33.3ms，换成 steps(20) 回到 16.7ms（同一台机、
     同一批 34 条线）。一秒 17 跳，虚线走的是「行军蚁」那种一格一格的步子，
     方向和速度照样读得出来，重绘却少了三分之二。 */
@keyframes ptcf{from{stroke-dashoffset:0} to{stroke-dashoffset:calc(var(--cfd, 12px) * -2)}}
@keyframes ptcfr{from{stroke-dashoffset:0} to{stroke-dashoffset:calc(var(--cfd, 12px) * 2)}}
.cfl{animation:ptcf 1.15s steps(20, end) infinite}
.cfl.rv{animation-name:ptcfr; animation-delay:-.575s}
.cfl.sl{animation-duration:2.1s}
.cfl.sl.rv{animation-delay:-1.05s}
/* 系统里关掉了动效就停在**静止的虚线**上：虚线本身是「这是一次通信，不是一根
   实体链路」的线型语义，跟着动画一起撤掉的话这一层就什么都不剩了。只停动，
   不撤线——方向三角和贴线读数都是静态的，那两件事一个字都不少。
   四个选择器要逐个写出来，不能只写 .cfl：媒体查询**不加特异度**，而上面的
   .cfl.rv 自己就带着 animation-name，(0,2,0) 压得过 (0,1,0) 的 .cfl{animation:none}
   ——只写一条的话反向那几股流会在「已关动效」的机器上继续跑（实测：侧视里
   30 条 combine 线照动）。列全之后每一档都由同特异度且更靠后的规则收掉。 */
@media (prefers-reduced-motion: reduce){
  .cfl, .cfl.rv, .cfl.sl, .cfl.sl.rv{animation:none}
}

/* 窄窗：右侧工具条会折行往左长，居中的搜索会被它压住。这时搜索不再居中，
   退到左侧标题那一列；图例相应往下让，避开折成两行的工具条。
   断点取 1560：工具条本身最宽能到 780px（max-width:min(72%,780px)），
   居中的搜索要在两侧各留出这么多才不会撞上——比直觉的「窄屏才管」高不少。 */
@media (max-width:900px){
  .pt-detail{width:min(86%, 240px)}
  .pt-stagebar{max-width:96%}
}
</style>
</head>
<body>
<div class="pt-root" id="app">
  <header class="pt-bar">
    <div class="pt-title"><b>并行拓扑</b><span class="sub">PRD Demo · <a href="./prd.html" target="_blank">PRD</a> / <a href="../parallel-reference/" target="_blank">参照系</a></span></div>
    <nav class="pt-seg" id="viewSeg"></nav>
    <div class="pt-chips" id="barChips"></div>
    <div class="pt-actions" id="barActs"></div>
  </header>
  <div class="pt-main" id="main">
    <!-- 画布自己的名字，占舞台左上角那个位置。收起顶栏之后（嵌入形态）整屏只剩画布，
         没有它就没人说得清这是什么；顶栏在的时候它自己让位，免得同一个名字印两遍。 -->
    <div class="pt-stagetitle" id="stageTitle"></div>
    <!-- 返回：跳进来的那几屏（卡内解剖 / 单维切分）在舞台左上角单独给它一个位置。
         原来它混在右上那条导航里，跟「它的来历（刀序链）」「这段在时间轴上的样子」
         排成一行——那两颗是**去哪儿**，返回是**回哪儿**，混在一起读者只会把最左边
         那颗当返回。左上角是所有人找返回的第一个地方，就放在那儿，写全字。 -->
    <div class="pt-backbar" id="backBar" hidden></div>
    <!-- 搜索单独占中间那一段（名字在左、控件在右，它居中），不再挤在右侧工具条里 -->
    <div class="pt-qbar" id="qbar"></div>
    <div class="pt-stage" id="stage"></div>
    <!-- 关闭整网后直接挂真的魔方 pattern（three.js 按需加载） -->
    <div class="pt-rubik" id="rubik" hidden></div>
    <div class="pt-stagebar" id="stagebar"></div>
    <!-- 缩放 HUD：读数即控件。gesture（滚轮/拖拽平移/双指）只改这块数字和一条
         transform，不重建场景——重建防抖到手停之后（scheduleCrisp）。 -->
    <div class="pt-zoomhud" id="zoomHud" hidden>
      <button data-act="zoomout" title="缩小（滚轮/触控板同样可用）">−</button>
      <button class="zpct" id="zoomPct" data-act="zoom100" title="适应画布，完整显示当前视图">Fit</button>
      <button data-act="zoomin" title="放大">＋</button>
      <span class="zsep"></span>
      <!-- 居中＝十字准星：四条边线收向正中一枚圆环，说的是「把场景挪回画面正中」，
           只动平移不动缩放，所以图里没有任何放大缩小的暗示。 -->
      <button class="zicon" data-act="viewcenter" aria-label="居中" title="平移归零，把场景拉回画面中央（缩放不变）"><svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="3.1"/><path d="M8 1.5v2.3M8 12.2v2.3M1.5 8h2.3M12.2 8h2.3"/></svg></button>
      <!-- 复位＝回旋箭头：绕一整圈退回起点，比十字准星多管两件事（视角、缩放），
           所以画成「转回去」而不是「对准」。逆时针，跟撤销同向。 -->
      <button class="zicon" data-act="turnreset" aria-label="复位" title="复位机位：视角、缩放、平移全部回到本视图的标准机位"><svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1.52 3.29v3.53h3.53"/><path d="M3.2 10.24A5.3 5.3 0 1 0 5.76 3.2L1.52 6.82"/></svg></button>
    </div>
    <!-- 算子明细卡：点一个算子浮出来，跟着那个算子的位置走 -->
    <aside class="pt-opcard" id="opCard" hidden></aside>
    <!-- 选中 rank 的容器卡（Rank+关整网）：点亮哪只卡，那只卡「装了什么」浮出来。
         solo 档（第三档单卡下钻）下这张卡让位给 memCards——见 renderRankMem 的
         on 条件与 renderMemCards 的注释。 -->
    <aside class="pt-rankmem" id="rankMem" hidden></aside>
    <!-- solo 档专用：把显存构成拆成几张纯卡片，各自贴着卡壳上那一条带浮着，
         而不是挤在一张表里——见 renderMemCards/placeMemCards。 -->
    <div class="pt-memcards" id="memCards" hidden></div>
    <!-- 选组 HUD：四个视角共用的一行切分组切换（TP·SP/CP/EP/DP/PP），钉在画布下沿 -->
    <div class="pt-grouphud" id="groupHud" hidden></div>
    <div class="pt-animcap" id="animCap"></div>
    <aside class="pt-card pt-detail" id="detail" hidden></aside>
    <div class="pt-card pt-drawer" id="drawer" hidden></div>
    <div class="pt-card pt-detach" id="detach" hidden></div>
    <div class="pt-legend" id="legend" hidden></div>
    <div class="pt-revbox" id="revbox" hidden></div>
    <!-- 过路高亮的说明徽标：读出卡在这种状态下是**故意**藏起来的（见 renderDetail），
         但一片虚线框亮在那儿却没有一句话解释来路，读者只会当成这一屏自己的选中。
         这枚徽标补的就是那句话，不补读数。 -->
    <div class="pt-hlbadge" id="hlBadge" hidden></div>
    <div class="pt-note" id="stageNote" hidden></div>
  </div>
  <footer class="pt-foot">
    <div class="pt-lrow" id="footCtl"></div>
  </footer>
  <!-- #tip 必须待在 .pt-root **里面**：--pt-* 那套变量是声明在 .pt-root 上的，
       放在外面 var(--pt-fg) / var(--pt-bg) 一个都解析不出来——背景成了透明、
       文字成了继承色，提示框就是一段浮在画布上的裸字。position:fixed，
       挪进来不影响任何布局。 -->
  <div id="tip"></div>
</div>
<script>
(function(){
"use strict";

/* ═════════ 基础 ═════════ */
var C = Math.cos(Math.PI/6), S = Math.sin(Math.PI/6);
function $(id){ return document.getElementById(id); }
/* 底栏（stagebar）那几条长说明：只留一个短名 + 一枚 ⓘ，整句进悬停。
   反馈是「只留标题加正文，解释收进 hover」——底栏本来是控件条，
   挂着两行读法就把控件挤到第二行去了。 */
function tipChip(short9, long9){
  return '<span class="pt-chip" style="cursor:help" title="'+esc(long9)+'">'+esc(short9)+' <span style="opacity:.55">ⓘ</span></span>';
}
/* 从一串读数（'34MB · 143GB/s · 0.23ms · 3807 tok'）里抽出**关键值**：
   搬多少 + 多久。反馈原话「这后面的关键值范围是要显示在标签上的，而不是名称」
   ——名称（梯度 AllReduce · DP 组）读者从颜色和位置就认得出，标签这么小的地方
   应该留给只有数字才说得清的那两样；带宽与 token 数留在悬停里。 */
function metricBrief(m9){
  var t9 = String(m9 || '');
  var by9 = (t9.match(/[\d.]+\s?(?:KB|MB|GB|TB)/) || [''])[0];
  var ms9 = (t9.match(/[\d.]+\s?ms/) || [''])[0];
  var out9 = [];
  if(by9) out9.push(by9.replace(/\s/g, ''));
  if(ms9) out9.push(ms9.replace(/\s/g, ''));
  return out9.join(' · ');
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmt(n){ return Number(n).toLocaleString('en-US'); }
function fmtGB(b){ return (b/Math.pow(2,30)).toFixed(b >= Math.pow(2,30)*10 ? 0 : 1); }
function fmtP(n){ return n>=1e9 ? (n/1e9).toFixed(2)+' B' : n>=1e6 ? (n/1e6).toFixed(1)+' M' : fmt(n); }
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
function proj(x,y,z,s){ return [(x-z)*C*s, ((x+z)*S - y)*s]; }
function ptsStr(p){ return p.map(function(q){ return q[0].toFixed(1)+','+q[1].toFixed(1); }).join(' '); }
/* 一组屏幕点的凸包（Andrew monotone chain）。用处只有一个：立方体投到屏幕上之后
   它的轮廓是几边形随机位而变（3D 下是六边形，正视/顶视/侧视下退化成四边形），
   要给整只盒子一块「点哪儿都算点中它」的命中面，就只能现算这个轮廓——挑某几个
   角写死，换个机位就会退化成一条没有面积的线。
   点数恒为 8，O(n log n) 的排序在这个规模上比任何"聪明"的特判都省心。 */
function hull2(pts){

  ['perNode','nodeRack','podCards'].forEach(function(k9){

  if(ui.view==='chain' && (Math.abs(ui.yaw3-0.42)>1e-3 || Math.abs(ui.pitch3-0.30)>1e-3)){

/* 告诉宿主：画面上现在还叠着通信没有。工作台拿它联动下方抽屉切到「通信观测」——
   上面看现象（流量带），下面看量化与归因（Sankey / Routing / 时间轴）。逐类开关
   也走这一口：五类全关等价于这一层关掉了，宿主不该还以为在看通信。 */
function ptoNotifyComm(){
  if(window.parent && window.parent !== window)
    window.parent.postMessage({type:'pto:comm', on: ui.commOn && commLitN() > 0}, '*');
}
/* 这一维的通信这次画不画：总闸 + 它自己那一档。五处画通信的地方（整网的算子级
   弧线 drawCommArcs、卡对卡的组拓扑 CARD_COMM、容量视图的地面流量带）共用它，
   免得三处各写各的判断、开关只对其中一处生效。 */
function commLit(d9){ return ui.commOn && ui.comm[d9] !== false; }
function commLitN(){ return COMMK.reduce(function(a9, k9){ return a9 + (commLit(k9[0]) ? 1 : 0); }, 0); }
/* 逐类开关的名录：维 · 按钮上的名字 · 这一维走的原语（提示语用） */
var COMMK = [['tp','TP','AllGather(s→h) / Reduce-Scatter(h→s)：进出 TP 区的换轴器'],
             ['cp','CP','Ring / Ulysses(All-to-All) / 朴素 AllGather：attention 要看到全序列'],
             ['ep','EP','All-to-All dispatch / combine：token 去专家那儿走一趟再回来'],
             ['pp','PP','P2P Send/Recv：段边界上只传激活（正向 H×4、反向 ∂H×4）'],
             ['dp','DP','梯度 AllReduce：一个 step 只有一次，反向（画成虚线）']];

/* ═════════ 校验与推导（FR-1） ═════════ */
function divisorsOf(n){ var d=[],i; for(i=1;i<=n;i++) if(n%i===0) d.push(i); return d; }
function nearDiv(n,x){ var d=divisorsOf(n),lo=null,hi=null; d.forEach(function(v){ if(v<=x) lo=v; if(hi===null&&v>=x) hi=v; }); var o=[]; if(lo&&lo!==x)o.push(lo); if(hi&&hi!==x)o.push(hi); return o; }
function nearMult(v,m){ var lo=Math.max(m,Math.floor(v/m)*m),hi=lo+m,o=[]; if(lo!==v)o.push(lo); if(hi!==v)o.push(hi); return o.filter(function(x,i,a){return a.indexOf(x)===i;}); }

function derive(c){
  var D = {tp:+c.tp, cp:+c.cp, pp:+c.pp, world:+c.world, layers:+c.layers, hidden:+c.hidden,
    heads:+c.heads, kv:+c.kv, ffn:+c.ffn, vocab:+c.vocab, seq:+c.seq, experts:+c.experts,
    topk:+c.topk, mbs:+c.mbs, ga:+c.ga, hbm:+c.hbm, errors:[], warns:[]};
  /* 物理链的三个尺寸：卡（rank）除了挂在并行坐标 (tp,cp,pp,dp,ep) 上，还挂在
     物理坐标 (超节点, 机柜, node, 槽位) 上——两套坐标的交叉就是「模型怎么切」与
     「机器怎么摆」的接缝。缺省照 CloudMatrix384 的公开口径：
       1 node = 8 NPU + 4 CPU + 7 颗板载 UB 交换芯片
       48 node = 1 超节点 = 384 卡，摊在 16 个机柜（12 计算 + 4 通信）
     这三个数**不参与整除校验**：它们答的是「插在哪」，不是「切成几份」，
     world 不被 perNode 整除只意味着最后一台机没插满，不是配置非法。 */
  D.perNode = Math.max(1, +c.perNode || 8);
  D.nodeRack = Math.max(1, +c.nodeRack || 4);
  D.podCards = Math.max(1, +c.podCards || 384);
  D.moe = D.experts > 0;
  D.ep = D.moe ? +c.ep : 1; D.etp = D.moe ? +c.etp : 1;
  var denom = D.tp*D.cp*D.pp;
  D.dpOk = denom>0 && D.world % denom === 0;
  D.dp = D.dpOk ? D.world/denom : Math.max(1, Math.round(D.world/denom));
  function err(id,msg,fx){ D.errors.push({id:id,msg:msg,fixes:fx||[]}); }
  if(!D.dpOk) err('world_div','world % (TP·CP·PP) ≠ 0：world='+D.world+' 不能被 '+denom+' 整除，DP 算不出整数（残差维，§11）。',
    nearMult(D.world,denom).map(function(w){return {label:'world → '+w, patch:{world:w}};}));
  if(D.heads % D.tp !== 0) err('heads_tp','heads % TP ≠ 0：heads='+D.heads+' 不能被 TP='+D.tp+' 整除——注意力头须均分到 TP 组（§11）。',
    nearDiv(D.heads,D.tp).map(function(t){return {label:'TP → '+t, patch:{tp:t}};})
    .concat(nearMult(D.heads,D.tp).map(function(h){return {label:'heads → '+h, patch:{heads:h}};})));
  if(D.layers % D.pp !== 0) err('layers_pp','layers % PP ≠ 0：layers='+D.layers+' 不能被 PP='+D.pp+' 整除——层须均分成 stage（§11）。',
    nearDiv(D.layers,D.pp).map(function(p){return {label:'PP → '+p, patch:{pp:p}};})
    .concat(nearMult(D.layers,D.pp).map(function(l){return {label:'layers → '+l, patch:{layers:l}};})));
  if(D.seq % (2*D.cp) !== 0) err('seq_cp','seq % (2·CP) ≠ 0：seq='+D.seq+' 不能被 '+(2*D.cp)+' 整除——因果负载均衡取首尾对称两段（§11，V5 可见）。',
    nearMult(D.seq,2*D.cp).map(function(s){return {label:'seq → '+s, patch:{seq:s}};}));
  if(D.moe){
    if(D.experts % D.ep !== 0) err('experts_ep','experts % EP ≠ 0：experts='+D.experts+' 不能被 EP='+D.ep+' 整除（§11）。',
      nearDiv(D.experts,D.ep).map(function(e){return {label:'EP → '+e, patch:{ep:e}};}));
    D.moeMin = D.pp * Math.max(D.tp*D.cp, D.ep*D.etp);
    if(D.world < D.moeMin) err('moe_min','总卡数不足：MoE 最小卡数 = PP × max(TP·CP, EP·ETP) = '+D.moeMin+'（不是各维连乘）。当前 '+D.world+'。',
      [{label:'world → '+D.moeMin, patch:{world:D.moeMin}}]);
    if(D.dpOk){
      D.plane = D.tp*D.cp*D.dp;
      if(D.plane % (D.ep*D.etp) !== 0) err('plane_ep','(TP·CP·DP) % (EP·ETP) ≠ 0：stage 内平面 '+D.plane+' 张卡折不成 EP·ETP='+(D.ep*D.etp)+' 组（folding）。', []);
    }
  }
  if(D.hidden % D.heads !== 0) D.warns.push('hidden % heads ≠ 0：headDim 非整数，按取整显示。');
  if(D.kv % D.tp !== 0) D.warns.push('kvHeads='+D.kv+' 不被 TP='+D.tp+' 整除：KV 头复制（GQA 常见）。');
  if(D.ga < D.pp) D.warns.push('GA='+D.ga+' < PP='+D.pp+'：流水线灌不满，气泡率恶化（FR-11）。');
  /* ZeRO 档位不是并行维度，不参与任何整除约束——它只改「同一批卡上，模型态各存几份」。
     所以它放在错误检查之后，不进 D.errors。 */
  D.zero = zeroLv();
  if(D.zero > 0 && D.dp <= 1) D.warns.push('ZeRO-'+D.zero+' 在 DP=1 时不省任何东西：它切的是 DP 域内的冗余副本，只有一份副本就没得切。');
  D.ok = D.errors.length === 0;
  D.layersPerStage = D.ok ? D.layers/D.pp : Math.ceil(D.layers/D.pp);
  D.headDim = Math.floor(D.hidden/D.heads) || 1;
  D.gbs = D.mbs*D.ga*D.dp;
  D.bubble = D.pp>1 ? (D.pp-1)/D.ga : 0;
  return D;
}

/* ═════════ 坐标算术（FR-3，可逆）：order = tp‑cp‑dp‑pp ═════════ */
function coordsOf(g,D){
  return { t: g % D.tp, c: Math.floor(g/D.tp) % D.cp,
           d: Math.floor(g/(D.tp*D.cp)) % D.dp, p: Math.floor(g/(D.tp*D.cp*D.dp)) % D.pp };
}
function rankOf(t,c,d,p,D){ return ((p*D.dp + d)*D.cp + c)*D.tp + t; }
function epOf(t,c,d,D){
  if(!D.moe) return null;
  var q = (d*D.cp + c)*D.tp + t;
  return {etp:q % D.etp, ep:Math.floor(q/D.etp) % D.ep, mdp:Math.floor(q/(D.etp*D.ep)), q:q};
}
function epMembers(g,D){

  }

}
function groupMembers(dim,g,D){
  var co = coordsOf(g,D), out=[], i;
  if(dim==='tp'){ for(i=0;i<D.tp;i++) out.push(rankOf(i,co.c,co.d,co.p,D)); }
  else if(dim==='cp'){ for(i=0;i<D.cp;i++) out.push(rankOf(co.t,i,co.d,co.p,D)); }
  else if(dim==='dp'){ for(i=0;i<D.dp;i++) out.push(rankOf(co.t,co.c,i,co.p,D)); }
  else if(dim==='pp'){ for(i=0;i<D.pp;i++) out.push(rankOf(co.t,co.c,co.d,i,D)); }
  else if(dim==='ep'){ out = D.moe ? epMembers(g,D) : [g]; }
  return out;
}
function dimSlice(dim, idx, D){
  var out=[];
  for(var p=0;p<D.pp;p++) for(var d=0;d<D.dp;d++) for(var c=0;c<D.cp;c++) for(var t=0;t<D.tp;t++){
    if(dim==='tp' && t===idx) out.push(rankOf(t,c,d,p,D));
    else if(dim==='dp' && d===idx) out.push(rankOf(t,c,d,p,D));
    else if(dim==='pp' && p===idx) out.push(rankOf(t,c,d,p,D));
    else if(dim==='cp' && c===idx) out.push(rankOf(t,c,d,p,D));
    else if(dim==='ep'){
      var e=epOf(t,c,d,D);
      if(e && e.ep===idx) out.push(rankOf(t,c,d,p,D));
    }
  }
  return out;
}

   拿到的是真东西：openPangu 整网图的算子节点 + 一张手工标注的切分表（轴/原因/partial/原语）。
   拿不到的是字节——真图不带 shape。所以：

     · 算子**宽度** = 按类别的粗略权重（线性层 ≫ norm/逐元素），并在图上标明口径
     · 每卡显存仍走本页的配置口径（paramsPerCard/memParts），不与上面混淆

var RD = {ok:false, key:'', model:null, ops:null};

  if(!window.OPENPANGU_GRAPH || !window.PtoNetShardingPattern) return null;

     这种对不上的读数——两处数字打架比没有数字更糟。 */
  var key = [D.tp,D.cp,D.pp,D.ep,D.dp,D.layers,D.heads,D.experts,D.seq,D.hidden,D.ffn,D.vocab].join('/');
  if(RD.ok && RD.key === key) return RD.model;
  try{
    RD.model = window.PtoNetShardingPattern.createModel({
      tp:D.tp, cp:D.cp, pp:D.pp, ep:D.ep, dp:D.dp,
      layers:D.layers, heads:D.heads, experts:D.experts, seqLen:D.seq,
      hidden:D.hidden, ffnHidden:D.ffn, vocab:D.vocab });

/* ══ 再细一级：**这一块**与别卡的同名块之间，到底有没有通信 ══════════════
   反馈：「通信关系还是没有深入到 rank 中间每一层的每一个组成部分，力度可以再
   细一些，或者说分析到底有没有这个力度之间的通信关系」。答案不是「都有」也不是
   「都没有」，而是**按这一块被哪把刀怎么切**逐块给的，而且这件事本来就是确定的：

     · 列切 / 头切（attn.q、attn.kv、mlp.gate/up、embed）——同一个张量沿 h 被切开，
       每片各算各的，算完各拿一段结果，**块这一级不通信**；代价推到下游出口。
     · 行切（attn.out、mlp.down）——每片算出来的是**部分和**，不归约就是错的答案，
       所以通信恰恰发生在这一块的出口：开 SP 是 Reduce-Scatter，不开是 AllReduce。
     · 桶切（experts）——token 要先送到专家所在的卡、算完送回，这一块的入口和出口
       各一次 All-to-All；ETP>1 时桶内每个专家的 ffn 维还被再切一层，那一层才是
       块**内部**的 TP 通信。
     · 复制（router、norm×2）与无参（attn.core）——每张卡逐字节相同 / 没有权重，
       没有要对齐的东西，**不通信**。

   一层的输出 → 下一段），DP 的梯度归约发生在**步末**、覆盖全部权重块。 */
function blockComm(D, o){
  var id = String(o.id || ''), cut = o.cut;
  if(id === 'attn.core') return {dim:null, kind:'无', why:'无参算子（flash-attn）：没有权重要对齐，这一块不产生跨卡通信'};
  if(cut === 'none')     return {dim:null, kind:'无', why:'复制块：每张卡逐字节相同，没有要对齐的东西'};
  if(cut === 'ep')       return {dim:'ep', kind:'All-to-All ×2',
    why:'桶切：token 先送到专家所在的卡（dispatch）、算完送回（combine），这一块的入口出口各一次'
        + (D.etp > 1 ? '；ETP=' + D.etp + '，桶内每个专家的 ffn 维还被再切一层，那一层是块内部的 TP 通信' : '；ETP=1，桶内每个专家是整份的，块内不再切')};
  if(id === 'attn.out' || id === 'mlp.down') return {dim:'tp', kind:'AllReduce / Reduce-Scatter',
    why:'行切：每片算出来的是**部分和**，不归约就是错的答案——所以通信恰好落在这一块的出口（开 SP 是 Reduce-Scatter，不开是 AllReduce）'};
  if(id === 'lm_head')   return {dim:'tp', kind:'AllGather(logits)', why:'词表列切：各卡各拿一段 logits，算 loss 前要收齐'};
  return {dim:null, kind:'无', why:'列切 / 头切：同一个张量沿 h 切开，每片各算各的、各拿一段结果，块这一级不通信——代价推到下游行切那一块的出口'};

function opBytes(D){ /* 单层各算子的每卡权重字节（bf16），供 V3 卡内解剖 & 读出 */

  o.push({id:'attn.core', cut:'none', how:'不切权重（无参）', b:0, shape:'flash-attn（激活算子）'});
  o.push({id:'attn.out', cut:'tp', how:'行切 ×'+D.tp, b:2*(D.heads/D.tp)*hd*D.hidden, shape:'['+(D.heads/D.tp)+'·'+hd+', '+fmt(D.hidden)+']'});
  if(D.moe){
    o.push({id:'router', cut:'none', how:'复制', b:2*D.hidden*D.experts, shape:'['+fmt(D.hidden)+', '+D.experts+']'});
    o.push({id:'experts', cut:'ep', how:'桶切 ×'+D.ep+'·ETP'+D.etp, b:2*(D.experts/D.ep)*3*D.hidden*(D.ffn/D.etp), shape:(D.experts/D.ep)+'个 × ['+fmt(D.hidden)+', '+fmt(Math.floor(D.ffn/D.etp))+']×3'});
  }else{

    o.push({id:'mlp.down', cut:'tp', how:'行切 ×'+D.tp, b:2*(D.ffn/D.tp)*D.hidden, shape:'['+fmt(Math.floor(D.ffn/D.tp))+', '+fmt(D.hidden)+']'});

/* ── 每张卡的载荷本来就不一样 ────────────────────────────────────────────
   原来 memParts 只按 PP 段算一遍给整段的卡复用，于是同一段里几十张卡的读数
   一模一样——那正好抹掉了这一屏要讲的事（「这些卡各装各的」）。
   哪些**真的**不一样，按机制分三档，不是随机涂抹：
     ① 不整除的余数（结构性，可精确算）：vocab 按 TP 切、experts 按 EP 切，
        除不尽时最后一片 / 最后一桶少拿一截，权重体跟着少。整除的配置（默认
        那套 128 卡就是）这一项**确实**为零——权重体一样是事实，不该假装不一样。
     ② 路由不均（MoE 实况）：token 不会均匀落到每个专家桶，收得多的桶激活体就大。
        口径与算子读数里那枚 imb（1.02–1.18×）同源。
     ③ 分配器碎片：每张卡的分配历史不同，预留那一截本来就不是同一个数。
   ①是算出来的；②③是**确定性合成**（sin-hash，同一张卡永远读到同一个数），
   与这一屏别处的数据标注同一套口径：示意但自洽。
   键取的是**坐标**（t/c/d/p/ep）而不是全局 rank 号——换 DP 度数时同一张卡的坐标

function loadSeed(k, salt){

function rankLoad(D, g){

  var key = (((co.t*7 + co.c)*13 + co.d)*17 + co.p) + (me ? me.ep*211 : 0);
  var vPer = Math.ceil(D.vocab / D.tp);
  var ePer = D.moe ? Math.ceil(D.experts / D.ep) : 0;
  return {

    expOwn:   D.moe ? Math.max(0, Math.min(ePer, D.experts - me.ep*ePer)) : 0,
    expEven:  D.moe ? D.experts / D.ep : 0,

    /* 相位差：各 rank 本来就不同步（掉队、通信抖动），差个几个百分点的步进度。

    phase: (loadSeed(key, 47) - 0.5) * 0.12

function paramsPerCard(D, ppRank, L){

  if(L && D.moe && L.expEven > 0 && L.expOwn !== L.expEven){

   1F1B 的形状：热身期一路攒（越靠前的 stage 攒得越多，因为它得等后面所有 stage
   都回传才放得掉第一份），稳态持平，排空期一份份还回去。这正是泳道那张图上
   「等待上游激活 → 前向 → 等待下游激活梯度 → 反向」四段的显存侧读法。
   t = 这一步走到了百分之几（0–1，宿主给，与泳道那条游标同一个量）。
   不给 t 就返回稳态峰值——**这是默认**，读数与从前一字不差：不放游标的时候，

  t = clamp(t, 0, 1);
  var warm  = 0.46 * (ppRank + 1) / D.pp;              /* 越靠后的 stage 越晚攒满 */
  var drain = 1 - 0.46 * (D.pp - ppRank) / D.pp;       /* 越靠前的 stage 越早开始排空 */
  var k;
  if(t < warm)       k = warm > 0 ? t / warm : 1;
  else if(t < drain) k = 1;
  else               k = (1 - t) / Math.max(1e-6, 1 - drain);
