/* ═════════ 刀序·切分链：用「先后/上下」把五把刀组织起来 ═════════
   两种顺序，方向相反，都真实存在（§11 / §02）：
   · 嵌套序（本图自上而下）：每一刀切在上一刀的产物里——DP 复制整网(最外) →
     PP 切层段 → TP 锯进算子内部 / EP 重组专家(最深)；输入侧 全局批 →DP→ 样本份 →CP→ 双段
   · 决策序（§11，自下而上）：①TP ②PP ③CP ④EP ⑤DP(残差)
   反向不是巧合：刀越深 → 通信越密 → 越要先定、越要贴机内。 */
/* ══ 正视/侧视：本页自己的 SVG 重画（不再嵌 sidecar）═════════════════════
   内容与 model-architecture-training-sidecar 那两张一致——
     正视 = 完整一条主线：模型输入段（Token IDs / Position IDs / Attention Context /
            Embedding Weight → Parallel Embedding）+ 一层的算子 DAG（MLA attention ×
            Dense/MoE FFN × mHC 汇合）+ 主输出与 MTP 尾巴——画的就是 OPENPANGU_GRAPH
            那份真图本身（graphSVG），DP·CP 复印成方阵、TP 在 Rank 下摊成行；
     侧视 = 全部层沿层深排开 + PP Stage 分段 + Dense/MoE 换挡带 + mHC residual 主干 +
            两头的输入/输出列——层与层不一样的全部证据都在。
   为什么重画而不是嵌：sidecar 每格要挂 5,686 个 DOM 节点、fit 是异步带过渡的，
   克隆/骨架/防抖那一整条时序链就是「加载慢、偶发乱码」的来源；而这两张图要讲的
   切分信息（TP/SP/CP/DP/EP 落在哪个算子的哪根轴上）本页的数据层本来就有——
   graphSVG + net-sharding 的 SHARD 表直接画得出来，比隔着 sidecar 的 DOM 去叠
   刀口条更准。同一份数据、同一套图元，快得多。 */

/* 斜纹/横纹的 defs：三个场景（netScene / frontScene / sideScene）共用同一套语义——
   斜纹 = 切 h（TP/EP），横纹 = 切 s（CP/SP，SP 借 TP 色）。 */
function hatchDefsSVG(k, suf){
  /* k = 当前缩放：纹样按 1/k 反除，放大后斜纹/横纹在屏幕上保持同样细密——
     不然 3.4 一格的纹被 wrapper 放大 5 倍就成了粗条纹（「线条没做缩放适配」）。
     suf = id 后缀：固定悬浮层（选择轨）在变换之外，要一套不缩放的纹样，id 不能撞。 */
  k = k || 1; suf = suf || '';
  var pz = (3.4/k).toFixed(3), sw = (1/k).toFixed(3);
  function pat(id, rot, col){
    id = id + suf;
    return '<pattern id="'+id+'" width="'+pz+'" height="'+pz+'" patternUnits="userSpaceOnUse"'
      + (rot ? ' patternTransform="rotate('+rot+')"' : '') + '>'
      + '<rect width="'+pz+'" height="'+pz+'" style="fill:'+mix(col,7)+'"/>'
      + '<line x1="0" y1="0" x2="'+(rot?0:pz)+'" y2="'+(rot?pz:0)+'" style="stroke:'+col+';stroke-width:'+sw+'"/></pattern>';
  }
  return pat('hxTP', 45, VC.tp) + pat('hxEP', -45, VC.ep) + pat('hxDP', 0, VC.dp)
       + pat('hxCP', 0, VC.cp) + pat('hxSP', 0, VC.tp);
}
/* 两头/分支的节点集合：正视按代表层二选一画 FFN 分支，卡维度下两头只属于首末段 */
var FS_HEAD = {input_tokens:1, embedding_weight:1, token_embedding:1, positions:1, attention_context:1};
var FS_TAIL = {final_norm:1, lm_head:1, lm_head_weight:1, logits:1, logits_allgather:1,
               mtp_input_norms:1, mtp_eh_proj:1, mtp_decoder_layer:1, mtp_head_weight:1,
               mtp_shared_head:1, mtp_logits:1};
var FS_DENSE = {dense_mlp:1, dense_gate_up:1, dense_silu:1, dense_down:1, dense_mlp_weights:1,
                ffn_all_gather:1, ffn_reduce_scatter:1};
var FS_MOE = {router_gate:1, route_topk:1, routed_expert_bank:1, moe_combine:1, router_weight:1,
              moe_all_to_all_dispatch:1, moe_all_to_all_combine:1, shared_expert_mlp:1,
              shared_expert_weights:1, expert_bank_weights:1, expert_parallel_state:1};
/* ═════════ 模块视图：整网正视/侧视从逐算子明细收成 5-6 个功能块 ═════════
   设计评审的结论：rank 视角不需要看到一层里全部 ~30 个逐算子框，只需要认出
   已经分好的那几大块（attn.qkv / attn.core / attn.out / router / experts，
   dense 配置下 FFN 侧收成一块 mlp）以及块与块之间的通信关系；逐算子的明细
   留给「整网通」那个更细的视角。

   为什么不直接复用 IXg.G.clusters：真图里 attention-block 是一整只大簇——
   Q/KV/core/out 全混在一起，没有再往下分（见 graph.js）；moe-block 又只把
   专家与合并混在一起，比「router 单独一块」粗一档。两头的簇粒度都对不上
   这里要的 5-6 块，所以照抄 FS_DENSE/FS_MOE 这张表的写法，直接给真图的
   叶子 id 建一张显式的 id → 块 映射：块的几何 = 落进它的那些叶子节点的
   并集包围盒（用的是真节点的真坐标，不是另画一套版式）。

   折叠规则：只收「专属于这一块、不会被别的块也要」的叶子——比如
   input_layernorm 只喂给 attention，收进 attn.qkv 没有歧义。但
   pre_mlp_norm / post_mlp_norm / block_post_norm 是 dense 分支与 MoE 分支
   共用的同一个节点（两条分支的分岔点 / 汇入点），收进 mlp 还是 router/
   experts 都是错的，所以保留成独立小条——待遇和通信算子一样，块以外的
   东西块视图完全不动。shared_expert_mlp 同理保留独立：它在图上与
   router/route_topk 那一行等高、并排展开，把它的包围盒并进 experts 会跟
   router 的框在纵向上撞在一起（两条列本来就有一段并排），拆出来才不会
   互相咬住。 */
var MODULE_WRAP_IDS = {decoder_layer:1, mhc_attention:1, sparse_mla_attention:1, dense_mlp:1};
var MODULE_BLOCKS = [
  {id:'attn.qkv',  label:'Attn · QKV',  rep:'q_a_proj',           parentClu:'attention-block',
   src:['input_layernorm','q_a_proj','q_causal_conv','q_residual_add','q_a_norm','q_b_proj',
        'kv_a_proj','kv_causal_conv','kv_residual_add','kv_a_norm','kv_b_proj']},
  {id:'attn.core', label:'Attn · Core', rep:'attention_core',     parentClu:'attention-block',
   src:['attention_core']},
  {id:'attn.out',  label:'Attn · Out',  rep:'o_proj',             parentClu:'attention-block',
   src:['o_causal_conv','o_residual_add','o_proj','post_attention_norm','mhc_attention_post']},
  {id:'mlp',       label:'MLP',         rep:'dense_gate_up',      parentClu:'ffn-block',
   src:['dense_gate_up','dense_silu','dense_down']},
  /* router_gate/route_topk 在真切分表里是复制计算（by:[]，两把刀都不切）——
     照实画的话会退回默认的灰底色。但这一块在概念上就是 EP 路由链路的入口，
     跟 kernelDefs 给 'router' 上的色一致，这里显式钦定 EP 色，不等真分片。 */
  {id:'router',    label:'Router',      rep:'router_gate',        parentClu:'moe-block', forceColor:'ep',
   src:['router_gate','route_topk']},
  {id:'experts',   label:'Experts',     rep:'routed_expert_bank', parentClu:'moe-block',
   src:['routed_expert_bank','moe_combine']}
];
/* mlp 只在代表层是 dense 时实打;router/experts 只在代表层是 MoE 时实打——
   与 FS_DENSE/FS_MOE 同一个开关，只是键换成块的合成 id（'blk.'+block.id）。 */
var MOD_FS_DENSE = {'blk.mlp':1};
var MOD_FS_MOE = {'blk.router':1, 'blk.experts':1};
/* 被块吞掉、以及被块的标题横条（decoder_layer 等 4 个纯装饰 module 节点）
   一起从「整网」逐算子渲染里摘掉的 id 全集。 */
var MODULE_EXCLUDE = null;
function moduleExcludeIds(){
  if(MODULE_EXCLUDE) return MODULE_EXCLUDE;
  var out = {};
  Object.keys(MODULE_WRAP_IDS).forEach(function(id){ out[id] = 1; });
  MODULE_BLOCKS.forEach(function(b){ b.src.forEach(function(id){ out[id] = 1; }); });
  MODULE_EXCLUDE = out;
  return out;
}
/* 块的几何：落进它的叶子节点的并集包围盒——复用真节点的真坐标 */
function moduleBlockNode(b, byId){
  var x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9, found = false;
  b.src.forEach(function(id){
    var n = byId[id]; if(!n) return; found = true;
    x0 = Math.min(x0, n.x - n.width/2); x1 = Math.max(x1, n.x + n.width/2);
    y0 = Math.min(y0, n.y - n.height/2); y1 = Math.max(y1, n.y + n.height/2);
  });
  if(!found) return null;
  var rep = byId[b.rep];
  return {id:'blk.'+b.id, blkDef:b, label:b.label, kind:'op',
    colorKey:(rep ? rep.colorKey : 'opv:linear'),
    x:(x0+x1)/2, y:(y0+y1)/2, width:x1-x0, height:y1-y0, parent:b.parentClu};
}
/* 泳道逐节点点开的 kernel 分段 → 这里对应哪一块（反查表，叶子 id → 块 id）。
   只算一次缓存起来：MODULE_BLOCKS 是静态表，反查表不会随渲染变化，每帧重建
   是白费——这张表本来也就六块几十个叶子，缓存收益不在"省了多少次循环"，
   是保持"只建一次"这条本页到处都在用的习惯（旁边 MODULE_EXCLUDE 就是同一个
   写法）。变量名大写下划线：函数级缓存，跟 MODULE_EXCLUDE 同一套记号。 */
var MODULE_LEAF_BLOCK = null;
function moduleLeafBlock(){
  if(MODULE_LEAF_BLOCK) return MODULE_LEAF_BLOCK;
  var out = {};
  MODULE_BLOCKS.forEach(function(b){ b.src.forEach(function(id){ out[id] = b.id; }); });
  MODULE_LEAF_BLOCK = out;
  return out;
}
/* 这一颗节点是不是「泳道点过来的那个块」——三个机位（3D/顶视 · 正视 · 侧视）
   共用这一句判定，理由跟 hlSelOn 一样：各写各的迟早会有一个机位漏判、或者
   判法悄悄长歪，「正视亮着侧视不亮」比不加这个功能还难查。
   两条分支对应模块视图的开/关两种状态——这条分歧不能省：
     · 模块视图开着时，块是一个合成节点（n.blkDef 存在），直接比它自己的 id；
     · 模块视图关着时，画面上根本没有 'blk.xxx' 这种合成节点，块吞并的那几个
       真叶子各自逐算子画出来（互相之间没有 blkDef），只能靠 id 反查它们各自
       落进了哪一块。用户点开泳道某一节时，看整网那边不一定开着模块视图——
       两种情况都要能高亮，否则功能在「模块视图关」这个很常见的状态下就是哑的。 */
function blockHLOn(n){
  if(!ui.hlBlock || !n) return false;
  if(n.blkDef) return n.blkDef.id === ui.hlBlock;
  return moduleLeafBlock()[n.id] === ui.hlBlock;
}
/* 聚合读数：不是另起一套假数据，是把块里每个真叶子各自的 sdOpBuckets——
   sdOpMetric 本身也是从这份桶里按「数据」多选拼出一行——按同一套多选原样
   求和/拼接：耗时求和、带参算子的 W 求和、MoE 专家的 token 数求和；
   router 那两个算子没有 token 数（是复制计算，读的是 Pmax/熵/失衡，不可加），
   退回取第一份代表读数。数值类（σ/Amax/…）同样挑第一个有这类读数的叶子
   做代表——块内同类叶子的量级本就接近，罗列一遍没有意义。 */
function sdBlockMetric(li, blk, byId, D, maxCh){
  var totalLat = 0, totalW = 0, totalTok = 0, sampleNum = null, moeRep = null, any = false;
  blk.src.forEach(function(id){
    var cn = byId[id]; if(!cn) return; any = true;
    var B = sdOpBuckets(li, cn, D);
    B.perf.forEach(function(s){ var m = /^(-?[\d.]+)ms$/.exec(s); if(m) totalLat += parseFloat(m[1]); });
    B.grad.forEach(function(s){ var m = /^W ([\d.]+)/.exec(s); if(m) totalW += parseFloat(m[1]); });
    var gotTok = false;
    B.moe.forEach(function(s){ var m = /^(\d+) tok/.exec(s); if(m){ totalTok += parseInt(m[1], 10); gotTok = true; } });
    if(!gotTok && !moeRep && B.moe.length) moeRep = B.moe;
    if(!sampleNum && B.num.length) sampleNum = B.num;
  });
  if(!any) return '';
  var out = [];
  if(ui.mv.perf && totalLat > 0) out.push('Σ'+totalLat.toFixed(2)+'ms');
  if(ui.mv.grad && totalW > 0) out.push('ΣW '+totalW.toFixed(0));
  if(ui.mv.moe){
    if(totalTok > 0) out.push(totalTok+' tok');
    else if(moeRep) out = out.concat(moeRep);
  }
  if(ui.mv.num && sampleNum) out = out.concat(sampleNum);
  if(maxCh) while(out.length > 1 && out.join(' ').length > maxCh) out.pop();
  return out.join(' ');
}
/* 警示同样是聚合：块里任一叶子亮红灯，这块就该跟着亮——和点开明细看到的
   判断必须是同一件事，不能图上一片正常、点开某个叶子才发现有问题。 */
function sdBlockWarn(li, blk, byId, D){
  return blk.src.some(function(id){ var cn = byId[id]; return cn && sdOpWarn(li, cn, D); });
}
/* 整张真图（含补齐的 MTP 尾巴）的包围盒——EXTRA_NODES 探出 G.height 之外，量一次缓存 */
var FS_GB = null;
function frontBounds(){
  if(FS_GB) return FS_GB;
  var IX = graphIndex(); if(!IX) return null;
  var y0 = 1e9, y1 = -1e9, x0 = 1e9, x1 = -1e9;
  IX.G.nodes.forEach(function(n){
    x0 = Math.min(x0, n.x - n.width/2); x1 = Math.max(x1, n.x + n.width/2);
    y0 = Math.min(y0, n.y - n.height/2); y1 = Math.max(y1, n.y + n.height/2);
  });
  FS_GB = {x:x0 - 24, y:y0 - 24, w:(x1 - x0) + 48, h:(y1 - y0) + 48};
  return FS_GB;
}
/* ── 地图式文字：正/侧视被 wrapper 按 zoom 整体放大，字按 FS_ZOOM_GROWTH 那个
   damping 跟着长，不是原地钉死——crisp 重绘时把字号、光晕、胶囊尺寸预先除回
   1/FS_Z，换到屏幕上就是「长，但比框慢」那条曲线；
   gesture 里的位图拉伸只是过渡，停手 0.4s 后就换成这份清晰的。
   FS_Z 由 frontScene / sideScene 每次渲染时设置（netScene 自己把 zoom 折进投影，
   不走这条）。缩得比 0.75 还小就不再缩小字：那时格子比字还小，字跟着缩只会
   小到读不清（这一段仍是纯地图式——缩得越小字越小没有意义，起这条底）。 */
var FS_Z = 1;
/* ── 字号增益：把「场景单位」换算成真的屏幕像素 ────────────────────────────
   这一页的 viewBox 比舞台的 CSS 尺寸大（VW≈1308 铺在 1680px 上，1 单位 ≈ 1.28px），
   于是 5.4 单位的正文标注落到屏幕上只有 ~6.9px——放大之后字虽然不再变大（地图式
   是对的），但**定在了一个看不清的尺寸上**。这里量一次实际的「单位 → 像素」比，
   连同一个可读性系数一起折进 FS_Z：所有 X/FS_Z 的写法（字号、描边、圆角、门牌
   内边距、两头轨的行距）会一起等比变大，比例关系不变，只是整体到了能看清的档位。
   标签的显隐阈值用的也是同一个 FS_Z（w*zs > 字长×2.2），字变大之后阈值自动变严：
   出现得更晚，但一出现就是看得清的——这正是地图式标注该有的行为。
   量出来的比不写死：viewBox 宽度由舞台长宽比反解（与 renderChain 同一条式子），
   舞台尺寸一变，字的**屏幕**大小仍然不变。 */
var FS_PX = 11.5;                      /* 正文标注（基准 5.4 档）在屏幕上的目标像素 */
/* 反除的上限。gain 越大 = 字在**场景单位**里越大；而 gain 里的 vw/cw 就是 1/缩放比，
   所以「gain 随窄而涨」等价于「画面缩小、字不缩」。上限压到 1.4 是因为字单方面涨
   上去就会互相叠——但**叠在哪儿是可以查的**：把上限抬到 2.6 逐对量一遍，一屏 42 对
   重叠里几乎全部出自四处版面缺陷，而不是「普遍性地挤」：

     · 段头横幅（PP Stage n · Lx–Ly ＋ 因子行）只管居中、从不管段宽装不装得下
     · 顶边距 TM 钉死 74，横幅整块却按 1/FS_Z 长，抬高后直接长进层刻度那一行
     · 层刻度芯片 78% 悬在基线之上，抬高后剩下的 22% 压进数据带第一条的标题
     · 右上角「数据标注」三行的行距是常数 12/10，字长上去就摞成一团

   这四处各自按「装不下就缩 / 装不下就不写 / 让位按同一个倍数长」修掉之后，同样

    return '<line x1="'+A[0]+'" y1="'+A[1]+'" x2="'+B2[0]+'" y2="'+B2[1]+'" style="stroke:'+VC[dim]+';stroke-width:1.6;marker-end:url(#arr'+dim+')"/>'
      + txt(B2[0], B2[1]+dy, label, 11, VC[dim], 'middle', 'font-weight="700"');
  }
  ax += arrow('tp', [o[0],-.55,o[1]], [o[0]+(uT[0]-o[0])*Math.min(TPn,3), -.55, o[1]+(uT[1]-o[1])*Math.min(TPn,3)], 'TP', 14);
  ax += arrow('dp', [o[0],-.55,o[1]], [o[0]+(uD[0]-o[0])*Math.min(DPn,3), -.55, o[1]+(uD[1]-o[1])*Math.min(DPn,3)], 'DP', 14);
  var ppx = (-Ze*C-.6)*s;
  ax += '<line x1="'+ppx+'" y1="0" x2="'+ppx+'" y2="'+(-((PPn-1)*ypitch+.6)*s)+'" style="stroke:'+VC.pp+';stroke-width:1.6;marker-end:url(#arrpp)"/>'
      + txt(ppx, -((PPn-1)*ypitch+.9)*s, 'PP↑', 11, VC.pp, 'middle', 'font-weight="700"');

  /* L5 通信 */
  var comm='';
  if(commActive && ui.commDim!=='cp'){
    var mem = groupMembers(ui.commDim, refG, D).filter(function(r){
      var c2 = coordsOf(r,D); return c2.c===facet && c2.d<DPn;
    });
    var pts = mem.map(function(r){ var c2=coordsOf(r,D); return cardAnchor(c2.t,c2.d,c2.p,D,LY); });
    comm = '<g opacity=".95">'+edgeSVG(pts, ui.commPrim, VC[ui.commDim], {mid:ui.commDim})+'</g>';
  }
  $('stage').innerHTML = '<svg viewBox="'+vb.map(function(v){return v.toFixed(0);}).join(' ')+'" preserveAspectRatio="xMidYMid meet">'
    + defsSVG() + '<g>'+cells+'</g><g id="commLayer">'+comm+'</g><g id="animLayer"></g><g pointer-events="none">'+ax+'</g></svg>';

  /* 舞台工具条 */
  var sb = '';
  sb += '<span class="pt-cap">CP 分面</span>';
  if(D.cp===1) sb += '<span class="pt-chip">CP=1 无分面</span>';
  else for(var ci=0; ci<D.cp; ci++) sb += '<button class="pb mono" data-act="facet" data-i="'+ci+'" style="--c:'+VC.cp+'"'+(facet===ci?' aria-pressed="true" ':'')+(facet===ci?' class="pb mono is-on"':'')+'>'+(facet===ci?'cp'+ci:'cp'+ci)+'</button>';
  sb += '<span class="pt-sep"></span><button class="pb" data-act="yaw" data-d="-1">⟲</button><button class="pb" data-act="yaw" data-d="1">⟳</button>'
      + (ui.yaw!==0?'<button class="pb" data-act="yawreset">复位等轴测</button>':'')
      + '<span class="pt-sep"></span><button class="pb'+(anim.on?' is-on':'')+'" data-act="anim">'+(anim.on?'■ 停止':'▶ 播放一个训练步')+'</button>';
  $('stagebar').innerHTML = sb;
  fixFacetButtons(facet);

  /* 折叠提示 */
  var LYf = LY.folded;
  if(LYf || (ui.unfold && D.dp*D.tp*D.pp>1600)){
    $('stageNote').hidden = false;
    $('stageNote').innerHTML = LYf
      ? (D.tp*D.dp*D.pp>1000
          ? '这套配置 '+fmt(D.tp*D.dp*D.pp)+' 个实例，默认不全量渲染（要几秒）——先画前 '+DPn+' 个 DP 副本。DP 是对称维，看一组等于看全部（DP-3）。<button class="pb" data-act="unfold">仍要全部画出</button>'
          : 'DP='+D.dp+' 为对称维，只画前 '+DPn+' 个副本——看一个组等于看全部（DP-3/DP-5）。<button class="pb" data-act="unfold">全部画出</button>')
      : fmt(D.tp*DPn*D.pp)+' 张卡全量渲染中。<button class="pb" data-act="refold">恢复折叠</button>';
  }else{ $('stageNote').hidden = true; }

  /* 抽离图（R2；CP 组唯一入口） */
  if(commActive && (ui.detach || ui.commDim==='cp')){
    $('detach').hidden = false;
    $('detach').innerHTML = detachHTML(D, refG);
  }else{ $('detach').hidden = true; }
}
function fixFacetButtons(facet){ /* 简化 is-on 写法（字符串拼接里难做干净） */

}
function detachHTML(D, refG){

  }else{

      + txt(p2[0], p2[1]+4, mem[i3], 10, 'var(--pt-fg)', 'middle', 'font-weight="700"')
      + txt(p2[0], p2[1]+23, dim+'_rank '+i3, 8.5, col);
  }).join('');
  var edges = edgeSVG(pts.map(function(p2){ return [p2[0], p2[1]-13]; }), ui.commPrim, col, {mid:dim, ring:true});
  return '<b style="font-size:12px">抽离模式 · 只看连线（R2）</b> '
    + '<span class="mono" style="font-size:12px;color:var(--pt-fg2)">'+DIMN[dim]+' 组 × '+PRIMS.filter(function(x){return x.id===ui.commPrim;})[0].name+' · '+n+' 张卡'+(sel===null?'（示意 0 号组）':'')+(dim==='cp'?' · CP 组跨分面，只在此呈现':'')+'</span>'
    + '<svg viewBox="0 0 '+w+' '+h+'">'+defsSVG()+edges+nodes+'</svg>';
}

/* ═════════ FR-10 动画 ═════════ */
function buildPhases(D){
  var ph=[], MB=Math.min(D.ga,2), m, s2, s3;
  for(m=1;m<=MB;m++) for(s2=0;s2<D.pp;s2++){
    ph.push({k:'tp',s:s2,m:m,dir:'前向'});
    if(D.moe) ph.push({k:'a2a',s:s2,m:m,dir:'前向'});
    if(s2<D.pp-1) ph.push({k:'p2p',s:s2,to:s2+1,m:m,dir:'前向'});
  }
  for(m=1;m<=MB;m++) for(s3=D.pp-1;s3>=0;s3--){
    ph.push({k:'tp',s:s3,m:m,dir:'反向'});
    if(s3>0) ph.push({k:'p2p',s:s3,to:s3-1,m:m,dir:'反向'});
  }
  ph.push({k:'dp'});
  return ph;
}
function animTick(D){
  var lay = document.getElementById('animLayer');
  if(!lay){ stopAnim(); return; }
  if(anim.i >= anim.phases.length){ stopAnim(); render(); return; }
  var p = anim.phases[anim.i++], LY = v1Layout(D);
  var refG = (sel!==null && sel<D.world) ? sel : rankOf(0, ui.cpFacet, 0, 0, D);
  var co = coordsOf(refG, D); if(co.d >= LY.dpShown) co.d = 0;
  var html='', capEl = $('animCap');
  function anchors(list){ return list.map(function(r){ var c2=coordsOf(r,D); return cardAnchor(c2.t, Math.min(c2.d,LY.dpShown-1), c2.p, D, LY); }); }
  if(p.k==='tp'){
    var mem=[]; for(var t=0;t<D.tp;t++) mem.push(rankOf(t, ui.cpFacet, co.d, p.s, D));
    html = '<g class="pulse2">'+edgeSVG(anchors(mem),'allreduce',VC.tp,{mid:'tp'})+'</g>';
    capEl.innerHTML = 'μb'+p.m+' · '+p.dir+' · stage '+p.s+' · <b>TP AllReduce</b>（每层两下，按 stage 折叠示意）';
  }else if(p.k==='p2p'){
    var a = cardAnchor(co.t,co.d,p.s,D,LY), b = cardAnchor(co.t,co.d,p.to,D,LY);
    html = '<g class="pulse1"><line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'" style="stroke:'+VC.pp+';stroke-width:3;marker-end:url(#arrpp)"/></g>';
    capEl.innerHTML = 'μb'+p.m+' · '+p.dir+' · <b>PP P2P</b> stage '+p.s+'→'+p.to;
  }else if(p.k==='a2a'){
    var memE = D.moe ? epMembers(rankOf(co.t,ui.cpFacet,co.d,p.s,D),D).filter(function(r){ var c3=coordsOf(r,D); return c3.c===ui.cpFacet && c3.d<LY.dpShown; }) : [];
    html = '<g class="pulse1">'+edgeSVG(anchors(memE),'alltoall',VC.ep,{mid:'ep'})+'</g>';
    capEl.innerHTML = 'μb'+p.m+' · stage '+p.s+' · <b>MoE All-to-All</b> 成片爆发';
  }else if(p.k==='dp'){
    var memD=[]; for(var d2=0; d2<Math.min(D.dp,LY.dpShown); d2++) memD.push(rankOf(co.t,ui.cpFacet,d2,co.p,D));
    html = '<g class="pulse2">'+edgeSVG(anchors(memD),'allreduce',VC.dp,{mid:'dp'})+'</g>';
    capEl.innerHTML = '<b>DP 梯度 AllReduce</b>——整步静默，末尾闪一次';
  }
  lay.innerHTML = html;
}
function startAnim(D){
  anim.on = true; anim.phases = buildPhases(D); anim.i = 0;
  $('animCap').style.display = 'block';
  anim.timer = setInterval(function(){ animTick(derive(cfg)); }, 620);
}
function stopAnim(){
  anim.on = false;
  if(anim.timer){ clearInterval(anim.timer); anim.timer = null; }
  var c = $('animCap'); if(c) c.style.display = 'none';
  var l = document.getElementById('animLayer'); if(l) l.innerHTML = '';
}

/* kernel 定义：算子→kernel 的 N:M 语义（融合/分段），attn/router/expert 色块——
   V3(卡内解剖)与 V2(时间·流)共用同一份：前者画结构(无量纲宽度)，后者按这份比例去分
   真实的 F/B 时长。粒度链要在两处对得上，不能一边画一套算子表（rank-segmentation-observability）。 */
function kernelDefs(D){
  return D.moe
    ? [{w:1.5, from:'融合', src:['attn.q','attn.kv'], c:VC.tp}, {w:.9, src:['attn.core'], c:'var(--pt-fg3)'},
       {w:.8, src:['attn.out'], c:VC.tp}, {w:.7, src:['router'], c:VC.ep},
       {w:.8, from:'组批 1/2', src:['experts'], c:VC.ep}, {w:.8, from:'组批 2/2', src:['experts'], c:VC.ep}]
    : [{w:1.5, from:'融合', src:['attn.q','attn.kv'], c:VC.tp}, {w:.9, src:['attn.core'], c:'var(--pt-fg3)'},
       {w:.8, src:['attn.out'], c:VC.tp}, {w:1.1, src:['mlp.gate/up'], c:VC.tp},
       {w:.45, from:'分段 1/2', src:['mlp.down'], c:VC.tp}, {w:.45, from:'分段 2/2', src:['mlp.down'], c:VC.tp}];
}

/* 放大：时间·流里点开的某个 F/B 块，按 kernelDefs 展开成带标签的 kernel 序列——
   与 V3「⑤流」轨道同一套色值/同一份比例，只是这里是单独拎出来放大看，不挤在算子带下面。 */
function fbZoomSVG(D, blk){
  var kdefs = kernelDefs(D), kSum = kdefs.reduce(function(a,k){ return a+k.w; }, 0);
  var W = 920, LBL = 128, rowH = 60, px = (W-LBL-30)/kSum;
  var y = 20;
  var kindName = blk.t==='F' ? '前向 F' : '反向 B';
  var out = txt(LBL, 12, '放大：stage '+blk.s+' 的 '+kindName+blk.m+' —— 这一次计算内部按 kernel 展开（与「卡内解剖」同一份算子表，同号同色）', 9.5, 'var(--pt-fg2)', 'start');
  var kx = LBL;
  kdefs.forEach(function(k){
    var w = k.w*px;
    out += '<rect x="'+kx.toFixed(1)+'" y="'+y+'" width="'+Math.max(1,w-2).toFixed(1)+'" height="'+(rowH-16)+'" style="fill:'+mix(k.c,30)+';stroke:'+k.c+';stroke-width:1"/>';
    var label = k.src.join('+')+(k.from?' · '+k.from:'');
    out += txt(kx+w/2, y+rowH-4, label, 8, k.c, 'middle', 'font-weight="600"');
    kx += w;
  });
  out += txt(kx, y+rowH+12, '算子→kernel = N:M（融合/分段）· 颜色=切法（青=TP · 紫=EP · 灰=不切权重）', 8.6, 'var(--pt-fg3)', 'end');
  return out;
}

/* ═════════ V2 时间·流（FR-7/8）：流=容器，容量是时间 ═════════ */
function renderV2(D){
  var sch = schedule(D), T = sch.T, PP = D.pp;

    if(layerOn('L4')) rows += txt(LBL-8, y+rowH/2-4, 'stage '+s2+(hot?' ◀ r'+sel:''), 10.5, hot?VC.dp:'var(--pt-fg3)', 'end', hot?'font-weight="700"':'');
  }

    var y=22+b.s*rowH, x=LBL+b.t0*px, w2=(b.t1-b.t0)*px-1.2;
    if(b.type==='AR'){
      blocks += '<g data-act="zoomar" style="cursor:pointer"><rect x="'+x+'" y="'+(y+1)+'" width="'+w2+'" height="'+(rowH-16)+'" style="fill:'+mix(VC.dp,26)+';stroke:'+VC.dp+';stroke-width:1.1"/>'
        + (w2>36?txt(x+w2/2, y+rowH/2-4, 'AllReduce', 8.5, VC.dp):'')+'</g>';
    }else{
      var fw = b.type==='F';
      var bw = Math.max(1,w2), bh = rowH-16, kx2 = x, segs = '', isZoomed = ui.zoomFB && ui.zoomFB.s===b.s && ui.zoomFB.t===b.type && ui.zoomFB.m===b.m;
      /* kernel 分段：块内部按 kernelDefs 比例分色，与「卡内解剖」同一份算子表、同一套色值——
         这样「rank 里有啥」（V3）与「这是时间」（V2）画的是同一份数据，不是各自为政（rank-segmentation-observability）。
         块通常只有几十 px 宽，分段只给色带，标签留给点开的放大视图（下面 fbZoomSVG）。 */
      kdefs2.forEach(function(k){
        var sw = bw*k.w/kSum2;
        segs += '<rect x="'+kx2.toFixed(1)+'" y="'+(y+1)+'" width="'+Math.max(.6,sw).toFixed(1)+'" height="'+bh+'" style="fill:'+mix(k.c, fw?34:58)+'"/>';
        kx2 += sw;
      });
      blocks += '<g data-act="zoomfb" data-s="'+b.s+'" data-t="'+b.type+'" data-m="'+b.m+'" style="cursor:pointer">'
        + segs
        + '<rect x="'+x+'" y="'+(y+1)+'" width="'+bw+'" height="'+bh+'" style="fill:none;stroke:'+(isZoomed?VC.pp:'var(--pt-bds)')+';stroke-width:'+(isZoomed?1.6:.7)+'"/>'
        + (w2>15?txt(x+w2/2, y+rowH/2-4, (fw?'F':'B')+b.m, 8.2, 'var(--pt-fg2)'):'')
        + '</g>';
      if(layerOn('L5') && b.recv) ticks += '<path d="M'+x+' '+(y-3)+' l4 -5 l-8 0 z" style="fill:'+VC.pp+'"/>';
    }
  });
  var axis = '<line x1="'+LBL+'" y1="'+(22+PP*rowH+2)+'" x2="'+(W-14)+'" y2="'+(22+PP*rowH+2)+'" style="stroke:var(--pt-fg);stroke-width:1"/>'
    + txt(W-14, 22+PP*rowH+15, '时间 →  F=1 B=2 · 1F1B 合成'+(sch.truncated?' · 只画前 '+sch.GA+' 个 μbatch':''), 9, 'var(--pt-fg3)', 'end');
  var zoomH = ui.zoomAR ? 236 : (ui.zoomFB ? 108 : 0);
  var zoom = ui.zoomAR ? arZoomSVG(D) : (ui.zoomFB ? fbZoomSVG(D, ui.zoomFB) : '');

  $('stagebar').innerHTML =
    '<button class="pb'+(ui.skew?' is-on':'')+'" data-act="skew">注入偏斜（某副本慢）</button>'
    + '<button class="pb'+(ui.zoomAR?' is-on':'')+'" data-act="zoomar">放大末尾 AllReduce</button>'
    + tipChip('怎么读这一屏', '流 = 时间容器：装 kernel，装满不会崩，只是变慢（§08）。点任一 F/B 块：放大看 attn/router/experts 怎么分段（与卡内解剖同号同色）。');
  $('stageNote').hidden = true; $('detach').hidden = true;
}
function arZoomSVG(D){
  var n = Math.min(D.dp,6), base=1.0, xfer=0.9, culprit = ui.skew ? Math.min(2,n-1) : -1;

  for(var r=0;r<n;r++){

      + '<rect x="'+x0+'" y="'+y+'" width="'+(x1-x0)+'" height="18" style="fill:'+(isCul?mix('var(--pt-danger)',14):mix(VC.dp,22))+';stroke:'+(isCul?'var(--pt-danger)':VC.dp)+';stroke-width:'+(isCul?1.6:1)+'"/>'
      + '<line x1="'+x0+'" y1="'+(y-3)+'" x2="'+x0+'" y2="'+(y+21)+'" style="stroke:var(--pt-fg);stroke-width:1.3;stroke-dasharray:2 2"/>'
      + (isCul?txt(x0+4, y+13, '最后进入 · 段最短 = 嫌疑人', 9, 'var(--pt-danger)', 'start', 'font-weight="700"'):'');

      + txt(LBL+exit*px, 10, '共同退出', 8.5, 'var(--pt-fg)');
  return out;

/* ═════════ V3 卡内解剖：容器打开 —— 层 → 算子 → kernel → 流 ═════════ */
function renderV3(D){
  var g = (sel!==null && sel<D.world) ? sel : 0;
  var co = coordsOf(g,D), Lps = D.layersPerStage, l0 = co.p*Lps;
  var ops = opBytes(D);
  var s = 46;
  var maxOpB = Math.max.apply(0, ops.map(function(o){return Math.max(o.b,1);}));
  var CW = 4.6, CH = 2.6, CD = Math.max(2.2, Math.min(6, Lps*.42));
  var picked = clamp(ui.selLayerOff, 0, Lps-1);
  var CIRC = '①②③④⑤⑥⑦⑧⑨⑩';   /* 算子编号：算子↔kernel 用同号对应（N:M） */
  var opIdx = {}, opFront = {};
  var parts = [];
  /* 包围盒：边生成边登记（文字给出估算宽度），最后据此定 viewBox */
  var bx=[], by=[];
  function reg(p, wL, wR, hU, hD){ bx.push(p[0]-(wL||0), p[0]+(wR||0)); by.push(p[1]-(hU||0), p[1]+(hD||0)); }
  function regBox(x,y,z,w,h,d){
    [[x,y,z],[x+w,y,z],[x,y,z+d],[x+w,y,z+d],[x,y+h,z],[x+w,y+h,z],[x,y+h,z+d],[x+w,y+h,z+d]]
      .forEach(function(c){ reg(proj(c[0],c[1],c[2],s)); });
  }

  /* ① 卡容器（线框=容量边界）+ 门牌（地址=文字，§15） */
  parts.push(boxSVG(0, 0, 0, CW, CH, CD, s, {wire:true, stroke:'var(--pt-fg)', sw:1.4}));
  regBox(0,0,0,CW,CH,CD);
  var door = proj(0, CH, CD, s);   /* 容器左上角外侧 */
  parts.push(txt(door[0]-6, door[1]-26, '卡 = 容器（容量 = 显存 '+D.hbm+'GB）', 11, 'var(--pt-fg)', 'start', 'font-weight="700"'));
  /* 门牌本身是正文（这张卡是谁），「地址只标不画」是读法——收进悬停。 */
  parts.push(txtI(door[0]-6, door[1]-12,
    '门牌: global_rank '+g+' · tp'+co.t+' cp'+co.c+' dp'+co.d+' pp'+co.p+(D.moe?(function(){var me=epOf(co.t,co.c,co.d,D);return ' ep'+me.ep;})():''),
    '地址只标不画：门牌是这张卡在五元组坐标系里的号，画布上不为它画任何几何——同一张卡在别的维还有别的号（1:N，§10）。',
    9.5, 'var(--pt-fg2)', 'start'));
  reg([door[0]-6, door[1]-26], 0, 320, 14, 0);

  /* ② 层 slabs（这段的 Lps 层；点选） */
  for(var li=0; li<Lps; li++){
    var lz = .25 + li*(CD-.5)/Lps, lh = .42, isPick = li===picked;
    parts.push('<g class="l3pick" data-li="'+li+'" style="cursor:pointer">'
      + boxSVG(.3, .2, lz, CW-.6, lh, Math.max(.16,(CD-.7)/Lps*.72), s,
        {stroke: isPick?VC.pp:'var(--pt-bds)', sw:isPick?1.8:.8, topFill:isPick?mix(VC.pp,26):''})
      + '</g>');
    /* 端点 + 选中层标全局层号：只标选中那层会让人以为 L 是卡内序号，逐层都标又会糊成一团 */
    var lc = proj(CW-.3, .2+lh, lz, s);
    if(isPick){
      parts.push(txt(lc[0]+8, lc[1]-2, 'L'+(l0+li), 10, VC.pp, 'start', 'font-weight="800"'));
      reg([lc[0]+8, lc[1]-2], 0, 34, 8, 4);
    }else if(li===0 || li===Lps-1){
      parts.push(txt(lc[0]+7, lc[1]-1, 'L'+(l0+li), 7.2, 'var(--pt-fg3)', 'start'));
      reg([lc[0]+7, lc[1]-1], 0, 26, 6, 3);
    }
  }
  var capL = proj(CW, 0, CD, s);   /* 容器最低点下方，谁也不压 */
  /* 层段是正文；「L 是什么号」那两句是读法，合成一枚 ⓘ。 */
  parts.push(txtI(capL[0], capL[1]+20, '层段 L'+l0+'–L'+(l0+Lps-1)+'（'+Lps+' 层）',
    '点任一层可以把它抽出来。L = 整网的全局层号（ℓ 轴 · 整网共 '+D.layers+' 层 L0–L'+(D.layers-1)+'），不是卡内序号；'
    + 'PP 刀把它切成 '+D.pp+' 段，这张卡只装 stage'+co.p+' 这一段。',
    9.5, 'var(--pt-fg3)', 'middle'));
  parts.push(txt(capL[0], capL[1]+44, '当前抽出：L'+(l0+picked)+' = 整网第 '+(l0+picked)+' 层 · 段内第 '+(picked+1)+'/'+Lps, 8.6, VC.pp, 'middle', 'font-weight="700"'));
  reg([capL[0], capL[1]+44], 300, 300, 0, 10);

  /* ③ 抽出的层 → 算子块（体积∝字节；切法着色） */
  var opW = 1.05, gap = .38, opsDrawn = ops.filter(function(o){ return o.b>0 || o.id==='attn.core'; });
  var bandW = opsDrawn.length*(opW+gap);
  var ox = CW + 2.4, oy = 0, hookPts = {};   /* 算子带放容器右前方，同一地面 */
  opsDrawn.forEach(function(o, oi){
    var hgt = o.b>0 ? .3 + 1.35*(o.b/maxOpB) : .26;
    var x0 = ox + oi*(opW+gap);
    var col = o.cut==='tp' ? VC.tp : o.cut==='ep' ? VC.ep : 'var(--pt-fg3)';
    if(o.b>0) parts.push(boxSVG(x0, oy, 0, opW, hgt, .9, s, {fill:mix(col,70), stroke:col, sw:1, attrs:' class="opblk" data-op="'+esc(o.id)+'"'}));
    else parts.push(boxSVG(x0, oy, 0, opW, .26, .9, s, {wire:true, stroke:col, sw:1, dash:'3 3', attrs:' class="opblk" data-op="'+esc(o.id)+'"'}));
    regBox(x0, oy, 0, opW, Math.max(hgt,.9), .9);
    var tc = proj(x0+opW/2, oy, .9, s);   /* 标注放块的前下方，斜排避让 */
    var ty = tc[1] + 14 + (oi%2)*18;
    opIdx[o.id] = CIRC.charAt(oi); opFront[o.id] = tc;
    parts.push(txt(tc[0], ty, opIdx[o.id]+' '+o.id, 8.8, 'var(--pt-fg)', 'middle', 'font-weight="600"'));
    parts.push(txt(tc[0], ty+10, o.how, 7.6, col));
    reg([tc[0], ty+10], 40, 40, 0, 8);
    hookPts[o.id] = proj(x0+opW/2, oy+hgt, .45, s);
  });
  /* 层→算子 展开引线（结构：无厚度虚线） */
  var pickedZ = .25 + picked*(CD-.5)/Lps;
  var pa = proj(CW-.3, .2+.21, pickedZ, s), pb = proj(ox-.15, .5, .45, s);
  parts.push('<path d="M'+pa[0]+' '+pa[1]+' C '+(pa[0]+60)+' '+(pa[1]-30)+', '+(pb[0]-60)+' '+(pb[1]-30)+', '+pb[0]+' '+pb[1]+'" style="fill:none;stroke:'+VC.pp+';stroke-width:1.2;stroke-dasharray:5 4;marker-end:url(#arrpp)"/>');
  var bandTop = proj(ox+bandW/2, 2.2, 0, s);
  parts.push(txtI(bandTop[0], bandTop[1], '抽出的 L'+(l0+picked)+' = 一排算子的「片」',
    '结构无厚度 · 内容有体积 · 切法看颜色（青=TP 切、紫=EP 切、灰=不切权重）。',
    9.5, 'var(--pt-fg2)', 'middle', 'font-weight="600"'));
  reg([bandTop[0], bandTop[1]], 230, 230, 10, 0);

  /* ④ 通信钩子（动作：发生在切口上）
     ── 这一屏也听「看哪一层」（ui.commGrain）──────────────────────────────
     卡内解剖是「层构成」的详情页：同一件事的两个深度，切换到哪一层就该一起变，
     否则读者在阵列那屏切到「时序」，点进这一屏又是四条跨卡箭头照旧亮着。
       rank / 张量 → 跨卡那四条钩子（它们锚在真算子上，正是「谁产生了这次通信」）
       路由        → 只留 router 与 EP 那两条（其余的去向与数据内容无关）
       时序 / 影响 → 跨卡的钩子全收起来，把下面那条 kernel 轨圈出来：这一屏的
                     时间容器本来就在那儿，不必另画一条带
       rank 内     → 同样收起跨卡的边，留下卡→层→算子→kernel 这条不出卡的链
     每条钩子还要各自过一遍 commLit(dim)：读者在配置面板里关掉的那一维，
     这一屏不该自作主张画回来（以前就是这样，两屏对不上）。 */
  var cgA9 = ui.commGrain;
  var xCardA9 = (cgA9 === 'rank' || cgA9 === 'tensor');
  var routeA9 = (cgA9 === 'rank' || cgA9 === 'tensor' || cgA9 === 'route');
  var flowA9  = (cgA9 === 'time' || cgA9 === 'cost');
  if(layerOn('L5') && cgA9 === 'route'){ xCardA9 = false; }
  if(layerOn('L5')){
    var hook = function(opId, dim, label, dx){
      if(!hookPts[opId]) return;
      if(!commLit(dim)) return;
      var hp = hookPts[opId], gx = hp[0]+dx, gy = hp[1]-46;
      parts.push('<line x1="'+hp[0]+'" y1="'+(hp[1]-8)+'" x2="'+gx+'" y2="'+gy+'" style="stroke:'+VC[dim]+';stroke-width:1.6;marker-end:url(#arr'+dim+')"/>');
      parts.push(txt(gx+3, gy-4, label, 8.6, VC[dim], 'start', 'font-weight="700"'));
      reg([gx+3, gy-4], 0, 120, 12, 0);
    };
    if(xCardA9) hook('attn.out', 'tp', 'TP AllReduce ①', 14);
    if(xCardA9 || cgA9 === 'route') hook(D.moe?'experts':'mlp.down', D.moe?'ep':'tp', D.moe?'EP All-to-All':'TP AllReduce ②', 20);
    if(D.moe && routeA9) hook('router', 'ep', '路由', 6);
    /* 段边界那条 P2P 与步末那条 DP AllReduce 画在卡的棱上（不锚算子），
       同样各过各的那道门：维被关掉、或者当前不是「跨卡」这两层，就不画。 */
    if(xCardA9 && commLit('pp')){
      var edge = proj(CW, CH*.86, 0, s);
      parts.push('<line x1="'+edge[0]+'" y1="'+edge[1]+'" x2="'+(edge[0]+58)+'" y2="'+(edge[1]-20)+'" style="stroke:'+VC.pp+';stroke-width:1.8;marker-end:url(#arrpp)"/>');
      parts.push(txt(edge[0]+62, edge[1]-24, 'PP P2P → '+(co.p+1<D.pp?'stage '+(co.p+1):'（末段→loss）'), 8.8, VC.pp, 'start', 'font-weight="700"'));
      reg([edge[0]+62, edge[1]-24], 0, 130, 12, 0);
    }
    if(xCardA9 && commLit('dp')){
      var edge2 = proj(0, .25, 0, s);   /* 左前棱下部，远离门牌 */
      parts.push('<line x1="'+edge2[0]+'" y1="'+edge2[1]+'" x2="'+(edge2[0]-58)+'" y2="'+(edge2[1]+14)+'" style="stroke:'+VC.dp+';stroke-width:1.5;stroke-dasharray:6 3;marker-end:url(#arrdp)"/>');
      parts.push(txt(edge2[0]-62, edge2[1]+18, 'DP AllReduce（整步静默，步末一次）', 8.6, VC.dp, 'end'));
      reg([edge2[0]-62, edge2[1]+18], 210, 0, 6, 10);
    }
  }

  /* ⑤ 流 = 时间容器：kernel 排队（算子→kernel N:M）——压到算子带正下方更深处 */
  var fw = Math.max(bandW+.6, 5.4), fh = .6, fx = ox - .2, fy = -3.9;
  /* 切到「时序 / 影响」时把这条轨圈出来：这一屏的时间容器本来就在这儿，
     不该再另画一条带——同一件事在同一屏上只该有一个位置。 */
  parts.push(boxSVG(fx, fy, 0, fw, fh, .8, s, {wire:true,
    stroke: flowA9 ? (cgA9 === 'cost' ? 'var(--pt-danger)' : VC.pp) : 'var(--pt-fg)',
    sw: flowA9 ? 2.2 : 1.1}));
  if(flowA9){
    /* 贴在轨道**右端**、轨道上方：等距投影下这条轨是斜的，取中点会正好压在
       kernel 块上（实测就是这样）。 */
    var fLab9 = proj(fx + fw, fy + fh, .8, s);
    parts.push(txt(fLab9[0] + 14, fLab9[1] - 6,
      cgA9 === 'cost'
        ? '影响 · 气泡率 ≈ ' + (D.bubble*100).toFixed(1) + '%'
        : '时序 · kernel 在此排队',
      8.8, cgA9 === 'cost' ? 'var(--pt-danger)' : VC.pp, 'start', 'font-weight="700"'));
    reg([fLab9[0] + 14, fLab9[1] - 6], 0, 180, 12, 0);
  }
  regBox(fx, fy, 0, fw, fh, .8);
  /* kernel 用 src 声明它由哪些算子来——标签打同号，并逐条画对应引线 */
  var kdefs = kernelDefs(D);
  var kx = fx+.15, kLines = [];
  kdefs.forEach(function(k, ki){
    parts.push(boxSVG(kx, fy+.07, .12, k.w, fh-.18, .5, s, {fill:mix(k.c,52), stroke:k.c, sw:.8}));
    var badges = k.src.map(function(id){ return opIdx[id]||'·'; }).join('+');
    var kc = proj(kx+k.w/2, fy, .8, s);              /* 前下棱：标签落在轨道外侧 */
    var kty = kc[1] + 24 + (ki%2)*13;
    parts.push(txt(kc[0], kty, badges+(k.from?' '+k.from:''), 7.6, k.c, 'middle', 'font-weight="700"'));
    reg([kc[0], kty], 38, 38, 0, 8);
    var kTop = proj(kx+k.w/2, fy+fh, .3, s);
    k.src.forEach(function(id){ if(opFront[id]) kLines.push([opFront[id], kTop, k.c]); });
    kx += k.w + .12;
  });
  kLines.forEach(function(L){                        /* 算子 → kernel：同号 + 引线双保险 */
    parts.push('<path d="M'+L[0][0]+' '+(L[0][1]+34)+' C '+L[0][0]+' '+(L[0][1]+90)+', '+L[1][0]+' '+(L[1][1]-60)+', '+L[1][0]+' '+L[1][1]+'" style="fill:none;stroke:'+L[2]+';stroke-width:.8;stroke-dasharray:3 4;opacity:.6"/>');
  });
  var fl = proj(fx, fy+fh/2, .4, s);   /* 轨道左端外侧的空白区（容器正下方） */
  parts.push(txt(fl[0]-16, fl[1]-4, '流 = 另一个容器（容量 = 时间）', 10, 'var(--pt-fg)', 'end', 'font-weight="700"'));
  /* 原来这里是四行说明（排队 / N:M / 同号对应 / 单卡持有），比它要说明的那条轨
     还长。收成一行「算子→kernel = N:M」+ ⓘ：标题留在画面上，读法进悬停。 */
  var nDown = D.moe ? 'experts' : 'mlp.down';
  parts.push(txtI(fl[0]-16, fl[1]+11, '算子→kernel = N:M',
    'kernel 在此排队；装满不会崩，只是变慢（§08）。'
    + '同号对应：'+(opIdx['attn.q']||'①')+'+'+(opIdx['attn.kv']||'②')+' → 一个 kernel（融合 N:1）；'
    + (opIdx[nDown]||'⑥')+' → 两个 kernel（分段 1:N），标签在轨道下方、与块同号。'
    + 'kernel 永远单卡持有——逻辑与物理唯一的交点。',
    8.8, 'var(--pt-fg2)', 'end', 'font-weight="600"'));
  reg([fl[0]-16, fl[1]+11], 300, 0, 14, 8);

  var pad = 22;
  var vb = [Math.min.apply(0,bx)-pad, Math.min.apply(0,by)-pad,
            (Math.max.apply(0,bx)-Math.min.apply(0,bx))+2*pad, (Math.max.apply(0,by)-Math.min.apply(0,by))+2*pad];
  $('stage').innerHTML = '<svg viewBox="'+vb.map(function(v){return v.toFixed(0);}).join(' ')+'" preserveAspectRatio="xMidYMid meet">'+defsSVG()+parts.join('')+'</svg>';

  /* 这一排原来是「解剖对象 / 抽哪一层 / 通信看哪一层 / 粒度链」一长条挂在画布
     上沿。反馈：「去掉这里，和主视图一样用配置按钮配置」——配置项全部搬进那只
     共用的配置面板（见 cfgPanel 里「卡内解剖」与「通信连线」两组）。
     再一轮反馈又拿掉两颗：
       ·「↖ 它的来历（刀序链）」——返回已经在左上角单独占位、而且写明回哪儿；
         这颗跟它挨着，只会让人以为有两种返回，其中一种还回错地方（它回的是
         刀序链本身，不是读者刚才那一屏）。
       ·「粒度链 ⓘ」——纯提示，不是控件。整网⊃层⊃算子⊃kernel 这条链画布上
         已经用三道「⊃ 放大 ⊕」逐级标出来了，工具条上再挂一枚只写字的胶囊是
         把图上说过的话又说一遍。
     只剩一条真正的跳转。 */
  $('stagebar').innerHTML =
      '<button data-act="v3totime" class="pb" title="跳到「时间·流」，看这一段（attn/router/experts）在真实时间轴上具体落在哪几个 kernel">这段在时间轴上的样子 ↷</button>';
  cfgSurface(D);
  $('stageNote').hidden = true; $('detach').hidden = true;
}

/* ═════════ 过路高亮的说明徽标 ═════════════════════════════════════════
   读出卡在这种状态下是**故意**藏起来的（renderDetail / renderRankMem 都拿
   !ui.hlSel 当闸，理由见那两处注释：亮着的常常是一整片卡，一张写死某个 rank
   的读数摆在那儿会被当成整片的读数）。但"藏起来"解决的是别念错数，没解决
   另一半——画面上一圈虚线亮着，读者不知道它为什么亮、也不知道怎么收手。
   这枚徽标只补那一半：说来路、说手势，**一个读数都不带**，所以不会重新踩进
   读出卡被藏起来的那个坑。
   位置贴左下角：右边那一列（读出卡/容器卡/算子卡）是"这一屏自己选的东西"的
   地盘，过路的高亮不该去占它——占了就等于在暗示两者是同一类信息。 */
function renderHLBadge(D){
  var el = $('hlBadge'); if(!el) return;
  var onS = D.ok && hlSelOn(D);
  /* 层高亮和卡高亮是两条各管各的线（见 applyQuery 的 keepHL），徽标一并认：
     只转过来一层、没转卡的时候，画面上亮的是"住着这一层的那几十张卡"，
     同样需要一句来路说明。 */
  var hlLi = ui.hlLayer ? parseInt(ui.revLayer, 10) : NaN;
  var onL = D.ok && isFinite(hlLi) && hlLi >= 0 && hlLi < D.layers;
  if(!onS && !onL){ el.hidden = true; el.innerHTML = ''; return; }
  var what = [];
  if(onS) what.push('<b>rank '+sel+'</b>');
  if(onL) what.push('<b>L'+hlLi+'</b>' + (onS ? '' : ' 住着的那几张卡'));
  el.hidden = false;
  el.innerHTML = '<span class="hlk" style="--c:'+VC.dp+'"></span>'
    + '<span>联动高亮 · ' + what.join(' · ')
    + '<br><span style="opacity:.7">来自另一个视图，不是这一屏的选中；点画布空白就散</span></span>';
}

/* ═════════ 读出卡（FR-3） ═════════ */
function renderDetail(D){
  var el = $('detail');
  if(!D.ok){ el.hidden = true; return; }
  /* 同 renderRankMem：高亮是过路的，不配一张写死某一个 rank 的读出卡 */
  if(ui.hlSel){ el.hidden = true; return; }
  /* 全局切分视角：本卡的四档字节已经由 #rankMem 那张标准读出卡给了（见
     renderRankMem 的 inGrid 分支），这张卡讲的是层段/专家桶/坐标公式/反查——
     另一个问题，右上角还有位置，但两张卡同时开没有必要，先按 view 关掉。 */
  if(ui.view==='solid' && ui.persp==='grid'){ el.hidden = true; return; }
  if(sel===null || sel>=D.world){
    if(ui.view==='anatomy'||ui.view==='dim'||ui.view==='chain'||ui.view==='solid'||ui.view==='story'){ el.hidden = (sel===null); if(sel===null) return; }
    el.hidden = false;
    el.innerHTML = '<h4>结构总览 · 点卡读出</h4>'
      + '<table>'
      + '<tr><td>副本</td><td><span class="dk" style="--c:'+VC.dp+'">DP</span> ×'+D.dp+'</td></tr>'
      + '<tr><td>段</td><td><span class="dk" style="--c:'+VC.pp+'">PP</span> ×'+D.pp+'，每段 '+D.layersPerStage+' 层（有序）</td></tr>'
      + '<tr><td>TP组</td><td><span class="dk" style="--c:'+VC.tp+'">TP</span> ×'+D.tp+'，组内切头/列</td></tr>'
      + (D.cp>1?'<tr><td>CP</td><td><span class="dk" style="--c:'+VC.cp+'">CP</span> ×'+D.cp+'，切输入 token（分面）</td></tr>':'')
      + (D.moe?'<tr><td>EP</td><td><span class="dk" style="--c:'+VC.ep+'">EP</span> ×'+D.ep+'，stage 平面重解释（视图）</td></tr>':'')
      + '<tr><td>卡</td><td>'+fmt(D.world)+' 张 = '+D.tp+'·'+D.cp+'·'+D.pp+'·'+D.dp+'</td></tr></table>'
      + revHTML(D);
  }else{
    if(ui.view==='chain' && ui.cardMode && ui.netOff){
      el.hidden = true;
      return;
    }
    var g = sel, co = coordsOf(g,D), me = D.moe?epOf(co.t,co.c,co.d,D):null;
    var chips = ['tp','cp','dp','pp'].map(function(dm){
      var v = {tp:co.t,cp:co.c,dp:co.d,pp:co.p}[dm];
      var hot = (ui.axis===dm) || (ui.commDim===dm && layerOn('L5'));
      return '<span class="c'+(hot?' hot':'')+'" style="--c:'+VC[dm]+'">'+dm+'_rank '+v+'</span>';
    }).join('');
    if(me) chips += '<span class="c'+(ui.axis==='ep'?' hot':'')+'" style="--c:'+VC.ep+'">ep_rank '+me.ep+'</span><span class="c">etp '+me.etp+'</span>';
    el.hidden = false;
    var l0d = co.p*D.layersPerStage, l1d = l0d + D.layersPerStage - 1;
    var expRow = '';

function revHTML(D){

/* 反查一层落在哪几张卡上——**正向那一问的逆命题**。
   这一屏别处答的都是「这张卡装了什么」，而这里问的是「这一层住在哪」：
   两个方向合起来才是完整的映射。光给一串 rank 号码说明不了什么，真正要讲的是
   那几刀**各自决定了什么**（也就是三者叠加时每一刀的分工）：
     PP 决定这一层去哪几张卡 · TP/EP 决定它在那几张卡里怎么碎 · DP 决定这套安排
     复制几遍；层作为概念自始至终没变，变的只是它被映射到硬件上的方式。
   末一行是结论：一层牵动 world/PP 张卡，而 TP 或 EP 只要落下，就没有哪一张
   持有完整的它。 */
function layerHome(D, L){
  var stage = Math.floor(L / D.layersPerStage);
  var l0 = stage*D.layersPerStage, l1 = Math.min(D.layers-1, l0+D.layersPerStage-1);
  var isMoe = D.moe && L >= Math.min(2, D.layers);       /* 与 netScene 的 denseTop 同口径 */
  var tot = D.tp * D.cp * D.dp;
  var frag = (ui.kTP && D.tp>1 ? D.tp : 1) * (isMoe && ui.kEP && D.ep>1 ? D.ep : 1);
  return {stage:stage, l0:l0, l1:l1, isMoe:isMoe, tot:tot, frag:frag};
}
function renderRevOut(D){
  var out = document.getElementById('revOut');
  if(!out) return;
  var v = ui.revLayer;
  if(v===''||isNaN(+v)){ out.innerHTML=''; return; }
  var L = clamp(Math.floor(+v), 0, D.layers-1), h = layerHome(D, L), stage = h.stage;
  var mem=[], d,c,t;
  for(d=0;d<D.dp&&mem.length<20;d++) for(c=0;c<D.cp&&mem.length<20;c++) for(t=0;t<D.tp&&mem.length<20;t++) mem.push(rankOf(t,c,d,stage,D));
  function step(dim, txt2){
    return '<div style="margin:1px 0 1px 0"><span class="dk" style="--c:'+VC[dim]+'">'+dim.toUpperCase()
      + '</span> <span style="font-size:12px">'+txt2+'</span></div>';
  }
  out.innerHTML = '<div class="formula" style="margin:5px 0 4px">'
    + '<b>L'+L+'</b> 住在哪'
    + step('pp', '落在 <b>stage '+stage+'</b>（L'+h.l0+'–L'+h.l1+'）—— 决定它<b>去哪几张卡</b>')
    + step('tp', (D.tp>1 ? '段内切成 <b>'+D.tp+' 份</b>（带着 SP）' : '×1，不切')
        + ' —— 决定它<b>在那几张卡里怎么碎</b>')
    + (D.moe ? step('ep', h.isMoe
        ? '这一层是 MoE，专家再分 <b>'+D.ep+' 桶</b>（重分组，<b>不新增卡</b>）'
        : '这一层是 Dense，<b>没有 e 轴</b>，EP 这一刀落不下来') : '')
    + (D.cp>1 ? step('cp', '输入再切 <b>'+D.cp+' 段</b>（切的是 s，不减权重）') : '')
    + step('dp', '上述整个安排<b>复制 '+D.dp+' 份</b>')
    + '<div style="margin-top:4px;border-top:1px solid var(--pt-bd);padding-top:3px">= 共 <b>'+fmt(h.tot)
    + '</b> 张卡与 L'+L+' 有关（world/PP）'
    + (h.frag>1 ? '，<b>无一张持有完整的它</b>（各持 1/'+h.frag+'）' : '，每张持有<b>完整</b>的它')
    + '</div></div>'
    + '<div class="rankchips">'+mem.map(function(r){return '<button data-act="pick" data-g="'+r+'">'+r+'</button>';}).join('')
    + (h.tot>mem.length?'<span style="font-size:12px;color:var(--pt-fg3)">…共 '+fmt(h.tot)+'</span>':'')+'</div>';
}

function accHTML(D){
  var rows = [];
  rows.push(['A1','CP 维度下原语仍可任选', 'pass', 'L5 选 CP 后 5 种原语全可选：Ring=P2P · Ulysses=All-to-All · 朴素=AllGather（勘误 L）']);
  rows.push(['A2','无 rank 几何体', 'pass', '几何体只表示卡/内容/动作；rank 一律 <text> 门牌（§15：地址无体积无容量）']);
  var probe2 = derive(Object.assign({},cfg,{world:D.tp*D.cp*D.pp*2}));
  var probe8 = derive(Object.assign({},cfg,{world:D.tp*D.cp*D.pp*8}));
  /* 这条断言原来只有一面：「调 DP 容器纹丝不动」。加上 ZeRO 档位之后它有了两面，
     而且两面都必须当场成立，否则这个档位就只是个装饰：
       档位 = 0 → DP=2 与 DP=8 的显存构成必须**逐字节相等**（复制 ≠ 共有）
       档位 > 0 → 必须**不等**，且被切的那几档要正好差 4 倍（8/2）
     只留一面的话，读者拨了档位看见 A3 变红，会以为是自己把配置调坏了。 */
  var mp2 = D.ok ? memParts(probe2,0) : null, mp8 = D.ok ? memParts(probe8,0) : null;
  var same3 = mp2 && JSON.stringify(mp2) === JSON.stringify(mp8);
  var z3 = D.zero, a3 = D.ok ? (z3 === 0 ? same3 : !same3) : null;
  var a3d;
  if(a3 === null) a3d = '先修正配置';
  else if(z3 === 0) a3d = '实时断言（档位=关）：DP=2 与 DP=8 显存构成逐字节相等（'+(same3?'相等':'不等!')+'）；单维·DP 视图讲了为什么——复制≠共有';
  else{
    var pick3 = function(mp, k){ var r=0; mp.forEach(function(x){ if(x.k===k) r=x.bytes; }); return r; };
    var kk3 = z3>=3 ? 'w' : (z3>=2 ? 'g' : 'opt');
    var r3 = pick3(mp8,kk3) > 0 ? pick3(mp2,kk3)/pick3(mp8,kk3) : 0;
    a3d = '实时断言（档位=ZeRO-'+z3+'）：这时 DP **要**改变容器——'+kk3.toUpperCase()+' 在 DP=2 时是 DP=8 时的 '
      + r3.toFixed(2)+' 倍（应为 4.00）。DP 从「只买吞吐」变成「也买余量」，这正是那条结论的限定条件';
  }
  rows.push(['A3', z3===0 ? '调 DP 容器纹丝不动' : '拨了 ZeRO：调 DP 容器**应该**动',
             a3===null?'manual':(a3?'pass':'fail'), a3d]);
  var a4 = AXIS_DOMAIN.join(',')==='tp,pp,dp,ep';
  rows.push(['A4','axis 取值域不含 CP', a4?'pass':'fail', '实时断言：{'+AXIS_DOMAIN.join(',')+'}；CP 走分面/V5/抽离图三条独立入口']);
  rows.push(['A5','归因指向耗时短的 rank', 'manual', '时间·流 → 注入偏斜 → 放大 AllReduce：段最短（最后进入）者被标为嫌疑人']);
  var bad = derive(Object.assign({},cfg,{heads:33,tp:16,world:16*D.cp*D.pp*2,experts:0}));
  var a6 = bad.errors.filter(function(e){return e.id==='heads_tp';})[0];
  rows.push(['A6','heads=33/TP=16 报具体约束', a6?'pass':'fail', a6?'实时校验输出：「'+esc(a6.msg.slice(0,46))+'…」+ 最近合法值':'未拦截!']);
  var mo = D.moe ? D : derive(PRESETS[2].cfg);
  var a7 = mo.moeMin === mo.pp*Math.max(mo.tp*mo.cp, mo.ep*mo.etp);
  rows.push(['A7','MoE 最小卡数公式', a7?'pass':'fail', mo.pp+'×max('+(mo.tp*mo.cp)+','+(mo.ep*mo.etp)+') = '+fmt(mo.moeMin)+'，非连乘']);
  rows.push(['A8','切视图选中保持', sel!==null?'pass':'manual', sel!==null?'当前 rank '+sel+'：单维柱描边 · 合成卡描边 · 解剖它 · 时间行高亮':'选卡后切视图验证']);
  return '<h4>验收自检 A1–A8（PRD §9 · M1 完成定义 = A1/A2/A4/A6/A7）<button class="pt-x" data-act="drawer" data-d="" style="float:right">✕</button></h4>'
    + '<table class="acc-t">'+rows.map(function(r){
      var b = r[2]==='pass'?'<span class="badge pass">✓ 实时</span>':r[2]==='fail'?'<span class="badge fail">✕</span>':'<span class="badge manual">交互</span>';
      return '<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td>'+b+'</td><td style="color:var(--pt-fg2)">'+r[3]+'</td></tr>';
    }).join('')+'</table>';

     一直摆在那儿——而过路高亮按约定就是**不落标签、不写 chip、点空白就散**的
     （见 ui.hlSel 那段说明）。先前这一行只看 sel、不问来路，于是宿主一转过来
     一个 rank，顶栏就多出一枚「选中 r94 ✕」——读者据此以为是自己在这一屏选的，
     可读出卡又偏偏不出来（那道闸认的是 !ui.hlSel），两个说法互相打架。
     这种状态下说话的是左下角那枚「联动高亮」徽标（renderHLBadge），它把来路和
     收手的手势一起讲清楚，不需要顶栏再重复一遍身份不明的读数。 */
  if(sel!==null && D.ok && sel<D.world && !ui.hlSel) chips += '<span class="pt-chip">选中 <b>r'+sel+'</b> <span data-act="clearsel" style="cursor:pointer;opacity:.6">✕</span></span>';
  $('barChips').innerHTML = chips;
  $('barActs').innerHTML =
    '<button data-act="drawer" data-d="cfg" class="'+(ui.drawer==='cfg'?'is-on':'')+'">配置</button>'
    + '<button data-act="theme" title="明暗主题">◐</button>';
}
function renderFoot(D){
  var out = '<span class="pt-cap">图层</span>' + LAYERS.map(function(L){
    var av = layerAvail(L);
    return '<button class="pb'+(av&&layerOn(L)?' is-on':'')+'" data-act="layer" data-l="'+L+'"'+(av?'':' disabled')+'>'+LAYER_NAME[L]+'</button>';
  }).join('');
  /* AXIS 高亮（ui.axis）与 L5 维度/原语/抽离（commDim/commPrim/detach）只有「合成·卡阵」
     一个视图会读它们去改画布（renderV1）。别的视图从不看这几个状态，按钮摆在那儿点了
     没反应——曾经跟着 AVAIL['L5'] 一起在 dim/time/anatomy/story 里现身，全是死点击。
     dim 视图自己在 stagebar 里已经有一份货真价实、只在 CP 轴出现的原语选择器
     （Ring/Ulysses/朴素，见 renderDimBar），不需要这里再摆一份摆设。 */
  if(ui.view==='compose'){
    out += '<span class="pt-sep"></span><span class="pt-cap" id="axisChips">axis 高亮 tp|pp|dp|ep</span>'
      + AXIS_DOMAIN.map(function(a){
          var dis = a==='ep' && !D.moe;
          return '<button class="pb mono'+(ui.axis===a?' is-on':'')+'" data-act="axis" data-a="'+a+'" style="--c:'+VC[a]+'"'+(dis?' disabled':'')+'>'+DIMN[a]+'</button>';
        }).join('')
      + '<button class="pb mono" disabled title="CP 不是卡网格的轴——输入分布见 V5，CP 通信组走抽离图（P2 修正 / A4）">CP⊘</button>';
    out += '<span class="pt-sep"></span><span class="pt-cap">L5 维度</span>'
      + COMM_DIMS.map(function(dm){
          var dis = dm==='ep' && !D.moe;
          return '<button class="pb mono'+(ui.commDim===dm&&layerOn('L5')?' is-on':'')+'" data-act="commdim" data-d="'+dm+'" style="--c:'+VC[dm]+'"'+(dis?' disabled':'')+'>'+DIMN[dm]+'</button>';
        }).join('')
      + '<span class="pt-cap" title="原语两类：P2P 是点对点，集合原语由一串 P2P 接成。两类都在计算图里以算子节点出现（send/recv、hcom_*），但在参照系里都是动作——不持有字节、不被切">⊗ 原语</span>'
      + PRIMS.map(function(pr){
          var cmn = (COMMON[ui.commDim]||[]).indexOf(pr.id)>=0;
          return '<button class="pb mono'+(ui.commPrim===pr.id&&layerOn('L5')?' is-on':'')+'" data-act="commprim" data-p="'+pr.id+'" title="'+esc(pr.kind+'：'+pr.why)+'">'+pr.name+'<span class="cmn">'+pr.kind+(cmn?'·常见':'')+'</span></button>';
        }).join('')
      + '<button class="pb'+(ui.detach?' is-on':'')+'" data-act="detach">抽离</button>';
  }
  $('footCtl').innerHTML = out;
}

/* 画布左上角用用户问题命名，并补一句最关键的阅读说明：方框是 Rank，不是模型层。
   题面可由 ?stitle= 覆盖：同一份实现发布成好几份 pattern（整网切分 / 3D 卡阵 /
   整网真图展开），每一份默认落在不同的一屏，画布左上角该报的是**那一屏**的题面，
   不是三份共用一句「模型分片与训练设备映射」。缺省仍是这句，老链接一个不动。 */
function renderStageTitle(){
  var el = $('stageTitle'); if(!el) return;
  if(el.firstChild) return;

    + '<button type="button" class="pt-stagehelp" aria-label="说明" title="每个方框代表一个 Rank（分布式训练进程，通常绑定一张加速卡），框内展示它负责的模型分片与数据。">?</button></span>';
}

/* ══ 二级读数：读出卡里点开的那一**块**显存 ═══════════════════════════════
   选中一张卡答的是「这张卡装了什么」；再点一块答的是「这一块自己是怎么来的」——
   它占的字节按什么口径算、被哪把刀切、本卡拿到的是哪一段。三问一组，缺一段
   读者就只能盯着一个 GB 数干瞪眼。
   三把常驻的账（权重/梯度/优化器态）**共用同一份分法**：它们是同一份参数的
   ×2 / ×2 / ×12 B，所以逐块切法只在权重那一档展开一次，另两档指回去、不抄第二遍。 */
/* ── 体腔小图：一格 = 一份，填实的那格就是本卡持有的 ─────────────────────
   与交集腔 L3 的①②两只体腔、以及读出卡里那两只缩略图同一个语汇（网格 + 实心
   一格），只是缩到读出卡的宽度里。**画出来的东西不用再用文字说一遍**：
   「×8 里的第 5 桶」画成八格里第五格填实，比写一行字快得多，也不会和图打架。
   ax = {nx, ix, lx, ny, iy, ly, c}：两根轴各自的份数、本卡的下标、轴名，c 是刀色。 */
function cavityGrid(ax){
  var BW = 200, BH = 52, PAD = 18;
  var nx = Math.max(1, ax.nx), ny = Math.max(1, ax.ny);
  /* 份数多到一格不足 3px 时不逐格画——画出来是一团糊，反而把「本卡是哪一格」盖掉。
     这时退回「整条 + 一段实心」：位置照旧准确，只是不再数得出格数（格数写在轴标上）。 */
  var cw = BW/nx, ch = BH/ny, fine = cw >= 3 && ch >= 3;
  var cells = '';
  if(fine){
    for(var y = 0; y < ny; y++) for(var x = 0; x < nx; x++){
      var on = (x === ax.ix && y === ax.iy);
      cells += '<rect x="'+(x*cw+0.5).toFixed(1)+'" y="'+(y*ch+0.5).toFixed(1)
        + '" width="'+(cw-1).toFixed(1)+'" height="'+(ch-1).toFixed(1)
        + '" style="fill:'+(on ? ax.c : 'transparent')
        + ';stroke:'+(on ? 'none' : 'var(--pt-bd)')+';stroke-width:.5'
        + (on ? '' : ';stroke-dasharray:2 2')+'"/>';
    }
  } else {
    cells += '<rect x="0.5" y="0.5" width="'+(BW-1)+'" height="'+(BH-1)
      + '" style="fill:none;stroke:var(--pt-bd);stroke-width:.5;stroke-dasharray:2 2"/>'
      + '<rect x="'+(ax.ix*cw).toFixed(1)+'" y="'+(ax.iy*ch).toFixed(1)
      + '" width="'+Math.max(1.5, cw).toFixed(1)+'" height="'+Math.max(1.5, ch).toFixed(1)
      + '" style="fill:'+ax.c+';stroke:none"/>';
  }
  return '<svg width="'+(BW+PAD+30)+'" height="'+(BH+15)+'" style="margin:2px 0 1px;overflow:visible">'
    + '<g transform="translate(1,1)">'+cells
    + '<rect x="0" y="0" width="'+BW+'" height="'+BH+'" style="fill:none;stroke:var(--pt-fg3);stroke-width:.9;stroke-dasharray:3 2"/></g>'
    /* 份数只在**真被分开**时才写：一根没切的轴写「×1」是在说一件没发生的事，
       而且和轴名连起来读成「复印16×1」这种自相矛盾的串。 */
    + '<text x="'+(BW+6)+'" y="'+(BH/2+4)+'" style="font-size:9.5px;fill:var(--pt-fg3)">'+esc(ax.ly)+(ny>1?'×'+ny:'')+'</text>'
    + '<text x="0" y="'+(BH+13)+'" style="font-size:9.5px;fill:var(--pt-fg3)">'+esc(ax.lx)+(nx>1?'×'+nx:'')+'</text>'
    + '</svg>';
}

/* ── 整条带的构成：按字节分宽度，每段上它自己那把刀的色 ────────────────────
   权重（以及跟着它的梯度/优化器态）**不能用一张网格说**：网格说的是「一根轴切
   成几份、我拿第几份」，可这条带里 experts 走 EP、attn.* 走 TP、router/norm 不切
   ——一张图填一格，等于替读者选了一块去代表全体，那正是最容易读错的一步。
   所以这一档画的是**它自己的横截面**：谁占多宽、各是什么色。与卡上那条带、
   以及交集腔 L3 的权重带是同一张图，三处对得上。 */
function compStrip(blocks, wide){
  var BW = wide || 210, BH = 20, tot = 0;
  blocks.forEach(function(b9){ tot += b9.bytes; });
  if(!(tot > 0)) return '';
  var x9 = 0, segs9 = '', labs9 = [];
  blocks.forEach(function(b9){
    var w9 = BW*b9.bytes/tot;
    if(w9 > 0.4){
      segs9 += '<rect x="'+x9.toFixed(1)+'" y="0" width="'+w9.toFixed(1)+'" height="'+BH
        + '" style="fill:'+cutColor(b9.cut)+';fill-opacity:'+(b9.cut==='none'?.28:.62)
        + ';stroke:var(--pt-bg);stroke-width:.6"/>';
      /* 只给放得下的那几段挂名字：挤不下就交给下面那张表，图上不叠字 */
      if(w9 >= 28) labs9.push('<text x="'+(x9+w9/2).toFixed(1)+'" y="'+(BH/2+3)
        + '" style="font-size:7.6px;fill:var(--pt-fg);font-weight:700" text-anchor="middle">'+esc(b9.id)+'</text>');
    }
    x9 += w9;
  });
  return '<svg width="'+BW+'" height="'+(BH+2)+'" style="margin:2px 0 0;overflow:visible">'
    + segs9 + labs9.join('')
    + '<rect x="0" y="0" width="'+BW+'" height="'+BH+'" style="fill:none;stroke:var(--pt-fg3);stroke-width:.8"/>'
    + '</svg>';
}

/* ── 体腔（缩到读出卡里的那只）─────────────────────────────────────────────
   与「映射·双链/交集腔」那一幕的①权重体 / ②激活体是同一只盒子、同一套语汇：
   三根轴各被自己那把刀切出格子（线用刀色），本卡持有的那一格填实。
   为什么不直接调那边的 solidBox：它是 renderSolidCav 的闭包，挂着 L1–L4 分层
   开关、轴尺、刀面板、门牌那一整套，是给 880px 画布写的；塞进 260px 的读出卡
   只会剩一团糊。这里复用的是它**自己也在用**的两个模块级原语（proj / boxSVG），
   所以形状、明暗、剔背面的规矩逐条一致，只是把注解留给旁边那行字。
   ax/ay/az = {n, dim, i}：份数、哪把刀（决定颜色）、本卡在这根轴上的下标。 */
function cavityBox3D(ax, ay, az, o){
  o = o || {};
  /* 这几张图是读出卡里的辅助插图，帮读者认「本卡是哪一格」，不是拿来抠尺寸的
     精密图——原来 98×60×52 在小面板里跟外框虚线、格线挤在一起看着像一团蚊子。
     放大到 1.4 倍就已经把「挤在一起」这件事解决了——先前又把线压得太淡，
     矫枉过正到「外框看不清」，缝也拉得太宽显得断续。缝收回接近原来的疏密，
     线宽/透明度也基本收回，只把最密的那一档（16 等分那种）压淡，稀疏的
     格线（≤8 等分）跟外框一样正常显示。 */
  var W = o.w || 138, HH = o.h || 84, DD = o.d || 73;
  var dx = W/Math.max(1,ax.n), dy = HH/Math.max(1,ay.n), dz = DD/Math.max(1,az.n);
  var body = '';
  /* ln 在这份文件里是各渲染函数各自的局部小工具（同一段代码写了三遍），
     模块级没有——这里自带一只，别去够别人作用域里的那个。 */
  function ln(a9, b9, st9){
    return '<line x1="'+a9[0].toFixed(1)+'" y1="'+a9[1].toFixed(1)
      + '" x2="'+b9[0].toFixed(1)+'" y2="'+b9[1].toFixed(1)+'" style="'+st9+'"/>';
  }
  /* 外壳：虚线细框——腔是「索引空间」，不是实心物件。 */
  body += boxSVG(0,0,0,W,HH,DD,1,{wire:true, stroke:'var(--pt-bd)', sw:1, dash:'3 2.5'});
  /* 每把刀在它自己那根轴上留下的格线。格距小到 2px 以下就不画：
     那时线比格子还密，画出来是一片灰，把「本卡是哪一格」盖掉。 */
  function gl(step, dim){
    return 'stroke:'+(VC[dim]||'var(--pt-bd)')+';stroke-width:'+(step>5?.75:.5)
      + ';stroke-opacity:'+(step>5?.55:.3);
  }
  var i9;
  if(dy >= 2) for(i9=1;i9<ay.n;i9++)
    body += ln(proj(0,i9*dy,DD,1), proj(W,i9*dy,DD,1), gl(dy, ay.dim))
          + ln(proj(W,i9*dy,0,1), proj(W,i9*dy,DD,1), gl(dy, ay.dim));
  if(dx*C >= 2) for(i9=1;i9<ax.n;i9++)
    body += ln(proj(i9*dx,HH,0,1), proj(i9*dx,HH,DD,1), gl(dx*C, ax.dim))
          + ln(proj(i9*dx,0,DD,1), proj(i9*dx,HH,DD,1), gl(dx*C, ax.dim));
  if(dz*C >= 2) for(i9=1;i9<az.n;i9++)
    body += ln(proj(0,HH,i9*dz,1), proj(W,HH,i9*dz,1), gl(dz*C, az.dim))
          + ln(proj(W,0,i9*dz,1), proj(W,HH,i9*dz,1), gl(dz*C, az.dim));
  /* 本卡持有的那一格：实心 + 描边。三根轴上各取自己的下标，交出来就是这张卡。 */
  var cx = ax.i*dx, cy = ay.i*dy, cz = az.i*dz;
  body += boxSVG(cx, cy, cz, dx, dy, dz, 1, {fill:o.cell || 'var(--pt-fg)'});
  body += boxSVG(cx, cy, cz, dx, dy, dz, 1, {wire:true, stroke:o.cell || 'var(--pt-fg)', sw:.8});
  /* 视野按投影后八个角算，别写死——三根轴的份数一变，盒子在屏幕上的包围盒就变 */
  var xs = [], ys = [];
  [[0,0,0],[W,0,0],[W,HH,0],[0,HH,0],[0,0,DD],[W,0,DD],[W,HH,DD],[0,HH,DD]].forEach(function(v){
    var q = proj(v[0],v[1],v[2],1); xs.push(q[0]); ys.push(q[1]);
  });
  var x0 = Math.min.apply(null,xs)-3, x1 = Math.max.apply(null,xs)+3;
  var y0 = Math.min.apply(null,ys)-3, y1 = Math.max.apply(null,ys)+3;
  return '<svg viewBox="'+x0.toFixed(1)+' '+y0.toFixed(1)+' '+(x1-x0).toFixed(1)+' '+(y1-y0).toFixed(1)
    + '" width="'+(x1-x0).toFixed(0)+'" height="'+(y1-y0).toFixed(0)+'" style="margin:2px 0 0;overflow:visible">'
    + body + '</svg>';
}

/* ── 关系链小图：这四档不是四笔并列的账，是一条环 ──────────────────────────
   前面那几张图（成分条、体腔）答的都是「这一档自己是怎么被切出来的」——每一档
   自问自答，四档之间看不出任何关系。可读者真正要问的下一句是「它们互相什么关系」：
     前向   A × W          → out      （所以 W 要在，A 是算出来的）
     反向   ∂L/∂out × A    → ∇W       （所以 A **必须留着**——这正是它占显存的理由）
     更新   Opt + ∇W       → W(t+1)   （所以 ∇W 要等优化器步用完才放得掉）
   这三行原先散在几条 note 里（「反向才产生，优化器步用完才放得掉」「和权重是同时
   压在卡上的两份」）。文字讲得清顺序，讲不清**环**：W 是链尾又是链头，A 跨前向反向
   两行——一句一句读过去，读者得自己在脑子里把它接起来，接错了也没人告诉他。画出来
   就不用接。
   语汇不另起：格子＝一份东西，色＝MEMC 里那一档自己的签名色，与卡上那条带、成分条
   逐格同色；当前这一档描一圈实边、别的档淡着——「我在链上的哪个位置」一眼可见。
   淡着的那几格**可点**（data-act="memblockpick"，与图例那几行同一个手势）：链是拿来
   走的，看见上游却跳不过去，等于画了一半。 */
function memChainFig(key){
  /* 权重带里的某一块也算在权重那一格上：它是 W 的一部分，在这条链上没有独立位置。
     优化器步临时区落在 ∇W 那一格——它就是那一次归约的缓冲，不是链上第五种东西。 */
  var K9 = key.indexOf('w:') === 0 ? 'w' : key;
  if(K9 === 'rsv') return '';      /* 碎片不在这条链上：硬画一格反而是编造关系 */
  var HERE = {w:'w', agw:'w', g:'g', opt:'opt', otmp:'g', act:'act'}[K9];
  /* 描边用**真正点开的那一档**的签名色，填色仍是那一格自己的：优化器步临时区挂在
     ∇W 那一格上，于是画出来是「绿格子外面一圈琥珀」——这一圈正是「我这一档就住在
     这个位置」的意思，比再多写一行字直接。另外四档两个色本来就相同，看不出差别。 */
  var HCOL = MEMC[K9] || MEMC[HERE];
  var CH = 15, ROW = 22, TOP = 20, X0 = 26, out = '';   /* TOP 留出的那一条是给回勾与它那行小字走的 */
  /* 一格：k 非空就是四档之一（有色、可点），否则是链上的中间量（out / ∂L/∂out），
     它们不占显存、不在图例里，画成虚框——「这两样不是你卡上的账」也得说清。 */
  function cell(x, y, w, k, txt9){
    var on9 = k && k === HERE;
    var col9 = k ? MEMC[k] : 'var(--pt-fg3)';
    var g9 = '<rect x="' + x.toFixed(1) + '" y="' + y + '" width="' + w.toFixed(1) + '" height="' + CH
      + '" rx="3" style="fill:' + (k ? col9 : 'none') + ';fill-opacity:' + (k ? (on9 ? .95 : .3) : 0)
      + ';stroke:' + (on9 ? HCOL : 'var(--pt-bd)') + ';stroke-width:' + (on9 ? 1.5 : .7)
      + (k ? '' : ';stroke-dasharray:2 2') + '"/>'
      + '<text x="' + (x + w / 2).toFixed(1) + '" y="' + (y + CH / 2 + 3)
      + '" style="font-size:8px;font-weight:' + (on9 ? 800 : 600) + ';fill:'
      + (on9 ? 'var(--pt-fg)' : 'var(--pt-fg2)') + '" text-anchor="middle">' + esc(txt9) + '</text>';
    return k ? ('<g data-act="memblockpick" data-mk="' + esc(k) + '" style="cursor:pointer">' + g9 + '</g>') : g9;
  }
  function op(x, y, s9){
    return '<text x="' + x.toFixed(1) + '" y="' + (y + CH / 2 + 3.5)
      + '" style="font-size:9px;fill:var(--pt-fg3)" text-anchor="middle">' + esc(s9) + '</text>';
  }
  function rowLab(y, s9){
    return '<text x="0" y="' + (y + CH / 2 + 3) + '" style="font-size:8px;fill:var(--pt-fg3)">' + esc(s9) + '</text>';
  }
  /* 三行同一套列位：两个操作数 + 一个产物，箭头永远在同一个 x 上——三行的
     「→ 右边」于是排成一竖列，读者一眼看得出「这一步产出的是什么」。 */
  var A9 = X0, W9 = 46, B9 = X0 + W9 + 14, C9 = B9 + W9 + 20;
  var rows = [

     读者要先分辨「这根线是不是穿过了它」才能往下读。 */
  var yB = TOP + 2 * ROW + CH / 2, xR = C9 + W9 + 8 + 5, xW = B9 + W9 / 2, yU = 9;
  out += '<path d="M' + xR.toFixed(1) + ' ' + yB + ' H' + (xR + 8).toFixed(1) + ' V' + yU
    + ' H' + xW.toFixed(1) + ' V' + (TOP - 4)

    + ' L' + (xW + 2.6).toFixed(1) + ' ' + (TOP - 4.5) + ' z" style="fill:var(--pt-fg3)"/>'
    + '<text x="' + (xW + 6).toFixed(1) + '" y="' + (yU - 1.5)
    + '" style="font-size:7.5px;fill:var(--pt-fg3)">下一步的 W</text>';
  return '<svg width="' + (xR + 12).toFixed(0) + '" height="' + (TOP + 2 * ROW + CH + 4)
    + '" style="margin:2px 0 0;overflow:visible">' + out + '</svg>';

       正文只留名字、数字与图。 */
    + (note ? '<span style="margin-left:5px;color:var(--pt-fg3);cursor:help" title="'+esc(note)+'">ⓘ</span>' : '')
    + '<button class="rm-dx" data-act="memblockpick" data-mk="" title="收起这一块">✕</button></div>'
    + '<dl>'+rows.join('')+'</dl>'
    + figs.join('')
    + commLine
    + sibLine
    + '</div>';
}

/* ══ 把「前态 → 后态」画出来，而不是写出来 ═══════════════════════════════
   五元组里另外四样（张量是什么、谁和谁、什么效果、反向是谁）是**论断**，只能写；
   但前态后态是**形状**——一句「[1, 4096, 4096] → [1, 8192, 4096]」要读者在脑子里
   把两串数字对齐、找出哪一位变了、再想明白那一位代表什么。画出来就是一眼：
   四格里亮着一格 → 整条亮着。这一屏别处早就守着同一条规矩（切法画出来不写出来，
   见 memBlockDetail 里那几张腔图的注释），通信这一栏是最后一处还在用文字说形状的。

   五种画法对应五类效果，不是五种原语——原语和效果不是一一对应的（§09 那条勘误）：
     ag   分片 → 完整      本卡那一格亮着，收拢成整条
     rs   完整 → 分片      反过来
     ar   值变、形不变      两条一样长，左边各卡颜色不同、右边一律相同
     a2a  重排             左右等长但格子顺序被打乱，连线交叉
     p2p  换卡、形不变      同一条带从一只卡壳跳到另一只卡壳里 */
function xformSVG(D, o){
  var W = 300, H = 74, BW = 96, BH = 24, BY = 26;
  var X0 = 4, X1 = W - 4 - BW, col = o.col, dim = 'var(--pt-fg3)';
  var n = Math.max(1, Math.min(o.n || 1, 8)), mine = Math.min(o.mine || 0, n - 1);
  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;display:block" '
        + 'font-family="var(--pt-mono, ui-monospace, Menlo, monospace)">';
  function seg(x, y, w, h, fill, stroke, dash){
    return '<rect x="' + x.toFixed(1) + '" y="' + y + '" width="' + Math.max(w,1).toFixed(1) + '" height="' + h + '" rx="2" '
      + 'fill="' + (fill||'none') + '" stroke="' + (stroke||dim) + '" stroke-width="1"'
      + (dash ? ' stroke-dasharray="' + dash + '"' : '') + '/>';
  }
  function cap(x, y, t, c, anchor){
    return '<text x="' + x + '" y="' + y + '" font-size="8.5" fill="' + (c||dim) + '" text-anchor="' + (anchor||'middle') + '">' + esc(t) + '</text>';
  }
  /* 一条按 n 等分的带；filled 里的那几格填实 */
  function bar(x, filled, tone){
    var out = '', w = BW / n, i;
    for(i = 0; i < n; i++){
      var on = filled.indexOf(i) >= 0;
      out += seg(x + i*w, BY, w - (n>1?1:0), BH, on ? (tone||col) : 'transparent', on ? (tone||col) : dim);
    }
    return out;
  }
  var all = []; for(var i = 0; i < n; i++) all.push(i);

  if(o.kind === 'ag' || o.kind === 'rs'){
    var lf = o.kind === 'ag' ? [mine] : all, rf = o.kind === 'ag' ? all : [mine];
    s += bar(X0, lf) + bar(X1, rf);
    s += cap(X0 + BW/2, BY - 6, o.kind === 'ag' ? '每卡一片（亮的是本卡）' : '完整一份');
    s += cap(X1 + BW/2, BY - 6, o.kind === 'ag' ? '拼成完整一份' : '切开（亮的是本卡）');
  }else if(o.kind === 'ar'){
    /* 值不同 → 值相同：形状一模一样，靠深浅表示「各卡的数不一样」 */
    var t, out = '';
    for(t = 0; t < n; t++) out += seg(X0 + t*(BW/n), BY, BW/n - 1, BH, mix(col, 26 + t*22), col);
    s += out + bar(X1, all);
    s += cap(X0 + BW/2, BY - 6, '各卡各一份 · 值不同');
    s += cap(X1 + BW/2, BY - 6, '各卡同一份 · 已求和');
  }else if(o.kind === 'a2a'){
    /* 每一格给一个自己的色阶，两边同源同色——不然「重排」只是几根装饰性的交叉线，
       读者看不出哪一格去了哪儿。有了色阶，连线是可追的：同色的两格就是同一批 token。 */
    var ord = [2, 0, 3, 1].slice(0, n), k, w2 = BW / n, tint = function(i){ return mix(col, 30 + i*22); };
    for(k = 0; k < n; k++){
      s += seg(X0 + k*w2, BY, w2 - 1, BH, tint(k), col);
      var dstI = ord.indexOf(k) >= 0 ? ord.indexOf(k) : k;
      s += seg(X1 + dstI*w2, BY, w2 - 1, BH, tint(k), col);
    }
    for(k = 0; k < n; k++){
      var y0 = BY + BH/2, x0 = X0 + (k + .5)*w2, x1 = X1 + ((ord.indexOf(k) >= 0 ? ord.indexOf(k) : k) + .5)*w2;
      s += '<path d="M' + x0.toFixed(1) + ' ' + (BY+BH+2) + ' C ' + x0.toFixed(1) + ' ' + (H-4) + ', '
         + x1.toFixed(1) + ' ' + (H-4) + ', ' + x1.toFixed(1) + ' ' + (BY+BH+2)
         + '" fill="none" stroke="' + col + '" stroke-width=".9" opacity=".55"/>';
    }
    s += cap(X0 + BW/2, BY - 6, '按序列排布');
    s += cap(X1 + BW/2, BY - 6, '按目的专家排布');
  }else if(o.kind === 'p2p'){
    /* 同一条带换了张卡：两只虚线卡壳，带只在其中一只里 */
    s += seg(X0 - 2, BY - 8, BW + 4, BH + 16, 'transparent', dim, '4 3');
    s += seg(X1 - 2, BY - 8, BW + 4, BH + 16, 'transparent', dim, '4 3');
    s += seg(X0 + 4, BY, BW - 8, BH, col, col);
    s += seg(X1 + 4, BY, BW - 8, BH, 'transparent', col, '3 3');
    s += cap(X0 + BW/2, H - 4, o.srcLab || '本卡');
    s += cap(X1 + BW/2, H - 4, o.dstLab || '下一段');
    s += cap(X0 + BW/2, BY - 12, '形状不变');
    s += cap(X1 + BW/2, BY - 12, '只是换了张卡');
  }else{
    return '';
  }
  /* 中间那支箭头 + 原语名：原语写在这里，因为它是**动作的名字**，不是形状 */
  var ax0 = X0 + BW + 4, ax1 = X1 - 4, ay = BY + BH/2;
  s += '<line x1="' + ax0 + '" y1="' + ay + '" x2="' + (ax1-5) + '" y2="' + ay + '" stroke="' + col + '" stroke-width="1.4"/>'
     + '<path d="M' + ax1 + ' ' + ay + ' l-6 -3 l0 6 z" fill="' + col + '"/>'
     + '<text x="' + ((ax0+ax1)/2) + '" y="' + (ay - 5) + '" font-size="8.5" font-weight="700" fill="' + col
     + '" text-anchor="middle">' + esc(o.prim || '') + '</text>';
  if(o.sub) s += cap((ax0+ax1)/2, ay + 12, o.sub, col);
  return s + '</svg>';
}

/* rank 内的搬运：它**不是通信**，判据是归属变不变（§15 四）。
   画出来的理由和上面一样——三级存储之间的往返是一条路径，写成一句话读者只会
   把它当成又一种原语，画成一条从 HBM 走到计算单元的线，才看得出它根本没跨出这张卡。 */
function intraRankSVG(){
  var W = 300, H = 62, col = 'var(--pt-fg3)';
  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;display:block" '
        + 'font-family="var(--pt-mono, ui-monospace, Menlo, monospace)">';
  s += '<rect x="2" y="2" width="' + (W-4) + '" height="' + (H-16) + '" rx="4" fill="none" stroke="' + col + '" stroke-width="1" stroke-dasharray="4 3"/>';
  var boxes = [['HBM', 6], ['片上缓冲', 106], ['计算单元', 206]];
  boxes.forEach(function(b, i){
    s += '<rect x="' + (b[1]+4) + '" y="14" width="84" height="22" rx="3" fill="var(--pt-s2)" stroke="' + col + '" stroke-width="1"/>'
       + '<text x="' + (b[1]+46) + '" y="29" font-size="9" fill="var(--pt-fg2)" text-anchor="middle">' + b[0] + '</text>';
    if(i < 2){
      s += '<line x1="' + (b[1]+90) + '" y1="25" x2="' + (b[1]+100) + '" y2="25" stroke="' + col + '" stroke-width="1.2"/>'
         + '<path d="M' + (b[1]+104) + ' 25 l-5 -2.5 l0 5 z" fill="' + col + '"/>';
    }
  });
  s += '<text x="' + (W/2) + '" y="' + (H-3) + '" font-size="8.5" fill="' + col + '" text-anchor="middle">'
     + '不跨通信域 · 归属不变，只换驻留位置 · 靠流与 event 同步</text>';
  return s + '</svg>';
}

/* ══ 通信五元组 ═══════════════════════════════════════════════════════════
   读出卡原来只报一行「对应通信：TP AllGather / Reduce-Scatter · TP 换轴器」。
   那一行答得了「哪一维、什么原语」，答不了这一屏真正被问到的那两句：
   **搬的是什么**、**搬完之后它变成了什么样**。而后者恰恰是通信的定义本身——
   一次通信 = layout 变换 + 归属再分配，前态后态不写出来，「通信是状态转换」
   就只是一句比喻（/parallel-reference/ §15 一、二）。

   所以每一条通信补齐成五样 + 一个效果：
     源 / 张量（含前态→后态）/ 并行域 / 原语 / 宿 ，外加 效果 与 反向对偶。
   反向那一栏不是凑数：官方 mappings 里每个原语都写成「前向做什么、反向做什么」
   的一对，而且**反向永远是另一个原语**（AG↔RS、copy↔AllReduce）——这条一写出来，
   「决定原语的不是维度」那句话就有了现场证据。 */

/* 这一维的组：几张卡、本卡第几个、组员是谁（列举前几个，多了省略）。 */
function commPeers(D, g, dim){
  var co = coordsOf(g, D), me = D.moe ? epOf(co.t, co.c, co.d, D) : null;
  var n, i, mk;
  if(dim === 'tp'){ n = D.tp; i = co.t; mk = function(k){ return rankOf(k, co.c, co.d, co.p, D); }; }
  else if(dim === 'cp'){ n = D.cp; i = co.c; mk = function(k){ return rankOf(co.t, k, co.d, co.p, D); }; }
  else if(dim === 'dp'){ n = D.dp; i = co.d; mk = function(k){ return rankOf(co.t, co.c, k, co.p, D); }; }
  else if(dim === 'pp'){ n = D.pp; i = co.p; mk = function(k){ return rankOf(co.t, co.c, co.d, k, D); }; }
  else if(dim === 'ep'){ n = D.ep; i = me ? me.ep : 0; mk = null; }   /* EP 是折叠出来的视图，没有可逆的门牌算术，只报组大小 */
  else return null;
  var list = [];
  if(mk){ for(var k = 0; k < Math.min(n, 4); k++) list.push('r' + mk(k)); if(n > 4) list.push('…'); }
  return {n:n, i:i, list:list};
}

/* 五元组的内容表。写成函数是因为前后 layout 必须**按当前配置算出来**——
   写死一句「分片→完整」等于什么都没说，读者要的是 [1, 1024, 4096] → [1, 8192, 4096]。 */
function comm5Spec(D, key, dim){
  var K = key.indexOf('w:') === 0 ? 'w' : key;
  var mb = D.mbs, sCp = Math.floor(D.seq / D.cp), h = D.hidden, hd = D.headDim;
  var shp = function(){ return '[' + Array.prototype.slice.call(arguments).join(', ') + ']'; };
  var T = {
    'w|tp': {
      gfx:'ag', code:'AG / RS', grain:'分块之间 · 同一张量的分片',
      prim:'开 SP：入口 AllGather、出口 ReduceScatter',
      tensor:'层间激活（进出 TP 区的那一份）',
      before: shp(mb, fmt(Math.floor(sCp/D.tp)), fmt(h)) + ' · SP 段',
      after:  shp(mb, fmt(sCp), fmt(h)) + ' · TP 段',
      effect:'分片 → 完整：<b>layout 变，归属不变</b>',
      dual:'<b>不开 SP 时不是这一对</b>：入口是 copy（前向不通信）、出口是 AllReduce。方向由「列切/行切 × 前向/反向 × SP 开没开」共同决定，不是固定模式'
    },
    'w|ep': {
      gfx:'a2a', code:'All-to-All', grain:'分块之间 · 按 token 重排',
      prim:'All-to-All（dispatch），算完 combine 再一次',
      tensor:'本层 router 判定后的 token',
      before:'按序列排布 · 本卡 ' + fmt(mb*sCp) + ' token × top' + D.topk,
      after:'按目的专家排布（permute 成连续段才发得出去）',
      effect:'<b>归属再分配 + 重排</b>——整张图上唯一一条按数据内容决定去向的边',
      dual:'combine 时按同一张置换表逆排回原位置，否则接不上残差'
    },
    'w|dp': {   /* ZeRO-3 才出现（见 zeroPatch） */
      gfx:'ag', code:'AllGather', grain:'分块之间 · 同一张量的分片',
      prim:'AllGather（前向一次、反向一次）',
      tensor:'本层参数 W',
      before:'各卡 1/' + D.dp + ' 片',
      after:'完整一层',
      effect:'分片 → 完整，<b>用毕丢弃</b>——这一档的常驻量没变，变的是它什么时候在',
      dual:'反向还要再拼一次；ZeRO-2 的差别就在「前向做完要不要立刻丢」这一个布尔量'
    },
    'agw|dp': {
      gfx:'ag', code:'AllGather', grain:'分块之间 · 同一张量的分片',
      prim:'AllGather',
      tensor:'本层参数 W（拼回来的那一份）',
      before:'各卡 1/' + D.dp + ' 片',
      after:'完整一层 + 预取的下一层',
      effect:'分片 → 完整（归属临时失效）',
      dual:'反向再来一次；窗口宽度 = FSDP 的 wrap 粒度'
    },
    'g|dp': {
      gfx: D.zero >= 2 ? 'rs' : 'ar', code: D.zero >= 2 ? 'ReduceScatter' : 'AllReduce', grain:'副本之间 · 同一张量的多份',
      prim: D.zero >= 2 ? 'ReduceScatter' : 'AllReduce',
      tensor:'本段参数的梯度 ∇W',
      before:'dp 个副本各一份完整的偏导（各吃各的微批，值互不相同）',
      after: D.zero >= 2 ? '只留本卡那一段（1/' + D.dp + '），已求和' : '各卡同一份，已求和',
      effect: D.zero >= 2 ? '<b>值变（求和）＋ 归属再分配</b>（完整 → 分片）' : '<b>值变（求和），layout 与归属都不变</b>',
      dual: D.zero >= 2 ? '与参数 AllGather 成对：AllReduce = ReduceScatter + AllGather，ZeRO 做的就是把这一对拆开' : '反向本身就是它——它是反向的收尾'
    },
    'act|pp': {
      gfx:'p2p', code:'P2P', grain:'段与段之间 · 换一张卡',
      prim:'P2P Send/Recv（<b>点对点，不是集合通信</b>）',
      tensor:'段边界的激活',
      before:'stage ' + '{p}' + ' 的输出 ' + shp(mb, fmt(sCp), fmt(h)),
      after:'stage ' + '{p1}' + ' 的输入（同一个张量，换了张卡）',
      effect:'<b>归属换卡，layout 不变</b>——五条边里唯一不改形状的一条',
      dual:'反向沿相反方向传 ∂L/∂act'
    },
    'act|cp': {
      gfx:'ag', code:'AllGather', grain:'分块之间 · 序列被切开的那几段',
      prim:'AllGather(KV)',
      tensor:'K / V',
      before:'本卡那一段序列的 KV ' + shp(mb, fmt(sCp), kvPerTp(D) + '·' + hd),
      after:'全序列 KV ' + shp(mb, fmt(D.seq), kvPerTp(D) + '·' + hd),
      effect:'分片 → 完整；<b>只发生在 attention</b>，其余算子照常（没有跨 token 运算）',
      dual:'反向对 KV 的激活梯度做 ReduceScatter；Ring 实现下这一对底层跑成环形 P2P——语义与实现是两层'
    },
    'act|tp': {
      gfx:'ag', code:'AG / RS', grain:'分块之间 · 换轴（s ↔ h）',
      prim:'AllGather(s→h) / ReduceScatter(h→s)',
      tensor:'层间激活',
      before:'SP 段 ' + shp(mb, fmt(Math.floor(sCp/D.tp)), fmt(h)),
      after:'TP 段 ' + shp(mb, fmt(sCp), fmt(h)),
      effect:'<b>换轴</b>：序列维 ↔ 隐藏维（切在哪根轴上变了）',
      dual:'成对：前向 AG 的反向就是 RS'
    },
    'opt|dp': {
      gfx:'none', grain:'不出这张卡',
      prim:'不过网络',
      tensor:'主参数 fp32 + m + v',
      before:'本卡那一段',
      after:'本卡那一段（就地更新）',
      effect:'<b>不通信</b>：归属早在梯度 ReduceScatter 那一步就分好了，这一档自己不用再说话',
      dual:'—'
    }
  };
  T['otmp|dp'] = T['g|dp'];   /* 临时区就是那一次归约的落脚处，同一件事的两面 */
  return T[K + '|' + dim] || null;
}

/* 一条通信渲染成一块。dim 没落下时照旧列出来但标灰——「这套配置里没有」与
   「这类对象没有」是两句不同的话（原来那条注释立的规矩，这里继续守）。 */
/* ── 九层可观测性矩阵（§15 六）══════════════════════════════════════════
   矩阵那一节的结论是「传统 profiling 通常只给第 4、5、6、8 行——谁和谁、什么
   原语、多少字节、什么时候；缺的正是首尾两端：这次通信属于模型的哪一部分，
   以及它到底有没有造成损失」。把九层挂在**每一条边**上，读出卡当场就能回答
   「这一条现在答得出哪几层」——而且各维的答案不一样（EP 有路由、TP 没有；
   PP 有气泡、别的维没有），一条一条挂才不会把「不适用」误读成「缺」。
   四档状态：y 答得出 / h 只答了一半 / n 缺 / na 这条边上不存在这一层。 */
var COMM_L9 = [
  {k:'model',  ab:'模', n:'模型',  ask:'谁产生了这次通信'},
  {k:'tensor', ab:'张', n:'张量',  ask:'搬的是什么、前态后态'},
  {k:'par',    ab:'并', n:'并行',  ask:'为什么需要它'},
  {k:'rank',   ab:'r',  n:'rank',  ask:'谁和谁'},
  {k:'prim',   ab:'原', n:'原语',  ask:'怎么搬'},
  {k:'load',   ab:'载', n:'载荷',  ask:'搬多少'},
  {k:'route',  ab:'路', n:'路由',  ask:'token 去哪了'},
  {k:'time',   ab:'时', n:'时序',  ask:'什么时候搬、藏住没有'},
  {k:'cost',   ab:'影', n:'影响',  ask:'造成了什么后果'},
  /* 第十层：前九层问的都是逻辑侧（谁 / 什么 / 怎么搬 / 何时 / 代价），这一层第一次
     把物理侧接进来。它不是九层的补充说明，是九层答不了的一问：同一条 AllToAll
     是快是慢，不取决于它连了几张卡，取决于这几张卡在不在同一个超节点里。 */
  /* 缩写用「网」不用「载」：载荷那一格已经占了「载」，两格同一个字读者分不开。 */
  {k:'fabric', ab:'网', n:'载体',  ask:'走哪张网'}
];
/* 每一层现在答到什么程度——按维给，不给一份通用答案：这九格要是每条边都长一样，
   它就退化成一张装饰用的图例，读者也就不会再去看它。 */
function commL9(D, dim){
  var real9 = (dim === 'tp' || dim === 'ep');
  return {
    model: real9 ? ['y','锚在真算子上（TP=attention 的 reduce-scatter，EP=MoE 的 dispatch），层号写在读数里']
                 : ['h','只到「代表算子 / 代表层」这一级：这一维的边挂在本段的代表算子上，不是逐算子给'],
    tensor:['y','张量是什么、前态 → 后态的 layout，上面「张量」一行与那张变换图都在说它'],
    par:   ['y','并行域与组大小（' + DIMN[dim] + ' 组，成员在「源→宿」一行里列全）'],
    rank:  ['y','源与宿都落到具体的 r 号；画布上这一条边连的就是这几张卡'],

        if(onX) rows.push('<tr><td colspan="3">'+memBlockDetail(D, g, mk)+'</td></tr>');

    }
    /* 缩略图**不再常驻**：点开那一档时明细里已经有一张更完整的（见 memBlockDetail），
       两张挨在一起说同一件事，读者会先花一秒确认它们是不是同一张。图只在
       点开的时候出现——没点开时这张表就该是一张干净的账。 */

     而读者是照着卡从上往下看的——图例若按垒的顺序列，读者得在脑子里把两张表倒过来
     对，每一行都要数一次。倒过来之后，图例第 n 档就是卡上从上数第 n 层。
     倒的是**档与档**：档内的明细（逐块切法、腔）仍然跟在自己那个档头下面，
     整组倒过来会让明细跑到档头上方、而且自己也颠倒，那是另一种乱。 */
  var rows = [], lastKind9 = null;
  groups.reverse().forEach(function(gr){
    if(gr.length && gr.kind !== lastKind9){

         它要解释的东西读者悬停时才需要。 */
      rows.push('<tr><td colspan="3" title="'
        + esc(gr.kind === 'model' ? '模型态：问的是「哪一段归我」——这几档的份额由切法决定，与时间无关'
                                  : '执行态：问的是「什么时候生、什么时候死」——这几档随训练一步的相位生灭')
        + '" style="padding:7px 0 3px;font-size:11px;letter-spacing:.08em;color:var(--pt-fg3);border-top:1px solid var(--pt-bd);cursor:help">'
        + (gr.kind === 'model' ? '模型态' : '执行态')

  el.innerHTML =
    '<div class="rm-h"><b>rank '+g+'</b>'
    /* 层段这一行就是 **PP 的切**：PP 不切任何一个张量（所以它不在权重带的分块里），
       它切的是「哪几层住在这张卡上」。`stage0 · L0–L11` 已经把这件事说完了——
       后面再补一句「12/48 层 · PP 刀切 4 段」是同一句话换个说法，删掉。 */
    + '<span>tp'+co.t+' cp'+co.c+' dp'+co.d+' pp'+p+(me?' ep'+me.ep:'')+' · stage'+p+' · L'+(p*lps)+'–L'+((p+1)*lps-1)+'</span>'
    + '<button class="rm-x" data-act="rankmemclose" title="收起（同时取消选中）">✕</button>'

       而且写的是**这张卡自己的**进度（含相位差），不是走带游标的原值。
       放在 ✕ 之后：它整行独占（flex 基准 100%），排在按钮之前会把按钮挤到第三行去。 */
    + '<span style="flex:0 0 100%;color:var(--pt-fg3)">'+esc(ZERO_SHORT[D.zero])
    + (stepT9 === null ? ' · 峰值口径' : ' · 步内 '+Math.round(stepT9*100)+'%')+'</span>'
    + '</div>'
    + '<table style="width:100%;border-collapse:collapse;font-size:12.5px;margin:4px 0 3px;font-family:var(--pt-mono)">'
    + rows.join('')
    + '<tr><td colspan="2" style="border-top:1px solid var(--pt-bd);padding-top:5px;font-weight:800;font-size:13px;color:'+(tot>cap?'var(--pt-danger)':'var(--pt-fg)')+'">合计 '+fmtGB(tot)+' / '+D.hbm+' GB</td>'
    + '<td style="border-top:1px solid var(--pt-bd);padding-top:5px;text-align:right;font-size:12px;color:var(--pt-fg3)">余量 '+fmtGB(cap-tot)+'</td></tr></table>'

/* ── solo 档（第三档单卡下钻）浮卡群：显存构成不再挤进 renderRankMem 那张

   不带可展开的子行/公式/反查那些第二档还有意义、这一档已经用不上的东西
   （反馈原话「纯卡片」）。汇总卡（rank 号/坐标/合计/余量）另算一张，钉在
   卡壳自己的门牌上方。每张卡的屏幕位置不接着 viewBox 坐标自己算一遍

function renderMemCards(D){

  var segs = memParts(D, p, g).filter(function(sg){ return sg.bytes > 0; });

/* 贴位：卡壳窄、几档的锚点（data-memblock，登记在 MS9 渲染那一步，见 5180 行
   附近）挤在同一小片屏幕里，直接"贴着锚点摆"几乎必叠。改成两段：
     汇总卡——贴这张卡自己的命中面（装不下时优先用 cardfull，圈住顶出壳外的
       那截，跟 scheduleCamSettle 的居中锚点同一个道理），钉在卡壳正上方；
     每档卡——不贴锚点本身，摆成卡壳一侧的**一列**（右侧放不下就换左侧），
       固定间距纵向排开，不会互相挤；每张卡另拉一根细引线连回它真正的锚点，
       "在哪列/第几张"与"它说的是卡上哪条带"两件事分开各自解决，就不需要
       一套真正的矩形装箱算法来防叠。 */
function placeMemCards(){
  var elWrap = $('memCards');
  if(!elWrap || elWrap.hidden) return;
  var st = $('stage'); if(!st) return;
  var sr = st.getBoundingClientRect();
  var g9 = sel;
  Array.prototype.forEach.call(elWrap.querySelectorAll('.mc-leader'), function(l){ l.remove(); });
  var boxEl = st.querySelector('[data-k="cardfull"][data-i="'+g9+'"]')
    || st.querySelector('[data-act="chainpick"][data-k="card"][data-i="'+g9+'"]');
  var boxR = boxEl ? boxEl.getBoundingClientRect() : sr;
  var boxLeft = boxR.left - sr.left, boxRight = boxR.right - sr.left, boxTop = boxR.top - sr.top;

  var sumCard = elWrap.querySelector('.mc-card[data-mc="__sum__"]');
  var sumBottom9 = boxTop;   /* 舞台矮/嵌入 iframe 窄时兜底：没有汇总卡就当它贴着壳顶 */
  if(sumCard){
    var scw = sumCard.offsetWidth || 190, sch = sumCard.offsetHeight || 70;
    var sumTop9 = clamp(boxTop - sch - 16, 4, Math.max(4, sr.height - sch - 4));
    sumCard.style.left = clamp((boxLeft+boxRight)/2 - scw/2, 4, Math.max(4, sr.width - scw - 4)).toFixed(0)+'px';
    sumCard.style.top = sumTop9.toFixed(0)+'px';
    /* 汇总卡钉的是"壳顶上方 16px"，可舞台矮（比如嵌进 rank-topology-lite 的
       那格 iframe，高度远不到 900）、壳顶本身就离舞台顶不到 sch+16 时，上面
       那行 clamp 会把它摁到 top:4 强行塞下——这一夹，汇总卡的下沿就可能反而
       落到壳顶**下面**去，跟第一张纵列卡撞在一起（反馈原话"点开每一个都
       超出rank了"：各档卡的框线压住了汇总卡）。纵列的起点因此不能只认
       boxTop，要跟汇总卡真实落地之后的下沿取较大值。 */
    sumBottom9 = sumTop9 + sch;
  }

  var segCards = Array.prototype.filter.call(elWrap.querySelectorAll('.mc-card'), function(c){ return c !== sumCard; });
  if(!segCards.length) return;
  var cw0 = segCards[0].offsetWidth || 148, gap = 10, margin = 24;
  var side = (sr.width - boxRight - margin) >= cw0 + 8 ? 'right' : 'left';
  var stackX = side === 'right' ? Math.min(boxRight + margin, sr.width - cw0 - 8) : Math.max(boxLeft - margin - cw0, 8);
  var y = clamp(Math.max(boxTop + 8, sumBottom9 + gap), 4, sr.height - 8);
  segCards.forEach(function(card){
    var k = card.getAttribute('data-mc');
    var anchorEl = st.querySelector('[data-memblock="'+k+'"]');
    var cw = card.offsetWidth || cw0, ch = card.offsetHeight || 40;
    var top = clamp(y, 4, Math.max(4, sr.height - ch - 4));
    var left = clamp(stackX, 4, Math.max(4, sr.width - cw - 4));
    card.style.left = left.toFixed(0)+'px';
    card.style.top = top.toFixed(0)+'px';
    y = top + ch + gap;
    if(!anchorEl) return;
    var tr = anchorEl.getBoundingClientRect();
    var ax = tr.left + tr.width/2 - sr.left, ay = tr.top + tr.height/2 - sr.top;
    var ex = side === 'right' ? left : left + cw, ey = top + ch/2;
    var dx = ex - ax, dy = ey - ay, len = Math.sqrt(dx*dx + dy*dy);
    var leader = document.createElement('div');
    leader.className = 'mc-leader';
    leader.style.left = ax.toFixed(1)+'px'; leader.style.top = ay.toFixed(1)+'px';
    leader.style.width = len.toFixed(1)+'px';
    leader.style.transform = 'rotate('+(Math.atan2(dy, dx)*180/Math.PI).toFixed(2)+'deg)';
    elWrap.appendChild(leader);
  });
}

/* ═════════ 总渲染 ═════════ */
function render(){
  syncTopologyPalette();

     那时 sel 被夹成 null 而 ui.hlSel 还留着 true，这一格就卡在"没有选中、却认为
     自己正被别处照亮"的半截状态里：hlSelOn 是假（画不出虚线），可读出卡那道闸
     （!ui.hlSel）永远开不了——表现为"某次联动之后这一格再也读不出卡"，而且没有任何
     手势能退出来（点空白只在真有东西可散时才 render）。夹一次就把两样一起收干净。 */
  if(sel!==null && (!D.ok || sel>=D.world)){ sel = null; ui.hlSel = false; }

  }else{

var swallowClick = false;
function endDrag3(ev){

$('stage').addEventListener('click', function(ev){

/* ── 滚轮缩放（向光标位置缩放）：只改 transform，不重建场景 ── */
$('stage').addEventListener('wheel', function(ev){
  if(ui.view !== 'chain' && !(ui.view==='solid'&&ui.persp==='grid')) return;
  ev.preventDefault();
  var svg = $('stage').querySelector('svg');
  if(!svg) return;
  var factor = ev.deltaY > 0 ? 1/1.15 : 1.15;
  var next = clamp(ui.zoom3 * factor, 0.2, 20);
  var r = next / ui.zoom3;
  var ctm = svg.getScreenCTM();
  if(ctm){
    var inv = ctm.inverse();
    var sx = inv.a*ev.clientX + inv.c*ev.clientY + inv.e;
    var sy = inv.b*ev.clientX + inv.d*ev.clientY + inv.f;
    var vb = svg.getAttribute('viewBox').split(/\s+/).map(Number);
    var vr9 = viewRendered;
    var cx9 = vr9 && isFinite(vr9.cx) ? vr9.cx : vb[0] + vb[2]/2;
    var cy9 = vr9 && isFinite(vr9.cy) ? vr9.cy : vb[1] + vb[3]/2;
    /* getScreenCTM 给的是**渲染基线**的用户坐标——连续滚动时上面还压着一层
       gesture 的 CSS transform，先把光标换算到「当前 ui 状态」的约定坐标系里，
       缩放锚点才不会一格一格漂。 */
    if(vr9){
      var kk = ui.zoom3 / vr9.zoom;
      sx = kk*(sx - cx9 - vr9.panX) + cx9 + ui.panX3;
      sy = kk*(sy - cy9 - vr9.panY) + cy9 + ui.panY3;
    }
    /* 场景约定 screen = C + pan + zoom·(base − C)，C = viewBox 中心。
       让光标那点不动 ⇒ pan' = (1−r)(光标 − C) + r·pan。 */
    ui.panX3 = (1-r)*(sx - cx9) + r*ui.panX3;
    ui.panY3 = (1-r)*(sy - cy9) + r*ui.panY3;
  }
  ui.zoom3 = next;
  applyViewTransform();
}, {passive:false});

/* ── 触屏双指缩放+平移 ── */
var touch3 = null;
$('stage').addEventListener('touchstart', function(ev){
  if((ui.view !== 'chain' && !(ui.view==='solid'&&ui.persp==='grid')) || ev.touches.length < 2) return;
  ev.preventDefault();
  var t = ev.touches;
  var mx = (t[0].clientX+t[1].clientX)/2, my = (t[0].clientY+t[1].clientY)/2;
  var dist = Math.hypot(t[1].clientX-t[0].clientX, t[1].clientY-t[0].clientY);
  touch3 = {mx:mx, my:my, dist:dist, zoom:ui.zoom3, panX:ui.panX3, panY:ui.panY3, cs:1};
  var svg = $('stage').querySelector('svg');
  if(svg){ var ctm = svg.getScreenCTM(); if(ctm) touch3.cs = 1/ctm.a; }
}, {passive:false});
$('stage').addEventListener('touchmove', function(ev){
  if(!touch3 || ev.touches.length < 2) return;
  ev.preventDefault();
  var t = ev.touches;
  var mx = (t[0].clientX+t[1].clientX)/2, my = (t[0].clientY+t[1].clientY)/2;
  var dist = Math.hypot(t[1].clientX-t[0].clientX, t[1].clientY-t[0].clientY);
  var r = dist / touch3.dist;
  ui.zoom3 = clamp(touch3.zoom * r, 0.2, 20);
  ui.panX3 = touch3.panX + (mx - touch3.mx)*touch3.cs;
  ui.panY3 = touch3.panY + (my - touch3.my)*touch3.cs;
  applyViewTransform();               /* 双指也是仿射：不重建，跟手 */
}, {passive:false});
$('stage').addEventListener('touchend', function(ev){
  if(touch3 && ev.touches.length < 2){ touch3 = null; urlWrite(); scheduleCrisp(); }
});

/* 宿主与页内选组共用同一份坐标换算。宿主传的是语义维度与组号，不接触 SVG 节点。 */
function applyParallelGroupPick(kk, iv){
  var Dq = derive(cfg); if(!Dq.ok || !isFinite(iv)) return false;
  var g0 = (sel!==null&&sel<Dq.world)?sel:0, c0 = coordsOf(g0,Dq);
  var offSame9 = (kk === 'card') && sel === iv && !ui.hlSel;
  takeSel();
  if(kk==='card') sel = offSame9 ? null : iv;
  else if(kk==='d' && iv>=0 && iv<Dq.dp) sel = rankOf(c0.t,c0.c,iv,c0.p,Dq);
  else if(kk==='p' && iv>=0 && iv<Dq.pp) sel = rankOf(c0.t,c0.c,c0.d,iv,Dq);
  else if(kk==='t' && iv>=0 && iv<Dq.tp) sel = rankOf(iv,c0.c,c0.d,c0.p,Dq);
  else if(kk==='e' && Dq.moe && iv>=0 && iv<Dq.ep){
    var m0 = epOf(c0.t,c0.c,c0.d,Dq);
    var q0 = (m0.mdp*Dq.ep+iv)*Dq.etp+m0.etp;
    sel = rankOf(q0%Dq.tp, Math.floor(q0/Dq.tp)%Dq.cp, Math.floor(q0/(Dq.tp*Dq.cp))%Dq.dp, c0.p, Dq);
  }
  else if(kk==='c' && Dq.cp>1 && iv>=0 && iv<2*Dq.cp){
    var ownerC2 = iv<Dq.cp ? iv : 2*Dq.cp-1-iv;
    sel = rankOf(c0.t, ownerC2, c0.d, c0.p, Dq);
  } else return false;
  return true;
}
