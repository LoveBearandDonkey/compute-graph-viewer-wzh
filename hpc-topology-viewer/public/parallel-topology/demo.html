    if(COMM_DIMS.indexOf(d.cut)>=0) ui.cutDim = d.cut;
    if(d.preset){
      var p2 = PRESETS.filter(function(x){ return x.id===d.preset; })[0];
      if(p2){ cfg = JSON.parse(JSON.stringify(p2.cfg)); activePreset = p2.id; }
    }
    /* sel = 「宿主替这一屏选了一张卡」，是**选中**，读出卡照浮。
       hl  = 「另一格点了什么，这一屏跟着照亮」，是**过路的高亮**：不落标签、
             不浮读出卡、点画布空白就散（见 ui.hlLayer / ui.hlSel 那段说明）。
       台面两格之间走的一律是 hl —— 一格里的点击不该在另一格留下一句没人下过的条件。 */
    if(typeof d.sel === 'number' && d.sel >= 0){ sel = d.sel; ui.hlSel = false; }
    if(d.sel === null){ sel = null; ui.hlSel = false; }
    /* 训练步进度（0–1）：泳道那条游标走到哪儿，逐卡的激活体就按 1F1B 的形状算到哪儿。
       null 收回游标，回到峰值（默认态）。只改逐卡读数，聚合口径不动。 */
    if(d.step !== undefined){
      ACT_T = (typeof d.step === 'number' && isFinite(d.step)) ? clamp(d.step, 0, 1) : null;
    }
    if(d.hl !== undefined){
      if(d.hl === null) clearHL();
      else{
        if(typeof d.hl.layer === 'number'){ ui.revLayer = String(d.hl.layer); ui.hlLayer = true; }
        else if(d.hl.layer === null && ui.hlLayer){ ui.revLayer = ''; ui.hlLayer = false; }
        if(typeof d.hl.rank === 'number'){ sel = d.hl.rank; ui.hlSel = true; }
        else if(d.hl.rank === null && ui.hlSel){ sel = null; ui.hlSel = false; }
        /* 泳道那边逐节点点选 kernel 分段转过来的块 id——host 没选中某一节、
           或选中的是不挂功能块的反向子阶段时传的是 null，跟 layer/rank 同一套
           「有值就置位、null 就清位」写法，不必另起一条判定。 */
        if(typeof d.hl.block === 'string' && d.hl.block){ ui.hlBlock = d.hl.block; }
        else if(d.hl.block === null && ui.hlBlock){ ui.hlBlock = ''; }
      }
    }
    if(d.l5 === true || d.l5 === false) (ui.layersUser[ui.view] = ui.layersUser[ui.view]||{}).L5 = d.l5;
    if(d.theme==='dark'||d.theme==='light') document.documentElement.setAttribute('data-theme', d.theme);
    render();
    /* 回报当前状态，宿主据此对齐别的格（选中卡可能被本页夹紧过） */
    if(ev.source){ var snap9=ptoStateSnapshot(); ev.source.postMessage({type:'pto:state-ack', view:ui.view, cut:ui.cutDim, sel:snap9.sel, groups:snap9.groups, config:snap9.config, preset:activePreset}, '*'); }
    /* filter 来自 Hover Bar，宿主已经把同一选择发给了两格。这里不能再回报
       pto:select；否则两格会互相把对方降级成 hl，刚出现的读出面板随即被收回。 */
  }
});
/* 页内换选中卡时主动上报，宿主用它联动别的组件（A8 的跨组件版）。
   独立打开时 parent===window，函数存在但什么也不做。 */
window.ptoNotifyHost = function(){
  if(window.parent && window.parent !== window){
    var snap9=ptoStateSnapshot();
    window.parent.postMessage({type:'pto:select', sel:snap9.sel, groups:snap9.groups, config:snap9.config, view:ui.view, cut:ui.cutDim}, '*');
  }
};

/* 刀序视图的 viewBox 宽度是**按舞台实测长宽比**反解的（见 renderChain）。
   首帧量到的是布局还没落定的高度，之后底部图例一排下来舞台会缩——不重画就永远按错的比例
   letterbox。盯着舞台的尺寸变化重画一次；重画只换 SVG 内容、不改舞台本身，不会自激。
   全局切分（renderSolidGrid）同理，但它盯的是**宽度**本身，不是长宽比——k（像素目标
   缩放）与 stacked（并排/摞叠切换的 760px 门槛）都直接读 clientWidth：组合工作台里
   拖动分栏宽度、或首帧量到 iframe 还没被父页面定宽时的临时值，都要能补一次重画。 */
if(window.ResizeObserver){
  var roLast = 0, roLastW = 0, roTimer = 0;
  new ResizeObserver(function(){
    var el = $('stage'); if(!el || el.clientHeight<60) return;
    if(ui.view==='chain'){
      var ar = (el.clientWidth-20)/(el.clientHeight-12);
      if(Math.abs(ar - roLast) < 0.02) return;
      roLast = ar;
    }else if(ui.view==='solid' && ui.persp==='grid'){
      if(Math.abs(el.clientWidth - roLastW) < 8) return;
      roLastW = el.clientWidth;
    }else return;
    clearTimeout(roTimer); roTimer = setTimeout(render, 60);
  }).observe($('stage'));
}

urlLoad();
/* ?brief=1：宿主只要一句聚合容量徽标（rank-topology-lite 集群总览那一档），
   不要 4000 张卡的 SVG——报完聚合数就地打住，不进 applyQuery/render 那一整套。
   本体自己独立打开、或宿主要真的看画面时都不传这个参数，走的还是下面原来
   那条路，逐位不变。urlLoad() 里那个 q 是它自己函数作用域内的局部变量，
   这里够不到，重新读一遍 URL——就一次查询，成本可以忽略。
   同一条 brief=1 路径上再加一步：urlLoad() 已经把 ?sel= 解析进全局 sel
   （不管 brief 是不是 1，两条路共用那一行），这里顺手多报一条 rank 自己的
   摘要（ptoRankBrief()：坐标/层段/容量/显存构成）——rank-topology-lite
   第二档（同组定位）原来问不到这份数据，只能等真的下钻到第三档才看得到
   显存，这一步让它在不铺整屏 SVG 的前提下也能借到同一份口径。sel 为空时
   ptoRankBrief() 自己会返回 null，不额外判断；只有 rank-topology-lite 会
   在 brief=1 之外再带 sel=，net-slicing/model-netgraph 这些同样共用这份
   demo.html 的消费方都不传，行为不变。 */
var q9brief = new URLSearchParams(location.search);
if(q9brief.get('brief')==='1'){
  if(window.parent && window.parent !== window){
    window.parent.postMessage({type:'pto:cluster', brief: ptoClusterBrief()}, '*');
    var rb9brief = ptoRankBrief();
    if(rb9brief) window.parent.postMessage({type:'pto:rank-brief', brief: rb9brief}, '*');
  }
} else {
  /* q= 带进来的那句话要真的生效（选中卡、落下刀），不能只是把字填回框里 */
  (function(){ var D0 = derive(cfg); if(D0.ok && ui.chips.length) applyQuery(D0); })();
  render();
  /* fastCard：URL 直接带 ?sel= 打开（rank-topology-lite 从逻辑魔方跳过来就是这条
     路，不经过 chainpick 点击）也要飞到那张卡——上面 chainpick 分支里那次调用管的
     是"页面已经开着、这一刻点了一张卡"，这一条管的是"页面一开就已经是选中态"。 */
  if(ui.fastCard && sel !== null) focusCardCamera(sel, ui.soloCard ? 20 : 9);
  /* 没选中任何卡时 ?solo=1 没有意义（第三档要有主角才成立）——落地就撤掉，
     免得之后随手点一张卡就莫名其妙直接进了第三档。 */
  if(sel === null) ui.soloCard = false;
  /* 一开场就把自己停在哪一档报给宿主：rank-topology-lite 的档位条/浮卡要跟着
     这一条落位，不能等到读者第一次点击才知道这一格现在是第几档。brief=1
     那条分支已经报过 pto:cluster、直接结束——这里再报一遍 pto:tier 只会让
     宿主收到一条它没料到的"第一档"消息，平白多一次状态判断。 */
  ptoNotifyTier();
}
})();
</script>
</body>
</html>
