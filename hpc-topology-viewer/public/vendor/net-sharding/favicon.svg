<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- 整网切分：一张计算图被六维切开 —— 竖向三段=PP，横向切片=TP，右下角一桶=EP -->
  <rect width="32" height="32" rx="7" fill="#0d1117"/>
  <!-- PP 三段（橙）：模型层被切成 stage -->
  <rect x="5"  y="5"  width="22" height="6" rx="1.6" fill="none" stroke="#ffaa3b" stroke-width="1.5"/>
  <rect x="5"  y="13" width="22" height="6" rx="1.6" fill="none" stroke="#ffaa3b" stroke-width="1.5"/>
  <rect x="5"  y="21" width="22" height="6" rx="1.6" fill="none" stroke="#ffaa3b" stroke-width="1.5"/>
  <!-- TP 切片（青）：段内沿张量轴再切 -->
  <line x1="12.3" y1="4" x2="12.3" y2="28" stroke="#22d3ee" stroke-width="1.3" opacity=".9"/>
  <line x1="19.6" y1="4" x2="19.6" y2="28" stroke="#22d3ee" stroke-width="1.3" opacity=".9"/>
  <!-- EP 专家桶（紫）：MoE 那一格被单独拿走 -->
  <rect x="20.1" y="21.5" width="6.4" height="5" rx="1.2" fill="#9b3cf6" opacity=".85"/>
  <!-- DP 复制（蓝虚框）：整网再复制一遍 -->
  <rect x="2.2" y="2.2" width="27.6" height="27.6" rx="8" fill="none" stroke="#4369ef"
        stroke-width="1.2" stroke-dasharray="3 2.6" opacity=".8"/>
</svg>
